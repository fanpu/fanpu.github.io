# Talks listed on the home page, newest first. Slides live in assets/presentations/.
- title: Average Gradient Outer Product as a Mechanism for Feature Learning
  date: 2025-09-19
  url: /assets/presentations/Average%20Gradient%20Outer%20Product.pdf
  thumb: /assets/img/talks/agop.webp
  blurb: "Curse of dimensionality and feature learning. Neural feature matrix (NFM). Average gradient outer product (AGOP). Deep neural feature ansatz: empirical evidence and theoretical results. Applications: spurious features, lottery tickets, grokking. Recursive feature machines. Steering LLMs."

- title: Learning Dynamics of LLM Finetuning
  date: 2025-05-13
  url: /assets/presentations/Learning%20Dynamics%20of%20LLM%20Finetuning.pdf
  thumb: /assets/img/talks/learning-dynamics.webp
  blurb: "SFT and DPO recap. Learning dynamics decomposition, from MNIST to LLMs. Training dynamics of SFT; hallucination explanation. Training dynamics of DPO; the squeezing effect. Off-policy DPO experiments. Remedies. PPO."

- title: "DistiLLM-2: A Contrastive Approach Boosts the Distillation of LLMs"
  date: 2025-05-08
  url: /assets/presentations/DistiLLM-2.pdf
  thumb: /assets/img/talks/distillm-2.webp
  blurb: "Why distillation. KL primer; forward vs. reverse KL. Prior work: DistiLLM and skew KL. Contrastive approach for LLM distillation (CALD). Curriculum for the interpolation coefficient. Results."

- title: "Convergence and Generalization of Neural Networks: Neural Tangent Kernels and Beyond"
  date: 2025-02-21
  url: /assets/presentations/Neural%20Tangent%20Kernels%20and%20Beyond.pdf
  thumb: /assets/img/talks/ntk.webp
  blurb: "Overparameterization, double descent, sensitivity to initialization. Infinite-width networks as Gaussian processes (NNGP). Neural tangent kernel: initialization, training, generalization, limitations. Tensor Programs I‑V. Maximal update parametrization (muP); zero-shot hyperparameter transfer."

- title: A Statistical Approach to Language Model Evaluations
  date: 2024-11-18
  url: /assets/presentations/Statistics%20for%20Evals.pdf
  thumb: /assets/img/talks/stats-evals.webp
  blurb: "Challenges with LLM evals. Standard error of the mean; clustered standard errors. Variance reduction; law of total variance. Paired analysis for comparing models. Hypothesis testing crash course; type I and II errors. Power analysis."

- title: Advanced Retrieval Augmented Generation Techniques
  date: 2024-10-08
  url: /assets/presentations/Advanced%20Retrieval%20Augmented%20Generation.pdf
  thumb: /assets/img/talks/advanced-rag.webp
  blurb: "Naive RAG. Retrieval: chunking strategies, query rewriting, HyDE, hybrid search (tf-idf, BM25). Generation: long contexts, lost in the middle, re-ranking, repacking. Multi-step retrieval: iterative, CoT-guided, tree of thought. Evaluation: faithfulness, relevance, retrieval metrics (precision@k, MRR, MAP, NDCG)."

- title: Superalignment, or how to train models smarter than us
  date: 2024-07-24
  url: /assets/presentations/Superalignment.pdf
  thumb: /assets/img/talks/superalignment.webp
  blurb: "Superalignment timeline. Weak-to-strong generalization setup; performance gap recovered. Approaches: naive fine-tuning, bootstrapping, auxiliary confidence loss, generative fine-tuning. Imitating weak supervisor errors; concept saliency. Disanalogies with real superalignment."

- title: Rotary Positional Embeddings (RoPE)
  date: 2024-05-03
  url: /assets/presentations/Rotary%20Positional%20Embeddings.pdf
  thumb: /assets/img/talks/rope.webp
  blurb: "Attention, batched attention, self-attention. Sinusoidal positional encodings and their flaws. RoPE: goals, overview, complex-form reinterpretation, full derivation. Relative position property."

- title: Parameter-Efficient Fine-Tuning
  date: 2024-04-30
  url: /assets/presentations/Parameter%20Efficient%20Fine-Tuning.pdf
  thumb: /assets/img/talks/peft.webp
  blurb: "Scaling laws for transfer. Memory costs of full fine-tuning. Adapters. LoRA: which matrices to adapt, why it works, serving many adapters. Quantization: absmax, zeropoint, block-wise, vector-wise, outlier features, mixed precision. QLoRA: NF4, double quantization, paged optimizers. Prefix tuning. Prompt tuning."

- title: Understanding Transformers
  date: 2024-03-01
  url: /assets/presentations/Understanding%20Transformers.pdf
  thumb: /assets/img/talks/transformers.webp
  blurb: "Neural networks, activations, loss functions. Language modeling: autoregressive models, perplexity, sampling (temperature, top-k, beam search). RNNs and LSTMs. Transformers: encoder/decoder variants, embeddings, attention, self-attention, masking, multi-head attention, positional encoding, residual connections, layer normalization, LM head."
