 {t:'Think in ranges',h:()=>'<p>Beginners ask "what does he have?" and pick one hand. It is the wrong question, because nobody can answer it.</p><p>The right question is "what are <b>all</b> the hands he would play this way?" That whole set is called his '+term('range')+'.</p><p>A range gets narrower with every action.</p><ol><li>A tight player raises from UTG. The range is about the top 12%: big pairs, big aces, the best suited high cards.</li><li>The flop comes 9 6 2 with three different suits, and he bets. Most of his range missed this flop, but he might bet anyway. Little changes.</li><li>The turn is a 3. He bets large again. Now the hands that missed mostly drop away, and what is left is weighted towards big pairs.</li></ol><p>You never reach certainty. You end with a list of possible hands and a rough idea of how likely each is. Your equity against that list is what you compare with the price.</p><p>In Trainer mode, the "Their ranges" panel does this narrowing for you on the 13 by 13 grid, so you can watch it happen.</p>'},
 {t:'Counting combos',h:()=>'<p>To weigh the hands in a range you need to know how many ways each can be dealt.</p><ul><li>An unpaired hand like AK has 4 aces \u00d7 4 kings = <b>16 combos</b>. Four are suited and twelve are offsuit.</li><li>A pair like QQ has <b>6 combos</b>, the number of ways to choose 2 queens from 4.</li></ul><h3>Blockers</h3><p>Any card you can see cannot be in your opponent\u2019s hand. Seeing a card therefore removes combos from their range. Such a card is called a '+term('blocker')+'.</p><ul><li>You hold an ace. There are 3 aces left, so AK drops from 16 to 3 \u00d7 4 = <b>12</b>, and AA drops from 6 to <b>3</b>.</li><li>The flop has a king on it. Pocket kings, which would now be three of a kind, drop from 6 combos to 3.</li></ul><h3>Why this matters</h3><p>On a flop of K 7 2 you may fear three of a kind. But KK, 77 and 22 add up to only 3 + 3 + 3 = 9 combos. Hands like AK, KQ and KJ, which are just one pair of kings, add up to 12 + 12 + 12 = 36. Any given bet is four times as likely to be one pair as three of a kind. Counting replaces fear with a number.</p>'},
 {drill:'combos',need:5,t:'Drill: count the combos'},
]},
{id:'texture',title:'Your hand on this board',blurb:'The vocabulary for made hands, and how dry and wet boards change what they are worth.',pages:[
 {t:'A pair is not just a pair',h:()=>'<p>"I have a pair" says almost nothing. What matters is how your pair relates to the board. These names are used constantly.</p>'+cardsRow([{label:'Overpair',cards:tc('Qs Qh')},{label:'Flop',cards:tc('9d 6c 2s')}])+'<p>A pocket pair higher than every board card. It beats any hand that paired the board.</p>'+cardsRow([{label:'Top pair',cards:tc('As 9h')},{label:'Flop',cards:tc('9d 6c 2s')}])+'<p>You paired the highest board card. The other hole card is your kicker, and a strong kicker matters a great deal.</p>'+cardsRow([{label:'Second pair',cards:tc('As 6h')},{label:'Flop',cards:tc('9d 6c 2s')}])+'<p>You paired the middle card. It is a medium hand, good for showing down cheaply, poor for building a big pot.</p>'+cardsRow([{label:'Set',cards:tc('6s 6h')},{label:'Flop',cards:tc('9d 6c 2s')}])+'<p>Three of a kind using a pocket pair. It is very strong and very well hidden. When the three of a kind uses a pair on the board plus one of your cards, it is called '+term('trips')+', and everyone can see that it is possible.</p>'},
 {t:'Dry boards and wet boards',h:()=>'<p>The '+term('texture')+' of the board tells you how many strong hands and draws are possible.</p>'+cardsRow([{label:'Dry',cards:tc('Ks 7d 2c')}])+'<p>Three different suits, which players call a '+term('rainbow')+' flop, and ranks far apart. No flush draw and almost no straight draw exists. Whoever is ahead now will usually still be ahead on the river.</p>'+cardsRow([{label:'Wet',cards:tc('9h 8h 7c')}])+'<p>Two hearts and three ranks in a row. Straights are already possible, and many hands have a draw. The best hand now is often not the best hand two cards later.</p><h3>What changes</h3><ul><li><b>On dry boards</b> you can bet small. Nobody has a draw to charge, and small bets get called by weaker hands.</li><li><b>On wet boards</b> bet bigger with your good hands, so that draws pay a bad price. Go back to the price table: a flush draw on the turn hits 19.6% of the time, so any bet of half the pot or more makes calling a mistake.</li><li><b>Paired boards,</b> such as 8 8 3, make full houses possible and make two pair much weaker, since everyone shares the pair of eights.</li></ul>'},
 {t:'Who does the board favour?',h:()=>'<p>Think back to ranges. The player who raised before the flop holds a lot of high cards and big pairs. The player who called holds more medium pairs and suited connected cards.</p><ul><li>A board like <b>A K 5</b> hits the raiser\u2019s range hard. They can bet often, and you should believe them more.</li><li>A board like <b>7 6 5</b> hits the caller\u2019s range. The raiser\u2019s ace-king has nothing, and should slow down.</li></ul><p>So the same bet means different things on different boards. Before reacting to a bet, ask whether this board is good for the person betting.</p>'},
 {drill:'handClass',need:5,t:'Drill: what do you have?'},
 {drill:'texture',need:4,t:'Drill: wet or dry?'},
]},
{id:'betting',title:'Betting: why and how much',blurb:'The only two reasons to bet, the price your bet sets, bluff maths, and stack-to-pot ratio.',pages:[
 {t:'Two reasons to bet',h:()=>'<p>Before every bet, ask what you want to happen next. There are only two good answers.</p><ol><li><b>Value.</b> You want a <b>worse</b> hand to call. You are probably ahead, and you are building the pot.</li><li><b>Bluff.</b> You want a <b>better</b> hand to fold. You are probably behind, and folding is the only way you win.</li></ol><p>If neither is likely, do not bet. This happens all the time with medium hands like second pair. Bet, and the worse hands fold while the better hands call. You win nothing extra when ahead and lose more when behind. With these hands, checking is usually best.</p><h3>The semi-bluff</h3><p>A bet made with a draw is called a '+term('semi-bluff')+'. It has two ways to win: everyone may fold now, or you may be called and then hit. That second chance makes semi-bluffs far safer than pure bluffs. If you are going to bluff, bluff with hands that can improve.</p>'},
 {t:'Your bet sets their price',h:()=>'<p>You already know pot odds from the caller\u2019s side. Now you are the one naming the price.</p><p>If you bet <i class="v">B</i> into a pot of <i class="v">P</i>, the caller pays <i class="v">B</i> for a final pot of <i class="v">P</i> + 2<i class="v">B</i>.</p>'+eqn('equity the caller needs = '+frac('<i>B</i>','<i>P</i> + 2<i>B</i>'))+priceTable(false)+'<p><b>For value, bet as much as worse hands will still call.</b> Bigger bets win more when called, but fewer hands call them. Two-thirds of the pot is a sound default on boards with draws. On dry boards smaller bets do the same job, as lesson 12 explains.</p><p><b>Against draws, make the price wrong.</b> A flush draw on the turn has 19.6%. A half-pot bet asks for 25%. If they call, they lose money on average, which means you gain it.</p>'},
 {t:'When does a bluff make money?',h:()=>'<p>Suppose you bet <i class="v">B</i> as a pure bluff, with no chance of winning if called, and your opponent folds a fraction <i class="v">f</i> of the time.</p>'+eqn('EV = <i>f</i> \u00d7 <i>P</i> \u2212 (1 \u2212 <i>f</i>) \u00d7 <i>B</i>')+'<p>Set that to zero and solve, exactly as you did for pot odds.</p>'+eqn('<i>f</i> = '+frac('<i>B</i>','<i>P</i> + <i>B</i>'))+priceTable(true)+'<p>The right-hand column is new. A half-pot bluff has to work one time in three. A pot-sized bluff has to work half the time.</p><p>The value gained from the chance that everyone folds is called '+term('fold equity')+'. Three things reduce it: more opponents, opponents who love to call, and boards that fit their range.</p><div class="key">Beginners bluff too often, against too many players, and against the wrong players. Until you can name the better hands you expect to fold, do not bluff.</div>'},
 {t:'Stack-to-pot ratio',h:()=>'<p>How strong a hand you need depends on how much is left to bet. The '+term('stack-to-pot ratio')+', or SPR, measures it.</p>'+eqn('SPR = '+frac('smaller of the two stacks','pot at the start of the street'))+'<ul><li><b>SPR below 3.</b> There is little left behind. One good pair is usually enough to put all your chips in, because folding gives up a large pot to save a small amount.</li><li><b>SPR from 3 to 8.</b> Top pair or an overpair is fine against one opponent. Be careful against several.</li><li><b>SPR above 8.</b> Stacks are deep. Playing for everything needs a very strong hand, two pair or better. Draws gain value because there is a lot to win when they arrive.</li></ul><p>Trainer mode shows the SPR on every decision after the flop.</p>'},
 {drill:'betPrice',need:5,t:'Drill: prices and bluffs'},
]},
{id:'defend',title:'Defending against bets',blurb:'Why you cannot just fold, minimum defence frequency, bluff-to-value ratios, and when to ignore both.',pages:[
 {t:'The problem with folding too much',h:()=>'<p>So far, facing a bet, you compared your equity with the price. That works when you know your opponent\u2019s range. But it hides a danger.</p><p>Suppose you fold to a pot-sized bet 70% of the time. Your opponent can now bet <b>any two cards</b> and profit. They risk one pot to win one pot, so they break even if you fold half the time, and you fold far more than that. Their cards do not matter.</p><p>Go back to the bluff formula from lesson 10. A pure bluff of <i class="v">B</i> into a pot of <i class="v">P</i> makes money when you fold more often than</p>'+eqn(frac('<i>B</i>','<i>P</i> + <i>B</i>'))+'<p>To stop that, you must continue with at least the rest of your range:</p>'+eqn('MDF = 1 \u2212 '+frac('<i>B</i>','<i>P</i> + <i>B</i>')+' = '+frac('<i>P</i>','<i>P</i> + <i>B</i>'))+'<p>This is the '+term('minimum defence frequency')+', MDF. Here <i class="v">P</i> is the pot <b>before</b> the bet.</p><table class="ttable"><tr><th>Bet size</th><th>You must continue with at least</th></tr><tr><td>A third of the pot</td><td>75% of your range</td></tr><tr><td>Half the pot</td><td>67%</td></tr><tr><td>Two-thirds of the pot</td><td>60%</td></tr><tr><td>The whole pot</td><td>50%</td></tr><tr><td>Twice the pot</td><td>33%</td></tr></table><p>Against small bets you should fold very little.</p>'},
 {t:'Which hands continue',h:()=>'<p>MDF is about your whole <b>range</b>, not the two cards in front of you. The method is:</p><ol><li>List every hand you could hold here, given how you have played.</li><li>Rank them from best to worst on this board.</li><li>Continue with the top share that MDF demands. Raise some of the very best, call with the rest, fold the bottom.</li></ol><p>A hand that beats only bluffs is called a '+term('bluff-catcher')+'. Second pair on the river against a big bet is the classic example. It loses to every value bet and beats every bluff, so its whole value depends on how often your opponent bluffs.</p><p>When you must pick between bluff-catchers, blockers break the tie. Prefer calling with hands that hold a card your opponent\u2019s <b>value</b> hands need, and avoid hands that hold a card their <b>bluffs</b> need. If the obvious bluffs are missed heart draws, holding a heart yourself makes a bluff less likely, which makes your call worse.</p>'},
 {t:'The mirror image: how much to bluff',h:()=>'<p>Turn it around. On the river you bet with some strong hands and some bluffs. What mix leaves your opponent with no good answer?</p><p>They pay <i class="v">B</i> for a final pot of <i class="v">P</i> + 2<i class="v">B</i>, so a call needs to win</p>'+eqn(frac('<i>B</i>','<i>P</i> + 2<i>B</i>'))+'<p>of the time. If exactly that share of your bets are bluffs, calling and folding earn them the same. Bluff more and they profit by always calling. Bluff less and they profit by always folding.</p><table class="ttable"><tr><th>River bet</th><th>Bluffs in your betting range</th><th>Value hands per bluff</th></tr><tr><td>Half the pot</td><td>25%</td><td>3</td></tr><tr><td>The whole pot</td><td>33%</td><td>2</td></tr><tr><td>Twice the pot</td><td>40%</td><td>1.5</td></tr></table><p>A range built like this, strong hands plus bluffs with little in between, is called '+term('polarised')+'. Notice that <b>bigger bets are allowed more bluffs</b>. That is one reason strong players bet big when their range is polarised.</p><p>On earlier streets your bluffs are usually draws, which still have equity, so you can bluff more often than these river numbers.</p>'},
 {t:'When to ignore all of this',h:()=>'<p>MDF and balanced bluffing describe play that <b>cannot be exploited</b>. Poker players call this game theory optimal, or GTO. It is the right default against strong, unknown opponents.</p><p>It is not the most profitable play against opponents with obvious habits.</p><ul><li>Against someone who almost never bluffs, MDF makes you pay off their value bets. Fold more than MDF says.</li><li>Against someone who bluffs constantly, call more than MDF says.</li><li>Against someone who never folds, your balanced bluffs just burn chips. Stop bluffing and bet your good hands bigger.</li></ul><p>Adjusting like this is called playing '+term('exploitatively')+'. It wins more, and it opens you up to being exploited in turn if you have misjudged them.</p><div class="key">MDF also has a built-in simplification: it assumes a bluff has no chance of winning when called. Before the river most bluffs have some equity, and solvers defend a little less than MDF when out of position. Treat it as a guide to "am I folding far too much?", not as a law.</div><p><b>About this trainer.</b> The bots here bluff less than a balanced player. So the coach decides by your equity against their range, which means folding more than MDF. That is the right adjustment against them and against most casual players. Against strong players it would make you too easy to push around. The review after each bet you face shows the MDF number so you can see the gap.</p>'},
 {drill:'mdf',need:5,t:'Drill: defend and bluff in the right proportions'},
]},
{id:'cbet',title:'Range advantage and the flop bet',blurb:'Why the player who raised often bets small with everything, and when they should not.',pages:[
 {t:'Whose flop is it?',h:()=>'<p>When you raise before the flop and then bet the flop, that bet is called a '+term('continuation bet')+', or c-bet. How often should you make it? The modern answer starts with ranges, not with your own two cards.</p><p>Compare the two ranges from lesson 7. The raiser holds more big pairs and big aces. The big blind, who called, holds more middling suited and connected cards, and would have re-raised their very best hands.</p><ul><li>'+term('Range advantage')+': whose whole range has more equity on this board.</li><li>'+term('Nut advantage')+': who holds more of the very strongest hands, such as sets, two pair and overpairs.</li></ul>'+cardsRow([{label:'Raiser\u2019s flop',cards:tc('Ks 7d 2c')}])+'<p>The raiser has every AK, KQ, AA and KK. The caller has fewer strong kings and almost no big pairs, because they would have re-raised those. The raiser has both advantages.</p>'+cardsRow([{label:'Caller\u2019s flop',cards:tc('7h 6s 5d')}])+'<p>The caller\u2019s suited connectors and small pairs have made straights, sets and two pair. The raiser\u2019s AK and AQ have nothing. The advantages have moved to the caller.</p>'},
 {t:'Frequency and size',h:()=>'<p>Studying solver output gives a rule worth memorising:</p><div class="key"><b>Range advantage decides how often you bet.<br>Nut advantage decides how big you bet.</b></div><h3>Dry, high-card flops: bet small, bet often</h3><p>On K 7 2 you have both advantages. The standard play is a small bet, about a third of the pot, with <b>most of your range</b>, strong and weak hands alike. From the lesson 10 table, a third-pot bluff only needs to work 25% of the time, the caller has missed often, and even your weakest hands have some equity.</p><p>Betting your whole range the same way also hides your hand. If you bet big only when you are strong, observant players will simply fold.</p><h3>Low or connected flops: check a lot</h3><p>On 7 6 5 you have neither advantage. Check most hands. Bet only your strong hands and good draws, and bet bigger, because those hands need protection from the many draws out there.</p><h3>Wet, high flops: split your range</h3><p>On Q J 9 with two of a suit, both ranges connect. Bet big with strong hands and good draws, check the medium hands such as a weak pair of jacks.</p>'},
 {t:'Three adjustments',h:()=>'<ul><li><b>Out of position, check more.</b> When you must act first on every later street, a bet that gets called puts you in a hard spot. Solvers c-bet noticeably less often out of position.</li><li><b>Against several opponents, tighten up.</b> With two or more callers, somebody has usually connected. Bet your good hands and give up most bluffs. The small whole-range bet is a heads-up play.</li><li><b>Against players who never fold, drop the bluffs.</b> The small bet with weak hands relies on folds. Against a Station, bet when you have something and check when you do not.</li></ul><p>In Trainer mode, when you were the preflop raiser and one opponent called, the coach now follows this plan on the flop and says which of the three boards you are on. Later streets still go by your equity.</p><div class="key">Turn and river play in strong games continues the same logic: who still has the strong hands after the action so far, and therefore who is allowed to bet big. That is beyond this tutorial, and it is the natural next thing to study with a solver-based trainer.</div>'},
 {drill:'cbet',need:5,t:'Drill: pick the flop plan'},
]},
{id:'types',title:'Opponents and the checklist',blurb:'Five player types, how to adjust to each, and the routine to run on every decision.',pages:[
 {t:'Two numbers that describe a player',h:()=>'<p>Two statistics describe how someone plays before the flop.</p><ul><li>'+term('VPIP')+': the share of hands they choose to put chips in with. It measures how <b>loose</b> they are.</li><li>'+term('PFR')+': the share of hands they raise before the flop. It measures how <b>aggressive</b> they are.</li></ul><p>The five bots at this table are one of each type below, but their seats do not say which. Each seat shows the two numbers as observed so far, for example 55/45. In Trainer mode the coach adds its guess at the type once it has seen about 15 hands. In Coaching mode you only get the numbers.</p><table class="ttable"><tr><th>Type</th><th>VPIP / PFR</th><th>What to do</th></tr><tr><td><b>Nit</b></td><td>14 / 11</td><td>Believe their bets. Take their blinds.</td></tr><tr><td><b>TAG</b></td><td>22 / 18</td><td>Solid. Give them normal respect.</td></tr><tr><td><b>LAG</b></td><td>34 / 27</td><td>They bluff more, so call them down with weaker hands.</td></tr><tr><td><b>Station</b></td><td>45 / 9</td><td>Never bluff them. Bet your good hands big.</td></tr><tr><td><b>Maniac</b></td><td>55 / 45</td><td>Let them bet into your strong hands.</td></tr></table><p>Real opponents do not wear labels. You work out their type by watching how often they enter pots and what they show at the end. The Calibration section after each showdown in Trainer and Coaching mode is practice for exactly that.</p>'},
 {t:'The checklist',h:()=>'<p>Everything in this tutorial folds into one routine. Run it on every decision until it becomes automatic.</p><ol><li><b>Ranges.</b> Who has shown strength? What seat and what type are they? What hands does that leave?</li><li><b>My hand.</b> What do I have on this board, in the proper vocabulary? Roughly what is my equity against that range?</li><li><b>Price.</b> If I face a bet, what equity does a call need? Call over pot plus call.</li><li><b>Plan.</b> If I raised before the flop, whose board is this? Am I betting for value, bluffing, or checking? If I bet, which worse hands call and which better hands fold?</li><li><b>Size.</b> What size does that job best?</li></ol><h3>Where to go from here</h3><p><b>Trainer mode</b> shows all of these numbers live: your equity, the price, every opponent\u2019s range, the EV of each button, and the coach\u2019s pick. Use it to build intuition. Guess the number first, then look.</p><p><b>Coaching mode</b> hides everything. You decide on your own, and the coach then reviews the decision in full. Your score there is the honest one.</p>'},
 {drill:'vsType',need:4,t:'Drill: adjusting to opponents'},
]},
];

// ---------- Tutorial state, storage, rendering ----------
const STORE_KEY='pokerTrainer.v2'; let memStore={};
function loadStore(){ try{ const v=JSON.parse(localStorage.getItem(STORE_KEY)); if(v&&typeof v==='object') memStore=v; }catch(e){} if(!memStore.done) memStore.done={}; return memStore; }
function saveStore(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(memStore)); }catch(e){} }
const tut={lesson:null,page:0,drill:null};

function renderTutorial(){
  const el=$('tutView');
  if(tut.lesson===null){
    const doneN=LESSONS.filter(l=>memStore.done[l.id]).length;
    const next=LESSONS.find(l=>!memStore.done[l.id]);
    el.innerHTML='<div class="tut"><div class="crumb"><a href="#" id="tRoot">\u2039 Modes</a><span></span></div><h2>Learn poker from zero</h2><p>'+LESSONS.length+' short lessons. Each one explains an idea in plain words, shows where the numbers come from, and then drills it with questions dealt at random until it sticks. Nothing is assumed, and each lesson uses only what came before.</p><div class="pips">'+LESSONS.map(l=>'<i class="'+(memStore.done[l.id]?'on':'')+'"></i>').join('')+'<span>'+doneN+' of '+LESSONS.length+' complete</span></div>'+(next?'<div class="tnav" style="margin-top:6px"><button class="fwd" id="goNext">'+(doneN?'Continue with lesson '+(LESSONS.indexOf(next)+1):'Start lesson 1')+'</button></div>':'<div class="key">All lessons complete. Trainer mode shows every number while you play. Coaching mode hides them and reviews you afterwards.</div>')+'<ul class="lessons">'+LESSONS.map((l,i)=>'<li class="'+(memStore.done[l.id]?'done':'')+'"><button data-id="'+l.id+'"><span class="n">'+(memStore.done[l.id]?'\u2713':(i+1))+'</span><span><b>'+l.title+'</b><span class="d">'+l.blurb+'</span></span></button></li>').join('')+'</ul></div>';
    el.querySelectorAll('.lessons button').forEach(b=>b.onclick=()=>openLesson(b.dataset.id,true));
    const gn=$('goNext'); if(gn) gn.onclick=()=>openLesson(next.id,true);
    $('tRoot').onclick=e=>{ e.preventDefault(); setMode('home'); };
    return;
  }
  const L=LESSONS[tut.lesson], pg=L.pages[tut.page]; const last=tut.page===L.pages.length-1;
  let h='<div class="tut"><div class="crumb"><a href="#" id="tHome">\u2039 All lessons</a><span>Lesson '+(tut.lesson+1)+', step '+(tut.page+1)+' of '+L.pages.length+'</span></div><h2>'+pg.t+'</h2>';
  if(pg.drill) h+=drillHTML(pg); else h+=pg.h();
  const drillOpen=pg.drill && tut.drill.correct<pg.need;
  const nextL=LESSONS[tut.lesson+1];
  h+='<div class="tnav">'+(tut.page>0?'<button class="prev" id="tPrev">Back</button>':'')+'<button class="fwd" id="tNext">'+(last?(nextL?'Finish, then lesson '+(tut.lesson+2):'Finish the tutorial'):(drillOpen?'Skip this drill':'Next'))+'</button></div></div>';
  el.innerHTML=h;
  if(pg.m) pg.m(el);
  if(pg.drill) wireDrill(pg);
  $('tHome').onclick=e=>{ e.preventDefault(); tut.lesson=null; renderTutorial(); window.scrollTo(0,0); };
  const pv=$('tPrev'); if(pv) pv.onclick=()=>gotoPage(tut.page-1);
  $('tNext').onclick=()=>{ if(!last) return gotoPage(tut.page+1); memStore.done[L.id]=true; saveStore(); if(nextL) openLesson(nextL.id,true); else { tut.lesson=null; renderTutorial(); window.scrollTo(0,0); } };
}
function gotoPage(p){ tut.page=p; const pg=LESSONS[tut.lesson].pages[p]; tut.drill=pg.drill?{q:DRILLS[pg.drill](),chosen:null,correct:0,asked:0}:null; renderTutorial(); window.scrollTo(0,0); }
function openLesson(id,stay){ const i=Math.max(0,LESSONS.findIndex(l=>l.id===id)); tut.lesson=i; tut.page=0; tut.drill=null; if(!stay&&mode!=='tutorial') setMode('tutorial',true); gotoPage(0); }
function drillHTML(pg){
  const d=tut.drill, q=d.q, done=d.chosen!==null;
  let h='<div class="pips">'+Array.from({length:pg.need},(_,i)=>'<i class="'+(i<d.correct?'on':'')+'"></i>').join('')+'<span>'+(d.correct>=pg.need?'Drill complete. Keep going if you like.':d.correct+' of '+pg.need+' correct answers')+'</span></div>';
  h+='<div class="drill"><div class="q">'+q.q+'</div>'+(q.visual||'')+'<div class="opts" id="dOpts">'+q.options.map((o,i)=>'<button data-i="'+i+'" class="'+(done?(i===q.answer?'right':(i===d.chosen?'wrong':'')):'')+'" '+(done?'disabled':'')+'>'+o+'</button>').join('')+'</div>';
  if(done) h+='<div class="fb"><div class="verd">'+(d.chosen===q.answer?'Correct.':'Not quite. The answer is '+q.options[q.answer]+'.')+'</div>'+q.explain+'</div><div class="tnav" style="margin-top:12px"><button class="fwd" id="dNext">Another question</button></div>';
  return h+'</div>';
}
function wireDrill(pg){
  const d=tut.drill;
  document.querySelectorAll('#dOpts button').forEach(b=>b.onclick=()=>{ d.chosen=+b.dataset.i; d.asked++; if(d.chosen===d.q.answer) d.correct++; renderTutorial(); });
  const n=$('dNext'); if(n) n.onclick=()=>{ d.q=DRILLS[pg.drill](); d.chosen=null; renderTutorial(); const dr=document.querySelector('.drill'); if(dr&&dr.scrollIntoView) dr.scrollIntoView({block:'start'}); };
}

// ---------- Mode switching ----------
function renderHome(){
  const doneN=LESSONS.filter(l=>memStore.done[l.id]).length, last=memStore.lastMode;
  const item=(m,t,d)=>'<button data-mode="'+m+'" class="'+(last===m?'last':'')+'">'+(last===m?'<em>last used</em>':'')+'<b>'+t+'</b><span>'+d+'</span></button>';
  $('homeView').innerHTML='<div class="home"><h1>Poker trainer</h1><p class="sub">No-limit hold\u2019em, 100 bb deep</p>'+
    item('tutorial','Tutorial','Learn from zero. '+LESSONS.length+' lessons with drills. '+doneN+' of '+LESSONS.length+' complete.')+
    item('trainer','Trainer','Play with every number shown: equity, price, ranges, EV of each button, and the coach\u2019s pick.')+
    item('coach','Coaching','Play with no hints. Every decision is reviewed afterwards. This score is the honest one.')+'</div>';
  $('homeView').querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
}
function setMode(m,keepLesson){
  mode=m; memStore.mode=m; if(m!=='home') memStore.lastMode=m; saveStore();
  const play=m==='trainer'||m==='coach';
  document.body.classList.toggle('coachmode',m==='coach');
  $('homeView').hidden=m!=='home'; $('tutView').hidden=m!=='tutorial'; $('playView').hidden=!play;
  $('settingsBox').hidden=true; $('gearBtn').setAttribute('aria-expanded','false');
  if(m==='home'){ renderHome(); window.scrollTo(0,0); return; }
  if(m==='tutorial'){ if(!keepLesson) tut.lesson=null; renderTutorial(); window.scrollTo(0,0); return; }
  $('modeName').textContent=m==='coach'?'Coaching mode':'Trainer mode';
  if(!g){ newGame(); return; }
  g.stats=g.statsAll[m==='coach'?'coach':'trainer'];
  if(stalled){ stalled=false; render(); step(); } else render();
}
loadStore();
setMode(['tutorial','trainer','coach'].includes(memStore.mode)?memStore.mode:'home');
</script>
