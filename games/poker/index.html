<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Poker Trainer</title>
    <meta name="description" content="Learn no-limit hold'em at a real table: lessons, a coach that shows its working, and honest review." />
    <meta name="theme-color" content="#050607" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/hud.css" />
    <link rel="stylesheet" href="css/panels.css" />
    <link rel="stylesheet" href="css/dock.css" />
    <link rel="stylesheet" href="css/lessons.css" />
    <script defer src="/assets/js/game-analytics.js"></script>
  </head>
  <body>
    <div id="stage"></div>
    <header id="hud" class="glass"></header>
    <div id="scrim"></div>
    <aside id="info" class="glass" aria-label="Coach"></aside>
    <footer id="dock" class="glass" aria-label="Your hand and actions"></footer>
    <div id="settings" class="glass" role="dialog" aria-label="Settings" hidden></div>
    <section id="lesson" class="glass" aria-label="Lesson" hidden></section>
    <main id="home" hidden></main>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <noscript><div class="notice">The poker trainer needs JavaScript.</div></noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
