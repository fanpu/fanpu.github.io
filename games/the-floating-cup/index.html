horse's hooves fly; in one day I see all the flowers of Chang'an.", "author": "孟郊", "work": "登科后", "era": "唐", "note": "Meng Jiao passed the imperial exam at forty-six after failing repeatedly. 春风得意 became the phrase for a person riding high. Say it on the day something you worked years for finally comes through.", "ctx": null, "py": "chūn fēng dé yì mǎ tí jí ， yī rì kàn jìn cháng ān huā", "deep": {"zi": [["春风得意", "chūn fēng dé yì", "Pleased as if in a spring wind; 得意 as 'having one's wish'. The line created the idiom."], ["马蹄疾", "mǎ tí jí", "Hooves fast; 疾 as 'swift' (as in 疾驰), not 'ill'."], ["看尽", "kàn jìn", "See all of; 尽 the complement again."], ["长安花", "cháng ān huā", "The flowers of Chang'an; also, in Tang slang, the courtesans of the pleasure quarter, and the exam-passers' celebrations visited both."]], "dui": ["昔日龌龊不足夸，今朝放荡思无涯", "xī rì wò chuò bù zú kuā ， jīn zhāo fàng dàng sī wú yá", "The old squalor is not worth telling; this morning I run loose, my thoughts without shore.", "The first couplet: he is not pretending to be dignified about it."], "dian": "The new 进士 (jìn shì) of each year were feasted at 曲江 (qǔ jiāng) and toured the capital's gardens; the 'flowers in one day' is that circuit. The poem is the tradition's most famous record.", "shi": "796. 孟郊 (mèng jiāo) was forty-six and had failed the 进士 (jìn shì) exam at least twice. His mother sent him to try again; he passed. He then got a minor county post, hated it, and became the poet of poverty and cold, paired with 贾岛 (jiǎ dǎo) as 郊寒岛瘦 (jiāo hán dǎo shòu), 'Meng's cold, Jia's thin'. This is the one warm day.", "chuan": "春风得意 (chūn fēng dé yì) is one of the most used idioms for someone riding high, and also for someone who is about to be brought low, since everyone knows how the poet's career went. Say it on the day the result comes through, and enjoy it; the cold will come on its own.", "lian": [["p", "yangtian", "李白 leaving for court"], ["p", "modengxian", "the cost of wasting the years before"], ["s", "triumph", "the day it pays off"]]}}, "guanshan": {"id": "guanshan", "zh": "无为在歧路，儿女共沾巾", "segs": [["无为", "do not", "wú wéi"], ["在歧路", "at the fork in the road", "zài qí lù"], ["儿女", "like boy and girl", "ér nǚ"], ["共沾巾", "together wet your handkerchiefs", "gòng zhān jīn"]], "en": "Do not stand at the fork in the road wetting your handkerchiefs like children.", "author": "王勃", "work": "送杜少府之任蜀州", "era": "唐", "note": "The line right after 海内存知己. Bracing, almost brusque. Say it when a goodbye is getting too teary.", "ctx": null, "py": "wú wéi zài qí lù ， ér nǚ gòng zhān jīn", "deep": {"zi": [["无为", "wú wéi", "Read wú wéi, 'do not', imperative; not the Daoist 无为."], ["歧路", "qí lù", "A forked road; the standard image for parting since the 古诗十九首."], ["儿女", "ér nǚ", "Boy and girl: youngsters, or lovers. 儿女情长 is the idiom for tender feeling. Here, mildly scornful."], ["沾巾", "zhān jīn", "Wet the handkerchief. 沾 as 'moisten', 巾 as the cloth."]], "dui": ["海内存知己，天涯若比邻", "hǎi nèi cún zhī jǐ ， tiān yá ruò bǐ lín", "With one who knows me in the world, the sky's edge is next door.", "The couplet before, which earns the right to say this one."], "dian": "The 歧路 (qí lù) farewell is old: 杨朱 (yáng zhū) wept at a fork in the road (列子 (liè zi)) because it could lead anywhere. 王勃 (wáng bó) inverts the tradition: do not weep at the fork.", "shi": "Same poem as 海内存知己 (hǎi nèi cún zhī jǐ); see that card.", "chuan": "Less quoted than its partner and more useful when a goodbye is getting soggy. The tone is affectionate bossiness. It works as a joke between friends who know the previous line.", "lian": [["p", "zhiji", "the couplet before"], ["p", "quanjun", "王维's farewell, with wine instead of bracing"], ["s", "farewell", "the airport"]]}}, "jinzun": {"id": "jinzun", "zh": "人生得意须尽欢，莫使金樽空对月", "segs": [["人生", "in life", "rén shēng"], ["得意", "when things go your way", "dé yì"], ["须", "must", "xū"], ["尽欢", "enjoy to the full", "jìn huān"], ["莫使", "do not let", "mò shǐ"], ["金樽", "the golden cup", "jīn zūn"], ["空", "empty", "kōng"], ["对月", "face the moon", "duì yuè"]], "en": "When life goes your way, enjoy it to the full; never let the golden cup sit empty under the moon.", "author": "李白", "work": "将进酒", "era": "唐", "note": "Li Bai's drinking song. The line for a good night that you refuse to waste. He follows it with 天生我材必有用. Say it when raising a glass among friends.", "ctx": null, "py": "rén shēng dé yì xū jìn huān ， mò shǐ jīn zūn kōng duì yuè", "deep": {"zi": [["得意", "dé yì", "To have things go your way; literally 'to obtain the intention'. 春风得意 (孟郊) is the same word."], ["须", "xū", "Must. A stronger 'should'."], ["尽欢", "jìn huān", "尽 as verb-complement: enjoy to the end."], ["樽", "zūn", "A wine vessel. The 金樽 is generous; a jade cup would have been refined, a gold one is celebratory."]], "dui": ["天生我材必有用，千金散尽还复来", "tiān shēng wǒ cái bì yǒu yòng ， qiān jīn sàn jìn huán fù lái", "Heaven made my talent, it must have a use; a thousand gold spent will come back.", "The next couplet, which is the justification for this one."], "dian": "The 乐府 (yuè fǔ) tradition of drinking songs; the 古诗十九首 (gǔ shī shí jiǔ shǒu) already say 为乐当及时 (wèi lè dāng jí shí), 'take joy while there is time'. Li Bai's addition is the moon as witness to the empty cup.", "shi": "See the companion card: 752, at 嵩山 (sōng shān), drinking with 岑勋 (cén xūn) and 元丹丘 (yuán dān qiū), after the court had let him go.", "chuan": "The line for a night you refuse to waste, and the standard toast when something has gone right. 空对月 (kōng duì yuè) is the memorable image: an empty cup facing a full moon is a failure of nerve.", "lian": [["p", "tiansheng", "the next couplet"], ["p", "yaoyue", "Li Bai with the moon and no friends"], ["p", "chunxiao", "苏轼's version of the night worth gold"]]}}, "qingzhou": {"id": "qingzhou", "zh": "两岸猿声啼不住，轻舟已过万重山", "segs": [["两岸", "on both banks", "liǎng àn"], ["猿声", "the cries of gibbons", "yuán shēng"], ["啼不住", "cannot stop calling", "tí bú zhù"], ["轻舟", "the light boat", "qīng zhōu"], ["已过", "has already passed", "yǐ guò"], ["万重山", "ten thousand folds of mountain", "wàn zhòng shān"]], "en": "The gibbons on both banks are still crying, and my light boat has already passed ten thousand mountains.", "author": "李白", "work": "早发白帝城", "era": "唐", "note": "Li Bai had just been pardoned on his way to exile and turned his boat around. The mountains that took weeks to pass going up take a morning coming down. Say it when something that dragged for ages is suddenly behind you.", "ctx": null, "py": "liǎng àn yuán shēng tí bú zhù ， qīng zhōu yǐ guò wàn zhòng shān", "deep": {"zi": [["猿声", "yuán shēng", "Gibbons. Their calls along the Three Gorges were a fixed image of sorrow in Chinese poetry; travellers' songs said three cries would wet your sleeves. Li Bai hears them and is already past."], ["啼不住", "tí bú zhù", "住 as a complement: cannot stop. The gibbons keep crying, the boat does not wait."], ["万重山", "wàn zhòng shān", "重 read chóng, 'layer, fold'. Ten thousand folds of mountain: the Gorges."]], "dui": ["朝辞白帝彩云间，千里江陵一日还", "cháo cí bái dì cǎi yún jiān ， qiān lǐ jiāng líng yī rì hái", "At dawn I left 白帝 among coloured clouds; a thousand li to 江陵 and back in one day.", "The first couplet. The speed is set up there and paid off here."], "dian": "The gibbon lore comes from a Jin-era 三峡 (sān xiá) folk song: 巴东三峡巫峡长 (bā dōng sān xiá wū xiá cháng)，猿鸣三声泪沾裳 (yuán míng sān shēng lèi zhān shang). Li Bai's trick is to invoke the sad image and outrun it. 郦道元 (lì dào yuán)'s 水经注 (shuǐ jīng zhù), the great geography, records the same lore and the same speed of the current.", "shi": "759. Li Bai had backed the wrong prince in the aftermath of the An Lushan rebellion, been sentenced to exile in 夜郎 (yè láng) (Guizhou), and was travelling upriver toward it when a general amnesty reached him at 白帝城 (bái dì chéng). He turned the boat around. The poem is that morning.", "chuan": "Read in every Chinese primary school as a landscape poem; adults rediscover it as a poem about release. It is the line for the day a long trouble ends and everything moves fast. Say it when the thing behind you is still shouting and no longer matters.", "lian": [["p", "changfeng", "the vow made on the way out of Chang'an"], ["p", "gungun", "the same river with everyone washed away"], ["s", "suddenly-behind", "trouble still shouting, already passed"]]}}, "choudao": {"id": "choudao", "zh": "抽刀断水水更流，举杯消愁愁更愁", "segs": [["抽刀", "draw a sword", "chōu dāo"], ["断水", "cut the water", "duàn shuǐ"], ["水更流", "the water flows on harder", "shuǐ gèng liú"], ["举杯", "raise a cup", "jǔ bēi"], ["消愁", "to drown sorrow", "xiāo chóu"], ["愁更愁", "the sorrow deepens", "chóu gèng chóu"]], "en": "Draw a sword to cut the water and the water flows harder; raise a cup to drown sorrow and the sorrow deepens.", "author": "李白", "work": "宣州谢朓楼饯别校书叔云", "era": "唐", "note": "Trying to stop a feeling by force makes it stronger. Say it when you notice you are fighting your own mind, or when someone reaches for a drink to fix something a drink cannot fix.", "ctx": null, "py": "chōu dāo duàn shuǐ shuǐ gèng liú ， jǔ bēi xiāo chóu chóu gèng chóu", "deep": {"zi": [["抽刀断水", "chōu dāo duàn shuǐ", "Four characters that became an idiom for a futile act. The image is exact: the blade passes, the water closes."], ["消愁", "xiāo chóu", "消 as dissolve, dispel; 愁 as sorrow-anxiety. 借酒消愁, drinking to dissolve sorrow, is the everyday phrase, and this line is its refutation."], ["更", "gèng", "Read gèng, 'even more'. Both halves end with it: 水更流, 愁更愁."]], "dui": ["人生在世不称意，明朝散发弄扁舟", "rén shēng zài shì bù chēng yì ， míng cháo sàn fà nòng piān zhōu", "If life in this world does not go your way, tomorrow loosen your hair and take to a small boat.", "The final couplet, the exit: give up the official's hairstyle and go."], "dian": "The loosened hair and small boat allude to 范蠡 (fàn lǐ), the minister who helped 越 destroy 吴 and then sailed off on the lakes rather than stay in power, the model of the wise withdrawal.", "shi": "753, at 宣州 (xuān zhōu) (Anhui), a farewell for his uncle 李云 (lǐ yún), a court librarian, on the tower built by the poet 谢朓 (xiè tiǎo) two centuries earlier. The poem opens with one of Li Bai's best lines about time: 弃我去者 (qì wǒ qù zhě)，昨日之日不可留 (zuó rì zhī rì bù kě liú), 'what abandons me, yesterday's day, cannot be kept'.", "chuan": "The couplet is quoted about grief, about insomnia, and about drinking; it is the Chinese observation that suppression amplifies. It is also, quietly, an argument against the whole 将进酒 (qiāng jìn jiǔ) programme by the same man a year later. Say it when you notice yourself forcing calm.", "lian": [["p", "jianbuduan", "李煜's version: cannot cut, cannot untangle"], ["p", "zhanzhuan", "the oldest insomnia"], ["s", "fighting-mind", "the feeling that grows when fought"]]}}, "yangtian": {"id": "yangtian", "zh": "仰天大笑出门去，我辈岂是蓬蒿人", "segs": [["仰天", "face the sky", "yǎng tiān"], ["大笑", "laugh loudly", "dà xiào"], ["出门去", "walk out the door", "chū mén qù"], ["我辈", "people like me", "wǒ bèi"], ["岂是", "how could we be", "qǐ shì"], ["蓬蒿人", "weed-and-bramble people (nobodies)", "péng hāo rén"]], "en": "I throw my head back, laugh, and walk out the door; how could someone like me be a nobody in the weeds?", "author": "李白", "work": "南陵别儿童入京", "era": "唐", "note": "Li Bai, aged forty-one, had just been summoned to the imperial court after years of waiting. This is the sound of leaving for the big opportunity. Loud, and he knew it.", "ctx": null, "py": "yǎng tiān dà xiào chū mén qù ， wǒ bèi qǐ shì péng hāo rén", "deep": {"zi": [["仰天大笑", "yǎng tiān dà xiào", "Face up, laugh loud. The gesture became the standard picture of Li Bai."], ["我辈", "wǒ bèi", "People of my kind; the plural is a boast, enrolling everyone who agrees."], ["蓬蒿", "péng hāo", "Two weeds, fleabane and wormwood; 蓬蒿人 is a person of the weeds, a nobody. The phrase survives only because of this line."]], "dui": ["会稽愚妇轻买臣，余亦辞家西入秦", "huì jī yú fù qīng mǎi chén ， yú yì cí jiā xī rù qín", "The foolish wife of 会稽 despised 买臣; I too now leave home and go west into Qin.", "The couplet before it. 朱买臣 (zhū mǎi chén) was a Han woodcutter whose wife left him for a failure; he became a governor. Li Bai casts himself as the man about to be proven right."], "dian": "The 朱买臣 (zhū mǎi chén) story from the 汉书 (hàn shū), the poor scholar whose wife leaves him and who then rides back as governor. Every reader knew the ending, so the allusion is a prediction.", "shi": "742. Li Bai was forty-one and had waited his whole adult life for a summons to court. It came, from 玄宗 (xuán zōng), on the recommendation of the Daoist 吴筠 (wú yún) and the princess 玉真 (yù zhēn). He wrote this at 南陵 (nán líng) as he left his children, and the summons produced eighteen months at court and then the dismissal.", "chuan": "The last seven characters are the Chinese line for 'I was never going to be ordinary', quoted by entrepreneurs, exam-passers, and people leaving jobs. The tragedy underneath, that the court did not want him for what he was, is what keeps it from being merely brash. Say it on the day the door opens, with the knowledge that doors also close.", "lian": [["p", "chunfeng", "the exam-passer's version of the same day"], ["p", "tiansheng", "the same conviction after the door closed"], ["s", "big-opportunity", "walking out laughing"]]}}, "guangsha": {"id": "guangsha", "zh": "安得广厦千万间，大庇天下寒士俱欢颜", "segs": [["安得", "how could I get", "ān dé"], ["广厦", "a great house", "guǎng shà"], ["千万间", "with ten million rooms", "qiān wàn jiān"], ["大庇", "to shelter broadly", "dà bì"], ["天下寒士", "all the cold scholars under heaven", "tiān xià hán shì"], ["俱欢颜", "all with glad faces", "jù huān yán"]], "en": "If only I could get a great house of ten million rooms, to shelter every poor scholar under heaven and make all their faces glad.", "author": "杜甫", "work": "茅屋为秋风所破歌", "era": "唐", "note": "The wind had just torn the roof off his hut and his children were cold. He wished for a house for everyone else. Say it when you want to build something that shelters many people, not just yourself.", "ctx": null, "py": "ān dé guǎng shà qiān wàn jiān ， dà bì tiān xià hán shì jù huān yán", "deep": {"zi": [["安得", "ān dé", "'How might I obtain', a wish form that expects no answer."], ["广厦", "guǎng shà", "A broad mansion. 厦 (shà) is a large building; the modern 大厦 descends from it."], ["庇", "bì", "Read bì, to shelter, to cover. 大庇: shelter broadly."], ["寒士", "hán shì", "Cold scholars: poor men of learning without office. The class Du Fu belonged to."]], "dui": ["呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足", "wū hū ！ hé shí yǎn qián tū wù jiàn cǐ wū ， wú lú dú pò shòu dòng sǐ yì zú", "Ah, when will such a house rise before my eyes? Then let my own hut alone be broken, let me freeze to death, content.", "The ending, which turns the wish into an offer."], "dian": "No earlier line; the sentiment is Mencius's ruler who shares his joys and sorrows with the people, moved from the throne to a hut.", "shi": "761, autumn, 成都 (chéng dū). The wind tore the thatch off the cottage, boys stole the straw, the bedding was cold as iron, the roof leaked all night. The poem recounts all of it and then makes this turn. The title says exactly what happened: 茅屋为秋风所破歌 (máo wū wèi qiū fēng suǒ pò gē), song of the thatched hut broken by the autumn wind.", "chuan": "The line that made Du Fu the 诗圣 (shī shèng), the poet-sage, in the moral sense: the poet who wished for others' shelter while his own children shivered. Quoted in housing policy debates and by people building things for many. It is a heavy line; say it about a mission, not a product.", "lian": [["p", "xiantianxia", "范仲淹's version, from a statesman"], ["p", "hongyi", "the burden heavy, the road far"], ["s", "shelter-many", "building for others"]]}}, "powanjuan": {"id": "powanjuan", "zh": "读书破万卷，下笔如有神", "segs": [["读书", "read books", "dú shū"], ["破万卷", "wear through ten thousand scrolls", "pò wàn juàn"], ["下笔", "put brush to paper", "xià bǐ"], ["如有神", "as if a spirit guides it", "rú yǒu shén"]], "en": "Read until ten thousand scrolls are worn through, and when you write it is as if a spirit moves your brush.", "author": "杜甫", "work": "奉赠韦左丞丈二十二韵", "era": "唐", "note": "Du Fu describing his own preparation to a patron. Input in bulk, then output that feels effortless. Say it when the years of reading finally show in the work.", "ctx": null, "py": "dú shū pò wàn juàn ， xià bǐ rú yǒu shén", "deep": {"zi": [["破", "pò", "To break, to wear through. 读书破万卷 is 'read until ten thousand scrolls are broken', the image of books worn out by use."], ["万卷", "wàn juàn", "Ten thousand scrolls. Books were scrolls; a 卷 is a chapter still."], ["如有神", "rú yǒu shén", "As if a spirit were present. 神 here is the numinous, not a god."]], "dui": ["赋料扬雄敌，诗看子建亲", "fù liào yáng xióng dí ， shī kàn zi jiàn qīn", "In rhapsody I reckoned myself 扬雄's match; in poetry I felt close to 子建.", "The next couplet, in which he names the two greatest writers of the past as his peers. Not modest."], "dian": "扬雄 (yáng xióng) (Han rhapsodist) and 子建 (zi jiàn) (曹植 (cáo zhí)) are the allusions; naming them is a claim to the lineage.", "shi": "Around 748, Chang'an. A long poem to 韦济 (wéi jì), a senior official, recounting Du Fu's youth, his reading, his early promise, and his failure to gain office, asking for help. It is a job application in verse and one of the few places he describes his own formation.", "chuan": "Universally quoted about the relationship between input and output, on library walls and in every essay about learning to write. The important word is 破: not read, but read to pieces.", "lian": [["p", "gongxing", "陆游: paper is shallow, do it yourself"], ["p", "xuesi", "learning and thinking, both required"], ["s", "prep-pays", "when it finally shows"]]}}, "jiashu": {"id": "jiashu", "zh": "烽火连三月，家书抵万金", "segs": [["烽火", "beacon fires (war)", "fēng huǒ"], ["连三月", "have lasted three months", "lián sān yuè"], ["家书", "a letter from home", "jiā shū"], ["抵", "is worth", "dǐ"], ["万金", "ten thousand gold", "wàn jīn"]], "en": "Beacon fires have burned three months running; a letter from home is worth ten thousand in gold.", "author": "杜甫", "work": "春望", "era": "唐", "note": "Du Fu trapped in occupied Chang'an during the An Lushan rebellion. Say it when a message from family arrives in the middle of a hard stretch.", "ctx": null, "py": "fēng huǒ lián sān yuè ， jiā shū dǐ wàn jīn", "deep": {"zi": [["烽火", "fēng huǒ", "Beacon fires, the ancient signal of invasion; here simply 'the war'."], ["连三月", "lián sān yuè", "Lasted three months running; some read 'into the third month'. Either way, spring, and the war still on."], ["抵", "dǐ", "To be worth, to equal in value. 抵万金: worth ten thousand gold."]], "dui": ["国破山河在，城春草木深", "guó pò shān hé zài ， chéng chūn cǎo mù shēn", "The state is broken, mountains and rivers remain; the city in spring, grass and trees run deep.", "The opening couplet, the most famous eight characters about a fallen capital."], "dian": "The poem's structure descends from 诗经 (shī jīng) laments for a fallen capital (黍离 (shǔ lí)). 家书 (jiā shū) as the measure of value became its own tradition afterward.", "shi": "757, spring. The An Lushan rebels held Chang'an and Du Fu was trapped inside it, his family in the countryside, no word for months. The poem's last couplet says his white hair is too thin to hold a hatpin.", "chuan": "家书抵万金 (jiā shū dǐ wàn jīn) is quoted about letters from home in every war and every migration since, and now about a text message. The gold is not exaggeration; it records what the message was actually worth that spring.", "lian": [["p", "guxiangming", "the same family, a different year"], ["p", "yixiang", "missing home on a festival"], ["s", "letter-home", "the message that arrives mid-crisis"]]}}, "guxiangming": {"id": "guxiangming", "zh": "露从今夜白，月是故乡明", "segs": [["露", "the dew", "lù"], ["从今夜", "from tonight", "cóng jīn yè"], ["白", "turns white (the White Dew solar term)", "bái"], ["月", "the moon", "yuè"], ["是", "is", "shì"], ["故乡", "my hometown", "gù xiāng"], ["明", "bright", "míng"]], "en": "From tonight the dew turns white; the moon is brightest over home.", "author": "杜甫", "work": "月夜忆舍弟", "era": "唐", "note": "Written for his scattered brothers during the rebellion, on the night the White Dew term begins in early September. The moon is not actually brighter at home. That is the point.", "ctx": null, "py": "lù cóng jīn yè bái ， yuè shì gù xiāng míng", "deep": {"zi": [["露", "lù", "Dew. 白露 (White Dew) is the solar term around 8 September; the line puns on it: from tonight the dew is white."], ["从今夜", "cóng jīn yè", "From this night. The precision of a calendar date inside a lyric."], ["月是故乡明", "yuè shì gù xiāng míng", "是 for emphasis: the moon is bright at home. Not true, and the poem knows it."]], "dui": ["有弟皆分散，无家问死生", "yǒu dì jiē fēn sàn ， wú jiā wèn sǐ shēng", "My brothers are all scattered; there is no home to ask whether they live or die.", "The next couplet, which explains why the moon is brighter at home."], "dian": "Moon-and-home is the oldest pairing in Chinese verse; Du Fu's contribution is the calendar. 白露 (bái lù) as a poetic marker goes back to the 诗经 (shī jīng)'s 蒹葭 (jiān jiā) (白露为霜 (bái lù wèi shuāng)).", "shi": "759, 秦州 (qín zhōu) (Tianshui, Gansu), autumn, during the rebellion. Du Fu had four younger brothers scattered across the war; the title, 月夜忆舍弟 (yuè yè yì shě dì), is 'remembering my brothers on a moonlit night'. He had just resigned his post and was moving the family west.", "chuan": "月是故乡明 (yuè shì gù xiāng míng) is the standard line for homesickness, quoted by every overseas Chinese community, sometimes as a name for associations. Its power is the admitted illusion. Say it on a clear September night abroad; the date will be close.", "lian": [["p", "haishang", "the moon that joins two places"], ["p", "jiashu", "the same brothers, the year before"], ["s", "moon-home", "White Dew, far away"]]}}, "xueni": {"id": "xueni", "zh": "人生到处知何似，应似飞鸿踏雪泥", "segs": [["人生", "a human life", "rén shēng"], ["到处", "wherever it goes", "dào chù"], ["知何似", "what is it like?", "zhī hé shì"], ["应似", "must be like", "yīng shì"], ["飞鸿", "a wild goose in flight", "fēi hóng"], ["踏雪泥", "stepping on snowy mud", "tà xuě ní"]], "en": "What is a life, wherever it goes? It must be like a wild goose landing on snowy mud.", "author": "苏轼", "work": "和子由渑池怀旧", "era": "北宋", "note": "The next lines: the mud keeps a claw-print by chance, and the goose flies off not caring east or west. The origin of the phrase 雪泥鸿爪, the traces we leave. Say it when you revisit a place from years ago.", "ctx": ["泥上偶然留指爪，鸿飞那复计东西", "ní shàng ǒu rán liú zhǐ zhǎo ， hóng fēi nà fù jì dōng xī", "By chance it leaves a claw-print in the mud; the goose flies on, not counting east or west."], "py": "rén shēng dào chù zhī hé shì ， yīng shì fēi hóng tà xuě ní", "deep": {"zi": [["到处", "dào chù", "Everywhere it goes; 到 (arrive) plus 处 (place)."], ["何似", "hé shì", "What is it like; 似 as 'resemble'."], ["飞鸿", "fēi hóng", "A wild goose in flight, the image of the traveller since the 诗经."], ["雪泥", "xuě ní", "Snow-mud, the thawing slush that takes a print and loses it."]], "dui": ["泥上偶然留指爪，鸿飞那复计东西", "ní shàng ǒu rán liú zhǐ zhǎo ， hóng fēi nà fù jì dōng xī", "On the mud it chances to leave a claw-print; the goose flies on, not counting east or west.", "The second couplet, which finishes the image and gave the language 雪泥鸿爪 (xuě ní hóng zhǎo)."], "dian": "None earlier; the image is 苏轼 (sū shì)'s, and it produced the idiom 雪泥鸿爪 (xuě ní hóng zhǎo) (traces left by chance) that everyone uses. The poem 'harmonises' (和) a poem by his brother 子由 (zǐ yóu) about 渑池 (miǎn chí), matching its rhymes.", "shi": "1061. 苏轼 (sū shì) was twenty-four, on his way to his first post. He and 子由 (zǐ yóu) had passed through 渑池 (miǎn chí) five years earlier on the way to the exams and lodged at a temple where an old monk received them; now the monk was dead and the poem they had written on the wall was gone. The second half says exactly that.", "chuan": "Quoted about impermanence, about revisiting places, and about what a life leaves behind. It is impermanence with no sorrow in it, which is 苏轼 (sū shì)'s gift. Say it when you go back somewhere from years ago and find, or don't find, the mark you left.", "lian": [["p", "ertong", "贺知章's return, forgotten by the children"], ["p", "shizhe", "the river that does not stop"], ["s", "revisit", "the place from years ago"]]}}, "chunxiao": {"id": "chunxiao", "zh": "春宵一刻值千金，花有清香月有阴", "segs": [["春宵", "a spring night", "chūn xiāo"], ["一刻", "one quarter-hour", "yī kè"], ["值千金", "is worth a thousand gold", "zhí qiān jīn"], ["花有清香", "the flowers have a clear fragrance", "huā yǒu qīng xiāng"], ["月有阴", "the moon has its shadows", "yuè yǒu yīn"]], "en": "A quarter-hour of a spring night is worth a thousand gold; the flowers have their scent, the moon its shadows.", "author": "苏轼", "work": "春宵", "era": "北宋", "note": "Now used for any precious evening. Say it on a night you don't want to end, or as a reason not to go home yet.", "ctx": null, "py": "chūn xiāo yī kè zhí qiān jīn ， huā yǒu qīng xiāng yuè yǒu yīn", "deep": {"zi": [["春宵", "chūn xiāo", "A spring night; 宵 for night specifically as the hours of dark."], ["一刻", "yī kè", "A quarter-hour; the old day had 100 刻, later 96. So, 'a moment'."], ["值千金", "zhí qiān jīn", "Worth a thousand gold; 值 as 'be worth'."], ["月有阴", "yuè yǒu yīn", "The moon has its shadows; 阴 as shade, the moon partly veiled."]], "dui": ["歌管楼台声细细，秋千院落夜沉沉", "gē guǎn lóu tái shēng xì xì ， qiū qiān yuàn luò yè chén chén", "Song and flutes from the towers grow faint; the swing in the courtyard, the night sinks deep.", "The second couplet, the party ending and the quiet after."], "dian": "None specific. The phrase 春宵一刻值千金 (chūn xiāo yī kè zhí qiān jīn) was later used, without the second half, for the wedding night, which narrowed it.", "shi": "Probably 1070s to 1080s; the poem is short and undated. It reads as a spring evening in a garden with a party going on somewhere else.", "chuan": "The line for a precious evening, and for the reason not to go home yet. Because of the wedding-night use, it can sound arch; the full couplet, with flowers and moon, restores it. Say it about a night you don't want to end.", "lian": [["p", "jinzun", "李白's argument for not wasting the night"], ["p", "liushao", "the Lantern Festival night"], ["s", "good-night", "refusing to waste it"]]}}, "dajiang": {"id": "dajiang", "zh": "大江东去，浪淘尽，千古风流人物", "segs": [["大江", "the great river", "dà jiāng"], ["东去", "flows east", "dōng qù"], ["浪淘尽", "the waves have washed away", "làng táo jìn"], ["千古", "a thousand ages of", "qiān gǔ"], ["风流人物", "brilliant figures", "fēng liú rén wù"]], "en": "The great river flows east, and its waves have washed away the brilliant figures of a thousand ages.", "author": "苏轼", "work": "念奴娇·赤壁怀古", "era": "北宋", "note": "The opening of the most famous of all Song ci, written at Red Cliff in exile. The heroes of the Three Kingdoms are gone; the river is not. Say it by any large river, or about anyone who was once the most important person in the room.", "ctx": null, "py": "dà jiāng dōng qù ， làng táo jìn ， qiān gǔ fēng liú rén wù", "deep": {"zi": [["大江", "dà jiāng", "The great river, the Yangtze; 江 originally meant only the Yangtze, as 河 meant the Yellow River."], ["淘尽", "táo jìn", "淘 as 'wash out, pan out' (as in panning for gold); the waves have panned away the heroes."], ["风流人物", "fēng liú rén wù", "Brilliant, outstanding figures; 风流 in its older, admiring sense, not the modern 'dissolute'."]], "dui": ["故垒西边，人道是，三国周郎赤壁", "gù lěi xī biān ， rén dào shì ， sān guó zhōu láng chì bì", "West of the old fort, people say, is the Red Cliff of 周郎 of the Three Kingdoms.", "The next line: 苏轼 (sū shì) is not sure it is the right Red Cliff, and says so."], "dian": "The Battle of Red Cliff (208), where 周瑜 (zhōu yú) burned 曹操 (cáo cāo)'s fleet; 三国志 (sān guó zhì) 周瑜传 (zhōu yú zhuàn). 苏轼 (sū shì)'s 周瑜 (zhōu yú) is 雄姿英发 (xióng zī yīng fā), handsome and brilliant, with 小乔 (xiǎo qiáo) just married: the historical man, not the novel's envious one.", "shi": "1082, 黄州 (huáng zhōu), the same exile year as 定风波 (dìng fēng bō). 苏轼 (sū shì) visited 赤鼻矶 (chì bí jī), a red cliff near 黄州 (huáng zhōu) that may not be the battle site (the battle was probably further upstream), and wrote this and the two 赤壁赋 (chì bì fù). The 词 ends 人生如梦 (rén shēng rú mèng)，一樽还酹江月 (yī zūn hái lèi jiāng yuè), 'life is a dream; I pour a cup to the river moon'.", "chuan": "The most famous 词 in the language, the opening of the 豪放 (háo fàng) (heroic) style. Recited at every large river and used about anyone who was once the most important person in the room. 浪淘尽 (làng táo jìn) alone is understood.", "lian": [["p", "gungun", "杨慎's version, which opens the novel"], ["p", "jishengyu", "the novel's 周瑜, envious and dying"], ["p", "shizhe", "Confucius's river"]]}}, "zaishao": {"id": "zaishao", "zh": "谁道人生无再少？门前流水尚能西", "segs": [["谁道", "who says", "shuí dào"], ["人生", "in life", "rén shēng"], ["无再少", "there is no second youth", "wú zài shào"], ["门前", "before the gate", "mén qián"], ["流水", "the stream", "liú shuǐ"], ["尚能西", "can still flow west", "shàng néng xī"]], "en": "Who says life has no second youth? The stream before the gate can still run west.", "author": "苏轼", "work": "浣溪沙·游蕲水清泉寺", "era": "北宋", "note": "Every Chinese river flows east; Su Shi found one running west and took it personally. Say it when starting over later than you planned.", "ctx": null, "py": "shuí dào rén shēng wú zài shào ？ mén qián liú shuǐ shàng néng xī", "deep": {"zi": [["谁道", "shuí dào", "Who says; the rhetorical challenge that opens a 翻案."], ["再少", "zài shǎo", "A second youth; 少 read shào."], ["尚能西", "shàng néng xī", "Can still go west; 尚 as 'still', the impossible direction."]], "dui": ["休将白发唱黄鸡", "xiū jiāng bái fà chàng huáng jī", "Do not, with white hair, sing of the yellow cock.", "The last line. 白居易 (bái jū yì) had a poem about the cock crowing the day away and age coming; 苏轼 (sū shì) tells his own white hair not to sing it."], "dian": "The 白居易 (bái jū yì) poem 醉歌 (zuì gē) (黄鸡催晓丑时鸣 (huáng jī cuī xiǎo chǒu shí míng)) is the allusion in the last line; the westward stream is real, the 兰溪 (lán xī) near 蕲水 (qí shuǐ), which flows west, and 苏轼 (sū shì) seized on it.", "shi": "1082, 黄州 (huáng zhōu) again, on a visit to 清泉寺 (qīng quán sì) with a doctor friend who was treating his arm. The preface notes the stream flows west. 苏轼 (sū shì) was forty-five, in disgrace, and wrote a poem about second youth.", "chuan": "The line for starting late, quoted by career-changers and by the retired. The Chinese image behind it, all rivers flow east, makes the west-flowing stream a genuine wonder rather than a metaphor. Say it when you begin something at an age people call too late.", "lian": [["p", "changfeng", "李白's resolve at the same low point"], ["p", "yehuo", "what grows back"], ["s", "start-over-late", "beginning again"]]}}, "shuiqiong": {"id": "shuiqiong", "zh": "行到水穷处，坐看云起时", "segs": [["行到", "walk until", "xíng dào"], ["水穷处", "the place where the water ends", "shuǐ qióng chù"], ["坐看", "sit and watch", "zuò kàn"], ["云起时", "the moment the clouds rise", "yún qǐ shí"]], "en": "Walk until the stream runs out, then sit and watch the clouds rise.", "author": "王维", "work": "终南别业", "era": "唐", "note": "Wang Wei following a stream up the mountain with no destination. When it ends, he sits. The Chinese line for reaching the end of a path and not treating it as a problem.", "ctx": null, "py": "xíng dào shuǐ qióng chù ， zuò kàn yún qǐ shí", "deep": {"zi": [["行到", "xíng dào", "Walk until reaching; 到 as the endpoint."], ["水穷处", "shuǐ qióng chù", "Where the water ends; 穷 in its old sense, 'exhausted, at its limit', as in 欲穷千里目."], ["坐看", "zuò kàn", "Sit and watch; two verbs, the second passive."], ["云起时", "yún qǐ shí", "When clouds rise; 时 as 'the moment'."]], "dui": ["兴来每独往，胜事空自知", "xīng lái měi dú wǎng ， shèng shì kōng zì zhī", "When the mood comes I go alone; the good moments only I know.", "The couplet before: the solitary walk that ends at the stream's source."], "dian": "The Buddhist reading is that this is a picture of 随缘 (suí yuán), going along with conditions: the path ends, another thing begins, neither is sought. 王维 (wáng wéi) does not say that; readers have said it for him for twelve centuries.", "shi": "终南别业 (zhōng nán bié yè), 王维 (wáng wéi)'s 'retreat in the 终南 (zhōng nán) mountains', late in life. The poem ends with meeting an old man in the woods and talking until forgetting to go home.", "chuan": "Quoted by Chinese Buddhists, by hikers, and by people leaving jobs without a plan. It is the calmest line in the deck about an ending. 苏轼 (sū shì)'s 也无风雨也无晴 (yě wú fēng yǔ yě wú qíng) is the same equanimity with weather; this one has no weather at all.", "lian": [["p", "wufengyu", "苏轼 walking on in the rain"], ["p", "zhangchi", "rest as part of the method"], ["s", "path-ends", "the end of the trail"]]}}, "mingyuesong": {"id": "mingyuesong", "zh": "明月松间照，清泉石上流", "segs": [["明月", "the bright moon", "míng yuè"], ["松间", "between the pines", "sōng jiān"], ["照", "shines", "zhào"], ["清泉", "a clear spring", "qīng quán"], ["石上", "over the stones", "shí shàng"], ["流", "flows", "liú"]], "en": "The bright moon shines between the pines; a clear spring flows over the stones.", "author": "王维", "work": "山居秋暝", "era": "唐", "note": "Ten characters, two images, no adjectives that aren't needed. The evening after rain in the mountains. Say it on a clear night by water.", "ctx": null, "py": "míng yuè sōng jiān zhào ， qīng quán shí shàng liú", "deep": {"zi": [["松间", "sōng jiān", "Between the pines; 间 as 'among'."], ["清泉", "qīng quán", "A clear spring; 清 the key adjective of the whole poem."], ["石上流", "shí shàng liú", "Flows over the stones. The five characters have no adjective that does not name a thing."]], "dui": ["空山新雨后，天气晚来秋", "kōng shān xīn yǔ hòu ， tiān qì wǎn lái qiū", "Empty mountain after new rain; the evening air turns to autumn.", "The opening couplet, which sets the after-rain clarity this couplet lives in."], "dian": "The poem ends 随意春芳歇 (suí yì chūn fāng xiē)，王孙自可留 (wáng sūn zì kě liú), reversing a 楚辞 (chǔ cí) line (王孙兮归来 (wáng sūn xī guī lái)，山中兮不可以久留 (shān zhōng xī bù kě yǐ jiǔ liú), 'prince, come back, you cannot stay long in the mountains'). 王维 (wáng wéi) says the prince may stay. That quiet reversal is the poem's whole argument for the reclusive life.", "shi": "Written at 辋川 (wǎng chuān), 王维 (wáng wéi)'s estate in the 终南 (zhōng nán) mountains south of Chang'an, where he spent his later years between official duties, painting, practising Buddhism, and writing the short poems that made him the 诗佛 (shī fú).", "chuan": "The couplet critics use to explain 王维 (wáng wéi)'s method: 诗中有画 (shī zhōng yǒu huà), painting in the poem (苏轼 (sū shì)'s phrase for him). No sentiment is stated; the scene is the sentiment. It is the line for a clear mountain evening by water, and it does not need to be explained to the person you say it to.", "lian": [["p", "kongshan", "the same empty mountain"], ["p", "haoyu", "杜甫's rain that everything needed"], ["s", "night-after-rain", "the stream loud after rain"]]}}, "kongshan": {"id": "kongshan", "zh": "空山不见人，但闻人语响", "segs": [["空山", "the empty mountain", "kōng shān"], ["不见人", "no one to be seen", "bú jiàn rén"], ["但闻", "only hear", "dàn wén"], ["人语响", "the echo of voices", "rén yǔ xiǎng"]], "en": "Empty mountain, no one in sight, only the echo of voices somewhere.", "author": "王维", "work": "鹿柴", "era": "唐", "note": "Wang Wei's most translated poem. Presence proven by absence. Say it in any quiet place where you can hear people you cannot see.", "ctx": null, "py": "kōng shān bú jiàn rén ， dàn wén rén yǔ xiǎng", "deep": {"zi": [["空山", "kōng shān", "Empty mountain. 空 is also the Buddhist śūnyatā, emptiness, and 王维 the Buddhist means both."], ["但闻", "dàn wén", "但 as 'only', its classical sense; not 'but'."], ["人语响", "rén yǔ xiǎng", "The echo of voices; 响 as 'resound'. Presence known only by sound."]], "dui": ["返景入深林，复照青苔上", "fǎn jǐng rù shēn lín ， fù zhào qīng tái shàng", "Returning light enters the deep wood and shines again on the green moss.", "The second couplet: late sunlight, moss, nothing else."], "dian": "None specific. The poem is one of the twenty in the 辋川集 (wǎng chuān jí), each on a spot in the estate, written with 裴迪 (péi dí); 鹿柴 (lù chái) (deer enclosure) is one location.", "shi": "辋川 (wǎng chuān), around 750. Twenty characters, no first person, no verb of feeling.", "chuan": "The most translated Chinese poem (Eliot Weinberger's Nineteen Ways of Looking at Wang Wei collects the versions). It is the standard example of how Chinese poetry can omit the subject entirely. Say it in any empty place where voices carry; it needs no occasion beyond that.", "lian": [["p", "mingyuesong", "the same mountain, evening"], ["p", "hanjiang", "柳宗元's emptied landscape"], ["s", "empty-place", "voices you can't see"]]}}, "canghai2": {"id": "canghai2", "zh": "曾经沧海难为水，除却巫山不是云", "segs": [["曾经", "having once", "céng jīng"], ["沧海", "seen the vast sea", "cāng hǎi"], ["难为水", "no other water counts as water", "nán wéi shuǐ"], ["除却", "apart from", "chú què"], ["巫山", "Mount Wu (famed for its clouds)", "wū shān"], ["不是云", "no cloud is a cloud", "bú shì yún"]], "en": "Having seen the ocean, no other water is water; apart from the clouds of Mount Wu, no cloud is a cloud.", "author": "元稹", "work": "离思·其四", "era": "唐", "note": "Written for his dead wife. After something extraordinary, nothing else compares. Said of a person, and also of a place, a teacher, a city, a job.", "ctx": null, "py": "céng jīng cāng hǎi nán wéi shuǐ ， chú què wū shān bú shì yún", "deep": {"zi": [["曾经", "céng jīng", "Having once; 曾 (once) plus 经 (experienced)."], ["沧海", "cāng hǎi", "The vast blue sea; 沧 as the dark blue-green of deep water."], ["难为水", "nán wéi shuǐ", "Hard to count as water; 为 as 'be taken as'."], ["除却", "chú què", "Apart from; a Tang colloquialism."]], "dui": ["取次花丛懒回顾，半缘修道半缘君", "qǔ cì huā cóng lǎn huí gù ， bàn yuán xiū dào bàn yuán jūn", "Passing through the flowers I am too idle to look back, half for my Buddhist practice, half for you.", "The second couplet, with its admission that the vow is only half religious."], "dian": "Two allusions. 沧海 (cāng hǎi) from 孟子 (mèng zi) 尽心上 (jìn xīn shàng): 观于海者难为水 (guān yú hǎi zhě nán wéi shuǐ)，游于圣人之门者难为言 (yóu yú shèng rén zhī mén zhě nán wéi yán), 'one who has seen the sea finds other water hard to count as water; one who has studied at the sage's gate finds other words hard'. 巫山 (wū shān) from 宋玉 (sòng yù)'s 高唐赋 (gāo táng fù), in which the goddess of 巫山 (wū shān) comes to a king in a dream as 'clouds at morning, rain at evening', which is why 云雨 (yún yǔ) means lovemaking.", "shi": "Written for his wife 韦丛 (wéi cóng), who died in 809 at twenty-seven. 元稹 (yuán zhěn) (元微之 (yuán wēi zhī), 白居易 (bái jū yì)'s closest friend) wrote a series of mourning poems for her; this is the fourth of 离思 (lí sī). His later romantic career made readers doubt the vow, which is part of the poem's afterlife.", "chuan": "The line for a standard that ruined you for anything else, used about lovers, teachers, cities, and cuisines. 曾经沧海 (céng jīng cāng hǎi) is the four-character form and is very common. The 孟子 (mèng zi) source means the line is also about learning: after the sage's gate, other words are hard.", "lian": [["p", "shinian", "苏轼's grief for a wife, ten years on"], ["p", "yixinren", "the vow made in advance"], ["s", "nothing-compares", "after the extraordinary"]]}}, "lingxi": {"id": "lingxi", "zh": "身无彩凤双飞翼，心有灵犀一点通", "segs": [["身无", "my body has no", "shēn wú"], ["彩凤", "bright phoenix", "cǎi fèng"], ["双飞翼", "pair of wings to fly to you", "shuāng fēi yì"], ["心有", "but my heart has", "xīn yǒu"], ["灵犀", "the magic rhinoceros horn (believed to have a thread running through it)", "líng xī"], ["一点通", "one point of connection", "yì diǎn tōng"]], "en": "I have no phoenix wings to fly to you, but our hearts are joined like the thread in a rhinoceros horn.", "author": "李商隐", "work": "无题·昨夜星辰昨夜风", "era": "唐", "note": "心有灵犀 is now the everyday phrase for two people who understand each other without a word. Say it when someone finishes your thought.", "ctx": null, "py": "shēn wú cǎi fèng shuāng fēi yì ， xīn yǒu líng xī yī diǎn tōng", "deep": {"zi": [["彩凤", "cǎi fèng", "A coloured phoenix, the bird of paired flight. 双飞翼: the two wings that would carry him to her."], ["灵犀", "líng xī", "The rhinoceros horn of legend, believed to have a white thread running from base to tip; touch one end and the other feels it. Hence 一点通: one point, connected through."], ["通", "tōng", "To pass through, to communicate; the horn's thread and the lovers' minds."]], "dui": ["昨夜星辰昨夜风，画楼西畔桂堂东", "zuó yè xīng chén zuó yè fēng ， huà lóu xī pàn guì táng dōng", "Last night's stars, last night's wind; west of the painted tower, east of the cassia hall.", "The opening: the party where they were in the same room and could not speak."], "dian": "The rhinoceros lore comes from the 抱朴子 (bào pǔ zi) and Han natural history; 李商隐 (lǐ shāng yǐn) turned a curiosity into the permanent Chinese image for silent understanding.", "shi": "One of the 无题 (wú tí) (untitled) poems that made 李商隐 (lǐ shāng yǐn) the master of the oblique love lyric. The woman is unnamed and unnamed on purpose; the poem ends with the drum calling him to office and him riding off 'like tumbleweed'.", "chuan": "心有灵犀 (xīn yǒu líng xī) is now an everyday idiom, used about friends, colleagues, and doubles partners, its origin in an illicit glance across a banquet mostly forgotten. Say it when someone finishes your sentence; it is light enough for that.", "lian": [["p", "liangqing", "love that does not need presence"], ["p", "zhiji", "the friend who knows you"], ["s", "wordless-understanding", "the finished sentence"]]}}, "yidai": {"id": "yidai", "zh": "衣带渐宽终不悔，为伊消得人憔悴", "segs": [["衣带", "my belt", "yī dài"], ["渐宽", "grows loose", "jiàn kuān"], ["终不悔", "and I never regret it", "zhōng bù huǐ"], ["为伊", "for her, for that", "wèi yī"], ["消得", "it is worth", "xiāo dé"], ["人憔悴", "wasting away", "rén qiáo cuì"]], "en": "My belt grows loose and I don't regret it; for this it is worth wasting away.", "author": "柳永", "work": "蝶恋花·伫倚危楼风细细", "era": "北宋", "note": "A love poem that 王国维 made the second of his three stages of great achievement: the long, thinning grind after the first vision and before the sudden finding. Say it in the middle of something that is costing you.", "ctx": null, "py": "yī dài jiàn kuān zhōng bù huǐ ， wèi yī xiāo dé rén qiáo cuì", "deep": {"zi": [["衣带", "yī dài", "The belt of the robe; its loosening is the classical sign of wasting from longing, from the 古诗十九首 (相去日已远，衣带日已缓)."], ["终不悔", "zhōng bù huǐ", "In the end no regret; 悔 as 'regret'."], ["伊", "yī", "She; a Song colloquial pronoun, which gives the line its intimacy."], ["消得", "xiāo dé", "Worth it, deserving; 消 in a Song colloquial sense, 'to merit'."], ["憔悴", "qiáo cuì", "Read qiáo cuì, haggard, wasted."]], "dui": ["伫倚危楼风细细，望极春愁，黯黯生天际", "zhù yǐ wēi lóu fēng xì xì ， wàng jí chūn chóu ， àn àn shēng tiān jì", "Long I lean on the high tower in a fine wind; gazing to the limit, spring grief rises dark at the sky's edge.", "The opening, the long look before the vow."], "dian": "The 古诗十九首 (gǔ shī shí jiǔ shǒu) loosening belt is the source; 王国维 (wáng guó wéi)'s three stages made it the second, the long grind after the first vision.", "shi": "Early eleventh century. 柳永 (liǔ yǒng) wrote for the singing-girls of the capital and was told by the emperor to 'go and write songs' when he failed the exams; he did, and his songs were sung 'wherever there was a well'. This one is a song of longing, and it is the one the philosophers took.", "chuan": "Quoted about devotion of every kind because of 王国维 (wáng guó wéi): PhDs, startups, marathons. The original is a love song about losing weight from missing someone. Both are true; say it in the middle of something that is costing you and that you'd choose again.", "lian": [["p", "zhongli", "the third stage, the sudden finding"], ["p", "qiusuo", "屈原's long road"], ["s", "costly-devotion", "the grind you chose"]]}}, "liangqing": {"id": "liangqing", "zh": "两情若是久长时，又岂在朝朝暮暮", "segs": [["两情", "two hearts", "liǎng qíng"], ["若是", "if they are", "ruò shì"], ["久长时", "lasting", "jiǔ cháng shí"], ["又岂在", "why would it depend on", "yòu qǐ zài"], ["朝朝暮暮", "every morning and every evening together", "zhāo zhāo mù mù"]], "en": "If two hearts are truly lasting, why would it depend on being together every morning and night?", "author": "秦观", "work": "鹊桥仙·纤云弄巧", "era": "北宋", "note": "About the Cowherd and Weaver Girl, who meet once a year across the Milky Way. The standard line for a long-distance relationship. Some editions read 长久时; both are attested.", "ctx": null, "py": "liǎng qíng ruò shì jiǔ cháng shí ， yòu qǐ zài zhāo zhāo mù mù", "deep": {"zi": [["两情", "liǎng qíng", "Two hearts, the feeling on both sides."], ["久长", "jiǔ cháng", "Long-lasting; 久长 and 长久 both appear in editions."], ["岂在", "qǐ zài", "How could it lie in; 岂 the rhetorical 'how'."], ["朝朝暮暮", "zhāo zhāo mù mù", "Every morning and every evening; the phrase 宋玉 used for the goddess of 巫山 ('clouds at dawn, rain at dusk'), so it also carries the erotic."]], "dui": ["纤云弄巧，飞星传恨，银汉迢迢暗度", "xiān yún nòng qiǎo ， fēi xīng chuán hèn ， yín hàn tiáo tiáo àn dù", "Thin clouds work their patterns; shooting stars carry grief; across the far Silver River she crosses in the dark.", "The opening: the Weaver Girl crossing the Milky Way on the seventh night."], "dian": "The 七夕 (qī xī) legend of 牛郎 (niú láng) and 织女 (zhī nǚ), the Cowherd and the Weaver Girl, separated by the Milky Way and allowed to meet once a year on a bridge of magpies (鹊桥 (què qiáo), the poem's title). The 古诗十九首 (gǔ shī shí jiǔ shǒu) already had 迢迢牵牛星 (tiáo tiáo qiān niú xīng) (盈盈一水间 (yíng yíng yī shuǐ jiān)，脉脉不得语 (mò mò bù dé yǔ): 'a clear stream between, gazing, unable to speak'). 秦观 (qín guān) took a tragic myth and argued it was fine.", "shi": "Late eleventh century. 秦观 (qín guān) was 苏轼 (sū shì)'s disciple and the master of the delicate 婉约 (wǎn yuē) style; he died in exile in 1100. The poem is a 翻案 (fān àn), a reversal of the legend's sadness.", "chuan": "The Chinese line for long-distance love, quoted at every 七夕 (qī xī) (now marketed as Chinese Valentine's Day). Its argument, that presence is not the measure, is used about friendship and about the dead as well. Say it about a relationship that lives on calls.", "lian": [["p", "lingxi", "understanding without contact"], ["p", "haishang", "the moon shared at a distance"], ["s", "long-distance", "different time zones"]]}}, "yixinren": {"id": "yixinren", "zh": "愿得一心人，白头不相离", "segs": [["愿得", "I wish to have", "yuàn dé"], ["一心人", "a person of one heart", "yī xīn rén"], ["白头", "until our hair is white", "bái tóu"], ["不相离", "never parting", "bù xiāng lí"]], "en": "I want one person with a single heart, and to grow white-haired together, never parting.", "author": "卓文君", "work": "白头吟", "era": "西汉", "note": "By a woman who eloped with the poet 司马相如 and later wrote this when he considered taking a concubine. He changed his mind. Say it about what you actually want from a relationship.", "ctx": null, "py": "yuàn dé yī xīn rén ， bái tóu bù xiāng lí", "deep": {"zi": [["一心人", "yī xīn rén", "A person of one heart; 一心 as 'single-minded, undivided'."], ["白头", "bái tóu", "White head; the standard image for growing old together (白头偕老)."], ["不相离", "bù xiāng lí", "Not part; 相 the reciprocal, 离 'leave'."]], "dui": ["皑如山上雪，皎若云间月", "ái rú shān shàng xuě ， jiǎo ruò yún jiān yuè", "White as snow on the mountain, bright as the moon among clouds.", "The opening: her own love, described as pure before she says she has heard of his betrayal."], "dian": "The story is in the 西京杂记 (xī jīng zá jì): 卓文君 (zhuó wén jūn), a rich widow, eloped with the poor poet 司马相如 (sī mǎ xiāng rú) after hearing him play the 琴 (the 凤求凰 (fèng qiú huáng)); they ran a wine shop; he became famous at court and considered taking a concubine; she sent him this, and he dropped the idea. Whether she wrote it is doubted (the poem may be an anonymous Han 乐府 (yuè fǔ) later attached to her name), but the story has carried it for two thousand years.", "shi": "Western Han, second century BCE, or a later 乐府 (yuè fǔ) in her voice. Either way it is the earliest Chinese poem in which a woman states her terms.", "chuan": "Quoted at weddings and in every discussion of what marriage should be; 白头不相离 (bái tóu bù xiāng lí) is on countless cards. It is a line for saying plainly what you want, which is rarer in Chinese than the sentiment.", "lian": [["p", "liangqing", "love that does not need daily presence"], ["p", "canghai2", "元稹's vow after the fact"], ["s", "what-i-want", "saying it plainly"]]}}, "shinian": {"id": "shinian", "zh": "十年生死两茫茫，不思量，自难忘", "segs": [["十年", "ten years", "shí nián"], ["生死", "the living and the dead", "shēng sǐ"], ["两茫茫", "each lost to the other in vastness", "liǎng máng máng"], ["不思量", "I don't dwell on it", "bù sī liáng"], ["自难忘", "yet cannot forget", "zì nán wàng"]], "en": "Ten years, the living and the dead each lost in a vastness; I don't dwell on it, and cannot forget.", "author": "苏轼", "work": "江城子·乙卯正月二十日夜记梦", "era": "北宋", "note": "Written after dreaming of his wife, dead ten years. The truest line in Chinese about grief that has settled but not gone. Say it on an anniversary.", "ctx": null, "py": "shí nián shēng sǐ liǎng máng máng ， bù sī liáng ， zì nán wàng", "deep": {"zi": [["生死", "shēng sǐ", "The living and the dead; two people, one on each side."], ["两茫茫", "liǎng máng máng", "Both lost in vastness; 茫茫 the reduplicated 'boundless, blurred', applied to both sides."], ["思量", "sī liáng", "Read sī liáng, to dwell on, to consider."], ["自难忘", "zì nán wàng", "Of itself hard to forget; 自 as 'naturally, of its own accord'."]], "dui": ["纵使相逢应不识，尘满面，鬓如霜", "zòng shǐ xiāng féng yīng bù shí ， chén mǎn miàn ， bìn rú shuāng", "Even if we met you would not know me: dust on my face, temples like frost.", "The next lines; he imagines her not recognising him."], "dian": "The 悼亡 (dào wáng) (mourning a wife) tradition begins with 潘岳 (pān yuè)'s 悼亡诗 (dào wáng shī) (third century) and includes 元稹 (yuán zhěn)'s 遣悲怀 (qiǎn bēi huái). 苏轼 (sū shì)'s is the first 悼亡词 (dào wáng cí), mourning in the song form, and the tradition treats it as the finest.", "shi": "1075, 密州 (mì zhōu). His first wife 王弗 (wáng fú) had died in 1065 at twenty-six, after eleven years of marriage; she had sat behind a screen listening to his visitors and told him afterwards which ones to trust. The title gives the exact night of the dream, 乙卯正月二十日 (yǐ mǎo zhēng yuè èr shí rì), 20th of the first month. The 词 ends with her small window and the moonlit hill of short pines where she is buried.", "chuan": "The Chinese line for old grief, quoted on death anniversaries and in every essay about 苏轼 (sū shì)'s heart. It refuses drama: he does not think about it, and cannot forget. Say it on an anniversary, or not at all; it is not a line for company.", "lian": [["p", "canghai2", "元稹's grief for a wife"], ["p", "chouziwei", "sorrow that stops the mouth"], ["s", "old-grief", "the anniversary"]]}}, "danxin": {"id": "danxin", "zh": "人生自古谁无死，留取丹心照汗青", "segs": [["人生", "in life", "rén shēng"], ["自古", "since ancient times", "zì gǔ"], ["谁无死", "who does not die", "shuí wú sǐ"], ["留取", "keep", "liú qǔ"], ["丹心", "a red (loyal) heart", "dān xīn"], ["照汗青", "to shine on the histories (bamboo records)", "zhào hàn qīng"]], "en": "Since ancient times who has not died? Keep a loyal heart to shine on the record of history.", "author": "文天祥", "work": "过零丁洋", "era": "南宋", "note": "Written in captivity by the last prime minister of the Song, who refused to serve the Mongols and was executed. Say it when doing the right thing is going to cost you.", "ctx": null, "py": "rén shēng zì gǔ shéi wú sǐ ， liú qǔ dān xīn zhào hàn qīng", "deep": {"zi": [["汗青", "hàn qīng", "Read hàn qīng. Bamboo strips were heated ('sweated', 汗) to drive out moisture before writing, and were green (青); 汗青 came to mean the written record, history."], ["丹心", "dān xīn", "A cinnabar-red heart; red as the colour of loyalty."], ["留取", "liú qǔ", "Keep, retain; 取 as a verbal complement."]], "dui": ["惶恐滩头说惶恐，零丁洋里叹零丁", "huáng kǒng tān tóu shuō huáng kǒng ， líng dīng yáng lǐ tàn líng dīng", "At Terror Rapids I spoke of terror; on Lonely Sea I sighed at loneliness.", "The couplet before: two place names (惶恐滩 (huáng kǒng tān), 零丁洋 (líng dīng yáng)) that happen to name his states, which he uses as puns."], "dian": "None specific; 孟子 (mèng zi)'s 舍生取义 (shě shēng qǔ yì) (give up life to keep righteousness) is the doctrine.", "shi": "1279. 文天祥 (wén tiān xiáng), the last chancellor of the Song, had been captured by the Mongols and was being carried by ship past 零丁洋 (líng dīng yáng) (the Lingding channel off Hong Kong) to witness the final Song defeat at 崖山 (yá shān). His captor asked him to write to the last Song general urging surrender; he wrote this instead. He was held in 大都 (dà dū) (Beijing) three years, refused 忽必烈 (hū bì liè)'s offer of a ministry, and was executed in 1283.", "chuan": "The Chinese line for integrity at the cost of life, quoted about every martyr since and on every memorial. It is too large for most occasions; it fits when doing the right thing is going to cost you something real and you have decided.", "lian": [["p", "nengyi", "Mencius's man who cannot be bent"], ["p", "duxing", "屈原's earlier refusal"], ["s", "right-thing-costs", "the principle with a price"]]}}, "chouziwei": {"id": "chouziwei", "zh": "而今识尽愁滋味，欲说还休", "segs": [["而今", "now", "ér jīn"], ["识尽", "I have tasted fully", "shí jǐn"], ["愁滋味", "the flavour of sorrow", "chóu zī wèi"], ["欲说", "about to speak", "yù shuō"], ["还休", "and stop", "hái xiū"]], "en": "Now that I know the full taste of sorrow, I open my mouth to speak, and stop.", "author": "辛弃疾", "work": "丑奴儿·书博山道中壁", "era": "南宋", "note": "The first half of the poem is about being young and pretending to be sad for effect. This is the second half. Say it when someone asks how you are and the honest answer is too long.", "ctx": ["少年不识愁滋味，爱上层楼，为赋新词强说愁", "shào nián bù shí chóu zī wèi ， ài shàng céng lóu ， wèi fù xīn cí qiáng shuō chóu", "When young I did not know the taste of sorrow; I loved to climb towers and forced a little sadness into my poems."], "py": "ér jīn shí jìn chóu zī wèi ， yù shuō hái xiū", "deep": {"zi": [["识尽", "shí jǐn", "Tasted fully; 识 as 'know by experience', 尽 as 'to the end'."], ["滋味", "zī wèi", "Flavour; the sorrow is something tasted, not thought."], ["欲说还休", "yù shuō hái xiū", "About to speak, and stop; 还 (hái) as 'and yet', 休 as 'cease'. Repeated twice in the original for the halting."]], "dui": ["少年不识愁滋味，爱上层楼，为赋新词强说愁", "shào nián bù shí chóu zī wèi ， ài shàng céng lóu ， wèi fù xīn cí qiáng shuō chóu", "When young I did not know sorrow's taste; I loved to climb high towers and forced a little sorrow into new poems.", "The first stanza, the youthful performance the second stanza has outgrown."], "dian": "None specific. The tower-climbing of the first stanza is the whole Tang tradition of 登楼 (dēng lóu) melancholy, which 辛弃疾 (xīn qì jí) admits he faked.", "shi": "Around 1181 to 1192, on the wall of a road station in 博山 (bó shān) (Jiangxi), during the ten years 辛弃疾 (xīn qì jí) was dismissed and living at 带湖 (dài hú). He was in his forties. The last line: 却道天凉好个秋 (què dào tiān liáng hǎo gè qiū), 'and say instead: what a fine cool autumn'.", "chuan": "The line for a feeling you'd rather not unpack, and for the adult discovery that real sorrow is quieter than the performed kind. 欲说还休 (yù shuō hái xiū) alone is a common phrase. Say it, or rather don't, when someone asks how you are after a real loss.", "lian": [["p", "shinian", "the grief that is not spoken about"], ["p", "chunshui", "the sorrow measured by a river"], ["s", "cant-say-it", "how are you"]]}}, "ertong": {"id": "ertong", "zh": "儿童相见不相识，笑问客从何处来", "segs": [["儿童", "the children", "ér tóng"], ["相见", "see me", "xiāng jiàn"], ["不相识", "do not know me", "bù xiāng shí"], ["笑问", "laughing, they ask", "xiào wèn"], ["客", "the visitor", "kè"], ["从何处来", "where are you from?", "cóng hé chù lái"]], "en": "The children see me and don't know me; laughing, they ask the stranger where he's from.", "author": "贺知章", "work": "回乡偶书·其一", "era": "唐", "note": "He came home at eighty-six after fifty years away. The previous line: my accent is unchanged, my hair is thin. Say it when you go back to a place that has forgotten you.", "ctx": ["少小离家老大回，乡音无改鬓毛衰", "shào xiǎo lí jiā lǎo dà huí ， xiāng yīn wú gǎi bìn máo shuāi", "I left home young and return old; my accent unchanged, my temples thinned."], "py": "ér tóng xiāng jiàn bù xiāng shí ， xiào wèn kè cóng hé chù lái", "deep": {"zi": [["儿童", "ér tóng", "Children; the word is old and unchanged."], ["相见", "xiāng jiàn", "See each other; 相 as reciprocal."], ["笑问", "xiào wèn", "Ask, laughing; the laugh is the poem's knife."], ["客", "kè", "Guest, stranger; what he has become in his own village."]], "dui": ["少小离家老大回，乡音无改鬓毛衰", "shào xiǎo lí jiā lǎo dà huí ， xiāng yīn wú gǎi bìn máo shuāi", "I left home young and return old; my accent unchanged, the hair at my temples thinned.", "The first couplet. 衰 is read cuī in the old rhyme, shuāi in modern reading."], "dian": "None specific. The poem became the source for every later homecoming poem; the second of the pair says the mirror lake by the door has not changed either.", "shi": "744. 贺知章 (hè zhī zhāng) was eighty-six, had served under three emperors, had been the first to call 李白 (lǐ bái) a banished immortal (谪仙 (zhé xiān)), and retired to 越州 (yuè zhōu) (Shaoxing) as a Daoist. He died within the year. The poem is his return after half a century.", "chuan": "Recited by every returning emigrant, and by everyone going back to a school reunion. The children's laugh keeps it from self-pity; he is the joke, and he tells it.", "lian": [["p", "xueni", "苏轼 on the traces we leave"], ["p", "xiangfeng", "meeting again by chance"], ["s", "home-forgot-you", "back after decades"]]}}, "fangcao": {"id": "fangcao", "zh": "天涯何处无芳草", "segs": [["天涯", "to the sky's edge", "tiān yá"], ["何处", "where", "hé chù"], ["无", "is there no", "wú"], ["芳草", "fragrant grass", "fāng cǎo"]], "en": "Where under heaven is there no fragrant grass?", "author": "苏轼", "work": "蝶恋花·春景", "era": "北宋", "note": "Now the standard consolation after a rejection: there are other people, other places, other chances. In the original it is about spring going, not a breakup, which makes it gentler than its modern use.", "ctx": null, "py": "tiān yá hé chù wú fāng cǎo", "deep": {"zi": [["天涯", "tiān yá", "The sky's edge, the far world; the same word as in 天涯若比邻."], ["何处无", "hé chù wú", "'Where is there no…', a rhetorical form meaning 'everywhere there is'."], ["芳草", "fāng cǎo", "Fragrant grass; in the 楚辞 tradition, 芳草 stands for the virtuous and the beautiful, so it is not only grass."]], "dui": ["枝上柳绵吹又少，天涯何处无芳草", "zhī shàng liǔ mián chuī yòu shǎo ， tiān yá hé chù wú fāng cǎo", "On the branches the willow down is blown ever thinner; but where under heaven is there no fragrant grass?", "The full couplet: the spring is ending, and there is spring elsewhere."], "dian": "屈原 (qū yuán)'s 芳草 (fāng cǎo) as the good and beautiful; the line borrows the resonance. The 词 continues with a famous second stanza: a man outside the wall hears a woman laughing on a swing inside, and 多情却被无情恼 (duō qíng què bèi wú qíng nǎo), 'the feeling one is vexed by the unfeeling one'.", "shi": "Undated, probably 1090s. The story in 词林纪事 (cí lín jì shì) is that 苏轼 (sū shì) asked his concubine 王朝云 (wáng cháo yún) to sing it during his exile in 惠州 (huì zhōu) and she wept at this line and could not go on; when she died he never had it sung again. The story may be improved; the line is his.", "chuan": "Now the standard consolation after a rejection, romantic or otherwise, close to 'plenty more fish in the sea'. In the original it is about spring passing, which makes it gentler than its use. Say it to a friend after a no; say the whole couplet if you want to be exact.", "lian": [["p", "huofu", "the rejection that hides a gift"], ["p", "zhiji", "the one friend who makes distance small"], ["s", "rejection", "a no, and other chances"]]}}, "fuyun2": {"id": "fuyun2", "zh": "不畏浮云遮望眼，自缘身在最高层", "segs": [["不畏", "I don't fear", "bù wèi"], ["浮云", "drifting clouds", "fú yún"], ["遮望眼", "blocking my view", "zhē wàng yǎn"], ["自缘", "simply because", "zì yuán"], ["身在", "I stand", "shēn zài"], ["最高层", "on the highest tier", "zuì gāo céng"]], "en": "I don't fear the drifting clouds blocking my view, because I stand on the highest tier.", "author": "王安石", "work": "登飞来峰", "era": "北宋", "note": "Written at thirty, before his great reforms. Noise cannot fool you if your vantage is high enough. Say it when the news, or the office, is full of clouds.", "ctx": null, "py": "bù wèi fú yún zhē wàng yǎn ， zì yuán shēn zài zuì gāo céng", "deep": {"zi": [["不畏", "bù wèi", "Not afraid of; 畏 as 'fear, dread'."], ["浮云", "fú yún", "Drifting clouds; in the tradition, the slanderers who block the ruler's sight of the sun (the good minister)."], ["遮望眼", "zhē wàng yǎn", "Block the gazing eye; 遮 as 'screen off'."], ["自缘", "zì yuán", "Simply because; 缘 as 'cause'."], ["最高层", "zuì gāo céng", "The highest tier of the pagoda; 层 the storey."]], "dui": ["飞来山上千寻塔，闻说鸡鸣见日升", "fēi lái shān shàng qiān xún tǎ ， wén shuō jī míng jiàn rì shēng", "On 飞来 hill a thousand-fathom pagoda; they say at cockcrow you see the sun rise.", "The first couplet: the height, and the promise of a clear dawn."], "dian": "Two lines being answered. 李白 (lǐ bái), 登金陵凤凰台 (dēng jīn líng fèng huáng tái): 总为浮云能蔽日 (zǒng wèi fú yún néng bì rì)，长安不见使人愁 (cháng ān bú jiàn shǐ rén chóu), 'always the drifting clouds can hide the sun; not seeing Chang'an makes me grieve'. And behind that, the 古诗十九首 (gǔ shī shí jiǔ shǒu): 浮云蔽白日 (fú yún bì bái rì)，游子不顾返 (yóu zi bù gù fǎn). 王安石 (wáng ān shí) takes 李白 (lǐ bái)'s grief and replaces it with confidence: the clouds cannot block me, I am above them.", "shi": "1050. 王安石 (wáng ān shí) was thirty, a county magistrate returning home through 绍兴 (shào xīng), and climbed 飞来峰 (fēi lái fēng). Twenty years later he would be the most powerful minister of the century and the 浮云 (fú yún) would be real: the whole conservative establishment, including 苏轼 (sū shì), opposed his reforms.", "chuan": "Quoted for clarity that comes from vantage, and by politicians about ignoring criticism, which is its danger. It is the confident twin of 苏轼 (sū shì)'s 不识庐山真面目 (bù shí lú shān zhēn miàn mù): 王安石 (wáng ān shí) says the height solves it, 苏轼 (sū shì) says the height is the problem. Say it when the noise is real and you can see past it, and remember that both men were right.", "lian": [["p", "lushan", "苏轼's opposite view, inside the mountain"], ["p", "gengshang", "one storey higher"], ["p", "fengqiu", "刘禹锡's crane above the clouds"]]}}, "qianmo": {"id": "qianmo", "zh": "千磨万击还坚劲，任尔东西南北风", "segs": [["千磨万击", "a thousand grindings, ten thousand blows", "qiān mó wàn jī"], ["还坚劲", "still firm and strong", "hái jiān jìn"], ["任尔", "let you (the wind) be", "rèn ěr"], ["东西南北风", "east, west, south, or north wind", "dōng xī nán běi fēng"]], "en": "A thousand grindings, ten thousand blows, and still it stands firm; let the wind come from any quarter it likes.", "author": "郑燮", "work": "竹石", "era": "清", "note": "Zheng Banqiao, painter of bamboo, on bamboo rooted in rock. Say it when criticism is coming from every direction and you have decided not to move.", "ctx": null, "py": "qiān mó wàn jī hái jiān jìn ， rèn ěr dōng xī nán běi fēng", "deep": {"zi": [["磨", "mó", "Grind, wear; 击 strike. 千磨万击: a thousand grindings, ten thousand blows."], ["坚劲", "jiān jìn", "Firm and strong; 劲 read jìng, 'tough'."], ["任尔", "rèn ěr", "Let you, as you please; 尔 the archaic 'you', addressed to the wind."]], "dui": ["咬定青山不放松，立根原在破岩中", "yǎo dìng qīng shān bù fàng sōng ， lì gēn yuán zài pò yán zhōng", "It bites into the green mountain and will not let go; its roots are set in the broken rock.", "The first couplet, the grip before the wind."], "dian": "Bamboo as the 君子 (jūn zǐ) goes back to the 诗经 (shī jīng) (瞻彼淇奥 (zhān bǐ qí ào)，绿竹猗猗 (lǜ zhú yī yī)) and to 王徽之 (wáng huī zhī)'s 'how can one live a day without this gentleman'. 郑板桥 (zhèng bǎn qiáo)'s contribution is bamboo as resistance rather than grace.", "shi": "Eighteenth century. 郑燮 (zhèng xiè) (郑板桥 (zhèng bǎn qiáo)), one of the 扬州八怪 (yáng zhōu bā guài) (Eight Eccentrics of Yangzhou), painter of bamboo and orchids, magistrate who resigned rather than starve his county. The poem is an inscription on one of his own bamboo paintings, so the 石 in the title is the rock in the picture.", "chuan": "Quoted about anyone holding position under attack, from dissidents to founders. It is the loud resilience line, where 野火烧不尽 (yě huǒ shāo bù jìn) is the quiet one. Say it when criticism is coming from all four directions and you have decided to stay rooted.", "lian": [["p", "suihan", "the pine and cypress in winter"], ["p", "yehuo", "the grass after fire"], ["s", "criticism-all-sides", "winds from all quarters"]]}}, "manzhao": {"id": "manzhao", "zh": "满招损，谦受益", "segs": [["满", "fullness, pride", "mǎn"], ["招损", "invites loss", "zhāo sǔn"], ["谦", "humility", "qiān"], ["受益", "receives benefit", "shòu yì"]], "en": "Pride invites loss; humility receives benefit.", "author": "尚书", "work": "大禹谟", "era": "上古", "note": "From the Book of Documents, among the oldest Chinese texts. Six characters. Say it to yourself when the praise is arriving faster than the work deserves.", "ctx": null, "py": "mǎn zhāo sǔn ， qiān shòu yì", "deep": {"zi": [["满", "mǎn", "Full. Of a vessel, or of a person full of himself. The image is a cup that has no room."], ["谦", "qiān", "Humility, and also the name of the fifteenth hexagram of the 周易, the only hexagram whose every line is auspicious."]], "dui": null, "dian": "None earlier; the 尚书 (shàng shū) is among the oldest texts. But note: the chapter it comes from, 大禹谟 (dà yǔ mó), belongs to the 'ancient script' portion of the 尚书 (shàng shū), which the Qing scholar 阎若璩 (yán ruò qú) showed in the seventeenth century to be a forgery assembled in the third or fourth century CE from earlier fragments. The line is therefore very old, but not as old as it claims.", "shi": "Presented as advice given to 禹, the flood-tamer, before he became emperor. The full sentence is 满招损 (mǎn zhāo sǔn)，谦受益 (qiān shòu yì)，时乃天道 (shí nǎi tiān dào), 'this is the way of heaven'.", "chuan": "Six characters that every Chinese child hears from a grandparent. Chinese modesty rituals, the reflexive 哪里哪里 (nǎ lǐ nǎ lǐ) in reply to praise, descend from this. Its use is preventive: say it to yourself when praise arrives, before you start to believe it.", "lian": [["p", "buyun", "not resenting the absence of praise"], ["p", "taoli", "reputation that does not need advertising"], ["s", "praise-arriving", "when the compliments come too fast"]]}}, "buyun": {"id": "buyun", "zh": "人不知而不愠，不亦君子乎", "segs": [["人不知", "others do not know me", "rén bù zhī"], ["而不愠", "and I am not resentful", "ér bù yùn"], ["不亦", "is that not", "bù yì"], ["君子乎", "a noble person?", "jūn zǐ hū"]], "en": "To be unknown and not resentful: is that not the mark of a noble person?", "author": "孔子", "work": "论语·学而", "era": "春秋", "note": "The third sentence of the Analects, right after the one about friends from afar. Not being recognised is the test; the resentment is what fails it.", "ctx": null, "py": "rén bù zhī ér bù yùn ， bù yì jūn zǐ hū", "deep": {"zi": [["愠", "yùn", "Resentment that has not yet become anger; a sulk with a grievance in it. Rare in modern Chinese outside this line."], ["君子", "jūn zǐ", "Originally 'a lord's son', an aristocrat by birth. Confucius quietly redefined it to mean an aristocrat by conduct, which is why the word can end this sentence about someone nobody has heard of."]], "dui": ["学而时习之，不亦说乎？有朋自远方来，不亦乐乎？", "xué ér shí xí zhī ， bù yì yuè hū ？ yǒu péng zì yuǎn fāng lái ， bù yì lè hū ？", "To learn and practise at the proper time, is that not a pleasure? A friend from afar, is that not a joy?", "The three sentences that open the Analects form one movement: private pleasure in learning, shared joy in friendship, and then this, the test that comes when neither the learning nor the friends bring recognition."], "dian": "No earlier text. This is line one of the book that everything else quotes.", "shi": "The opening of 学而 (xué ér), the first chapter. The tradition holds that the editors placed these three sentences first on purpose, as a summary of the whole programme: study, fellowship, and equanimity about reputation.", "chuan": "The line gave classical Chinese a standard shape for stating a virtue: describe the hard situation, then ask 不亦 (bù yì)…乎, 'is that not…?' Because it comes first in the first book every schoolchild once memorised, the rhythm of 不亦 (bù yì)…乎 is instantly recognisable and often parodied. Said seriously, it is a claim about yourself, so most people quote it about others.", "lian": [["p", "buhuan", "the same worry, ten lines later, turned into an instruction"], ["p", "youpeng", "the sentence immediately before it"], ["p", "shixi", "the sentence that opens the book"]]}}, "cuncao": {"id": "cuncao", "zh": "谁言寸草心，报得三春晖", "segs": [["谁言", "who says", "shuí yán"], ["寸草心", "the heart of an inch-high blade of grass", "cùn cǎo xīn"], ["报得", "can repay", "bào dé"], ["三春晖", "the light of three months of spring", "sān chūn huī"]], "en": "Who says the heart of a blade of grass can ever repay the light of three months of spring?", "author": "孟郊", "work": "游子吟", "era": "唐", "note": "The mother sewing her son's clothes before he leaves. The most quoted line in Chinese about what we owe our parents. Say it before you call home.", "ctx": null, "py": "shuí yán cùn cǎo xīn ， bào dé sān chūn huī", "deep": {"zi": [["寸草", "cùn cǎo", "An inch of grass; the child, small and low."], ["心", "xīn", "Heart; in botany, the tender core of a plant. The pun is exact: the grass's heart is the child's."], ["报得", "bào dé", "Repay; 得 as potential complement: can repay."], ["三春晖", "sān chūn huī", "The light of the three months of spring (孟春, 仲春, 季春); the mother."]], "dui": ["临行密密缝，意恐迟迟归", "lín xíng mì mì fèng ， yì kǒng chí chí guī", "Before he leaves she sews stitch on close stitch, fearing his late return.", "The couplet before, the concrete scene the metaphor grows from."], "dian": "None earlier. The poem is the source for the whole modern vocabulary of maternal love; 春晖 (chūn huī) became a name for schools, charities, and a famous 1990s essay.", "shi": "Written around 800 when 孟郊 (mèng jiāo), over fifty, finally had a post at 溧阳 (lì yáng) and brought his mother to live with him; the subtitle says 迎母溧上作 (yíng mǔ lì shàng zuò), 'written on welcoming my mother'. The 游子 (yóu zi) (wanderer) of the title is himself.", "chuan": "The most quoted line about parents in Chinese, recited at Mother's Day events and engraved on temple walls. It is so familiar that it can be sentimental; said quietly before you actually call home, it is not.", "lian": [["p", "shuyujing", "the warning about waiting too long"], ["p", "jiashu", "the letter from home"], ["s", "call-home", "before the call"]]}}, "shukeren": {"id": "shukeren", "zh": "是可忍，孰不可忍", "segs": [["是", "this", "shì"], ["可忍", "can be tolerated", "kě rěn"], ["孰", "what then", "shú"], ["不可忍", "cannot be tolerated", "bù kě rěn"]], "en": "If this can be tolerated, what cannot?", "author": "孔子", "work": "论语·八佾", "era": "春秋", "note": "Confucius on a minister who used the emperor's dance troupe at his own house. The Chinese way to say a line has been crossed. Say it rarely; it is strong.", "ctx": null, "py": "shì kě rěn ， shú bù kě rěn", "deep": {"zi": [["是", "shì", "Here the demonstrative 'this', not the modern copula."], ["忍", "rěn", "To bear, to tolerate. 可忍: can be borne."], ["孰", "shú", "Read shú, 'what, which'. 孰不可忍: what could not be borne?"]], "dui": null, "dian": "None earlier. The occasion is the source.", "shi": "From 八佾 (bā yì), the chapter on ritual. 季氏 (jì shì), the most powerful family in 鲁, staged 八佾 (bā yì), eight rows of eight dancers, in their courtyard. That number was reserved for the Son of Heaven; a minister was entitled to four rows. Confucius's remark is about a usurpation dressed as entertainment: if this is tolerated, the whole order is already gone.", "chuan": "The line was used by every reformer and revolutionary in Chinese history to name the moment of intolerable breach, and by 毛泽东 (máo zé dōng) in a famous 1966 editorial. Because of that history it is a heavy phrase, and comic when used about small things, which is also a use.", "lian": [["s", "line-crossed", "what it is for"], ["p", "nengyi", "the man who cannot be bent"], ["p", "duxing", "conviction that might be pride"]]}}, "danrushui": {"id": "danrushui", "zh": "君子之交淡如水", "segs": [["君子之交", "the friendship of noble people", "jūn zǐ zhī jiāo"], ["淡", "is plain, light", "dàn"], ["如水", "like water", "rú shuǐ"]], "en": "The friendship of noble people is plain as water.", "author": "庄子", "work": "山木", "era": "战国", "note": "The rest: the friendship of small people is sweet as wine; the plain one lasts, the sweet one breaks. Say it about a friend you haven't spoken to in a year and could call tomorrow.", "ctx": null, "py": "jūn zǐ zhī jiāo dàn rú shuǐ", "deep": {"zi": [["交", "jiāo", "Friendship, association; the noun form of 交往. 君子之交 is the association of noble people."], ["淡", "dàn", "Bland, light, plain. The word for weak tea and for a flat flavour, used here as praise."]], "dui": ["小人之交甘若醴", "xiǎo rén zhī jiāo gān ruò lǐ", "The friendship of small people is sweet as new wine.", "The matching half. 醴 (lǐ) is sweet, weak, quickly made wine. The passage continues: the plain grows close, the sweet breaks off."], "dian": "None earlier. 庄子 (zhuāng zi)'s own text reads 淡若水 (dàn ruò shuǐ), 'plain as water'; the form 淡如水 (dàn rú shuǐ) that everyone says is a later smoothing.", "shi": "庄子 (zhuāng zi) 山木 (shān mù). The saying is put in the mouth of a hermit, 子桑雽 (zi sāng hù), advising Confucius after his friends deserted him during the siege between 陈 and 蔡. That the Daoist book has Confucius receiving the advice is typical 庄子 (zhuāng zi) mischief.", "chuan": "One of the few Daoist lines that became a Confucian proverb. It is the standard Chinese description of a friendship that survives silence, and it is also, less kindly, what people say about friends who never call. Say it about someone you could phone tomorrow after a year and pick up mid-sentence.", "lian": [["p", "suihan", "the friend who stays in winter"], ["p", "zhiji", "the friend who knows you"], ["s", "low-maintenance-friend", "the year-long silence that costs nothing"]]}}, "duxing": {"id": "duxing", "zh": "举世皆浊我独清，众人皆醉我独醒", "segs": [["举世", "the whole world", "jǔ shì"], ["皆浊", "is muddy", "jiē zhuó"], ["我独清", "I alone am clear", "wǒ dú qīng"], ["众人", "everyone", "zhòng rén"], ["皆醉", "is drunk", "jiē zuì"], ["我独醒", "I alone am awake", "wǒ dú xǐng"]], "en": "The whole world is muddy and I alone am clear; everyone is drunk and I alone am awake.", "author": "屈原", "work": "渔父", "era": "战国", "note": "Qu Yuan says this to a fisherman just before drowning himself. The fisherman's reply is to go with the current. Say it when you are sure everyone else is wrong, and then check whether the fisherman had a point.", "ctx": null, "py": "jǔ shì jiē zhuó wǒ dú qīng ， zhòng rén jiē zuì wǒ dú xǐng", "deep": {"zi": [["举世", "jǔ shì", "The whole world; 举 as 'all, entire', as in 举国."], ["浊", "zhuó", "Muddy, turbid, of water; morally, corrupt. The opposite of 清."], ["醒", "xǐng", "Awake, sober. 独醒, alone awake, became an idiom for lonely lucidity."]], "dui": ["沧浪之水清兮，可以濯吾缨；沧浪之水浊兮，可以濯吾足", "cāng làng zhī shuǐ qīng xī ， kě yǐ zhuó wú yīng ； cāng làng zhī shuǐ zhuó xī ， kě yǐ zhuó wú zú", "When the Canglang's water is clear, I wash my hat-strings; when it is muddy, I wash my feet.", "The fisherman's reply, sung as he rows away. Adapt to the water. 孟子 (mèng zi) quotes the same song."], "dian": "None earlier for 屈原 (qū yuán)'s line. The fisherman's song is older and appears in 孟子 (mèng zi) too, which suggests it was a folk song both writers reached for.", "shi": "楚辞 (chǔ cí) 渔父 (yú fù), a short dialogue probably written by a follower rather than 屈原 (qū yuán) himself. 屈原 (qū yuán), a minister of 楚, exiled by a king who preferred flatterers, meets a fisherman by the river and explains why he is haggard. The fisherman suggests going with the current; 屈原 (qū yuán) refuses and, in the tradition, drowns himself in the 汨罗 (mì luó) river. The Dragon Boat festival commemorates the search for his body.", "chuan": "The line is the founding statement of Chinese principled isolation and has been quoted by every dissident since. Its shadow is that it is also what every crank says. The dialogue keeps both: 屈原 (qū yuán)'s integrity and the fisherman's survival. The honest way to use it is to say it and then ask yourself whether the fisherman was right.", "lian": [["p", "qiusuo", "屈原's other great line, the long road"], ["p", "danxin", "the minister who chose death with a clear heart"], ["s", "everyone-wrong", "the room that disagrees"]]}}, "guobugai": {"id": "guobugai", "zh": "过而不改，是谓过矣", "segs": [["过", "an error", "guò"], ["而不改", "and not correcting it", "ér bù gǎi"], ["是谓", "that is called", "shì wèi"], ["过矣", "the real error", "guò yǐ"]], "en": "To make a mistake and not correct it: that is the real mistake.", "author": "孔子", "work": "论语·卫灵公", "era": "春秋", "note": "Confucius did not mind errors. He minded defending them. Say it when you catch yourself explaining instead of fixing.", "ctx": null, "py": "guò ér bù gǎi ， shì wèi guò yǐ", "deep": {"zi": [["过", "guò", "Error, transgression; also 'to pass'. The same character is in 过错 and 过去. The line uses it three times, twice as noun, once at the end with the exclamatory 矣."], ["是谓", "shì wèi", "'This is called', the formula for a definition. Confucius is defining what an error really is."]], "dui": null, "dian": "The Analects returns to the theme: 过则勿惮改 (guò zé wù dàn gǎi) ('when you err, do not fear to correct it', 学而 (xué ér)) and 子贡 (zi gòng)'s saying that a gentleman's errors are like eclipses, seen by all and admired when corrected. 左传 (zuǒ zhuàn) has the older 人谁无过 (rén shuí wú guò)，过而能改 (guò ér néng gǎi)，善莫大焉 (shàn mò dà yān) ('who is without fault? to err and be able to change, no good is greater').", "shi": "From 卫灵公 (wèi líng gōng). No occasion recorded.", "chuan": "Quoted in performance reviews, apologies, and political self-criticism. Its bite is in the redefinition: the error is not the act but the refusal. In practice the line is most useful in the second before you start justifying.", "lian": [["p", "zhizhi", "the honesty that makes correction possible"], ["p", "zizhi", "seeing the fault in yourself"], ["s", "defending-error", "the paragraph about why it happened"]]}}, "shenzheng": {"id": "shenzheng", "zh": "其身正，不令而行", "segs": [["其身正", "if one is upright oneself", "qí shēn zhèng"], ["不令", "without giving orders", "bù lìng"], ["而行", "things get done", "ér xíng"]], "en": "When the leader is upright, things get done without orders.", "author": "孔子", "work": "论语·子路", "era": "春秋", "note": "The second half: if he is not upright, orders are given and not followed. The whole Confucian theory of leadership in ten characters. Say it when you are about to ask people to do something you don't do.", "ctx": ["其身不正，虽令不从", "qí shēn bù zhèng ， suī lìng bù cóng", "If he is not upright himself, even his orders are not obeyed."], "py": "qí shēn zhèng ， bù lìng ér xíng", "deep": {"zi": [["身", "shēn", "One's own person, body and conduct together. 其身正 is 'if his person is upright'
