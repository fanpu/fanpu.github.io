."], ["令", "lìng", "Command. 不令而行: without commanding, it is done. The line is about what happens without orders."]], "dui": ["其身不正，虽令不从", "qí shēn bù zhèng ， suī lìng bù cóng", "If he is not upright himself, even his orders are not obeyed.", "The second half, which is the warning. The two halves together are the whole theory."], "dian": "None earlier. It is the plainest statement of the Confucian idea that government is by example, which the 大学 (dà xué) systematised as the chain from cultivating the self to ordering the state.", "shi": "From 子路 (zi lù), a chapter largely about governing. Confucius held office briefly in 鲁 and spent years advising rulers who did not take the advice; the line has that experience behind it.", "chuan": "Quoted in every Chinese book on leadership and in every anti-corruption campaign. 司马迁 (sī mǎ qiān) applied it to the general 李广 (lǐ guǎng) in the passage that also gave us 桃李不言 (táo lǐ bù yán). In a team it means exactly what it says: they copy what you do.", "lian": [["p", "taoli", "the general to whom 司马迁 applied it"], ["p", "jisuo", "the personal rule behind the public one"], ["s", "leading", "the instruction you don't follow"]]}}, "jisuo": {"id": "jisuo", "zh": "己所不欲，勿施于人", "segs": [["己", "yourself", "jǐ"], ["所不欲", "what you do not want", "suǒ bù yù"], ["勿施于人", "do not impose on others", "wù shī yú rén"]], "en": "What you do not want for yourself, do not impose on others.", "author": "孔子", "work": "论语·卫灵公", "era": "春秋", "note": "Confucius's one-word rule for a whole life, given when asked for one: 恕 (shù, reciprocity). Say it when you're about to hand someone the treatment you'd resent.", "ctx": null, "py": "jǐ suǒ bù yù ， wù shī yú rén", "deep": {"zi": [["己", "jǐ", "Self, oneself. Note that it is not 我 (I); 己 is the reflexive, which makes the rule general."], ["欲", "yù", "Want, desire. 所不欲: that which is not wanted."], ["施", "shī", "To apply, to bestow, to impose. 施于人: impose on others."]], "dui": null, "dian": "Appears twice in the Analects. In 卫灵公 (wèi líng gōng), 子贡 (zi gòng) asks for one word to practise for a whole life, and Confucius says 恕 (shù), and explains it with this line. In 颜渊 (yán yuān), 仲弓 (zhòng gōng) asks about benevolence and gets the same eight characters. The Golden Rule in negative form; Confucius stated it about five centuries before the Gospels stated the positive one.", "shi": "Two occasions, both answers to a disciple's question, which is why it reads as a rule rather than an observation.", "chuan": "The line is inscribed at the United Nations and quoted in every comparison of world ethics. Philosophers have argued that the negative form is wiser than the positive: it stops you imposing your preferences. In daily use it is what you say when you catch yourself about to treat someone the way you would resent being treated.", "lian": [["p", "shenzheng", "the same rule applied to leaders"], ["p", "liangyao", "when the honest thing is what they do not want"], ["s", "leading", "asking people to do what you don't"]]}}, "shilai": {"id": "shilai", "zh": "时来天地皆同力，运去英雄不自由", "segs": [["时来", "when the moment comes", "shí lái"], ["天地", "heaven and earth", "tiān dì"], ["皆同力", "all push with you", "jiē tóng lì"], ["运去", "when fortune leaves", "yùn qù"], ["英雄", "even a hero", "yīng xióng"], ["不自由", "is not free", "bù zì yóu"]], "en": "When the moment comes, heaven and earth push with you; when fortune leaves, even a hero is not free.", "author": "罗隐", "work": "筹笔驿", "era": "唐", "note": "About 诸葛亮, the greatest strategist of the Three Kingdoms, who still lost. Say it when timing beat effort, yours or someone else's.", "ctx": null, "py": "shí lái tiān dì jiē tóng lì ， yùn qù yīng xióng bù zì yóu", "deep": {"zi": [["时来", "shí lái", "When the time comes; 时 as the right moment, the same 时 as in 好雨知时节."], ["同力", "tóng lì", "Same force: all pushing together."], ["运去", "yùn qù", "When luck departs; 运 as fortune, as in 命运."], ["不自由", "bù zì yóu", "Not free; not the modern political sense, but 'not his own master'."]], "dui": ["千里山河轻孺子，两朝冠剑恨谯周", "qiān lǐ shān hé qīng rú zi ， liǎng cháo guān jiàn hèn qiáo zhōu", "A thousand li of rivers and hills entrusted to a child; the cap and sword of two reigns, and hatred for 谯周.", "The couplet after: 诸葛亮 (zhū gě liàng)'s burden (the boy emperor 刘禅 (liú chán)) and the minister 谯周 (qiáo zhōu) who advised surrender after his death."], "dian": "The whole poem is about 诸葛亮 (zhū gě liàng) at 筹笔驿 (chóu bǐ yì), the post station where he planned his northern campaigns. It leans on 出师表 (chū shī biǎo) and on 杜甫 (dù fǔ)'s 蜀相 (shǔ xiāng) (出师未捷身先死 (chū shī wèi jié shēn xiān sǐ), 'the campaign not won, he died first').", "shi": "Late ninth century. 罗隐 (luó yǐn) failed the 进士 (jìn shì) exam ten times and became the bitter satirist of the late Tang. The poem is about the greatest strategist in Chinese history failing anyway, which is 罗隐 (luó yǐn)'s own situation dressed up.", "chuan": "The couplet is quoted about timing in careers, in business, in politics; it is the Chinese acknowledgement that effort is not sufficient. It sounds fatalistic only if you forget that 诸葛亮 (zhū gě liàng) tried anyway. Say it about someone brilliant who caught the wrong decade.", "lian": [["p", "huofu", "fortune and misfortune leaning on each other"], ["p", "juantu", "the general who might have come back"], ["s", "timing-beat-effort", "everything right except the moment"]]}}, "shuyujing": {"id": "shuyujing", "zh": "树欲静而风不止，子欲养而亲不待", "segs": [["树欲静", "the tree wants to be still", "shù yù jìng"], ["而风不止", "but the wind does not stop", "ér fēng bù zhǐ"], ["子欲养", "the child wants to care for them", "zǐ yù yǎng"], ["而亲不待", "but the parents do not wait", "ér qīn bù dài"]], "en": "The tree wants stillness but the wind won't stop; the child wants to care for his parents, but they do not wait.", "author": "增广贤文", "work": "增广贤文（本自《韩诗外传》）", "era": "明清", "note": "The line about calling your parents while you can. Older than the 增广贤文; the story is of a man weeping at the roadside over exactly this. Say it, then make the call.", "ctx": null, "py": "shù yù jìng ér fēng bù zhǐ ， zǐ yù yǎng ér qīn bù dài", "deep": {"zi": [["欲静", "yù jìng", "Wants stillness; 欲 as 'wish', 静 as 'still'."], ["风不止", "fēng bù zhǐ", "The wind does not stop; 止 as 'cease'."], ["子欲养", "zǐ yù yǎng", "The child wishes to support; 养 as 'to nourish, care for', the duty of the young to the old."], ["亲不待", "qīn bù dài", "The parents do not wait; 亲 as 'parents', 待 as 'wait'."]], "dui": null, "dian": "韩诗外传 (hán shī wài zhuàn) (second century BCE) and 孔子家语 (kǒng zi jiā yǔ): Confucius on the road heard a man weeping, 皋鱼 (gāo yú), who explained he had travelled to study and come home to find his parents dead, and said 树欲静而风不止 (shù yù jìng ér fēng bù zhǐ)，子欲养而亲不待 (zǐ yù yǎng ér qīn bù dài). Confucius told his disciples to remember it, and thirteen of them went home. The 增广贤文 (zēng guǎng xián wén) kept the line and dropped the story.", "shi": "The story is Han; the line is in every later collection of filial sayings.", "chuan": "The line that ends arguments about whether to call home. It is quoted in eulogies by the child who waited too long, and it is one of the most painful lines in Chinese because everyone has a version of the delay. Say it, then make the call; do not save it for the eulogy.", "lian": [["p", "cuncao", "the mother's spring light"], ["p", "jiashu", "the letter from home"], ["s", "call-home", "before you call"]]}}, "wengu": {"id": "wengu", "zh": "温故而知新，可以为师矣", "segs": [["温故", "review the old", "wēn gù"], ["而知新", "and learn the new", "ér zhī xīn"], ["可以", "one can", "kě yǐ"], ["为师矣", "be a teacher", "wéi shī yǐ"]], "en": "Review what is old and learn what is new from it; such a person can be a teacher.", "author": "孔子", "work": "论语·为政", "era": "春秋", "note": "Rereading your own notes from a year ago and seeing something you missed is exactly this. Say it when the old material yields something new.", "ctx": null, "py": "wēn gù ér zhī xīn ， kě yǐ wéi shī yǐ", "deep": {"zi": [["温", "wēn", "To warm; by extension to review, as in 温习. Old learning is warmed up, not merely reread."], ["故", "gù", "The old, the past, what is already known. Also 'therefore', but not here."], ["为师", "wèi shī", "为 read wéi, 'to be'. 可以为师矣: can be a teacher."]], "dui": null, "dian": "None earlier. 礼记 (lǐ jì) has the related idea that a teacher must know both the old and the new.", "shi": "From 为政 (wéi zhèng), next to 学而不思则罔 (xué ér bù sī zé wǎng). The three sayings together describe knowing as an activity rather than a possession.", "chuan": "温故知新 (wēn gù zhī xīn) is one of the most used four-character idioms in education. Its modern reading is often 'revise', which is too small; the line says the old yields new knowledge to the person who returns to it. Rereading your own notes and finding what you missed is exactly this.", "lian": [["p", "xuesi", "the two failure modes it guards against"], ["p", "gongxing", "knowledge that has to be redone by hand"], ["p", "shixi", "practice at the right time"]]}}, "nayan": {"id": "nayan", "zh": "君子欲讷于言而敏于行", "segs": [["君子", "a noble person", "jūn zǐ"], ["欲", "wishes to be", "yù"], ["讷于言", "slow in speech", "nè yú yán"], ["而敏于行", "and quick in action", "ér mǐn yú xíng"]], "en": "A noble person wants to be slow to speak and quick to act.", "author": "孔子", "work": "论语·里仁", "era": "春秋", "note": "Say it after a meeting where the talking outran the doing.", "ctx": null, "py": "jūn zǐ yù nè yú yán ér mǐn yú xíng", "deep": {"zi": [["讷", "nè", "Read nè, slow or halting in speech. Not eloquence's opposite; the reluctance to speak before acting."], ["敏", "mǐn", "Quick, nimble, diligent. The same 敏 as in 敏感 and 敏捷."]], "dui": null, "dian": "Part of a cluster in the Analects: 巧言令色 (qiǎo yán lìng sè) (suspicion of fluency), 刚毅木讷近仁 (gāng yì mù nè jìn rén) (plainness is close to goodness), and 先行其言而后从之 (xiān xíng qí yán ér hòu cóng zhī) ('act first, then let your words follow', 为政 (wéi zhèng)). Confucius distrusted speech he had not seen backed by action.", "shi": "From 里仁 (lǐ rén). No occasion recorded.", "chuan": "讷言敏行 (nè yán mǐn xíng) is the four-character form. It became a model of the ideal official and, later, of the ideal engineer. In a culture that prizes eloquence it is a counterweight; in a meeting culture it is a rebuke. Say it after you have talked too much.", "lian": [["p", "qiaoyan", "the negative: clever words, pleasing face"], ["p", "gongxing", "doing it with your own hands"], ["s", "talk-vs-do", "the meeting full of words"]]}}, "juantu": {"id": "juantu", "zh": "江东子弟多才俊，卷土重来未可知", "segs": [["江东子弟", "the young men of Jiangdong", "jiāng dōng zǐ dì"], ["多才俊", "many are talented", "duō cái jùn"], ["卷土重来", "roll up the dust and come back", "juǎn tǔ chóng lái"], ["未可知", "who can say?", "wèi kě zhī"]], "en": "The young men of Jiangdong are full of talent; whether he might have rolled back the dust and returned, who can say?", "author": "杜牧", "work": "题乌江亭", "era": "唐", "note": "About 项羽, who killed himself at the Wu river rather than go home defeated. Du Mu argues he should have gone home and regrouped. 卷土重来 is now the phrase for a comeback. Say it when you lose and decide it isn't final.", "ctx": null, "py": "jiāng dōng zǐ dì duō cái jùn ， juǎn tǔ chóng lái wèi kě zhī", "deep": {"zi": [["江东", "jiāng dōng", "East of the river: the lower Yangtze, 项羽's home base."], ["才俊", "cái jùn", "Talented and outstanding; 俊 as 'excellent'."], ["卷土重来", "juǎn tǔ chóng lái", "Roll up the dust and come again; the image of an army's dust cloud returning. Now the idiom for a comeback."], ["未可知", "wèi kě zhī", "Cannot be known; the poem ends on an open question."]], "dui": ["胜败兵家事不期，包羞忍耻是男儿", "shèng bài bīng jiā shì bù qī ， bāo xiū rěn chǐ shì nán ér", "Victory and defeat are the soldier's lot and cannot be planned; to swallow shame and bear disgrace is what makes a man.", "The first couplet, the argument that 项羽 (xiàng yǔ) should have endured."], "dian": "史记 (shǐ jì) 项羽本纪 (xiàng yǔ běn jì): defeated at 垓下 (gāi xià), 项羽 (xiàng yǔ) reached the Wu river, where a boatman offered to ferry him to 江东 (jiāng dōng); he said he could not face the elders whose sons he had led to death, and cut his throat. 杜牧 (dù mù)'s poem is an argument with that decision. 王安石 (wáng ān shí) answered a century later in 叠题乌江亭 (dié tí wū jiāng tíng): 江东子弟今虽在 (jiāng dōng zǐ dì jīn suī zài)，肯与君王卷土来 (kěn yǔ jūn wáng juǎn tǔ lái), 'the men of Jiangdong may still be there, but would they come back for their king?' 李清照 (lǐ qīng zhào) took 项羽 (xiàng yǔ)'s side: 至今思项羽 (zhì jīn sī xiàng yǔ)，不肯过江东 (bù kěn guò jiāng dōng).", "shi": "838 or so, at 乌江亭 (wū jiāng tíng) (Anhui), where the suicide happened. 杜牧 (dù mù) was the grandson of a prime minister and wrote on military history; the poem is a strategist's second-guess.", "chuan": "卷土重来 (juǎn tǔ chóng lái) is one of the most used idioms for a comeback, in sport, business, and politics. The three-poem argument (杜牧 (dù mù), 王安石 (wáng ān shí), 李清照 (lǐ qīng zhào)) is a famous case of poets debating history across centuries. Say it when you lose and decide it isn't the end; the 王安石 (wáng ān shí) rebuttal is there if you want to be honest about whether anyone would follow.", "lian": [["p", "yehuo", "resilience without the drama"], ["p", "shilai", "when the timing is what beat you"], ["s", "comeback", "losing a round"]]}}, "taoli": {"id": "taoli", "zh": "桃李不言，下自成蹊", "segs": [["桃李", "peach and plum trees", "táo lǐ"], ["不言", "say nothing", "bù yán"], ["下", "beneath them", "xià"], ["自成蹊", "a path forms by itself", "zì chéng xī"]], "en": "The peach and plum trees say nothing, yet a path forms beneath them.", "author": "司马迁", "work": "史记·李将军列传", "era": "西汉", "note": "About the general 李广, who never promoted himself and whom soldiers followed anyway. Say it about someone whose reputation was built by others, or when tempted to advertise.", "ctx": null, "py": "táo lǐ bù yán ， xià zì chéng xī", "deep": {"zi": [["桃李", "táo lǐ", "Peach and plum; also, since the Tang, a teacher's students (桃李满天下, 'peach and plum all over the world')."], ["不言", "bù yán", "Do not speak; the trees say nothing."], ["蹊", "qī", "Read xī, a footpath; 成蹊: a path forms."]], "dui": null, "dian": "The 太史公曰 (tài shǐ gōng yuē) (the Grand Historian says) at the end of the 李将军列传 (lǐ jiāng jūn liè zhuàn): 司马迁 (sī mǎ qiān) first quotes Confucius's 其身正 (qí shēn zhèng)，不令而行 (bù lìng ér xíng), then adds this as a 谚 (proverb), and applies both to 李广 (lǐ guǎng), the general the soldiers loved, who never spoke well of himself, was never made a marquis, and killed himself rather than face a court-martial at sixty. 王昌龄 (wáng chāng líng)'s 但使龙城飞将在 (dàn shǐ lóng chéng fēi jiāng zài) is about the same man.", "shi": "史记 (shǐ jì), completed around 91 BCE. 司马迁 (sī mǎ qiān) himself had been castrated for defending another general, 李广 (lǐ guǎng)'s grandson 李陵 (lǐ líng), so the biography is written by a man who had paid for taking the family's side.", "chuan": "The standard Chinese line for reputation earned without self-promotion, and, because of the 桃李 (táo lǐ) pun, for teachers. Say it about someone whose fame was built by others, or when tempted to post about your own work.", "lian": [["p", "shenzheng", "the Confucius line 司马迁 pairs it with"], ["p", "buhuan", "not worrying about being known"], ["s", "reputation-earned", "the temptation to advertise"]]}}, "dangduan": {"id": "dangduan", "zh": "当断不断，反受其乱", "segs": [["当断", "when one should decide", "dāng duàn"], ["不断", "and does not", "bù duàn"], ["反", "instead", "fǎn"], ["受其乱", "suffers the resulting chaos", "shòu qí luàn"]], "en": "Fail to decide when you should, and you suffer the chaos instead.", "author": "司马迁", "work": "史记·齐悼惠王世家", "era": "西汉", "note": "Say it when you have been circling a decision for a week.", "ctx": null, "py": "dāng duàn bù duàn ， fǎn shòu qí luàn", "deep": {"zi": [["当断", "dāng duàn", "When one ought to cut; 断 as 'decide, sever', the same 断 as in 判断."], ["不断", "bù duàn", "Does not decide; here not the modern 'continuously'."], ["反", "fǎn", "Instead, contrary to intent; 反 as 'on the contrary'."], ["受其乱", "shòu qí luàn", "Suffers its chaos; 乱 as 'disorder'."]], "dui": null, "dian": "史记 (shǐ jì) 齐悼惠王世家 (qí dào huì wáng shì jiā), quoting what 司马迁 (sī mǎ qiān) calls a Daoist saying (道家之言 (dào jiā zhī yán)). The occasion: in the crisis after Empress 吕's death in 180 BCE, the king of 齐's brother hesitated over killing a hostile minister; the minister's man 魏勃 (wèi bó) was quicker. 春秋 (chūn qiū) commentators had the same thought as 优柔寡断 (yōu róu guǎ duàn) (soft and indecisive).", "shi": "史记 (shǐ jì), first century BCE. The line is spoken by a strategist about a missed moment.", "chuan": "The Chinese line against dithering, quoted in business and by generals. It is not an argument for haste; it is an argument that not deciding is itself a decision with costs. Say it to yourself in the second week of circling a choice.", "lian": [["p", "nanyi", "the monk who just went"], ["p", "yuanlv", "the opposite failure: not thinking ahead"], ["s", "indecision", "the choice you keep postponing"]]}}, "shixi": {"id": "shixi", "zh": "学而时习之，不亦说乎", "segs": [["学", "to learn", "xué"], ["而", "and", "ér"], ["时习之", "practise it at the right times", "shí xí zhī"], ["不亦", "is it not", "bù yì"], ["说乎", "a pleasure? (说 is read yuè, an old form of 悦)", "shuō hū"]], "en": "To learn something and put it into practice at the right time, is that not a pleasure?", "author": "孔子", "work": "论语·学而", "era": "春秋", "note": "The first sentence of the Analects. 习 originally meant a fledgling flapping its wings repeatedly. The pleasure is in the repetition. Say it when the practice finally clicks.", "ctx": null, "py": "xué ér shí xí zhī ， bù yì yuè hū", "deep": {"zi": [["学", "xué", "To learn, in the sense of taking in from a teacher or text."], ["时", "shí", "'At the proper time' or 'regularly'; commentators disagree, and the ambiguity is productive."], ["习", "xí", "Read xí. The ancient graph shows wings over the sun: a fledgling flapping repeatedly. Practice as repetition until it becomes flight."], ["说", "shuō", "Read yuè, an old way of writing 悦, pleasure. Inner delight, contrasted with 乐 (outward joy) in the next sentence."]], "dui": ["有朋自远方来，不亦乐乎", "yǒu péng zì yuǎn fāng lái ， bù yì lè hū", "A friend from afar, is that not a joy?", "The next sentence. Learning is the private pleasure; the friend is the shared one."], "dian": "None earlier. This is the first sentence of the Analects and therefore the first sentence of the Confucian tradition.", "shi": "Placed first by the compilers, presumably as the summary of the whole enterprise. Whether Confucius said it first or the editors chose it, it defines the book: learning, and joy in learning.", "chuan": "Every literate Chinese person can recite it; it is also parodied constantly, which is the fate of first sentences. The interesting word is 时: if it means 'at the right time', the pleasure comes from timing, from using what you learned when the occasion arrives, which is this whole game.", "lian": [["p", "youpeng", "the sentence after it"], ["p", "wengu", "returning to the old"], ["s", "prep-pays", "when the practice finally shows"]]}}, "tianxingjian": {"id": "tianxingjian", "zh": "天行健，君子以自强不息", "segs": [["天行", "the movement of heaven", "tiān xíng"], ["健", "is vigorous", "jiàn"], ["君子", "the noble person", "jūn zǐ"], ["以", "accordingly", "yǐ"], ["自强不息", "strengthens himself without rest", "zì qiáng bù xī"]], "en": "Heaven moves with vigour; the noble person, likewise, strengthens himself without ceasing.", "author": "周易", "work": "乾卦·象传", "era": "先秦", "note": "From the Book of Changes, the first hexagram. Tsinghua University's motto is the four characters 自强不息. Say it on a morning run, or on the morning you didn't want to.", "ctx": null, "py": "tiān xíng jiàn ， jūn zǐ yǐ zì qiáng bù xī", "deep": {"zi": [["天行", "tiān xíng", "The movement of heaven: the sun, the seasons, the turning sky. 行 as motion, not conduct."], ["健", "jiàn", "Vigorous, robust, tireless. The character is the name-quality of the first hexagram, 乾."], ["以", "yǐ", "'Accordingly, by means of this'. The 君子 takes heaven's motion as his model."], ["不息", "bù xī", "息 is to rest, to breathe out. 不息: without cease."]], "dui": ["地势坤，君子以厚德载物", "dì shì kūn ， jūn zǐ yǐ hòu dé zài wù", "The earth's disposition is receptive; the noble person, likewise, carries all things with generous virtue.", "The matching line from the second hexagram, 坤. Heaven strives; earth bears. Tsinghua's motto joins the two: 自强不息 (zì qiáng bù xī)，厚德载物 (hòu dé zài wù)."], "dian": "None earlier. This is from the 象传 (xiàng zhuàn), the 'Image' commentary, one of the Ten Wings attached to the 周易 (zhōu yì), traditionally credited to Confucius and actually composed over the Warring States and Han. Each hexagram gets one such line: the image, then what the 君子 (jūn zǐ) does in response.", "shi": "The first hexagram, 乾, six unbroken lines, pure yang, heaven. The 象传 (xiàng zhuàn) for it is this sentence.", "chuan": "自强不息 (zì qiáng bù xī) became the most widely used four-character motto in modern China, on schools, factories, and Tsinghua's gate. 梁启超 (liáng qǐ chāo) gave a speech at Tsinghua in 1914 on these two hexagram lines that fixed the pairing. It is quoted so often that it can sound like a slogan; the original is about imitating the sky, which is stranger and better.", "lian": [["p", "shizhe", "the river that does not stop"], ["p", "modengxian", "the same urgency from a general"], ["s", "morning-discipline", "the run you almost skipped"]]}}, "zhangchi": {"id": "zhangchi", "zh": "一张一弛，文武之道也", "segs": [["一张", "one tightening", "yī zhāng"], ["一弛", "one loosening", "yī chí"], ["文武之道", "the way of Kings Wen and Wu", "wén wǔ zhī dào"], ["也", "(particle)", "yě"]], "en": "Tighten, then loosen: this was the way of Kings Wen and Wu.", "author": "礼记", "work": "杂记下", "era": "先秦", "note": "Confucius explaining why the people were allowed a wild festival: a bow kept strung breaks. Rest is part of the method, not a break from it. Say it when you decide to stop for the day.", "ctx": null, "py": "yī zhāng yī chí ， wén wǔ zhī dào yě", "deep": {"zi": [["张", "zhāng", "To draw a bow taut; to stretch. Also to open, as in 张开."], ["弛", "chí", "Read chí, to slacken a bowstring. Not 驰 (to gallop). 松弛 is the modern compound."], ["文武", "wén wǔ", "Kings 文 and 武, founders of the Zhou dynasty, the model rulers of the Confucian tradition. 文武之道 is 'the way of the founders'."]], "dui": null, "dian": "None earlier. The whole passage is the source: 张而不弛 (zhāng ér bù chí)，文武弗能也 (wén wǔ fú néng yě)；弛而不张 (chí ér bù zhāng)，文武弗为也 (wén wǔ fú wèi yě)；一张一弛 (yī zhāng yī chí)，文武之道也 (wén wǔ zhī dào yě). 'Taut without slack, even Wen and Wu could not manage; slack without taut, Wen and Wu would not do; taut then slack, that was their way.'", "shi": "礼记 (lǐ jì) 杂记下 (zá jì xià). 子贡 (zi gòng) went to watch the 蜡 (zhà) festival, a year-end feast, and came back disapproving of a whole state gone mad with drink. Confucius replied with this: after a hundred days of labour, one day of license, and the bow image.", "chuan": "Quoted in Chinese writing on work and management for two thousand years, and now on burnout. Its authority comes from putting rest inside the method rather than outside it. Say it when you stop deliberately rather than from exhaustion.", "lian": [["p", "caiju", "the unhurried state itself"], ["p", "shuiqiong", "sitting down when the path ends"], ["s", "stop-for-the-day", "closing the laptop"]]}}, "nengyi": {"id": "nengyi", "zh": "贫贱不能移，富贵不能淫，威武不能屈", "segs": [["贫贱", "poverty and low status", "pín jiàn"], ["不能移", "cannot move him", "bù néng yí"], ["富贵", "wealth and rank", "fù guì"], ["不能淫", "cannot corrupt him", "bù néng yín"], ["威武", "force and threat", "wēi wǔ"], ["不能屈", "cannot bend him", "bù néng qū"]], "en": "Poverty cannot move him, wealth cannot corrupt him, force cannot bend him.", "author": "孟子", "work": "滕文公下", "era": "战国", "note": "Mencius's definition of a 大丈夫, a great man, given in answer to someone who thought the great men were the ones who frightened kings. Say it as a standard when one of the three is being applied to you.", "ctx": null, "py": "pín jiàn bù néng yí ， fù guì bù néng yín ， wēi wǔ bù néng qū", "deep": {"zi": [["移", "yí", "To move, to shift. 不能移: cannot be moved from his course."], ["淫", "yín", "Read yín. Modern sense is sexual excess; the classical sense is 'to overflow, to lead to excess, to corrupt'. Wealth cannot make him overflow."], ["屈", "qū", "To bend, to submit. 不屈 is still the word for unbowed."]], "dui": null, "dian": "None earlier. Mencius is answering 景春 (jǐng chūn), who admired the diplomats 公孙衍 (gōng sūn yǎn) and 张仪 (zhāng yí) because 'when they are angry the princes are afraid'. Mencius says that is the way of a concubine, obedience to power, and defines the 大丈夫 (dà zhàng fū) instead.", "shi": "孟子 (mèng zi) 滕文公下 (téng wén gōng xià). 孟子 (mèng zi) (c. 372 to 289 BCE) was the second great Confucian, and this passage is his portrait of the great man: one who dwells in benevolence, stands in ritual, walks in righteousness, and then these three refusals.", "chuan": "The three clauses became the standard Chinese description of integrity and were quoted by 文天祥 (wén tiān xiáng) in prison, by reformers under the Qing, and by dissidents since. 富贵不能淫 (fù guì bù néng yín) alone is often used about corruption. It is a standard to hold, not a boast to make.", "lian": [["p", "danxin", "文天祥, who lived it"], ["p", "fuyun", "Confucius on wealth wrongly got"], ["s", "right-thing-costs", "when the principle is expensive"]]}}, "jishengyu": {"id": "jishengyu", "zh": "既生瑜，何生亮", "segs": [["既", "since", "jì"], ["生瑜", "you made Zhou Yu", "shēng yú"], ["何", "why", "hé"], ["生亮", "make Zhuge Liang?", "shēng liàng"]], "en": "Since you made Zhou Yu, why did you also make Zhuge Liang?", "author": "罗贯中", "work": "三国演义", "era": "明", "note": "Zhou Yu's last words in the novel, dying of frustration at always being outdone. The Chinese line for envy of a rival who is simply better. Say it as a joke; it takes the sting out.", "ctx": null, "py": "jì shēng yú ， hé shēng liàng", "deep": {"zi": [["既", "jì", "Since, given that; 既…何 is 'since…, why…'."], ["瑜", "yú", "周瑜, given name 瑜 (a fine jade); the novel's 周瑜 is brilliant and cannot bear being second."], ["亮", "liàng", "诸葛亮, given name 亮 (bright). The two names are both 'fine things', which the line uses."]], "dui": null, "dian": "The historical 周瑜 (zhōu yú) of 三国志 (sān guó zhì) was 性度恢廓 (xìng dù huī kuò), 'broad and generous in temperament', and 苏轼 (sū shì)'s 念奴娇 (niàn nú jiāo) celebrates him as 雄姿英发 (xióng zī yīng fā). The envy is the novelist's invention, to make 诸葛亮 (zhū gě liàng) shine. The line is spoken as 周瑜 (zhōu yú) dies, in chapter 57, after being outmanoeuvred three times.", "shi": "罗贯中 (luó guàn zhōng)'s 三国演义 (sān guó yǎn yì), fourteenth century, the novel that fixed the popular version of the Three Kingdoms and gave China its idea of 周瑜 (zhōu yú) as a jealous genius. You know the book; this is its most quoted dying breath.", "chuan": "The line for envy of a rival who is simply better, said with a laugh by anyone who keeps losing to the same person. Because everyone knows it is a novelist's slander, it can be said without malice. Say it about the peer who beat you again.", "lian": [["p", "jianxian", "the Confucian alternative: think of drawing level"], ["p", "dajiang", "the historical 周瑜, celebrated"], ["s", "envy-rival", "losing to the same person"]]}}}, "S": [{"id": "miss-moon", "fam": "情", "title": "Missing someone far away, and the moon is out", "w": ["You look up, the moon is bright, and you think of someone who is far away.", "It's a clear night, full moon, and you wish a particular person could see it too.", "You're in a different country from someone you love and the moon comes up over the water.", "Mid-Autumn, and the person you'd most like to share it with is a thousand miles off.", "A friend abroad sends you a photo of the moon and you realise it's the same moon."], "p": ["changjiu", "haishang"], "chips": ["月"]}, {"id": "overlooked", "fam": "情", "title": "Your work is being overlooked", "w": ["You did good work and nobody seems to have noticed.", "Someone less capable got the credit, or the role, and you feel invisible.", "You're frustrated that people don't recognise what you can do.", "A reviewer dismissed your project without reading it properly.", "You keep thinking: they just don't see it."], "p": ["buhuan", "tiansheng"], "chips": []}, {"id": "resolve", "fam": "情", "title": "Resolve after a setback", "w": ["Something failed and you've decided to keep going anyway.", "After a bad week you sit down and recommit to the long goal.", "You got rejected. You're going to try again, bigger.", "The road ahead is blocked in three directions and you choose to push through.", "You want a line that turns frustration into a sail."], "p": ["changfeng", "qiusuo"], "chips": []}, {"id": "cant-sleep", "fam": "情", "title": "Can't sleep, turning something over", "w": ["It's 2am and you can't stop thinking about it.", "You lie awake replaying a conversation.", "Something is tangled in your head and you can't cut it or comb it straight.", "A person or a problem is keeping you up.", "You've been tossing and turning for an hour."], "p": ["zhanzhuan", "jianbuduan"], "chips": ["夜"]}, {"id": "awe", "fam": "情", "title": "Awe at something vast", "w": ["You stand on a summit and everything below looks small.", "The sea, or the night sky, is so big it seems to contain the sun and stars.", "A view so large it rearranges your sense of scale.", "You feel tiny in front of a mountain range or an ocean.", "Standing at a viewpoint after a long climb."], "p": ["lingjueding", "canghai", "gengshang"], "chips": ["山"]}, {"id": "wasted-day", "fam": "情", "title": "You wasted the day", "w": ["It's evening and you realise the whole day slipped away.", "You caught yourself idling for hours and feel the loss.", "You want to remind yourself that time only goes one way.", "A day of scrolling; nothing done.", "You're young, you had energy, and you spent it on nothing."], "p": ["cunjin", "shaozhuang", "modengxian"], "chips": []}, {"id": "contentment", "fam": "情", "title": "Happy with very little", "w": ["A simple meal, a quiet evening, and you notice you're content.", "You have almost nothing and it feels like enough.", "A walk, a cup of tea, a view, and no wish for more.", "You catch yourself unhurried, not chasing anything, and glad.", "Someone asks why you seem so calm living so plainly."], "p": ["caiju", "yidanshi"], "chips": []}, {"id": "alone", "fam": "情", "title": "Alone, and fine with it", "w": ["You're eating or drinking alone and enjoying your own company.", "Solo on a trip, no one to talk to, and it feels clean rather than sad.", "A cold, quiet, empty place and you're the only one there.", "Drinking by yourself under the moon.", "You chose solitude tonight."], "p": ["yaoyue", "hanjiang"], "chips": ["夜"]}, {"id": "unmoored", "fam": "情", "title": "Feeling unmoored", "w": ["No job, no fixed place, and you're not sure what you are right now.", "Between things, drifting, and you want to say so without whining.", "You feel like a small bird over a very large landscape.", "Traveling alone at night and a bit lost in a bigger sense.", "Everything you used to be anchored to has moved."], "p": ["shaou"], "chips": []}, {"id": "equanimity", "fam": "情", "title": "Calm inside the storm", "w": ["Bad news arrives and you find you're not shaken.", "You want to hold both the good days and the bad days lightly.", "Things went wrong; you walk on anyway.", "You're refusing to let external events decide your mood.", "Caught in the rain, literally or otherwise, and you decide not to mind."], "p": ["wufengyu", "wuxi"], "chips": ["雨"]}, {"id": "festival-far", "fam": "情", "title": "A festival, and you're far from home", "w": ["It's Chinese New Year and you're overseas.", "A holiday everyone else is spending with family, and you're alone in a foreign city.", "Double Ninth, Mid-Autumn, any festival, and you're the stranger in a strange place.", "Your family's group chat is full of festival photos and you're twelve time zones away.", "Missing home twice as much because today is a special day."], "p": ["yixiang"], "chips": []}, {"id": "time-river", "fam": "情", "title": "Time passing, in front of water", "w": ["Standing by a river and thinking about how fast the years go.", "You watch water flow past and feel your own age.", "A birthday, a river, a mood.", "You're aware that everything moves one way and doesn't stop.", "By a large river, thinking about all the people who came before."], "p": ["shizhe", "gungun"], "chips": ["水"]}, {"id": "sorrow-river", "fam": "情", "title": "Something heavy, and a river", "w": ["A sadness that feels as long as a river.", "You lost something big and you're standing by moving water.", "Grief that doesn't fit in a sentence.", "Looking at a river in spring with a heavy heart.", "You want a line for how much sorrow one person can hold."], "p": ["chunshui"], "chips": ["水"]}, {"id": "farewell", "fam": "事", "title": "Seeing off a friend who's leaving", "w": ["A close friend is moving to another country.", "You're at the airport saying goodbye to someone who won't be back for years.", "Last dinner before a friend moves away.", "Someone you're close to is going somewhere far and you want to send them off well.", "A goodbye that should be warm, not teary."], "p": ["zhiji", "mochou", "guanshan"], "chips": ["送"]}, {"id": "last-drink", "fam": "事", "title": "The last drink before someone leaves", "w": ["One more round before your friend flies out tomorrow.", "Raising a glass to someone going somewhere hard and far.", "A farewell toast.", "You want to urge someone to drink one more with you before they go.", "The bar is closing, the friend is leaving, one more."], "p": ["quanjun"], "chips": ["送", "酒"]}, {"id": "flattery", "fam": "事", "title": "Someone is flattering you", "w": ["A person is being very smooth and complimentary and you don't quite trust it.", "Sweet words from someone who wants something.", "You're being charmed and you notice it.", "An investor or recruiter is laying it on thick.", "Too many compliments, too fast."], "p": ["qiaoyan"], "chips": []}, {"id": "hard-truth", "fam": "事", "title": "Telling or hearing a hard truth", "w": ["You have to tell a friend something they won't want to hear.", "Someone just gave you feedback that stung, and it was right.", "Honest advice that grates.", "You're about to disagree with someone senior, kindly.", "A bitter pill that will help."], "p": ["liangyao"], "chips": []}, {"id": "old-friend", "fam": "事", "title": "Bumping into someone unexpectedly", "w": ["You run into an old classmate on the other side of the world.", "Someone you haven't seen in ten years walks into the same café.", "A friend from far away turns up at your door.", "An unexpected reunion.", "Small world: the person you least expected, here."], "p": ["xiangfeng", "youpeng"], "chips": []}, {"id": "friend-visits", "fam": "事", "title": "A friend arrives from far away", "w": ["A friend flies in to visit you.", "Someone you love made a long trip just to see you.", "Welcoming a guest who's come a long way.", "Your college roommate is in town.", "An old friend from home lands tonight."], "p": ["youpeng"], "chips": []}, {"id": "better-person", "fam": "事", "title": "Someone much better than you walks in", "w": ["You meet someone who is clearly far ahead of you at the thing you care about.", "A colleague's work makes yours look small and you feel it.", "You want to turn envy into a plan.", "Meeting a master.", "Someone you admire is in the room."], "p": ["jianxian", "sanren"], "chips": []}, {"id": "learned-unexpected", "fam": "事", "title": "You learned something from an unlikely person", "w": ["A junior colleague taught you something.", "A taxi driver said something wiser than your last three books.", "You picked up a trick from someone you'd underestimated.", "Anyone can be your teacher, and today someone was.", "You want to credit a lesson from an unexpected source."], "p": ["sanren"], "chips": []}, {"id": "breakthrough", "fam": "事", "title": "A breakthrough after a dead end", "w": ["You'd given up on the bug, and then it revealed itself.", "Every path was blocked, then suddenly one opened.", "The answer was in plain sight the whole time.", "After hours of searching, you turn around and there it is.", "A dead end turns into a road."], "p": ["liuan", "zhongli"], "chips": []}, {"id": "too-close", "fam": "事", "title": "Too close to the problem to see it", "w": ["You've been staring at this so long you can't see it anymore.", "Someone outside the team spotted what you couldn't.", "You realise you need to step back to see the shape of it.", "Inside the mountain, you can't see the mountain.", "You want a line for needing distance."], "p": ["lushan", "gengshang"], "chips": ["山"]}, {"id": "shortcut", "fam": "事", "title": "Tempted by a shortcut that isn't right", "w": ["An easy way to money or credit that doesn't sit right.", "Someone offers you a deal that's profitable and a little dirty.", "You could cut a corner and nobody would know.", "Wealth on offer, but not by the proper road.", "You want a line for turning it down."], "p": ["aicai", "fuyun"], "chips": []}, {"id": "study-modes", "fam": "事", "title": "Consuming without thinking, or the reverse", "w": ["You've read all day and retained nothing.", "You've been theorising for a week without reading anything.", "You want to name the failure mode you're in: input without digestion, or speculation without input.", "A study session that was all highlighting and no thinking.", "Time to switch from reading to building, or from building to reading."], "p": ["xuesi", "gongxing"], "chips": []}, {"id": "know-dont-know", "fam": "事", "title": "Someone is pretending to know", "w": ["A person is bluffing about somethin /* ---------- matching ---------- */
const zhOnly=s=>s.replace(/[^\u4e00-\u9fff]/g,'');

function lev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ let c=[i]; for(let j=1;j<=n;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); } p=c; } return p[n]; }

/* ---------- Claude ---------- */
const deckIndex=()=>Object.values(P).map(p=>`${p.id}|${p.zh}|${p.author}|${p.en}`).join('\n');
const SYS=`You run 流觞, a game set at a poetry banquet modelled on the Orchid Pavilion gathering of 353. The host is 王羲之. The guests are 王维, 杜甫, 苏轼, 李白, each speaking strictly in character (Wang Wei quiet and exact; Du Fu grave, dutiful, dry; Su Shi witty, warm, teasing; Li Bai loud, boastful, generous). The player is a young Singaporean scholar learning classical Chinese. Reply in English; any Chinese you include must be followed by pinyin with tone marks in parentheses. Never use em dashes. Keep every remark to one or two sentences. Never invent classical lines: guests may only speak lines from the DECK below, chosen by id. When judging, be honest and specific about fit; flattery is a fault at this table. Output only JSON, no markdown fences.\n\nDECK (id|line|author|meaning):\n${deckIndex()}`;
async function ask(user, maxTokens=900){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system:SYS,messages:[{role:'user',content:user}]})});
  if(!r.ok) throw new Error('api '+r.status);
  const d=await r.json(); const t=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const m=t.match(/\{[\s\S]*\}/); if(!m) throw new Error('nojson'); return JSON.parse(m[0]);

let ONLINE=true;

/* ---------- banquet state ---------- */
let B=null; // {seat, rounds:[], i, phase, cups, ya, scene, wi, cupAt, judge, guest, timer, input, opening}
const ROUNDS=8;
function pickScene(seat, usedScenes){

}
function startBanquet(seat, yu){

async function openBanquet(){

  B.cupAt = toGuest ? rnd(GNAMES.filter(g=>g!==B.seat)) : 'you';

}
function endBanquet(carried){

function startTimer(){ const secs=GUESTS[B.seat].secs; const t0=Date.now(); clearInterval(B.timer); B.timer=setInterval(()=>{ const bar=document.getElementById('tbar'); const r=1-(Date.now()-t0)/(secs*1000); if(r<=0){ clearInterval(B.timer); if(B.phase==='yourturn') choose(null, true); } else if(bar) bar.style.width=(r*100)+'%'; },150); }
function buildOptions(sc, seat){
  const n = seat==='李白'?6:seat==='苏轼'?5:4;
  const target = rnd(sc.p.filter(id=>!(ST.pouch[id]||{}).said).length ? sc.p.filter(id=>!(ST.pouch[id]||{}).said) : sc.p);
  const mine = new Set(sc.p);
  const near = shuffle(Object.keys(P).filter(id=>!mine.has(id) && scenesOf(id).some(x=>x.fam===sc.fam && (x.chips.some(c=>sc.chips.includes(c)) || x.fam===sc.fam))));

async function choose(id, timedOut){

async function guestOnly(){

}

/* ---------- the stream ---------- */
const SEATPOS={'王维':0.16,'杜甫':0.36,'苏轼':0.56,'李白':0.76,'you':0.94};
function streamSvg(){
  const order=GNAMES.filter(g=>g!==B.seat).concat([B.seat,'you']); // seat neighbour sits next to you
  const pos={}; order.forEach((n,i)=>pos[n]=[0.14,0.34,0.54,0.74,0.92][i]);
  B.pos=pos;
  return `<svg class="stream" viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg" aria-label="the winding stream">
  <path id="strm" d="M10,40 C60,10 90,90 140,70 S210,20 250,60 S320,120 350,95" fill="none" stroke="var(--water)" stroke-width="14" stroke-linecap="round"/>
  <path d="M10,40 C60,10 90,90 140,70 S210,20 250,60 S320,120 350,95" fill="none" stroke="var(--water2)" stroke-width="1.5" stroke-dasharray="3 6" opacity=".7"/>
  ${order.map(n=>{ const pt=ptAt(pos[n]); const you=n==='you'; return `<text class="s ${you?'you':''}" x="${pt.x}" y="${pt.y+ (pt.side>0?26:-16)}" text-anchor="middle">${you?'你':n}</text>`; }).join('')}
  <g id="cupg" transform="translate(${ptAt(B.cupPos||0.02).x},${ptAt(B.cupPos||0.02).y})"><path d="M-7,-3 L7,-3 L5,5 L-5,5 Z" fill="#fff" stroke="var(--ink)" stroke-width="1.3"/><ellipse cx="0" cy="-3" rx="7" ry="2.2" fill="var(--seal)" opacity=".85"/></g>
  </svg>`;
}
let PATHEL=null;
function ptAt(f){ if(!PATHEL){ const ns='http://www.w3.org/2000/svg'; const sv=document.createElementNS(ns,'svg'); PATHEL=document.createElementNS(ns,'path'); PATHEL.setAttribute('d','M10,40 C60,10 90,90 140,70 S210,20 250,60 S320,120 350,95'); sv.appendChild(PATHEL); sv.style.position='absolute'; sv.style.width='0'; sv.style.height='0'; document.body.appendChild(sv); } const L=PATHEL.getTotalLength(); const p=PATHEL.getPointAtLength(f*L); const p2=PATHEL.getPointAtLength(Math.min(L,(f+0.02)*L)); const side = (p2.x-p.x)*(0-p.y) - (p2.y-p.y)*(0-p.x) > 0 ? 1 : -1; return {x:p.x,y:p.y,side}; }
function floatCup(target, done){
  const g=document.getElementById('cupg'); const f=B.pos[target]; const L=PATHEL.getTotalLength(); const f0=B.cupPos||0.02; B.cupPos=f;
  if (REDUCED||!g){ if(g){ const p=PATHEL.getPointAtLength(f*L); g.setAttribute('transform',`translate(${p.x},${p.y})`); } setTimeout(done,300); return; }
  const dur=1800+f*1400, t0=performance.now();
  const ease=t=>1-Math.pow(1-t,3);
  function step(now){ const t=Math.min(1,(now-t0)/dur); const ff=f0+(f-f0)*ease(t); const p=PATHEL.getPointAtLength(ff*L); const bob=Math.sin(now/120)*1.5; g.setAttribute('transform',`translate(${p.x},${p.y+bob}) rotate(${Math.sin(now/200)*6})`); if(t<1) requestAnimationFrame(step); else setTimeout(done,350); }
  requestAnimationFrame(step);
}

/* ---------- banquet render ---------- */
let seatPick=null;
function renderBanquet(){
  if (!B||B.phase==='lobby'){
    const last=ST.banquets.slice(-1)[0];
    return header()+`<p class="prompt" style="font-size:18px">Choose a seat.</p>
    <p class="small">The cup floats down the stream and stops in front of someone. If it is you, the host names a scene and you choose the line that fits it from those on the table. A good line earns 雅 (yǎ, refinement). A poor one, or silence, earns a cup of 罚酒 (fá jiǔ, penalty wine). Three cups and you are carried out. Whoever sits beside you answers every scene too; their lines go into your 锦囊.</p>
    <div class="seats">${GNAMES.map(n=>{ const g=GUESTS[n]; return `<button class="seat ${seatPick===n?'on':''}" data-seat="${n}"><span class="d">${g.secs}s · ${n==='李白'?6:n==='苏轼'?5:4} lines</span><b>${n}</b><i>${g.py} · ${g.era}</i><p>${g.desc}</p></button>`; }).join('')}</div>
    <p class="cue">遇 · what happened to you today (optional)</p>

  }

  if (B.phase==='opening') return header()+top+streamSvg()+`<p class="wait">The guests are settling</p>`;
  if (B.phase==='end'){
    const s=saidCount();
    return header()+top+`<p class="prompt" style="margin-top:14px">${B.carried?'Carried out.':'The stream runs dry.'}</p>
    <div class="host"><b>${HOST}:</b> ${B.carried?'Three cups. Our friend has been helped to the door with great courtesy. The table will remember.':`${B.ya} 雅 over ${B.i} rounds, ${B.cups} cup${B.cups===1?'':'s'} of penalty wine. ${B.ya>=12?'A good night.':B.ya>=6?'Respectable.':'You stayed upright, which is something.'}`}</div>
    <div class="stat"><div><b>${B.ya}</b><span>雅 tonight</span></div><div><b>${B.log.filter(l=>l.apt!=null&&l.apt>=2).length}</b><span>lines you produced</span></div><div><b>${s}/${Object.keys(P).length}</b><span>锦囊 said</span></div></div>
    <p class="small">${B.log.map(l=>`${esc(l.scene)}: ${l.apt==null?'guest':['cup','cup','fit','apt'][l.apt]}`).join(' · ')}</p>
    <div class="row"><button class="primary" id="again">Another banquet</button><button data-tab="pouch">Open the 锦囊</button></div>`;
  }
  const sc=B.scene, w=sc?sc.w[B.wi]:'';
  let body='';
  if (B.phase==='table'){
    body=`<div class="host"><b>${HOST}:</b> ${esc(B.opening.host_line)}</div>${B.opening.guest_aside?`<div class="host guest"><b>${B.seat}:</b> ${esc(B.opening.guest_aside)}</div>`:''}<div class="row"><button class="primary" id="float">Float the cup</button></div>`;
  } else if (B.phase==='floating'){
    body=`<p class="wait">The cup is drifting</p>`;
  } else if (B.phase==='yourturn'){
    if (!B.opts) B.opts=buildOptions(sc,B.seat);
    const showPy = g.hint==='author';
    body=`<p class="cue">${sc.fam} · the host says</p><p class="prompt">${esc(w)}</p><div class="timer"><i id="tbar"></i></div>
    <div class="opts">${B.opts.map(id=>`<button data-pick="${id}">${esc(P[id].zh)}${showPy?`<small>${esc(P[id].py)}</small>`:''}</button>`).join('')}</div>`;
  } else if (B.phase==='guestturn'){
    body=`<p class="cue">${sc.fam} · the host says, to ${B.cupAt}</p><p class="prompt">${esc(w)}</p><p class="wait">${B.cupAt} is thinking</p>`;
  } else if (B.phase==='judging'){
    body=`<p class="cue">${sc.fam} · the host says</p><p class="prompt">${esc(w)}</p><p class="small">You said: ${esc(B.input)||'nothing'}</p><p class="wait">The host is weighing it</p>`;
  } else if (B.phase==='judged'){
    const j=B.judge, gu=B.guest;
    let judge='';
    if (j){
      const cls=j.apt>=2?'good':'bad';
      judge=`<p class="small">You chose: ${j.picked&&P[j.picked]?esc(P[j.picked].zh):'nothing'}</p><div class="react ${cls}">${esc(j.reaction||'')}<small>${j.apt===3?'+2 雅':j.apt===2?'+1 雅':'罚酒 · one cup'}</small></div>
      ${j.comment?`<div class="host"><b>${HOST}:</b> ${esc(j.comment)}</div>`:`<p class="wait">${HOST} is weighing it</p>`}
      ${j.match_id&&P[j.match_id]?card(P[j.match_id],{cls:j.first?'pulse':'',guest:HOST}):j.picked&&P[j.picked]?card(P[j.picked],{brief:true,cls:'dim'}):''}
      ${j.first?'<p class="small" style="color:var(--seal)">印 · first time you produced this line at the table. It is in the 锦囊.</p>':''}`;
    }
    const gp=P[gu.phrase_id]; const ge=ST.pouch[gu.phrase_id]||{};
    const guest=`<p class="cue">${gu.name} answers the same scene</p>${gu.remark?`<div class="host guest"><b>${gu.name}:</b> ${esc(gu.remark)}</div>`:`<p class="wait">${gu.name} is thinking</p>`}${card(gp,{cls:ge.said?'':'dim',guest:gu.name})}${ge.said?'':'<p class="small">Heard, not yet said. It sits in the 锦囊 as a gap until you produce it at the table.</p>'}`;
    const nxt = B.cups>=3?'Be carried out':B.i>=ROUNDS?'Finish the night':'Float the cup';
    const pending = (j&&!j.comment)||!gu.remark;
    body=`<p class="cue">${sc.fam} · the host said</p><p class="prompt" style="font-size:18px">${esc(w)}</p>${judge}${guest}<div class="row"><button class="primary" id="next" ${pending?'disabled':''}>${nxt}</button></div>`;
  }
  return header()+top+streamSvg()+body;
}

/* ---------- pouch ---------- */
let openP=null, pouchView='景';
function renderPouch(){
  if (pouchView==='景') return renderPouchScenes();
  const byA={}; Object.values(P).forEach(p=>(byA[p.author]=byA[p.author]||[]).push(p));
  const authors=Object.keys(byA).sort((a,b)=>{ const sa=byA[a].filter(p=>(ST.pouch[p.id]||{}).said).length, sb=byA[b].filter(p=>(ST.pouch[p.id]||{}).said).length; return (sb-sa)||(byA[b].length-byA[a].length); });
  const extras=Object.entries(ST.extra);
  return header('锦囊')+viewToggle()+`<p class="small">李贺 (Lǐ Hè) rode out each morning with a brocade pouch and dropped every line he thought of into it. This is yours. Grey lines you have heard at the table; dashes are lines the guests have not said yet; the seal 印 means you produced it yourself.</p>
  <div class="stat"><div><b>${saidCount()}</b><span>said 印</span></div><div><b>${heardCount()-saidCount()}</b><span>heard</span></div><div><b>${Object.keys(P).length-heardCount()}</b><span>gaps</span></div></div>
  ${authors.map(a=>{ const ps=byA[a]; const s=ps.filter(p=>(ST.pouch[p.id]||{}).said).length; return `<div class="grp"><div class="h"><span>${esc(a)}</span><span>${s}/${ps.length}</span></div>${ps.map(p=>{ const e=ST.pouch[p.id]||{}; if(!e.heard) return `<div class="pline gap"><span>${'—'.repeat(Math.min(12,zhOnly(p.zh).length))}</span><small>${esc(p.work)}</small></div>`; return `<div class="pline ${e.said?'':'heard'}" data-open="${p.id}"><span>${esc(p.zh)}${e.said?'<span class="sl">印</span>':''}</span><small>${e.said?'said':'heard from '+esc(e.by)}</small></div>${openP===p.id?card(p):''}`; }).join('')}</div>`; }).join('')}
  ${extras.length?`<h2>Lines you brought yourself</h2>${extras.map(([id,x])=>extraCard(x)).join('')}`:''}`;
}

function viewToggle(){ return `<div class="seg"><button data-pv="景" class="${pouchView==='景'?'on':''}">景 by scene</button><button data-pv="人" class="${pouchView==='人'?'on':''}">人 by poet</button></div>`; }
let pouchFam='情';

  const fams=[['情','feelings'],['事','scenarios'],['物','things']];

  <div class="seg">${fams.map(f=>{ const n=SC.filter(s=>s.fam===f[0]).length; return `<button data-pf="${f[0]}" class="${pouchFam===f[0]?'on':''}">${f[0]} ${f[1]} <small>${n}</small></button>`; }).join('')}</div>

  ${list.map(s=>{ const said=s.p.filter(p=>(ST.pouch[p]||{}).said).length; return `<div class="grp"><div class="h" data-scene="${s.id}" style="cursor:pointer"><span>${esc(s.title)}</span><span>${said}/${s.p.length}</span></div>${openP===s.id?`<p class="small" style="margin:0 0 6px">${esc(s.w[0])}</p>`+s.p.map(pid=>{ const p=P[pid], e=ST.pouch[pid]||{}; if(!e.heard) return `<div class="pline gap"><span>${'—'.repeat(Math.min(12,zhOnly(p.zh).length))}</span><small>${esc(p.author)} 《${esc(p.work)}》</small></div>`; return card(p); }).join(''):''}</div>`; }).join('')}`;
}
/* ---------- yard (the ladder from v1, kept as practice) ---------- */
const RUNGS=['学','认','补','诵','急'], RUNG_EN=['study','recognise','complete','recite','live'];
const lv=pid=>ST.lv[pid]||0;
let SESSION=null;
function pickQueue(){ const t=today(); const cands=Object.keys(P).map(pid=>({pid,l:lv(pid),up:ST.lastUp[pid]===t,own:!!ST.owned[pid]})); const pool=shuffle(cands.filter(c=>!c.own)).sort((a,b)=>(a.up-b.up)||(a.l-b.l)); const review=shuffle(cands.filter(c=>c.own)).slice(0,2); return shuffle(pool.slice(0,8).concat(review).map(c=>{ const r=c.own?4:Math.min(4,c.l+1); const sc=rnd(scenesOf(c.pid)); const seen=ST.seen[c.pid]||[]; let wis=sc.w.map((_,i)=>i); if(r===4){ const un=wis.filter(i=>!seen.includes(sc.id+':'+i)); if(un.length) wis=un; } return {pid:c.pid,scene:sc.id,wi:rnd(wis),rung:r}; })); }
function distractors(pid){ const mine=new Set(scenesOf(pid).flatMap(s=>s.p)); return shuffle(Object.keys(P).filter(x=>!mine.has(x))).slice(0,3); }
function renderYard(){
  if(!SESSION){ return header('练')+`<p class="prompt" style="font-size:18px">The practice yard.</p><p class="small">Drill between banquets. Scene first, phrase second, four rungs: 认 pick it, 补 finish it, 诵 produce it, 急 produce it from a wording you have never seen, against the clock. One rung per phrase per day. This does not add to the 锦囊; only the table does.</p><div class="row"><button class="primary" id="go">Ten items</button></div>`; }
  const q=SESSION.queue, it=q[SESSION.i];
  if(!it) return header('练')+`<p class="prompt">Done.</p><div class="row"><button class="primary" id="go">Another ten</button><button data-tab="banquet">To the banquet</button></div>`;
  const p=P[it.pid], s=SCI[it.scene], w=s.w[it.wi];
  const prog=`<div class="prog">${q.map((_,i)=>`<i class="${i<SESSION.i?'d':''}"></i>`).join('')}</div>`;
  const rung=`<div class="rung">${RUNGS.slice(1).map((r,i)=>`<span class="${i+1===it.rung?'on':''}">${r} ${RUNG_EN[i+1]}</span>`).join('')}</div>`;
  const cue=`<p class="cue">${s.fam} · scene</p><p class="prompt">${esc(w)}</p>`;
  let body='';
  if(SESSION.fb){ const f=SESSION.fb; body=`<div class="fb ${f.ok?'ok':'no'}">${esc(f.msg)}</div>${card(p,{brief:true})}<div class="row"><button class="primary" id="ynext">Next</button></div>`; }
  else if(it.rung===1){ body=`<div class="opts">${shuffle([it.pid].concat(distractors(it.pid))).map(o=>`<button data-opt="${o}">${esc(P[o].zh)}</button>`).join('')}</div>`; }
  else { const hint=it.rung===2?`<p class="hint">${esc(zhOnly(p.zh).slice(0,2))}… &nbsp; ${esc(p.author)}</p>`:it.rung===3?`<p class="hint">${esc(p.author)} 《${esc(p.work)}》</p>`:`<div class="timer"><i id="ybar"></i></div>`; body=`${hint}${SESSION.hint?`<p class="hint">${esc(p.py)}</p>`:''}<input id="yans" placeholder="characters or pinyin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="row"><button class="primary" id="ycheck">Check</button><button id="yhint" class="ghost">${SESSION.hint||it.rung===4?'Reveal answer':'Show pinyin'}</button></div>`; }
  return header('练')+prog+rung+cue+body;
}
function ygrade(it,res){ const p=P[it.pid], s=SCI[it.scene], t=today(); let msg,ok=false;
  if(res){ ok=true; if(SESSION.hint) msg='Right, but with the pinyin shown it does not count.'; else if(ST.lastUp[it.pid]===t&&!ST.owned[it.pid]) msg='Right. Already climbed today.'; else if(ST.owned[it.pid]){ msg='Still yours.'; } else { const seen=ST.seen[it.pid]=ST.seen[it.pid]||[]; const key=s.id+':'+it.wi; if(it.rung===4&&seen.includes(key)) msg='Right, but you had seen this wording. 急 needs a fresh one.'; else { ST.lv[it.pid]=it.rung; ST.lastUp[it.pid]=t; if(it.rung===4){ ST.owned[it.pid]=t; msg='Owned in the yard. Now say it at the table.'; } else msg=`Climbed to ${RUNGS[it.rung]}.`; } seen.push(key); } }
  else { msg=it.rung===1?'Not that one.':'Not it. Comes back tomorrow.'; if(lv(it.pid)>0&&!ST.owned[it.pid]&&ST.lastUp[it.pid]!==t){ ST.lv[it.pid]=Math.max(0,lv(it.pid)-1); msg+=' Dropped a rung.'; } }
  touchStreak(); save(); SESSION.fb={ok,msg}; }
function yTimer(){ const bar=document.getElementById('ybar'); if(!bar) return; const t0=Date.now(); clearInterval(SESSION.timer); SESSION.timer=setInterval(()=>{ const r=1-(Date.now()-t0)/15000; if(r<=0){ clearInterval(SESSION.timer); if(!SESSION.fb){ ygrade(SESSION.queue[SESSION.i],null); SESSION.fb.msg='Time.'; render(); } } else bar.style.width=(r*100)+'%'; },200); }

/* ---------- rank ---------- */

  <p class="cue">said in life</p>${usedCount()?`<div class="list">${Object.keys(ST.used).map(p=>`<div><span style="color:var(--ink);font-size:14px;white-space:normal">${esc(P[p]?P[p].zh:p)}</span><span>${ST.used[p].length}×</span></div>`).join('')}</div>`:'<p class="empty">Nothing yet. This list is the point of the whole game.</p>'}

/* ---------- glue ---------- */
const app=document.getElementById('app');
function render(){
  tabsHtml();
  app.innerHTML = ST.tab==='banquet'?renderBanquet():ST.tab==='pouch'?renderPouch():ST.tab==='yard'?renderYard():renderRank();
  const a=document.getElementById('ans'); if(a){ a.focus(); a.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('say').click(); }); }
  const y=document.getElementById('yans'); if(y){ y.focus(); y.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('ycheck').click(); }); }
  if (SESSION&&SESSION.queue[SESSION.i]&&SESSION.queue[SESSION.i].rung===4&&!SESSION.fb) yTimer();
}
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-tab],[data-seat],[data-use],[data-open],[data-pv],[data-pf],[data-scene],[data-pick],[data-layer],[data-unlock],[data-ask],[data-goto],.w,.gloss .x,#start,#float,#say,#pass,#next,#again,#go,#ycheck,#yhint,#ynext,[data-opt],#reset');
  if(!b) return;
  if(b.dataset.tab){ ST.tab=b.dataset.tab; if(B) clearInterval(B.timer); if(SESSION) clearInterval(SESSION.timer); save(); render(); window.scrollTo(0,0); return; }
  if(b.dataset.seat){ seatPick=b.dataset.seat; const y=document.getElementById('yu'); B=B||{phase:'lobby'}; if(y) B.yuDraft=y.value; render(); return; }
  if(b.dataset.use){ logUse(b.dataset.use); return; }
  if(b.dataset.open){ openP=openP===b.dataset.open?null:b.dataset.open; render(); return; }
  if(b.dataset.layer){ const [pid,L]=b.dataset.layer.split(':'); layerTab[pid]=L; render(); return; }
  if(b.dataset.unlock){ if(yaBalance()>=3){ ST.yaSpent=(ST.yaSpent||0)+3; (ST.unlocked=ST.unlocked||{})[b.dataset.unlock]=today(); save(); render(); } return; }
  if(b.dataset.goto){ ST.tab='pouch'; pouchView='人'; openP=b.dataset.goto; save(); render(); setTimeout(()=>{ const el=document.getElementById('c-'+b.dataset.goto); if(el) el.scrollIntoView({block:'start'}); },50); return; }
  if(b.dataset.ask){ askGuest(b.dataset.ask, b.dataset.guest); return; }
  if(b.dataset.pv){ pouchView=b.dataset.pv; openP=null; render(); return; }
  if(b.dataset.pf){ pouchFam=b.dataset.pf; openP=null; render(); return; }
  if(b.dataset.scene){ openP=openP===b.dataset.scene?null:b.dataset.scene; render(); return; }
  if(b.classList.contains('w')){ const s=P[b.dataset.p].segs[+b.dataset.i]; showGloss(s); return; }
  if(b.classList.contains('x')){ hideGloss(); return; }
  if(b.id==='start'){ const y=document.getElementById('yu'); startBanquet(seatPick, y?y.value:''); return; }
  if(b.id==='float'||b.id==='next'){ nextRound(); return; }
  if(b.dataset.pick){ if(B.phase!=='yourturn') return; const ok=B.scene.p.includes(b.dataset.pick); b.classList.add(ok?'right':'wrong'); document.querySelectorAll('[data-pick]').forEach(o=>{ o.disabled=true; if(!ok&&B.scene.p.includes(o.dataset.pick)) o.classList.add('right'); }); setTimeout(()=>choose(b.dataset.pick,false), ok?400:900); return; }
  if(b.id==='say'){ const v=document.getElementById('ans').value.trim(); if(!v) return; submit(v,false); return; }
  if(b.id==='pass'){ submit('',false); return; }
  if(b.id==='again'){ B={phase:'lobby'}; render(); window.scrollTo(0,0); return; }
  if(b.id==='go'){ SESSION={queue:pickQueue(),i:0,fb:null,hint:false,timer:null}; render(); return; }
  if(b.dataset.opt){ const it=SESSION.queue[SESSION.i]; document.querySelectorAll('[data-opt]').forEach(o=>{ if(o.dataset.opt===it.pid) o.classList.add('right'); else if(o===b) o.classList.add('wrong'); }); const ok=b.dataset.opt===it.pid; setTimeout(()=>{ ygrade(it,ok?'exact':null); render(); },ok?350:900); return; }
  if(b.id==='ycheck'){ const it=SESSION.queue[SESSION.i]; const v=document.getElementById('yans').value.trim(); if(!v) return; clearInterval(SESSION.timer); ygrade(it,matches(v,P[it.pid])); render(); return; }
  if(b.id==='yhint'){ const it=SESSION.queue[SESSION.i]; if(!SESSION.hint&&it.rung<4){ SESSION.hint=true; render(); } else { clearInterval(SESSION.timer); ygrade(it,null); SESSION.fb.msg='Revealed. Comes back tomorrow.'; render(); } return; }
  if(b.id==='ynext'){ SESSION.i++; SESSION.fb=null; SESSION.hint=false; render(); window.scrollTo(0,0); return; }
  if(b.id==='reset'){ if(confirm('Erase all progress?')){ ST={pouch:{},extra:{},used:{},banquets:[],face:0,ya:0,streak:{last:'',n:0},tab:'rank',lv:{},lastUp:{},seen:{},owned:{},lastSummary:''}; B=null; save(); render(); } return; }
});
async function askGuest(pid, guest){
  const inp=document.getElementById('q-'+pid); const q=(inp&&inp.value.trim())||''; if(!q) return;
  const p=P[pid], dp=p.deep||{}; QA[pid]='…'; render();
  let a=null;
  if (ONLINE){ try{ const r=await ask(`QUESTION. The player asks ${guest} about the line ${pid}|${p.zh} (${p.author}, ${p.work}): "${q.replace(/"/g,"'")}". Answer in character as ${guest}, in three to five sentences, in English with pinyin after any Chinese. Use this verified background first: MEANING: ${p.en} WORDS: ${(dp.zi||[]).map(z=>z[0]+': '+z[2]).join('; ')} PAIR: ${dp.dui?dp.dui[0]+' / '+dp.dui[2]:''} ALLUSION: ${dp.dian||''} OCCASION: ${dp.shi||''} AFTERLIFE: ${dp.chuan||''}. If the answer needs facts beyond this background, give them but mark them plainly with the words "from memory, unchecked". Never invent a classical line. Return JSON: {"answer": string}`,700); a=r.answer; }catch(e){ ONLINE=false; } }
  QA[pid]=a||`${guest} is out of earshot just now (the host cannot reach the guests without a connection). What is written on the card is checked; ask again when the connection returns.`;
  render();
}
function showGloss(s){ hideGloss(); const g=document.createElement('div'); g.className='gloss'; g.innerHTML=`<button class="x" aria-label="close">×</button><div class="gz">${esc(s[0])}</div><div class="gp">${esc(s[2])}</div><div class="gm">${esc(s[1])}</div>`; document.body.appendChild(g); }
function hideGloss(){ document.querySelectorAll('.gloss').forEach(g=>g.remove()); }
load().then(()=>{ if(ST.tab==='banquet') B={phase:'lobby'}; render(); });
</script>
