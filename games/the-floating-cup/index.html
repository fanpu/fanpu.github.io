<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>流觞 · liú shāng</title>
<style>
:root{
  --paper:#EDF0EA; --paper2:#E1E6DE; --ink:#1C2422; --ink2:#55615B; --ink3:#8A948E;
  --rule:#C6CFC4; --seal:#B5302A; --seal2:#F1DCD8; --ok:#3F7A5A; --okbg:#DCEBE0; --water:#B9CBD1; --water2:#7FA3AE;
  --serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC","PingFang SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-text-size-adjust:100%}
body{font-size:16px;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:14px 16px 96px}
h1{font-size:15px;font-weight:400;margin:0 0 10px;color:var(--ink2)}
h1 b{color:var(--ink);font-weight:600;font-size:22px;margin-right:6px}
h2{font-size:17px;font-weight:600;margin:18px 0 6px}
button{font-family:inherit;font-size:15px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:6px;padding:9px 14px;cursor:pointer}
button:active{background:var(--paper2)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ghost{background:transparent}
button:disabled{opacity:.5}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
input,textarea{font-family:inherit;font-size:19px;width:100%;padding:10px 12px;border:1px solid var(--rule);border-bottom:2px solid var(--ink);border-radius:6px 6px 0 0;background:#fff;color:var(--ink)}
textarea{font-size:16px;min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:none;border-bottom-color:var(--seal)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);display:flex;justify-content:center;padding:6px 0 max(10px,env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:0 0 25%;max-width:130px;border:0;background:transparent;border-radius:0;padding:4px 0;color:var(--ink3);line-height:1.1}
.tabs button .z{display:block;font-size:22px}
.tabs button .e{display:block;font-size:11px}
.tabs button.on{color:var(--ink)}
.tabs button.on .z{text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--seal);text-decoration-thickness:2px}
.small{font-size:13px;color:var(--ink2)}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.seg button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 0;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.seg button small{color:var(--ink3)}
.seg button.on small{color:#ccc}
.cue{font-size:12px;color:var(--ink3);margin:16px 0 4px}
.prompt{font-size:22px;line-height:1.4;margin:0 0 6px}
.card{margin:12px 0 4px;padding:14px 14px 12px;background:#fff;border:1px solid var(--rule);border-radius:8px;position:relative}
.card.dim{background:transparent;color:var(--ink2)}
.card.sealed .zh{padding-right:44px}
.zh{font-size:24px;line-height:1.5;letter-spacing:.02em;margin:0}
.zh .w{cursor:pointer;border-bottom:1px dotted var(--rule);padding-bottom:1px}
.zh .w:active{background:var(--seal2)}
.zh .p{color:var(--ink3);margin:0 2px}
.py{font-size:13px;color:var(--ink2);margin:6px 0 0;line-height:1.6}
.en{font-size:15px;margin:10px 0 0;line-height:1.55}
.src{font-size:13px;color:var(--ink2);margin:8px 0 0}
.note{font-size:14px;color:var(--ink2);margin:10px 0 0;line-height:1.55}
.ctx{font-size:13px;color:var(--ink2);margin:10px 0 0;padding-left:10px;border-left:2px solid var(--rule);line-height:1.55}
.ctx .cz{color:var(--ink);font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12px;color:var(--ink2);border:1px solid var(--rule);border-radius:4px;padding:2px 7px}
.seal{position:absolute;top:10px;right:10px;width:34px;height:34px;border:2px solid var(--seal);color:var(--seal);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;transform:rotate(-8deg)}
.gloss{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--ink);padding:16px 18px max(18px,env(safe-area-inset-bottom));z-index:9;max-width:520px;margin:0 auto;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.gloss .gz{font-size:30px}.gloss .gp{color:var(--ink2);font-size:14px}.gloss .gm{margin-top:6px;font-size:16px}
.gloss .x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:20px;color:var(--ink3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
/* banquet */
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.seat{border:1px solid var(--rule);border-radius:8px;padding:12px;background:#fff;text-align:left;cursor:pointer;position:relative}
.seat.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seat b{font-size:22px;display:block;font-weight:600}
.seat i{font-style:normal;font-size:12px;color:var(--ink3);display:block}
.seat p{margin:6px 0 0;font-size:13px;color:var(--ink2);line-height:1.45}
.seat .d{position:absolute;top:10px;right:10px;font-size:11px;color:var(--ink3)}
.stream{width:100%;height:auto;display:block;margin:4px 0 8px}
.stream .s{font-size:15px;fill:var(--ink)}
.stream .s.you{fill:var(--seal);font-weight:600}
.stream .lab{font-size:10px;fill:var(--ink3)}
.cups{display:flex;gap:6px;align-items:center}
.cup{width:18px;height:18px;border:2px solid var(--ink3);border-radius:0 0 8px 8px;background:transparent}
.cup.full{background:var(--seal);border-color:var(--seal)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin:0 0 4px}
.host{font-size:15px;line-height:1.55;margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--ink);background:#fff}
.host.guest{border-left-color:var(--water2)}
.host b{font-weight:600}
.react{font-size:20px;margin:12px 0 0;letter-spacing:.06em}
.react small{display:block;font-size:12px;color:var(--ink3);letter-spacing:0}
.react.good{color:var(--ok)}.react.bad{color:var(--seal)}
.timer{height:3px;background:var(--rule);border-radius:2px;margin:8px 0 12px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--seal);width:100%;transition:width .2s linear}
.hint{font-size:14px;color:var(--ink2);margin:0 0 12px}
.wait{color:var(--ink3);font-size:14px;margin:14px 0}
.wait::after{content:'…';animation:dots 1.2s steps(3) infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.pulse{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(.97);background:var(--okbg)}100%{transform:scale(1)}}
/* layers */
.lt{display:flex;gap:2px;margin:12px 0 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.lt button{border:0;border-radius:0;background:transparent;padding:6px 8px;font-size:14px;color:var(--ink3)}
.lt button.on{color:var(--ink);border-bottom:2px solid var(--seal);margin-bottom:-1px}
.lt button.lk{color:var(--rule)}
.lay{font-size:14px;line-height:1.6;color:var(--ink2);margin:10px 0 0}
.lay .k{color:var(--ink);font-size:17px}
.lay .kp{font-size:12px;color:var(--ink3);margin-left:6px}
.lay div.zi{margin:0 0 8px}
.lay .lk{color:var(--ink3);font-style:italic}
.lay a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);cursor:pointer}
.ask{margin-top:10px;display:flex;gap:6px}
.ask input{font-size:14px;padding:7px 10px;border-radius:6px;border-bottom:1px solid var(--rule)}
.ask button{padding:7px 10px;font-size:13px;white-space:nowrap}
.qa{font-size:14px;line-height:1.55;margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--water2);background:#fff}
.qa small{display:block;color:var(--ink3);font-size:11px;margin-top:4px}
/* pouch */
.grp{margin:14px 0 0;border-top:1px solid var(--rule)}
.grp .h{display:flex;justify-content:space-between;padding:10px 0 4px;font-size:16px}
.grp .h span{color:var(--ink3);font-size:13px}
.pline{padding:8px 0;border-top:1px dotted var(--rule);font-size:18px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pline.gap{color:var(--ink3);letter-spacing:.05em;font-size:15px;overflow:hidden}
.pline.gap span{white-space:nowrap;overflow:hidden;text-overflow:clip;flex:1}
.pline.heard{color:var(--ink2)}
.pline small{font-size:11px;color:var(--ink3);white-space:nowrap;letter-spacing:0}
.pline .sl{color:var(--seal);font-size:13px;margin-left:6px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0 16px}
.stat div{border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:12px;color:var(--ink2)}
.rankseal{width:110px;height:110px;border:3px solid var(--seal);color:var(--seal);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;line-height:1;transform:rotate(-4deg);margin:14px 0 18px}
.rankseal small{font-size:12px;margin-top:6px}
.ladder{border-top:1px solid var(--rule)}
.ladder div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.ladder div.now{color:var(--seal)}.ladder div.past{color:var(--ink3)}
.list{border-top:1px solid var(--rule)}
.list div{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.list div span{color:var(--ink3);font-size:12px;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opts button{text-align:left;font-size:19px;padding:12px 14px;line-height:1.4}
.opts button small{display:block;font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.4}
.opts button:disabled{opacity:1}
.opts button.right{background:var(--okbg);border-color:var(--ok)}.opts button.wrong{background:var(--seal2);border-color:var(--seal)}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--paper2);font-size:15px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--seal2)}
.rung{font-size:12px;color:var(--ink2);display:flex;gap:10px;margin:6px 0 12px}
.rung span{opacity:.45}.rung span.on{opacity:1;color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--seal)}
.prog{display:flex;gap:3px;margin:4px 0 14px}.prog i{flex:1;height:3px;background:var(--rule)}.prog i.d{background:var(--ink)}
.empty{padding:20px 0;color:var(--ink2);font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script id="deck" type="application/json">{"P": {"changjiu": {"id": "changjiu", "zh": "但愿人长久，千里共婵娟", "segs": [["但愿", "only wish", "dàn yuàn"], ["人", "people, the two of us", "rén"], ["长久", "long-lasting, live long", "cháng jiǔ"], ["千里", "a thousand li apart", "qiān lǐ"], ["共", "share", "gòng"], ["婵娟", "the moon (literally: the graceful one)", "chán juān"]], "en": "I only wish us long life, so that a thousand li apart we still share this moon.", "author": "苏轼", "work": "水调歌头·明月几时有", "era": "北宋", "note": "The closing line of the most famous Mid-Autumn poem in Chinese. Written for his brother 苏辙, whom he had not seen for six or seven years, depending on how you count. Say it to anyone you miss when the moon is full.", "ctx": ["人有悲欢离合，月有阴晴圆缺", "rén yǒu bēi huān lí hé ， yuè yǒu yīn qíng yuán quē", "People have sorrow and joy, parting and reunion; the moon has dark and bright, full and waning."], "py": "dàn yuàn rén cháng jiǔ ， qiān lǐ gòng chán juān", "deep": {"zi": [["但愿", "dàn yuàn", "Only wish; 但 as 'only', 愿 as 'wish'. The whole poem ends on a wish, not a claim."], ["长久", "cháng jiǔ", "Long-lasting; here 'may we live long', though the phrase is deliberately open: long life, long love, long anything."], ["共", "gòng", "Share; the moon as the thing that can be shared across any distance."], ["婵娟", "chán juān", "Read chán juān. Originally a woman's graceful beauty; poets borrowed it for the moon. 苏轼 is calling the moon 'the lovely one'."]], "dui": ["人有悲欢离合，月有阴晴圆缺，此事古难全", "rén yǒu bēi huān lí hé ， yuè yǒu yīn qíng yuán quē ， cǐ shì gǔ nán quán", "People have sorrow and joy, parting and reunion; the moon has dark and bright, full and waning; this has never been whole.", "The couplet before, the acceptance that makes the wish honest."], "dian": "谢庄 (xiè zhuāng)'s 月赋 (yuè fù) (fifth century): 美人迈兮音尘阙 (měi rén mài xī yīn chén quē)，隔千里兮共明月 (gé qiān lǐ xī gòng míng yuè), 'the beloved has gone, no word or trace; a thousand li apart, we share the bright moon'. 苏轼 (sū shì)'s 千里共婵娟 (qiān lǐ gòng chán juān) is that line compressed. He also answers 张九龄 (zhāng jiǔ líng)'s 海上生明月 (hǎi shàng shēng míng yuè)，天涯共此时 (tiān yá gòng cǐ shí) and, in the opening, 李白 (lǐ bái)'s 把酒问月 (bǎ jiǔ wèn yuè) (青天有月来几时 (qīng tiān yǒu yuè lái jǐ shí)，我今停杯一问之 (wǒ jīn tíng bēi yī wèn zhī)).", "shi": "Mid-Autumn 1076, 密州 (mì zhōu) (Shandong), where 苏轼 (sū shì) was governor. The preface says he drank till dawn, got very drunk, wrote this, and 'also thought of 子由 (zǐ yóu)', his younger brother 苏辙 (sū zhé), whom he had not seen for six years (the seven in some accounts counts differently). The brothers were the closest pair in Chinese literary history; 苏轼 (sū shì) asked to be posted near him and wasn't.", "chuan": "The Mid-Autumn poem, sung in a 1983 setting by 邓丽君 (dèng lì jūn) that every Chinese person knows. The critic 胡仔 (hú zǎi) said that after this 水调歌头 (shuǐ diào gē tóu), all other Mid-Autumn poems could be discarded. Say it to anyone you miss when the moon is full; it is understood in every Chinese-speaking country.", "lian": [["p", "yinqing", "the couplet before it"], ["p", "haishang", "the Tang line it answers"], ["p", "xichuang", "another moment stored up to share"]]}}, "haishang": {"id": "haishang", "zh": "海上生明月，天涯共此时", "segs": [["海上", "over the sea", "hǎi shàng"], ["生", "is born, rises", "shēng"], ["明月", "bright moon", "míng yuè"], ["天涯", "the edge of the sky, far away", "tiān yá"], ["共", "share", "gòng"], ["此时", "this moment", "cǐ shí"]], "en": "Over the sea the bright moon is born; at the sky's edge we share this moment.", "author": "张九龄", "work": "望月怀远", "era": "唐", "note": "The Tang answer to 但愿人长久. Quieter and older. The moon rising over water is the trigger; the point is that the same moon is above the person you miss right now.", "ctx": null, "py": "hǎi shàng shēng míng yuè ， tiān yá gòng cǐ shí", "deep": {"zi": [["生", "shēng", "'Is born': the moon is not said to rise but to be generated by the sea. Later critics compared it with 张若虚's 海上明月共潮生, and 谢灵运's 池塘生春草; 生 is the Tang word for a scene coming into being."], ["天涯", "tiān yá", "The sky's edge, the far world; the same word as in 天涯若比邻."], ["共此时", "gòng cǐ shí", "Share this moment; 此时 as 'this very time', the present made common property."]], "dui": ["情人怨遥夜，竟夕起相思", "qíng rén yuàn yáo yè ， jìng xī qǐ xiāng sī", "The one who loves resents the long night, and all night longing rises.", "The second couplet, which turns from the shared moon to the private night."], "dian": "谢庄 (xiè zhuāng)'s 月赋 (yuè fù) again: 隔千里兮共明月 (gé qiān lǐ xī gòng míng yuè). 张九龄 (zhāng jiǔ líng) took the shared moon and added the sea and the moment; 苏轼 (sū shì) took 张九龄 (zhāng jiǔ líng) and added the wish. The three lines are one conversation across seven centuries, and this is its middle term.", "shi": "Around 737. 张九龄 (zhāng jiǔ líng) had been chief minister under 玄宗 (xuán zōng) and had just been ousted by 李林甫 (lǐ lín fǔ), the man whose administration would end in the An Lushan rebellion. He wrote this in demotion at 荆州 (jīng zhōu), missing someone in the capital; whom, he did not say.", "chuan": "The Tang answer to the Mid-Autumn question, quieter than 苏轼 (sū shì) and older, and preferred by people who find 但愿人长久 (dàn yuàn rén cháng jiǔ) too familiar. Say it when the moon comes up over water and you think of someone far away; 海上生明月 (hǎi shàng shēng míng yuè) alone is a complete sentence in Chinese.", "lian": [["p", "changjiu", "苏轼's answer, seven centuries later"], ["p", "xichuang", "another moment shared across distance"], ["p", "guxiangming", "杜甫's moon, brightest at home"]]}}, "buhuan": {"id": "buhuan", "zh": "不患人之不己知，患不知人也", "segs": [["不患", "do not worry that", "bù huàn"], ["人", "others", "rén"], ["之", "(links subject and verb)", "zhī"], ["不己知", "do not know me (classical word order for 不知己)", "bù jǐ zhī"], ["患", "worry that", "huàn"], ["不知人", "I do not know others", "bù zhī rén"], ["也", "(sentence-final particle)", "yě"]], "en": "Do not worry that others do not know you; worry that you do not know others.", "author": "孔子", "work": "论语·学而", "era": "春秋", "note": "Confucius says a version of this four separate times in the Analects, which tells you how often his students complained about being overlooked. Turn the complaint around: what are you failing to notice about the people around you?", "ctx": null, "py": "bù huàn rén zhī bù jǐ zhī ， huàn bù zhī rén yě", "deep": {"zi": [["患", "huàn", "Modern 患 means illness or disaster. In classical usage it is a verb, 'to be troubled by', and it opens both halves so the sentence hinges on what you choose to be troubled by."], ["不己知", "bù jǐ zhī", "Classical Chinese puts the object before the verb when the sentence is negated and the object is a pronoun: 不知己 becomes 不己知. Same rule in 莫己知 and 不吾知. Once you see it you will see it everywhere in the Analects."], ["也", "yě", "Sentence-final 也 marks a judgement rather than a report: 'this, and not that, is what to worry about.'"]], "dui": null, "dian": "This has no earlier source; it is the source. Confucius returns to the thought four times: 学而 (xué ér) has this line and 人不知而不愠 (rén bù zhī ér bù yùn); 里仁 (lǐ rén) has 不患莫己知 (bù huàn mò jǐ zhī)，求为可知也 (qiú wèi kě zhī yě) ('do not worry that no one knows you; seek to become worth knowing'); 宪问 (xiàn wèn) has 不患人之不己知 (bù huàn rén zhī bù jǐ zhī)，患其不能也 (huàn qí bù néng yě) ('worry about your own inability'); 卫灵公 (wèi líng gōng) has 君子病无能焉 (jūn zǐ bìng wú néng yān)，不病人之不己知 (bù bìng rén zhī bù jǐ zhī). Four variations means the students kept raising it and he kept turning it around.", "shi": "The Analects is not a book Confucius wrote; it is a record of sayings compiled by disciples and their disciples over generations after his death in 479 BCE. This line closes the first chapter, 学而 (xué ér), which is the chapter about learning and about how a person should carry himself before he has any position. Most of the men listening were exactly your age and had no job.", "chuan": "Later readers split on the emphasis. 朱熹 (zhū xī), the twelfth-century commentator whose reading became the exam standard for six hundred years, took it as being about self-cultivation: worry about your own knowing. Modern readers often hear the second half as being about empathy: worry about not understanding others. Both are there. In speech the first half alone, 不患人之不己知 (bù huàn rén zhī bù jǐ zhī), is enough; everyone knows the ending.", "lian": [["p", "buyun", "the same thought two lines earlier in the same chapter, framed as the mark of a 君子"], ["p", "tiansheng", "the loud version: Li Bai refusing to be worried at all"], ["p", "taoli", "the general who never advertised and was followed anyway"]]}}, "tiansheng": {"id": "tiansheng", "zh": "天生我材必有用，千金散尽还复来", "segs": [["天生", "heaven-born, what heaven gave", "tiān shēng"], ["我材", "my talent", "wǒ cái"], ["必", "surely", "bì"], ["有用", "has a use", "yǒu yòng"], ["千金", "a thousand gold pieces", "qiān jīn"], ["散尽", "scattered to nothing", "sàn jìn"], ["还复来", "will come back again", "huán fù lái"]], "en": "Heaven made my talent, so it must have a use; a thousand gold pieces spent will come back again.", "author": "李白", "work": "将进酒", "era": "唐", "note": "Li Bai at his most defiant. Written after being dismissed from court. The line to say when you have been passed over and want to sound like you do not care. Careful: it is loud. Use with friends, not in a meeting.", "ctx": null, "py": "tiān shēng wǒ cái bì yǒu yòng ， qiān jīn sàn jìn huán fù lái", "deep": {"zi": [["材", "cái", "Material, timber; by extension talent. Written 材 not 才 in most editions, keeping the image of wood waiting to be used."], ["必有用", "bì yǒu yòng", "必 is the loud word. Not 'may', not 'should': must."], ["散尽", "sàn jìn", "散 (scatter) plus 尽 (to the end). Money spent to nothing."], ["还", "hái", "Read huán, 'return', not hái 'still'. 还复来: it comes back again."]], "dui": ["人生得意须尽欢，莫使金樽空对月", "rén shēng dé yì xū jìn huān ， mò shǐ jīn zūn kōng duì yuè", "When life goes your way, enjoy it fully; never let the golden cup sit empty under the moon.", "The couplet just before it. The two together are the whole argument of the poem: drink now, because you are worth it and the money will return."], "dian": "The poem's title is a 乐府 (yuè fǔ) tune name, 将进酒 (qiāng jìn jiǔ) (read qiāng, 'please drink'), a Han drinking song; Li Bai took the old frame and filled it with himself. The opening, 君不见黄河之水天上来 (jūn bú jiàn huáng hé zhī shuǐ tiān shàng lái), is one of the great openings in Chinese.", "shi": "Written around 752, after Li Bai had been dismissed from 玄宗 (xuán zōng)'s court with a golden handshake and years of wandering. The two friends named in the poem, 岑夫子 (cén fū zǐ) and 丹丘生 (dān qiū shēng), were drinking with him at 嵩山 (sōng shān). The whole poem is one long toast.", "chuan": "The most quoted line for self-belief in Chinese, printed on bags and shouted at karaoke. It survives that because it is not a slogan but a specific man's defiance on a specific night. The register is loud; among friends after a setback it is perfect, in a professional setting it reads as bravado.", "lian": [["p", "jinzun", "the couplet before it"], ["p", "yangtian", "the same man walking out the door laughing"], ["p", "buhuan", "Confucius's quieter answer to the same complaint"]]}}, "changfeng": {"id": "changfeng", "zh": "长风破浪会有时，直挂云帆济沧海", "segs": [["长风", "a long wind", "zhǎng fēng"], ["破浪", "breaks the waves", "pò làng"], ["会有时", "there will be a time", "huì yǒu shí"], ["直", "straight", "zhí"], ["挂", "hoist", "guà"], ["云帆", "cloud-high sail", "yún fān"], ["济", "cross", "jì"], ["沧海", "the vast blue sea", "cāng hǎi"]], "en": "There will come a time when the long wind breaks the waves; I will hoist my sail to the clouds and cross the sea.", "author": "李白", "work": "行路难·其一", "era": "唐", "note": "The poem before this line is pure frustration: ice blocks the river, snow covers the mountain, the road is hard. Then this. The mood swing is the point. Say it when you decide to keep going.", "ctx": ["行路难，行路难，多歧路，今安在", "xíng lù nán ， xíng lù nán ， duō qí lù ， jīn ān zài", "Hard road, hard road, so many forks; where am I now?"], "py": "cháng fēng pò làng huì yǒu shí ， zhí guà yún fān jì cāng hǎi", "deep": {"zi": [["长风", "zhǎng fēng", "A long wind, a wind with distance in it. Also a person's name-worthy ambition after this poem."], ["会有时", "huì yǒu shí", "会 here is 'will surely', a future certainty, not 'meeting'. 会有时: there will be a time."], ["云帆", "yún fān", "A sail high as the clouds. Hyperbole is Li Bai's native mode."], ["济", "jì", "To cross water; the same 济 as in 济南 (south of the 济 river) and 经济."]], "dui": ["行路难，行路难，多歧路，今安在", "xíng lù nán ， xíng lù nán ， duō qí lù ， jīn ān zài", "Hard road, hard road; so many forks; where am I now?", "The lines just before it, where the poem bottoms out. The turn from that to this is the whole point."], "dian": "长风破浪 (cháng fēng pò làng) quotes the Southern Dynasties general 宗悫 (zōng què), who as a boy, asked his ambition, said 愿乘长风破万里浪 (yuàn chéng zhǎng fēng pò wàn lǐ làng), 'I wish to ride the long wind and break ten thousand li of waves'. Li Bai's readers heard that boast underneath. The poem also alludes to 姜太公 (jiāng tài gōng) fishing and 伊尹 (yī yǐn) dreaming, two men called from obscurity to power, in the lines before the fork.", "shi": "行路难 (xíng lù nán) 三首 (sān shǒu) were written in 744 as Li Bai left Chang'an, dismissed after less than two years at court. The friends gave him a farewell banquet; the poem begins with expensive wine he cannot swallow.", "chuan": "The final couplet is quoted on its own so often that people forget the despair before it. That is a loss: the line only means what it means because of 多歧路 (duō qí lù). Used for careers, for national projects, for exam students; it is the Chinese line for resolve after a low point, and it is best said after actually having one.", "lian": [["p", "qiusuo", "屈原's road, the older vow"], ["p", "qingzhou", "the day the boat actually flew"], ["p", "juantu", "the general who should have made this vow"]]}}, "jianbuduan": {"id": "jianbuduan", "zh": "剪不断，理还乱，是离愁", "segs": [["剪不断", "cannot cut it off", "jiǎn bù duàn"], ["理还乱", "try to untangle it and it is still tangled", "lǐ hái luàn"], ["是", "it is", "shì"], ["离愁", "the sorrow of parting", "lí chóu"]], "en": "Cannot cut it, cannot untangle it: this is the sorrow of separation.", "author": "李煜", "work": "相见欢·无言独上西楼", "era": "南唐", "note": "Li Yu was the last ruler of the Southern Tang, captured when the Song conquered his state, and wrote this as a prisoner. 剪不断，理还乱 is now said of any feeling or problem you cannot cut or comb straight, not only parting.", "ctx": null, "py": "jiǎn bù duàn ， lǐ hái luàn ， shì lí chóu", "deep": {"zi": [["剪不断", "jiǎn bù duàn", "Cannot cut off; 剪 as 'scissor'. The image is a thread, or hair, or silk."], ["理还乱", "lǐ hái luàn", "Sort it, and it is still tangled; 理 as 'put in order' (as in 理发, 整理)."], ["离愁", "lí chóu", "The sorrow of separation; here, separation from a lost kingdom."]], "dui": ["无言独上西楼，月如钩", "wú yán dú shàng xī lóu ， yuè rú gōu", "Wordless, alone, I climb the west tower; the moon like a hook.", "The opening: the prisoner alone with a crescent moon."], "dian": "None specific. The tangled silk of longing is old (the 诗经 (shī jīng)'s 心之忧矣 (xīn zhī yōu yǐ)，如匪浣衣 (rú fěi huàn yī)), but 李煜 (lǐ yù) made it a line everyone says.", "shi": "After 975, 开封 (kāi fēng), where 李煜 (lǐ yù), the last ruler of 南唐 (nán táng), was held after the Song took his capital 金陵 (jīn líng) (Nanjing). He had been a poet-king who preferred music to war; in captivity he wrote the poems that made him the founder of the serious 词. The Song emperor had him poisoned in 978 on his forty-second birthday.", "chuan": "The couplet is quoted about any feeling or problem that cannot be cut or combed, a divorce, a debt, a research question. The last line of the poem, 别是一般滋味在心头 (bié shì yì bān zī wèi zài xīn tóu), 'a different kind of taste in the heart', is also famous. Say it at 2 a.m.", "lian": [["p", "choudao", "李白: cutting water with a sword"], ["p", "zhanzhuan", "the oldest sleepless night"], ["s", "cant-sleep", "2 a.m."]]}}, "zhanzhuan": {"id": "zhanzhuan", "zh": "悠哉悠哉，辗转反侧", "segs": [["悠哉悠哉", "long, long (the night, the longing)", "yōu zāi yōu zāi"], ["辗转", "toss and turn", "zhǎn zhuǎn"], ["反侧", "roll over and over", "fǎn cè"]], "en": "Long, so long; I toss and turn all night.", "author": "诗经", "work": "周南·关雎", "era": "西周", "note": "From the very first poem in the Book of Odes, about a young man who cannot sleep for thinking of a girl. 辗转反侧 is now the standard way to say 'lay awake turning something over'.", "ctx": ["求之不得，寤寐思服", "qiú zhī bù dé ， wù mèi sī fú", "Sought her and could not get her; awake and asleep I think of her."], "py": "yōu zāi yōu zāi ， zhǎn zhuǎn fǎn cè", "deep": {"zi": [["悠哉", "yōu zāi", "Read yōu zāi; 悠 as 'long, drawn out', 哉 an exclamation. Repeated: long, so long."], ["辗转", "zhǎn zhuǎn", "Read zhǎn zhuǎn, to roll and turn; the two characters are near-synonyms, a binome for restlessness."], ["反侧", "fǎn cè", "Turn over onto the side; 反 as 'flip', 侧 as 'side'."]], "dui": ["求之不得，寤寐思服", "qiú zhī bù dé ， wù mèi sī fú", "Sought and not obtained; awake and asleep I think of her.", "The line before: 寤寐 (wù mèi) (awake and asleep) is the poem's own phrase for all-day longing."], "dian": "There is nothing earlier; the 关雎 (guān jū) is the first poem in the first anthology. Confucius said of it 乐而不淫 (lè ér bù yín)，哀而不伤 (āi ér bù shāng), 'joyful without excess, sorrowful without harm', which became the standard for all Chinese poetry.", "shi": "The 诗经 (shī jīng) was assembled by the sixth century BCE from songs of the Zhou states; 关雎 (guān jū) opens the 周南 (zhōu nán) section and the whole book. It begins with ospreys calling on a river island and a 君子 (jūn zǐ) wanting a 淑女 (shū nǚ); this couplet is the middle of the night before the music of the ending.", "chuan": "辗转反侧 (zhǎn zhuǎn fǎn cè) is an everyday idiom for tossing and turning; most people who say it do not know it is from the first poem in Chinese. The couplet is the line for a sleepless night over a person or a problem, and the fact that it is 2,700 years old is a comfort at 3 a.m.", "lian": [["p", "jianbuduan", "李煜's tangle"], ["p", "choudao", "李白's water that will not be cut"], ["s", "cant-sleep", "turning it over"]]}}, "lingjueding": {"id": "lingjueding", "zh": "会当凌绝顶，一览众山小", "segs": [["会当", "I will surely", "huì dāng"], ["凌", "climb to, tower over", "líng"], ["绝顶", "the very peak", "jué dǐng"], ["一览", "take in at one glance", "yī lǎn"], ["众山", "all the mountains", "zhòng shān"], ["小", "small", "xiǎo"]], "en": "One day I will stand on the very peak and see all the mountains small.", "author": "杜甫", "work": "望岳", "era": "唐", "note": "Du Fu at twenty-four, looking at Mount Tai and not yet having climbed it. It is a promise, not a report. Said at a summit, or about any goal you have decided to reach.", "ctx": null, "py": "huì dāng líng jué dǐng ， yī lǎn zhòng shān xiǎo", "deep": {"zi": [["会当", "huì dāng", "会 as 'certainly will', 当 as 'ought'. Together, a future resolve: 'I shall'."], ["凌", "líng", "To rise above, to overtop. The same 凌 as in 凌驾."], ["绝顶", "jué dǐng", "绝 as 'utmost'. The very summit."], ["众山小", "zhòng shān xiǎo", "Not 'the mountains are small' but 'see the mountains as small'. 小 is used causatively, and that is the allusion."]], "dui": ["荡胸生曾云，决眦入归鸟", "dàng xiōng shēng céng yún ， jué zì rù guī niǎo", "Layered clouds rise and wash the chest; straining the eyes, I follow the returning birds.", "The couplet before, where the poet is still below, looking up."], "dian": "孟子 (mèng zi) 尽心上 (jìn xīn shàng): 孔子登东山而小鲁 (kǒng zi dēng dōng shān ér xiǎo lǔ)，登泰山而小天下 (dēng tài shān ér xiǎo tiān xià), 'Confucius climbed 东山 (dōng shān) and Lu seemed small; climbed 泰山 (tài shān) and the world seemed small'. 一览众山小 (yī lǎn zhòng shān xiǎo) is that sentence turned into a line of verse. 泰山 (tài shān) was the mountain emperors climbed to report to heaven.", "shi": "Around 736. Du Fu was twenty-four, had just failed the imperial exam for the first time, and was travelling in the east. He did not climb the mountain; the poem is written looking at it. Everything in it is anticipation.", "chuan": "The most quoted Chinese line about ambition and vantage, on office walls and in speeches. Because it was written by a young man who had just failed, it carries a hopefulness that his later poems lose entirely. Say it at a summit, or when you decide on one.", "lian": [["p", "gengshang", "the same idea one storey at a time"], ["p", "lushan", "the mountain you cannot see from inside"], ["p", "fuyun2", "王安石 at the top, unbothered by clouds"]]}}, "canghai": {"id": "canghai", "zh": "日月之行，若出其中；星汉灿烂，若出其里", "segs": [["日月之行", "the sun and moon in their courses", "rì yuè zhī xíng"], ["若", "seem to", "ruò"], ["出其中", "rise from within it (the sea)", "chū qí zhōng"], ["星汉", "the Milky Way (literally: star river)", "xīng hàn"], ["灿烂", "brilliant", "càn làn"], ["若", "seem to", "ruò"], ["出其里", "come from inside it", "chū qí lǐ"]], "en": "The sun and moon on their courses seem to rise out of it; the brilliant river of stars seems to come from within it.", "author": "曹操", "work": "观沧海", "era": "东汉", "note": "Cao Cao, the warlord of the Three Kingdoms, looking at the Bohai sea on his way back from a northern campaign. Considered the first great landscape poem in Chinese. The sea contains the sky: say it when something is so vast it seems to hold everything.", "ctx": null, "py": "rì yuè zhī xíng ， ruò chū qí zhōng ； xīng hàn càn làn ， ruò chū qí lǐ", "deep": {"zi": [["日月之行", "rì yuè zhī xíng", "The travelling of sun and moon; 行 as 'course, motion'."], ["若", "ruò", "As if; the whole couplet is a double 'as if', the sea seeming to contain the sky."], ["星汉", "xīng hàn", "The Star River, the Milky Way; 汉 as 'river' (the 汉 river gave its name to the dynasty and the ethnicity)."], ["灿烂", "càn làn", "Read càn làn, brilliant, dazzling; reduplicative binome."]], "dui": ["东临碣石，以观沧海", "dōng lín jié shí ， yǐ guān cāng hǎi", "East I reach 碣石 and look on the blue sea.", "The opening: the place, and the act of looking."], "dian": "None earlier; this is counted as the first complete landscape poem in Chinese, before 谢灵运 (xiè líng yùn) made the genre. Its four-character line is the 诗经 (shī jīng) metre, so 曹操 (cáo cāo) is writing the old form about a new subject.", "shi": "207 CE. 曹操 (cáo cāo), aged fifty-two, had just crushed the 乌桓 (wū huán) in the northeast and was returning through 碣石 (jié shí) on the Bohai coast; the poem is one of four in 步出夏门行 (bù chū xià mén xíng). He was the warlord who controlled the Han emperor and whose son founded 魏; also the poet whose 短歌行 (duǎn gē xíng) (对酒当歌 (duì jiǔ dāng gē)) you know. 毛泽东 (máo zé dōng)'s 浪淘沙 (làng táo shā)·北戴河 (běi dài hé) (东临碣石有遗篇 (dōng lín jié shí yǒu yí piān)) is written at the same place, about him.", "chuan": "The couplet is quoted about any vastness that seems to hold everything, and about ambition of imperial size. Because 曹操 (cáo cāo) is the villain of the novel and a major poet in fact, saying his line is a small act of taking the historian's side. Say it by an ocean.", "lian": [["p", "lingjueding", "杜甫's summit, the mountains small"], ["p", "gungun", "the river that washed 曹操 away"], ["s", "awe", "something vast"]]}}, "shaozhuang": {"id": "shaozhuang", "zh": "少壮不努力，老大徒伤悲", "segs": [["少壮", "young and strong", "shào zhuàng"], ["不努力", "does not strive", "bù nǔ lì"], ["老大", "grown old", "lǎo dà"], ["徒", "in vain, uselessly", "tú"], ["伤悲", "grieve", "shāng bēi"]], "en": "If you do not strive while young and strong, you will only grieve in vain when old.", "author": "汉乐府", "work": "长歌行", "era": "汉", "note": "Every Chinese child learns this. The previous line is 百川东到海，何时复西归 (all rivers flow east to the sea; when do they ever return west?). Time only goes one way.", "ctx": null, "py": "shào zhuàng bù nǔ lì ， lǎo dà tú shāng bēi", "deep": {"zi": [["少壮", "shào zhuàng", "Young and strong; 少 read shào, 壮 as 'robust'."], ["努力", "nǔ lì", "Strive; the modern word is unchanged."], ["老大", "lǎo dà", "Grown old; 老大 in the classical sense, not 'boss'."], ["徒", "tú", "In vain, merely; the adverb that makes the grief pointless."]], "dui": ["百川东到海，何时复西归", "bǎi chuān dōng dào hǎi ， hé shí fù xī guī", "A hundred rivers flow east to the sea; when do they ever return west?", "The couplet before, the natural fact the moral is drawn from."], "dian": "The 乐府 (yuè fǔ) (Music Bureau) collected songs under the Han; 长歌行 (cháng gē xíng) is one, anonymous, and this ending is its whole point. 苏轼 (sū shì)'s 门前流水尚能西 (mén qián liú shuǐ shàng néng xī) is a deliberate answer to 何时复西归 (hé shí fù xī guī).", "shi": "Han dynasty, anonymous. The poem begins with dew on green sunflowers and morning light, moves to autumn and the yellowing of everything, then the rivers, then this. It is the model of the 'carpe diem' poem in Chinese, except that the conclusion is work, not pleasure.", "chuan": "Every Chinese child learns it and most adults quote it at children. It is the least elegant line in the deck and the most used. Said to yourself on a wasted evening, it is exactly as blunt as it should be.", "lian": [["p", "cunjin", "the folk maxim on gold and time"], ["p", "modengxian", "the general's version"], ["p", "zaishao", "苏轼 answering the rivers"]]}}, "cunjin": {"id": "cunjin", "zh": "一寸光阴一寸金，寸金难买寸光阴", "segs": [["一寸", "one inch of", "yī cùn"], ["光阴", "time (literally: light and shadow, the sun's movement)", "guāng yīn"], ["一寸金", "an inch of gold", "yī cùn jīn"], ["寸金", "an inch of gold", "cùn jīn"], ["难买", "cannot buy", "nán mǎi"], ["寸光阴", "an inch of time", "cùn guāng yīn"]], "en": "An inch of time is an inch of gold, but an inch of gold cannot buy an inch of time.", "author": "增广贤文", "work": "增广贤文", "era": "明清", "note": "The 增广贤文 is a Ming-Qing collection of folk maxims that every schoolchild once memorised. This one is the plainest possible statement about time. Useful precisely because everyone knows it.", "ctx": null, "py": "yī cùn guāng yīn yī cùn jīn ， cùn jīn nán mǎi cùn guāng yīn", "deep": {"zi": [["寸", "cùn", "An inch; the smallest common measure, used for time by way of the sundial's shadow moving an inch."], ["光阴", "guāng yīn", "Light and shadow: time, from the sun's movement. The word survives only in poetic and proverbial use."], ["难买", "nán mǎi", "Hard to buy; 难 as 'difficult', the fulcrum of the second half."]], "dui": null, "dian": "The Tang poet 王贞白 (wáng zhēn bái) wrote 读书不觉已春深 (dú shū bù jué yǐ chūn shēn)，一寸光阴一寸金 (yī cùn guāng yīn yī cùn jīn) ('reading, I did not notice spring had deepened; an inch of time is an inch of gold') in 白鹿洞二首 (bái lù dòng èr shǒu). The 增广贤文 (zēng guǎng xián wén) took his second line and added the reply, 寸金难买寸光阴 (cùn jīn nán mǎi cùn guāng yīn), which is the half everyone remembers.", "shi": "The 增广贤文 (zēng guǎng xián wén) is an anonymous Ming-Qing anthology of maxims, expanded over centuries (增广 (zēng guǎng) means 'expanded'), used as a children's primer alongside 三字经 (sān zì jīng). It has no author and no argument, only lines, and it is where most Chinese proverbs live.", "chuan": "The plainest Chinese statement about time and therefore the most quoted, on school walls and by parents. Its very familiarity is the point: everyone can finish it. Say the first half and let the room supply the second.", "lian": [["p", "shaozhuang", "the Han warning about youth"], ["p", "modengxian", "the general's version"], ["s", "wasted-day", "the day gone"]]}}, "caiju": {"id": "caiju", "zh": "采菊东篱下，悠然见南山", "segs": [["采菊", "pick chrysanthemums", "cǎi jú"], ["东篱下", "beneath the eastern hedge", "dōng lí xià"], ["悠然", "unhurried, at ease", "yōu rán"], ["见", "see (some read it 现, 'appears')", "jiàn"], ["南山", "the southern mountain", "nán shān"]], "en": "Picking chrysanthemums by the eastern hedge, unhurried, I see the southern mountain.", "author": "陶渊明", "work": "饮酒·其五", "era": "东晋", "note": "Tao Yuanming quit his post as a county magistrate rather than bow to an inspector, and farmed for the rest of his life. This is the founding line of Chinese contentment. The key word is 悠然: not looking for the mountain, just seeing it.", "ctx": ["此中有真意，欲辨已忘言", "cǐ zhōng yǒu zhēn yì ， yù biàn yǐ wàng yán", "In this there is a true meaning; I would explain it but have already forgotten the words."], "py": "cǎi jú dōng lí xià ， yōu rán jiàn nán shān", "deep": {"zi": [["采菊", "cǎi jú", "Pick chrysanthemums; the flower of autumn and of the recluse, and, in 陶渊明's day, of longevity when steeped in wine."], ["东篱", "dōng lí", "The eastern hedge; 篱 (lí) a fence of woven branches. After this poem 东篱 alone means a hermit's garden."], ["悠然", "yōu rán", "Unhurried, at ease; the word the whole tradition took from this line."], ["见", "jiàn", "Read jiàn, 'see', in most editions; some early texts have 望 (gaze at), and 苏轼 argued furiously that 望 ruins the line, because 见 is accidental and 望 is deliberate. He was right."], ["南山", "nán shān", "The southern mountain; 庐山, near his farm at 柴桑."]], "dui": ["此中有真意，欲辨已忘言", "cǐ zhōng yǒu zhēn yì ， yù biàn yǐ wàng yán", "In this there is a true meaning; I want to explain it and have already forgotten the words.", "The ending, which is 庄子 (zhuāng zi) (得意而忘言 (dé yì ér wàng yán), 'get the meaning and forget the words') applied to a hedge."], "dian": "庄子 (zhuāng zi)'s 忘言 (wàng yán) in the last line; 诗经 (shī jīng)'s 南山 (nán shān) (如南山之寿 (rú nán shān zhī shòu), long life like the southern mountain) under the mountain. Later, 周敦颐 (zhōu dūn yí)'s 爱莲说 (ài lián shuō) opened with 晋陶渊明独爱菊 (jìn táo yuān míng dú ài jú), 'of the Jin, Tao Yuanming alone loved the chrysanthemum', fixing the flower to the man forever.", "shi": "Around 417. 陶渊明 (táo yuān míng) (365 to 427) had resigned as magistrate of 彭泽 (péng zé) in 405 after eighty days, saying he would not bow for five pecks of rice (不为五斗米折腰 (bù wèi wǔ dǒu mǐ zhé yāo)), and farmed, badly and happily, for the rest of his life. The 饮酒 (yǐn jiǔ) poems, twenty of them, were written 'after drinking, in the evenings'. This is the fifth and the most famous poem of the Six Dynasties.", "chuan": "The founding image of Chinese contentment. Every later poet who retired quoted it; 王维 (wáng wéi), 苏轼 (sū shì), and 辛弃疾 (xīn qì jí) all wrote in his voice. It is the line for noticing you are happy with little and not chasing the mountain, only seeing it. The register is quiet; say it quietly.", "lian": [["p", "yidanshi", "颜回's bowl and gourd"], ["p", "shuiqiong", "王维 sitting where the water ends"], ["s", "contentment", "a walk, a cup, a view"]]}}, "yidanshi": {"id": "yidanshi", "zh": "一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐", "segs": [["一箪食", "one bamboo bowl of rice", "yī dān shí"], ["一瓢饮", "one gourd of water", "yī piáo yǐn"], ["在陋巷", "in a shabby lane", "zài lòu xiàng"], ["人", "others", "rén"], ["不堪其忧", "could not bear the hardship", "bù kān qí yōu"], ["回", "Yan Hui (Confucius's favourite student)", "huí"], ["也", "(topic marker)", "yě"], ["不改其乐", "did not change his joy", "bù gǎi qí lè"]], "en": "A bowl of rice, a gourd of water, a shabby lane. Others could not bear the hardship, but Hui never lost his joy.", "author": "孔子", "work": "论语·雍也", "era": "春秋", "note": "Confucius describing 颜回, the student he loved most, who died young. The joy is not despite poverty; it does not depend on the circumstances at all. Say the last five characters, 回也不改其乐, when you notice you are happy with very little.", "ctx": null, "py": "yī dān shí ， yī piáo yǐn ， zài lòu xiàng ， rén bù kān qí yōu ， huí yě bù gǎi qí lè", "deep": {"zi": [["箪", "dān", "A round bamboo container for cooked rice. Poor people's tableware; the word survives almost only in this line."], ["瓢", "piáo", "A ladle made from half a dried gourd. 箪食瓢饮 became an idiom for living on almost nothing."], ["陋巷", "lòu xiàng", "A mean lane. 陋 is the same character in 陋室, the humble room of 刘禹锡's 陋室铭."], ["回也", "huí yě", "回 is 颜回, the disciple; 也 after a name marks it as the topic: 'as for Hui'."]], "dui": null, "dian": "None earlier. The line became the source for a whole philosophical programme: the Song thinker 周敦颐 (zhōu dūn yí) set his two students, the 程 brothers, the task of finding 孔颜乐处 (kǒng yán lè chù), 'what Confucius and Yan Hui took joy in', and that question runs through Neo-Confucianism.", "shi": "From 雍也 (yōng yě). 颜回 (yán huí) was the disciple Confucius loved most and considered the only one who truly loved learning; he died around thirty, and Confucius wept that heaven was destroying him. This passage is spoken while Hui was alive, with the exclamation 贤哉回也 (xián zāi huí yě) ('how worthy is Hui') at both ends.", "chuan": "Quoted whenever someone wants to say that contentment does not depend on circumstance, and sometimes, less honestly, to praise poverty from a comfortable chair. The safeguard is that Confucius is not praising the poverty; he is praising the 不改 (bù gǎi), the not changing. Say the last five characters when the point is that your mood did not move.", "lian": [["p", "caiju", "the poet's version, a hedge and a mountain"], ["p", "fuyun", "Confucius's own bent-arm pillow"], ["s", "contentment", "happy with very little"]]}}, "yixiang": {"id": "yixiang", "zh": "独在异乡为异客，每逢佳节倍思亲", "segs": [["独", "alone", "dú"], ["在异乡", "in a strange land", "zài yì xiāng"], ["为异客", "as a stranger, a guest", "wéi yì kè"], ["每逢", "every time it comes to", "měi féng"], ["佳节", "a festival", "jiā jié"], ["倍", "doubly", "bèi"], ["思亲", "miss family", "sī qīn"]], "en": "Alone in a strange land, a stranger; every festival I miss my family twice as much.", "author": "王维", "work": "九月九日忆山东兄弟", "era": "唐", "note": "Wang Wei at seventeen, in the capital on the Double Ninth festival (重阳, the ninth day of the ninth lunar month). Written for exactly the scene of being far from home on a holiday. Every overseas Chinese knows it.", "ctx": ["遥知兄弟登高处，遍插茱萸少一人", "yáo zhī xiōng dì dēng gāo chù ， biàn chā zhū yú shǎo yī rén", "Far away I know my brothers climb the heights, all wearing dogwood sprigs, one person short."], "py": "dú zài yì xiāng wéi yì kè ， měi féng jiā jié bèi sī qīn", "deep": {"zi": [["异乡", "yì xiāng", "A strange land; 异 as 'other, different'. 异客 doubles it: a stranger in a strange place."], ["每逢", "měi féng", "Every time one meets; 逢 for encountering an occasion."], ["倍", "bèi", "Doubly; the multiplier that makes the line."], ["思亲", "sī qīn", "Miss family; 亲 as kin, not romance."]], "dui": ["遥知兄弟登高处，遍插茱萸少一人", "yáo zhī xiōng dì dēng gāo chù ， biàn chā zhū yú shǎo yī rén", "Far off I know my brothers climb the heights, all wearing dogwood, one person short.", "The second couplet, which does the thing 杜甫 (dù fǔ) does in 月夜 (yuè yè): imagines the family from the outside and counts the gap."], "dian": "The customs are the allusion. On 重阳 (chóng yáng) (ninth of the ninth month) people climb a height and wear sprigs of 茱萸 (zhū yú) (dogwood) against evil, a practice recorded in the 续齐谐记 (xù qí xié jì) story of 桓景 (huán jǐng). 王维 (wáng wéi) assumes the reader knows the ritual so he can subtract one person from it.", "shi": "Around 717. 王维 (wáng wéi) was seventeen, from 蒲州 (pú zhōu) (east of the mountains, hence 山东 (shān dōng) in the title, which is not the modern province), studying in Chang'an for the exams. He passed at twenty-one, the youngest 状元 (zhuàng yuán) of his generation.", "chuan": "The most quoted homesickness line in Chinese, on every overseas festival poster and in every essay about the diaspora. Written by a teenager, it has a teenager's directness, which is why it has never been improved on. Say it at Chinese New Year when the group chat fills with food photos.", "lian": [["p", "guxiangming", "杜甫's version, with the calendar"], ["p", "changjiu", "the moon that makes distance bearable"], ["s", "festival-far", "a holiday in a foreign city"]]}}, "yaoyue": {"id": "yaoyue", "zh": "举杯邀明月，对影成三人", "segs": [["举杯", "raise the cup", "jǔ bēi"], ["邀", "invite", "yāo"], ["明月", "the bright moon", "míng yuè"], ["对影", "facing my shadow", "duì yǐng"], ["成三人", "makes three of us", "chéng sān rén"]], "en": "I raise my cup and invite the moon; with my shadow that makes three of us.", "author": "李白", "work": "月下独酌·其一", "era": "唐", "note": "Li Bai drinking alone and refusing to be sad about it. The best line for solitude that is chosen rather than suffered. Say it when you are alone and fine with it.", "ctx": null, "py": "jǔ bēi yāo míng yuè ， duì yǐng chéng sān rén", "deep": {"zi": [["邀", "yāo", "To invite. Inviting the moon is the poem's founding absurdity, played straight."], ["对影", "duì yǐng", "Facing my shadow; 对 as 'facing, toward'."], ["成三人", "chéng sān rén", "Makes three persons. Counting the moon and the shadow as company is the joke and the grief."]], "dui": ["花间一壶酒，独酌无相亲", "huā jiān yī hú jiǔ ， dú zhuó wú xiāng qīn", "Among the flowers a jug of wine; drinking alone, no one close.", "The opening, which states the loneliness plainly before the poem starts inventing company."], "dian": "陶渊明 (táo yuān míng) drank alone and wrote 饮酒 (yǐn jiǔ) poems, and the moon as companion goes back to the 古诗十九首 (gǔ shī shí jiǔ shǒu); but no one before Li Bai had counted the shadow. The poem later admits the two companions are hopeless: 月既不解饮 (yuè jì bù jiě yǐn)，影徒随我身 (yǐng tú suí wǒ shēn), the moon cannot drink, the shadow only follows.", "shi": "Probably 744, in Chang'an, during the court years, when Li Bai was surrounded by people and had no friends among them. Four poems under this title; this is the first.", "chuan": "The line for solitude that is chosen, or at least owned. Quoted at every Mid-Autumn by people drinking alone, and painted a thousand times. Its tone is what saves it: it is funny before it is sad, and Li Bai ends by proposing to meet the moon and shadow again in the Milky Way.", "lian": [["p", "haishang", "the moon shared with someone far away"], ["p", "hanjiang", "solitude with the joke removed"], ["p", "jinzun", "the same cup with friends"]]}}, "wufengyu": {"id": "wufengyu", "zh": "回首向来萧瑟处，归去，也无风雨也无晴", "segs": [["回首", "look back", "huí shǒu"], ["向来", "just now, the way I came", "xiàng lái"], ["萧瑟处", "the bleak, rain-swept place", "xiāo sè chù"], ["归去", "go back", "guī qù"], ["也无风雨", "no wind and rain", "yě wú fēng yǔ"], ["也无晴", "and no clear sky either", "yě wú qíng"]], "en": "I look back at the rain-swept way I came. Going home: no wind, no rain, and no sunshine either.", "author": "苏轼", "work": "定风波·莫听穿林打叶声", "era": "北宋", "note": "Su Shi was caught in a rainstorm without an umbrella while in political exile. His companions panicked; he walked on singing. Written that evening. The last seven characters, 也无风雨也无晴, are the Chinese phrase for equanimity: the storm and the calm are both weather, and you are not the weather.", "ctx": ["竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生", "zhú zhàng máng xié qīng shèng mǎ ， shuí pà ？ yī suō yān yǔ rèn píng shēng", "Bamboo staff, straw sandals, lighter than a horse. Who is afraid? A straw cape in the misty rain, I take life as it comes."], "py": "huí shǒu xiàng lái xiāo sè chù ， guī qù ， yě wú fēng yǔ yě wú qíng", "deep": {"zi": [["向来", "xiàng lái", "'Just now, the way just travelled'; classical sense, not the modern 'always'."], ["萧瑟", "xiāo sè", "Bleak, rustling, desolate; the sound of wind in bare trees, and of rain."], ["归去", "guī qù", "Go back; the word 陶渊明 used for leaving office (归去来兮), which every reader hears."], ["也无风雨也无晴", "yě wú fēng yǔ yě wú qíng", "Two 也无: neither the storm nor the fair weather. The double negation is the equanimity."]], "dui": ["竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生", "zhú zhàng máng xié qīng shèng mǎ ， shuí pà ？ yī suō yān yǔ rèn píng shēng", "Bamboo staff, straw sandals, lighter than a horse. Who is afraid? In a straw cape through mist and rain, I take life as it comes.", "The middle of the first stanza, the walk itself."], "dian": "陶渊明 (táo yuān míng)'s 归去来 (guī qù lái) in 归去 (guī qù); the fisherman's straw cape (蓑) from 柳宗元 (liǔ zōng yuán) and the 楚辞 (chǔ cí) 渔父 (yú fù). The Buddhist reading, that rain and sun are both empty, was 苏轼 (sū shì)'s own; he was reading 禅 texts in 黄州 (huáng zhōu).", "shi": "7 March 1082, 黄州 (huáng zhōu) (Hubei), the third year of 苏轼 (sū shì)'s exile after the 乌台诗案 (wū tái shī àn), when his poems were used as evidence of slander and he narrowly escaped execution. The preface: on the road to 沙湖 (shā hú), caught in rain, the umbrella-carriers had gone ahead, everyone was miserable, 'I alone did not feel it'; it cleared, and he wrote this.", "chuan": "The most quoted Chinese line for equanimity, in every book on 苏轼 (sū shì) and on every calendar. 一蓑烟雨任平生 (yī suō yān yǔ rèn píng shēng) is nearly as famous. The register is mild; it can be said in a meeting after bad news without sounding like a quotation, which is rare. 苏轼 (sū shì) is the guest at this table who says it, and he was there.", "lian": [["p", "wuxi", "范仲淹's version, from the same decade's politics"], ["p", "shuiqiong", "王维's version, no weather at all"], ["s", "equanimity", "the storm you decide not to mind"]]}}, "wuxi": {"id": "wuxi", "zh": "不以物喜，不以己悲", "segs": [["不以", "not because of", "bù yǐ"], ["物", "external things", "wù"], ["喜", "rejoice", "xǐ"], ["不以", "not because of", "bù yǐ"], ["己", "one's own circumstances", "jǐ"], ["悲", "grieve", "bēi"]], "en": "Not made glad by things, not made sad by one's own lot.", "author": "范仲淹", "work": "岳阳楼记", "era": "北宋", "note": "The definition of an 'ancient benevolent person' in the Record of Yueyang Tower. Written for a friend who had been demoted, by a man who had been demoted three times himself. Say it as a reminder, not a boast.", "ctx": null, "py": "bù yǐ wù xǐ ， bù yǐ jǐ bēi", "deep": {"zi": [["以", "yǐ", "'Because of'; 不以物喜 is 'not glad because of things'."], ["物", "wù", "External things, objects, circumstances; as opposed to 己."], ["己", "jǐ", "Oneself, one's own lot; 不以己悲 is 'not grieved because of oneself'."]], "dui": ["居庙堂之高则忧其民，处江湖之远则忧其君", "jū miào táng zhī gāo zé yōu qí mín ， chù jiāng hú zhī yuǎn zé yōu qí jūn", "High in the halls of court, he worries for the people; far in the rivers and lakes, he worries for his ruler.", "The continuation: what the ancient benevolent person does instead of being glad or sad about himself."], "dian": "The 古仁人 (gǔ rén rén) (ancient benevolent person) is the Confucian ideal official; 庙堂 (miào táng) and 江湖 (jiāng hú) as the two places of the 士 come from 庄子 (zhuāng zi). The whole 记 is built toward 先天下之忧而忧 (xiān tiān xià zhī yōu ér yōu).", "shi": "1046. 范仲淹 (fàn zhòng yān), the reforming chancellor whose 庆历新政 (qìng lì xīn zhèng) had just been reversed, was in provincial exile at 邓州 (dèng zhōu). His friend 滕子京 (téng zi jīng), also demoted, had rebuilt the 岳阳楼 (yuè yáng lóu) on 洞庭 (dòng tíng) lake and sent him a painting, asking for a commemorative essay. 范仲淹 (fàn zhòng yān) had never seen the tower. He wrote the essay from the painting.", "chuan": "The most quoted definition of composure in Chinese public life, in every civics textbook. Its use has a hazard: it sounds like a boast about oneself. It is safer as a reminder than as a claim.", "lian": [["p", "wufengyu", "苏轼's version, a generation later, in the rain"], ["p", "xiantianxia", "the same essay's famous last line"], ["p", "yidanshi", "颜回, who did not change"]]}}, "zhiji": {"id": "zhiji", "zh": "海内存知己，天涯若比邻", "segs": [["海内", "within the four seas, the whole world", "hǎi nèi"], ["存", "there exists", "cún"], ["知己", "someone who truly knows me", "zhī jǐ"], ["天涯", "the sky's edge", "tiān yá"], ["若", "is like", "ruò"], ["比邻", "next door", "bǐ lín"]], "en": "As long as there is one who knows me anywhere in the world, the sky's edge is next door.", "author": "王勃", "work": "送杜少府之任蜀州", "era": "唐", "note": "The parting line of the Tang. Wang Bo, who died at twenty-six, wrote it for a friend leaving for a post in Sichuan. The next couplet tells them not to weep at the fork in the road like children. Say it to someone moving abroad.", "ctx": ["无为在歧路，儿女共沾巾", "wú wéi zài qí lù ， ér nǚ gòng zhān jīn", "Do not stand at the fork in the road wetting your handkerchiefs like boy and girl."], "py": "hǎi nèi cún zhī jǐ ， tiān yá ruò bǐ lín", "deep": {"zi": [["海内", "hǎi nèi", "Within the seas: the ancient Chinese picture of the world as land ringed by four seas. So, 'in the world'."], ["知己", "zhī jǐ", "One who knows me; the word for the friend who understands. 士为知己者死 (史记) is the extreme of it."], ["比邻", "bǐ lín", "邻 is neighbour; 比 is 'adjacent'. Next door."]], "dui": ["无为在歧路，儿女共沾巾", "wú wéi zài qí lù ， ér nǚ gòng zhān jīn", "Do not, at the fork in the road, wet your handkerchiefs together like children.", "The final couplet: brace, do not weep."], "dian": "曹植 (cáo zhí), 赠白马王彪 (zèng bái mǎ wáng biāo): 丈夫志四海 (zhàng fū zhì sì hǎi)，万里犹比邻 (wàn lǐ yóu bǐ lín), 'a man's will spans the four seas; ten thousand li is still next door'. 王勃 (wáng bó) tightened it and made 知己 (zhī jǐ) the condition. The reworking is the classic case of a Tang poet improving a 建安 (jiàn ān) line.", "shi": "Early 670s, Chang'an. 杜少府 (dù shào fǔ) (a minor official surnamed Du) was leaving for a post in Sichuan. 王勃 (wáng bó), one of the 初唐四杰 (chū táng sì jié), was about twenty, brilliant, and would drown at twenty-six returning from visiting his exiled father.", "chuan": "The farewell line of the language, in every graduation card and expatriate speech. The opening couplet, 城阙辅三秦 (chéng què fǔ sān qín)，风烟望五津 (fēng yān wàng wǔ jīn), is the grand setting most people forget. Say it when someone moves abroad; the four characters 天涯比邻 (tiān yá bǐ lín) are enough in conversation.", "lian": [["p", "guanshan", "the last couplet of the same poem"], ["p", "mochou", "高适's warmer version"], ["p", "danrushui", "the friendship that does not need distance closed"]]}}, "mochou": {"id": "mochou", "zh": "莫愁前路无知己，天下谁人不识君", "segs": [["莫愁", "do not worry", "mò chóu"], ["前路", "the road ahead", "qián lù"], ["无知己", "has no one who knows you", "wú zhī jǐ"], ["天下", "under heaven, everywhere", "tiān xià"], ["谁人", "who", "shuí rén"], ["不识君", "does not know you", "bù shí jūn"]], "en": "Do not fear that the road ahead has no one who knows you; who under heaven does not know your name?", "author": "高适", "work": "别董大·其一", "era": "唐", "note": "Gao Shi was broke and unknown when he wrote this for a departing musician friend who was also broke. Two poor men encouraging each other. Warmer and more boosting than 海内存知己. Say it to someone leaving to try something ambitious.", "ctx": null, "py": "mò chóu qián lù wú zhī jǐ ， tiān xià shuí rén bù shí jūn", "deep": {"zi": [["莫愁", "mò chóu", "Do not worry. 莫 is the classical negative imperative."], ["知己", "zhī jǐ", "The friend who knows you; the same word as in 王勃's line, which 高适 is answering."], ["谁人", "shuí rén", "Who; 人 is a filler for the metre."], ["识君", "shí jūn", "识 as 'know, recognise'; 君 as 'you', respectful."]], "dui": ["千里黄云白日曛，北风吹雁雪纷纷", "qiān lǐ huáng yún bái rì xūn ， běi fēng chuī yàn xuě fēn fēn", "A thousand li of yellow cloud dim the white sun; north wind, geese, snow falling thick.", "The opening couplet: a cold, poor, northern parting."], "dian": "Answers 王勃 (wáng bó)'s 海内存知己 (hǎi nèi cún zhī jǐ) across sixty years. Where 王勃 (wáng bó) promises one friend anywhere, 高适 (gāo shì) promises fame everywhere. 董大 (dǒng dà) was 董庭兰 (dǒng tíng lán), a famous 琴 player; the compliment is that a musician that good will be known wherever he goes.", "shi": "747, winter, 睢阳 (suī yáng) (Henan). 高适 (gāo shì) was in his forties, penniless, not yet the general and governor he would become; 董庭兰 (dǒng tíng lán) had just lost his patron. Two broke men at a cheap farewell. The second poem of the pair says outright that neither had money for wine.", "chuan": "The warmest farewell line in Chinese, and the one to use for someone leaving to attempt something. It is quoted at graduations, on posters, and in the mouths of coaches. It is a boost, so it wants a recipient who needs one.", "lian": [["p", "zhiji", "the line it answers"], ["p", "quanjun", "王维's colder farewell, west of the pass"], ["s", "farewell", "seeing off a friend"]]}}, "qiaoyan": {"id": "qiaoyan", "zh": "巧言令色，鲜矣仁", "segs": [["巧言", "clever words", "qiǎo yán"], ["令色", "a pleasing face, an ingratiating expression", "lìng sè"], ["鲜矣", "rare indeed is", "xiǎn yǐ"], ["仁", "benevolence, real goodness", "rén"]], "en": "Clever words and a pleasing face: rarely is there goodness in them.", "author": "孔子", "work": "论语·学而", "era": "春秋", "note": "Confucius's warning about flatterers, four characters that every Chinese person recognises. When someone is being very smooth with you, this is the thought. Do not say it to their face.", "ctx": null, "py": "qiǎo yán lìng sè ， xiǎn yǐ rén", "deep": {"zi": [["巧", "qiǎo", "Skilful, ingenious. Praise in most contexts; here it curdles. The same character in 巧妙 is a compliment."], ["令色", "lìng sè", "令 means 'good, fine' (as in 令尊, your honoured father). 令色 is a fine expression, a face arranged to please."], ["鲜矣仁", "xiǎn yǐ rén", "鲜 is read xiǎn, 'rare', not xiān, 'fresh'. The order is inverted for emphasis: 'rare indeed, the benevolence' rather than 'benevolence is rare'."]], "dui": null, "dian": "Appears twice in the Analects (学而 (xué ér) and 阳货 (yáng huò)), which suggests it was a saying the school repeated. Its mirror is 刚毅木讷 (gāng yì mù nè)，近仁 (jìn rén) in 子路 (zi lù): 'firm, resolute, plain, and slow of speech: close to benevolence.' The two lines together are the Confucian theory of surfaces: fluency is suspect, awkwardness is not.", "shi": "In 学而 (xué ér), between the opening lines about learning and the passage on daily self-examination. Confucius was himself an accomplished speaker and diplomat, so this is not a preference for rudeness. It is a warning about people whose skill is aimed at you.", "chuan": "巧言令色 (qiǎo yán lìng sè) became a four-character idiom with an entirely negative charge, used for flatterers and smooth operators. The Confucian preference for 讷 (slowness of speech) shaped Chinese ideas of trustworthiness for two millennia: the man who speaks too well is still, in many rooms, the one people watch. Do not say it to someone's face; say it to yourself while they are talking.", "lian": [["p", "nayan", "the positive version: slow to speak, quick to act"], ["p", "liangyao", "honest words grate; smooth ones do not"], ["p", "manzhao", "what fullness invites"]]}}, "liangyao": {"id": "liangyao", "zh": "良药苦口利于病，忠言逆耳利于行", "segs": [["良药", "good medicine", "liáng yào"], ["苦口", "bitter in the mouth", "kǔ kǒu"], ["利于病", "benefits the illness", "lì yú bìng"], ["忠言", "loyal words, honest advice", "zhōng yán"], ["逆耳", "grate on the ear", "nì ěr"], ["利于行", "benefit one's conduct", "lì yú xíng"]], "en": "Good medicine is bitter but cures the illness; honest words grate on the ear but improve your conduct.", "author": "增广贤文", "work": "增广贤文（本自《史记》）", "era": "明清", "note": "The idea is older, from the Records of the Grand Historian, where an adviser uses it to persuade Liu Bang not to loot a captured palace. Say the second half, 忠言逆耳, when you are about to tell someone something they will not enjoy hearing, or when you have just been told.", "ctx": null, "py": "liáng yào kǔ kǒu lì yú bìng ， zhōng yán nì ěr lì yú xíng", "deep": {"zi": [["良药", "liáng yào", "Good medicine; 良 as 'fine, good'."], ["苦口", "kǔ kǒu", "Bitter in the mouth; 口 as the place of tasting."], ["忠言", "zhōng yán", "Loyal words; 忠 as the virtue of the honest adviser."], ["逆耳", "nì ěr", "Against the ear; 逆 as 'go against', the same 逆 as in 逆水行舟."]], "dui": null, "dian": "史记 (shǐ jì) 留侯世家 (liú hóu shì jiā): after 刘邦 (liú bāng) took the Qin capital he wanted to stay in the palace with its women and treasure; 樊哙 (fán kuài) argued, he refused; 张良 (zhāng liáng) said 忠言逆耳利于行 (zhōng yán nì ěr lì yú xíng)，毒药苦口利于病 (dú yào kǔ kǒu lì yú bìng), 'loyal words go against the ear and benefit conduct; poison-drugs are bitter and benefit the illness'. He moved out. Note the original says 毒药 (dú yào), poison-drugs, which in Han usage meant strong medicine; the 增广贤文 (zēng guǎng xián wén) softened it to 良药 (liáng yào) and swapped the halves.", "shi": "The 史记 (shǐ jì) scene is 206 BCE. The 增广贤文 (zēng guǎng xián wén) version is the one everyone knows; the reversal of order (medicine first, words second) makes the medicine the metaphor and the words the point.", "chuan": "The standard preface to unwelcome advice in Chinese, and the standard consolation after receiving it. 忠言逆耳 (zhōng yán nì ěr) alone is enough in speech. Say it before you tell someone something true, and mean the 忠.", "lian": [["p", "qiaoyan", "the opposite: pleasing words"], ["p", "jisuo", "what you would not want said to you"], ["s", "hard-truth", "telling or hearing it"]]}}, "xiangfeng": {"id": "xiangfeng", "zh": "人生何处不相逢", "segs": [["人生", "in life", "rén shēng"], ["何处", "where", "hé chù"], ["不", "not", "bù"], ["相逢", "meet each other", "xiāng féng"]], "en": "In this life, where do people not meet again?", "author": "增广贤文", "work": "增广贤文（亦见宋诗）", "era": "明清", "note": "The line for bumping into someone you never expected to see again. It also carries a warning in the 增广贤文 context: treat people well, because you will meet them again.", "ctx": null, "py": "rén shēng hé chù bù xiāng féng", "deep": {"zi": [["人生", "rén shēng", "In life; the phrase that opens a hundred maxims."], ["何处", "hé chù", "Where; the rhetorical 'where not'."], ["相逢", "xiāng féng", "Meet each other; 逢 as 'encounter', the same as in 每逢佳节."]], "dui": null, "dian": "The line appears in Song poetry before the 增广贤文 (zēng guǎng xián wén) collected it; 晏殊 (yàn shū) and others use 人生何处不相逢 (rén shēng hé chù bù xiāng féng) as a whole line. The maxim book paired it with a warning about not making enemies, since you will meet them again.", "shi": "Song origin, Ming-Qing circulation. It is a line of the streets and the road, not the study.", "chuan": "The thing to say when you run into someone on the other side of the world; universally understood and always a pleasure. Its second life, as a warning to treat people well because paths recross, is worth remembering in a small industry.", "lian": [["p", "youpeng", "the friend who arrives on purpose"], ["p", "ertong", "the return where no one recognises you"], ["s", "old-friend", "the café on the other side of the world"]]}}, "youpeng": {"id": "youpeng", "zh": "有朋自远方来，不亦乐乎", "segs": [["有朋", "to have a friend", "yǒu péng"], ["自远方来", "come from afar", "zì yuǎn fāng lái"], ["不亦", "is it not", "bù yì"], ["乐乎", "a joy", "lè hū"]], "en": "To have a friend come from afar, is that not a joy?", "author": "孔子", "work": "论语·学而", "era": "春秋", "note": "The second sentence of the Analects, so the second thing Confucius says in the book that defines him. Say it when a friend visits from far away. Everyone will recognise it and it always lands.", "ctx": null, "py": "yǒu péng zì yuǎn fāng lái ， bù yì lè hū", "deep": {"zi": [["朋", "péng", "In early usage 朋 meant fellow students of the same teacher, people bound by shared learning, rather than friends in general. The friend from afar is a colleague in the Way."], ["自", "zì", "'From' as a preposition. In modern Chinese 从 does this job; 自 survives in fixed phrases like 自古."], ["乐", "lè", "Read lè, joy shown outwardly, as opposed to 说 (yuè) in the previous sentence, an inner pleasure. The distinction is deliberate: learning pleases inwardly, friends gladden visibly."]], "dui": ["学而时习之，不亦说乎", "xué ér shí xí zhī ， bù yì yuè hū", "To learn and practise at the right time, is that not a pleasure?", "The line before it. Learning is the private half; the friend arriving is the shared half."], "dian": "None earlier. It became the source for a whole etiquette of welcome; Chinese hosts still quote it at the door.", "shi": "Second sentence of the Analects. Confucius's school drew students from several states, so a 朋 arriving 自远方 (zì yuǎn fāng) was a real event: weeks of travel to sit with a teacher.", "chuan": "The most quoted line of welcome in the language, used on banners at conferences and in speeches by officials greeting foreign delegations. Because it is so worn, saying it to an actual friend at an actual door restores it. The tone is light; do not deliver it as a proverb.", "lian": [["p", "buyun", "the next sentence"], ["p", "xiangfeng", "meeting again by chance rather than by visit"], ["p", "danrushui", "the friend who does not need the visit"]]}}, "jianxian": {"id": "jianxian", "zh": "见贤思齐焉，见不贤而内自省也", "segs": [["见贤", "see a worthy person", "jiàn xián"], ["思齐", "think of equalling them", "sī qí"], ["焉", "(particle: in that case)", "yān"], ["见不贤", "see an unworthy person", "jiàn bù xián"], ["而", "and", "ér"], ["内自省", "look inward and examine yourself", "nèi zì xǐng"], ["也", "(sentence-final particle)", "yě"]], "en": "Seeing a worthy person, think of matching them; seeing an unworthy one, examine yourself.", "author": "孔子", "work": "论语·里仁", "era": "春秋", "note": "The first four characters, 见贤思齐, are the everyday form. The second half is the part people forget: a bad example is also a mirror. Say it when someone much better than you at something walks in.", "ctx": null, "py": "jiàn xián sī qí yān ， jiàn bù xián ér nèi zì xǐng yě", "deep": {"zi": [["贤", "xián", "Worthy, virtuous and capable together. 贤 is what you should be, 圣 (sage) is what almost no one is."], ["思齐", "sī qí", "齐 is 'level, equal'; 思齐 is to think of drawing level. Not envy, not admiration: the intention to close the gap."], ["内自省", "nèi zì xǐng", "省 read xǐng, to examine. 内 (inward) and 自 (self) both point the same way, a doubling that makes the turn inward emphatic."]], "dui": null, "dian": "No earlier source. It is the compact form of a method that runs through the Analects: the teacher is whoever is in front of you.", "shi": "From 里仁 (lǐ rén), the chapter on benevolence as a place to live. The sayings around it are mostly about the 君子 (jūn zǐ) and the 小人 (xiǎo rén) as two kinds of person; this one refuses the split. Worthy and unworthy are both useful.", "chuan": "见贤思齐 (jiàn xián sī qí) is the four-character idiom and it is common; the second half is quoted far less, which loses the point. 曾子 (zēng zǐ)'s 吾日三省吾身 (wú rì sān xǐng wú shēn) ('I examine myself three times a day', also in the Analects) is the same 省. Chinese schools put 见贤思齐 (jiàn xián sī qí) on walls. Say it about a specific person and it stops being a wall slogan.", "lian": [["p", "sanren", "the same method with three people and a road"], ["p", "jishengyu", "what happens when 思齐 fails and turns to envy"], ["p", "zhizhi", "knowing the gap is the first step to closing it"]]}}, "sanren": {"id": "sanren", "zh": "三人行，必有我师焉", "segs": [["三人行", "when three people walk together", "sān rén xíng"], ["必", "surely", "bì"], ["有我师", "there is my teacher", "yǒu wǒ shī"], ["焉", "among them", "yān"]], "en": "When three people walk together, one of them is surely my teacher.", "author": "孔子", "work": "论语·述而", "era": "春秋", "note": "The continuation says: pick out what is good in them and follow it, what is bad and correct it in yourself. It is not modesty; it is a method. Say it about anyone you learned something from unexpectedly.", "ctx": ["择其善者而从之，其不善者而改之", "zé qí shàn zhě ér cóng zhī ， qí bù shàn zhě ér gǎi zhī", "Choose what is good in them and follow it; what is not good, change in yourself."], "py": "sān rén xíng ， bì yǒu wǒ shī yān", "deep": {"zi": [["三人行", "sān rén xíng", "三 in classical Chinese often means 'several' rather than exactly three. Any small group walking together."], ["师", "shī", "Teacher, and also 'to take as a teacher'. The claim is that the role of teacher is available in anyone."], ["焉", "yān", "Read yān; here 'among them, therein'. It closes the sentence and points back at the group."]], "dui": ["择其善者而从之，其不善者而改之", "zé qí shàn zhě ér cóng zhī ， qí bù shàn zhě ér gǎi zhī", "Choose what is good in them and follow it; what is not good, correct in yourself.", "The continuation, which turns the saying from humility into procedure: sort, copy, correct."], "dian": "韩愈 (hán yù) built his essay 师说 (shī shuō) (Discourse on Teachers, 802) on this line: 圣人无常师 (shèng rén wú cháng shī), 'the sage has no fixed teacher', citing Confucius learning from 郯子 (tán zi), 苌弘 (cháng hóng), 师襄 (shī xiāng) and 老聃 (lǎo dān), and concluding 弟子不必不如师 (dì zǐ bù bì bù rú shī)，师不必贤于弟子 (shī bù bì xián yú dì zǐ): the student need not be inferior to the teacher, nor the teacher wiser than the student. That essay is how the line entered the exam curriculum.", "shi": "From 述而 (shù ér), the chapter where Confucius describes his own habits and temperament. The line sits among sayings about what he himself does: transmits rather than invents, learns without tiring, teaches without wearying.", "chuan": "Universally quoted, often reduced to modesty. The original is not modest; it is a claim that you can extract a lesson from anyone if you sort properly. In a work setting it is the polite way to credit a junior colleague without making a speech.", "lian": [["p", "jianxian", "the same instruction with a worthy person instead of a group"], ["p", "wengu", "what makes someone a teacher"], ["p", "nayan", "learning by watching rather than talking"]]}}, "liuan": {"id": "liuan", "zh": "山重水复疑无路，柳暗花明又一村", "segs": [["山重水复", "mountain after mountain, stream after stream", "shān chóng shuǐ fù"], ["疑", "I suspected", "yí"], ["无路", "there was no road", "wú lù"], ["柳暗", "willows dark", "liǔ àn"], ["花明", "flowers bright", "huā míng"], ["又一村", "another village", "yòu yī cūn"]], "en": "Mountains fold on mountains, streams double back, I thought there was no road; then dark willows, bright flowers, and another village.", "author": "陆游", "work": "游山西村", "era": "南宋", "note": "The Chinese phrase for a breakthrough that comes right after you had given up. 柳暗花明 alone is now a set phrase. Say it when the bug finally reveals itself, or when a dead end turns.", "ctx": null, "py": "shān chóng shuǐ fù yí wú lù ， liǔ àn huā míng yòu yī cūn", "deep": {"zi": [["山重水复", "shān chóng shuǐ fù", "Mountains doubled, waters folded back; four characters that became an idiom for a tangled situation."], ["疑", "yí", "Suspected, doubted; the traveller's state, not a fact."], ["柳暗花明", "liǔ àn huā míng", "Willows dark, flowers bright; the idiom for a sudden opening."], ["又一村", "yòu yī cūn", "Another village; 又 as 'again, yet another'."]], "dui": ["莫笑农家腊酒浑，丰年留客足鸡豚", "mò xiào nóng jiā là jiǔ hún ， fēng nián liú kè zú jī tún", "Don't laugh at the farmers' cloudy winter wine; in a good year they keep a guest with plenty of chicken and pork.", "The opening couplet, the plain hospitality the poem walks toward."], "dian": "None specific; the village walk is real. 王维 (wáng wéi)'s 行到水穷处 (xíng dào shuǐ qióng chù) is the Tang ancestor of the road that ends and then does not.", "shi": "1167. 陆游 (lù yóu) had been dismissed from office the year before for advocating war against the 金 (the poem's title, 游山西村 (yóu shān xī cūn), is a walk in the village west of the mountain, near his home at 山阴 (shān yīn), Shaoxing). He was forty-two and would live to eighty-five, writing nearly ten thousand poems, most of them about wanting to recover the north.", "chuan": "柳暗花明 (liǔ àn huā míng) is one of the most used idioms for a breakthrough, in business, in research, in politics. The full couplet is quoted when a dead end turns. 陆游 (lù yóu) wrote it in the middle of a career that was itself a dead end, which is worth knowing when you say it.", "lian": [["p", "zhongli", "辛弃疾's version, the sudden turn of the head"], ["p", "shuiqiong", "王维's road that ends without anxiety"], ["s", "breakthrough", "after the dead end"]]}}, "zhongli": {"id": "zhongli", "zh": "众里寻他千百度，蓦然回首，那人却在，灯火阑珊处", "segs": [["众里", "in the crowd", "zhòng lǐ"], ["寻他", "searched for her", "xún tā"], ["千百度", "a thousand, a hundred times", "qiān bǎi dù"], ["蓦然", "suddenly", "mò rán"], ["回首", "turn my head", "huí shǒu"], ["那人", "that person", "nà rén"], ["却在", "was instead", "què zài"], ["灯火阑珊处", "where the lanterns were dim and few", "dēng huǒ lán shān chù"]], "en": "In the crowd I searched for her a thousand times; suddenly I turned, and there she was, where the lanterns were dim.", "author": "辛弃疾", "work": "青玉案·元夕", "era": "南宋", "note": "Set on the Lantern Festival. The scholar 王国维 made this the third of his three stages of any great achievement: you search everywhere, and the thing you wanted was quietly behind you. Say it when the answer turns out to have been in plain sight.", "ctx": null, "py": "zhòng lǐ xún tā qiān bǎi dù ， mò rán huí shǒu ， nà rén què zài ， dēng huǒ lán shān chù", "deep": {"zi": [["众里", "zhòng lǐ", "In the crowd; 众 as 'the many'."], ["千百度", "qiān bǎi dù", "A thousand, a hundred times; 度 as the measure word for occasions."], ["蓦然", "mò rán", "Read mò rán, suddenly, unexpectedly; a word almost only used in this line now."], ["阑珊", "lán shān", "Read lán shān, fading, dwindling; of lamps burning low, of a party ending, of spring."]], "dui": ["东风夜放花千树，更吹落、星如雨", "dōng fēng yè fàng huā qiān shù ， gèng chuī luò 、 xīng rú yǔ", "The east wind at night opens a thousand trees of flowers, and blows down stars like rain.", "The opening: the Lantern Festival fireworks and lanterns as flowers and falling stars."], "dian": "王国维 (wáng guó wéi), in 人间词话 (rén jiān cí huà) (1908), made this the third of three stages every great achievement passes through: first 晏殊 (yàn shū)'s 昨夜西风凋碧树 (zuó yè xī fēng diāo bì shù)，独上高楼 (dú shàng gāo lóu)，望尽天涯路 (wàng jǐn tiān yá lù) (the lonely survey), then 柳永 (liǔ yǒng)'s 衣带渐宽终不悔 (yī dài jiàn kuān zhōng bù huǐ) (the grind), then this (the sudden finding). That reading has become as famous as the poem.", "shi": "Around 1174, 临安 (lín ān) (Hangzhou), the Southern Song capital. 辛弃疾 (xīn qì jí) was a northerner who had led a cavalry raid into a 金 camp at twenty-two and spent the rest of his life being denied a war. The woman in the dim lanterns is read as his own unfashionable integrity, or as a woman, or both.", "chuan": "Quoted for every discovery that turns out to have been behind you: the answer, the person, the point. The 王国维 (wáng guó wéi) reading makes it a line about research, and it is used that way in Chinese science writing. Say it when the bug was in the first file you opened.", "lian": [["p", "yidai", "the second stage, the grind"], ["p", "liuan", "陆游's version of the sudden opening"], ["p", "liushao", "the same festival, the person gone"]]}}, "aicai": {"id": "aicai", "zh": "君子爱财，取之有道", "segs": [["君子", "a noble person", "jūn zǐ"], ["爱财", "loves wealth", "ài cái"], ["取之", "obtains it", "qǔ zhī"], ["有道", "by proper means, according to the Way", "yǒu dào"]], "en": "A noble person loves wealth, but takes it by the proper road.", "author": "增广贤文", "work": "增广贤文", "era": "明清", "note": "Note it does not say a good person is above money. It says the way you get it is what matters. The most practical line in Chinese business ethics. Say it when tempted by a shortcut.", "ctx": null, "py": "jūn zǐ ài cái ， qǔ zhī yǒu dào", "deep": {"zi": [["君子", "jūn zǐ", "The noble person; the maxim uses the Confucian word to bless the wanting."], ["爱财", "ài cái", "Loves wealth; 财 as money, property. The maxim's honesty is in admitting the love."], ["有道", "yǒu dào", "By the Way, by proper means; 道 in its ordinary sense of 'road, method'."]], "dui": null, "dian": "论语 (lún yǔ) 里仁 (lǐ rén): 富与贵 (fù yǔ guì)，是人之所欲也 (shì rén zhī suǒ yù yě)；不以其道得之 (bù yǐ qí dào dé zhī)，不处也 (bù chù yě), 'wealth and rank are what people desire; if not obtained by the proper way, do not dwell in them'. The maxim is that sentence made portable, with 君子爱财 (jūn zǐ ài cái) added to make the desire explicit.", "shi": "增广贤文 (zēng guǎng xián wén); the line is on the wall of many Chinese shops, sometimes beside the god of wealth, which is a fair summary of Chinese commercial ethics.", "chuan": "The most practical line about money in the language, used in business, by parents, and by anyone turning down a dirty deal. It does not ask you to be above money, only to take the right road to it. Say it whe
