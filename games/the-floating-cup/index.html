function said(pid){ const e=ST.pouch[pid]=ST.pouch[pid]||{}; e.heard=e.heard||today(); const first=!e.said; e.said=e.said||today(); e.n=(e.n||0)+1; return first; }
const saidCount=()=>Object.values(ST.pouch).filter(e=>e.said).length;
const heardCount=()=>Object.values(ST.pouch).filter(e=>e.heard).length;
const usedCount=()=>Object.keys(ST.used).length;
function rank(){ let r=0; RANKS.forEach((k,i)=>{ if(saidCount()>=k[3]&&usedCount()>=k[4]) r=i; }); return r; }
function logUse(pid){ (ST.used[pid]=ST.used[pid]||[]).push(today()); touchStreak(); save(); toast('用 · said in life'); render(); }

/* ---------- matching ---------- */
const zhOnly=s=>s.replace(/[^\u4e00-\u9fff]/g,'');
const pyFlat=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ü/g,'v').replace(/u:/g,'v').replace(/[^a-z]/g,'');
function lev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ let c=[i]; for(let j=1;j<=n;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); } p=c; } return p[n]; }
function matches(input,p){ const zi=zhOnly(input); if(zi.length){ const t=zhOnly(p.zh); if(lev(zi,t)<=Math.floor(t.length/6)) return 'exact'; if(t.includes(zi)&&zi.length>=Math.ceil(t.length*0.5)) return 'partial'; return null; } const pi=pyFlat(input); if(!pi.length) return null; const t=pyFlat(p.py); if(lev(pi,t)<=Math.floor(t.length/10)) return 'exact'; if(t.includes(pi)&&pi.length>=Math.ceil(t.length*0.5)) return 'partial'; return null; }
function localMatch(input){ for (const pid in P){ if (matches(input,P[pid])) return pid; } return null; }

/* ---------- rendering helpers ---------- */
function zhHtml(p){ let out='',k=0,i=0; for(const ch of p.zh){ if(/[\u4e00-\u9fff]/.test(ch)){ if(k===0) out+=`<span class="w" data-p="${p.id}" data-i="${i}">`; out+=ch; k++; if(k===p.segs[i][0].length){ out+='</span>'; k=0; i++; } } else out+=`<span class="p">${ch}</span>`; } return out; }
function card(p,o={}){ const e=ST.pouch[p.id]||{}; const used=(ST.used[p.id]||[]).length;
  return `<div class="card ${o.cls||''} ${e.said?'sealed':''}" id="c-${p.id}">${e.said?'<div class="seal">印</div>':''}
  <p class="zh">${zhHtml(p)}</p><p class="py">${esc(p.py)}</p><p class="en">${esc(p.en)}</p>
  <p class="src">${esc(p.author)} 《${esc(p.work)}》 ${esc(p.era)}</p>
  ${o.brief?'':`<p class="note">${esc(p.note)}</p>`}${(!o.brief&&p.ctx)?`<div class="ctx"><div class="cz">${esc(p.ctx[0])}</div><div>${esc(p.ctx[1])}</div><div>${esc(p.ctx[2])}</div></div>`:''}
  <div class="row">${e.said?`<span class="tag">said at table ${e.n}×</span>`:e.heard?`<span class="tag">heard from ${esc(e.by)}</span>`:''}${used?`<span class="tag">said in life ${used}×</span>`:''}<span style="flex:1"></span><button class="ghost" data-use="${p.id}">说过了 · said it in life</button></div></div>`; }
function extraCard(x){ return `<div class="card"><p class="zh">${esc(x.zh)}</p><p class="py">${esc(x.py)}</p><p class="en">${esc(x.en)}</p><p class="src">${esc(x.src)} · brought by you, not checked against the corpus</p></div>`; }
function header(t){ return `<h1><b>流觞</b>liú shāng · the floating cup${t?' · '+t:''}</h1>`; }
function tabsHtml(){ const T=[['banquet','宴','banquet'],['pouch','囊','pouch'],['yard','练','yard'],['rank','榜','rank']]; document.getElementById('tabs').innerHTML=T.map(t=>`<button data-tab="${t[0]}" class="${ST.tab===t[0]?'on':''}"><span class="z">${t[1]}</span><span class="e">${t[2]}</span></button>`).join(''); }

/* ---------- Claude ---------- */
const deckIndex=()=>Object.values(P).map(p=>`${p.id}|${p.zh}|${p.author}|${p.en}`).join('\n');
const SYS=`You run 流觞, a game set at a poetry banquet modelled on the Orchid Pavilion gathering of 353. The host is 王羲之. The guests are 王维, 杜甫, 苏轼, 李白, each speaking strictly in character (Wang Wei quiet and exact; Du Fu grave, dutiful, dry; Su Shi witty, warm, teasing; Li Bai loud, boastful, generous). The player is a young Singaporean scholar learning classical Chinese. Reply in English; any Chinese you include must be followed by pinyin with tone marks in parentheses. Never use em dashes. Keep every remark to one or two sentences. Never invent classical lines: guests may only speak lines from the DECK below, chosen by id. When judging, be honest and specific about fit; flattery is a fault at this table. Output only JSON, no markdown fences.\n\nDECK (id|line|author|meaning):\n${deckIndex()}`;
async function ask(user, maxTokens=900){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system:SYS,messages:[{role:'user',content:user}]})});
  if(!r.ok) throw new Error('api '+r.status);
  const d=await r.json(); const t=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const m=t.match(/\{[\s\S]*\}/); if(!m) throw new Error('nojson'); return JSON.parse(m[0]);
}
let ONLINE=true;

/* ---------- banquet state ---------- */
let B=null; // {seat, rounds:[], i, phase, cups, ya, scene, wi, cupAt, judge, guest, timer, input, opening}
const ROUNDS=8;
function pickScene(seat, usedScenes){
  const g=GUESTS[seat]; const pref=g.scenes.filter(s=>!usedScenes.includes(s));
  const unsaid=pref.filter(s=>SCI[s].p.some(p=>!(ST.pouch[p]||{}).said));
  const pool=unsaid.length?unsaid:pref.length?pref:SC.map(s=>s.id).filter(s=>!usedScenes.includes(s));
  return rnd(pool);
}
function startBanquet(seat, yu){
  const plan=shuffle([...Array(ROUNDS).keys()]).slice(0,2); // rounds where the cup stops at a guest
  B={seat, i:0, cups:0, ya:0, plan, usedScenes:[], phase:'opening', yu:(yu||'').trim(), log:[], opening:null, custom:null};
  touchStreak();
  render();
  openBanquet();
}
async function openBanquet(){
  const seat=B.seat; let op=null;
  if (ONLINE && (B.yu || ST.lastSummary)){
    try{ op=await ask(`OPENING. The player sits beside ${seat}. ${ST.lastSummary?'Memory of the last banquet: '+ST.lastSummary+'. Let the host or a guest allude to it in one clause.':''} ${B.yu?`The player says this happened to them today: "${B.yu.replace(/"/g,"'")}". Turn it into the first scene of the night: a one-line scene the host announces (second person, plain English, no Chinese), and choose 2 to 4 deck ids that genuinely fit it. If nothing in the deck fits, choose the closest and say so in the host line.`:'No scene needed from you.'}\nReturn JSON: {"host_line": string, ${B.yu?'"scene_title": string, "scene_text": string, "candidates": [ids], ':''}"guest_aside": string (one sentence from ${seat}, in character)}`,700); }
    catch(e){ ONLINE=false; }
  }
  if (!op) op={host_line: B.yu?`The stream is running. Tonight's first cup carries what you brought with you.`:`The stream is running. When the cup stops in front of you, the scene is yours.`, guest_aside: rnd(GUESTS[seat].canned)};
  if (op.candidates && op.candidates.length){ const ids=op.candidates.filter(id=>P[id]); if(ids.length) B.custom={id:'_yu',fam:'遇',title:op.scene_title||'What happened to you today',w:[op.scene_text||B.yu],p:ids,chips:[]}; }
  B.opening=op; B.phase='table'; render();
}
function nextRound(){
  if (B.cups>=3){ endBanquet(true); return; }
  if (B.i>=ROUNDS){ endBanquet(false); return; }
  const toGuest=B.plan.includes(B.i);
  let sc; if (B.custom && B.i===0 && !toGuest){ sc=B.custom; } else { const id=pickScene(B.seat,B.usedScenes); sc=SCI[id]; B.usedScenes.push(id); }
  B.scene=sc; B.wi=Math.floor(Math.random()*sc.w.length); B.judge=null; B.guest=null; B.input='';
  B.cupAt = toGuest ? rnd(GNAMES.filter(g=>g!==B.seat)) : 'you';
  B.phase='floating'; render();
  floatCup(B.cupAt, ()=>{ B.phase = toGuest?'guestturn':'yourturn'; render(); if(toGuest) guestOnly(); else startTimer(); });
}
function endBanquet(carried){
  clearInterval(B.timer);
  const rec={date:today(),seat:B.seat,ya:B.ya,cups:B.cups,carried,rounds:B.i}; ST.banquets.push(rec); ST.ya+=B.ya; if(carried) ST.face++;
  ST.lastSummary = carried ? `the player drank three cups beside ${B.seat} and was carried out after ${B.i} rounds` : `the player finished ${B.i} rounds beside ${B.seat} with ${B.ya} 雅 and ${B.cups} cup${B.cups===1?'':'s'} of penalty wine`;
  B.phase='end'; B.carried=carried; save(); render();
}
function startTimer(){ const secs=GUESTS[B.seat].secs; const t0=Date.now(); clearInterval(B.timer); B.timer=setInterval(()=>{ const bar=document.getElementById('tbar'); const r=1-(Date.now()-t0)/(secs*1000); if(r<=0){ clearInterval(B.timer); if(B.phase==='yourturn') submit('', true); } else if(bar) bar.style.width=(r*100)+'%'; },150); }
async function submit(val, timedOut){
  clearInterval(B.timer); B.input=val; B.phase='judging'; render();
  const sc=B.scene, seat=B.seat, w=sc.w[B.wi];
  const cands=sc.p.map(id=>`${id}|${P[id].zh}`).join('\n');
  let res=null;
  if (ONLINE && !timedOut && val){
    try{ res=await ask(`ROUND. Scene announced by the host: "${w}". Deck lines that fit this scene: \n${cands}\nThe player answered (characters or pinyin, tones optional, small typos allowed): "${val.replace(/"/g,"'")}".\nJudge: apt 3 = a genuine classical line that fits the scene well; 2 = fits but loosely or tonally off; 1 = a genuine classical line that does not fit; 0 = not a recognisable classical line, or gibberish. If it matches a deck line, give match_id. If it is a genuine classical line NOT in the deck and you are certain of its exact wording and source, give recognized {zh, py, en, src}; otherwise null. comment: the host ${HOST} in one or two sentences, specific about fit, may quote the player's line. reaction: a 4-character Chinese phrase for the table's response with pinyin in parentheses (e.g. 满座称善 for apt 3, silence for 0). Then ${seat} answers the same scene with a different deck line from the list above (never the one the player just said; if none left, pick the closest deck line from the whole DECK) and says in character why it fits, in one or two sentences, adding one concrete detail about the line or its author.\nReturn JSON: {"judge":{"apt":0-3,"match_id":id|null,"recognized":{...}|null,"comment":string,"reaction":string},"guest":{"name":"${seat}","phrase_id":id,"remark":string}}`); }
    catch(e){ ONLINE=false; }
  }
  if (!res){
    let apt=0, match=null;
    if (val){ match=sc.p.find(id=>matches(val,P[id])); if(match) apt=matches(val,P[match])==='exact'?3:2; else { const any=localMatch(val); if(any){ match=any; apt=1; } } }
    const comments={3:'That is the line. The table is with you.',2:'It fits, though you only gave part of it. Say the whole line next time.',1:'A real line, but not for this scene. Drink.',0:timedOut?'The cup has floated past. Drink.':val?'The host does not recognise that. Drink.':'You let the cup pass. Drink.'};
    const others=sc.p.filter(id=>id!==match); const gp=others.length?rnd(others):rnd(Object.keys(P));
    res={judge:{apt,match_id:match,recognized:null,comment:comments[apt],reaction:apt===3?'满座称善 (mǎn zuò chēng shàn)':apt===2?'有人颔首 (yǒu rén hàn shǒu)':'……'},guest:{name:seat,phrase_id:gp,remark:rnd(GUESTS[seat].canned)}};
  }
  // apply
  const j=res.judge||{apt:0}; j.apt=Math.max(0,Math.min(3,+j.apt||0));
  if (j.match_id && P[j.match_id]){ if (j.apt>=2){ const first=said(j.match_id); j.first=first; } else heard(j.match_id, 'yourself'); }
  else if (j.recognized && j.recognized.zh){ const id='x'+zhOnly(j.recognized.zh).slice(0,6); ST.extra[id]=Object.assign({},j.recognized,{date:today(),apt:j.apt}); j.extra_id=id; }
  if (j.apt>=3) B.ya+=2; else if (j.apt===2) B.ya+=1; else B.cups++;
  let g=res.guest||{}; if(!g.phrase_id||!P[g.phrase_id]||g.phrase_id===j.match_id){ const o=sc.p.filter(id=>id!==j.match_id); g.phrase_id=o.length?rnd(o):rnd(Object.keys(P)); } g.name=GNAMES.includes(g.name)?g.name:seat; if(!g.remark) g.remark=rnd(GUESTS[g.name].canned);
  heard(g.phrase_id, g.name);
  B.judge=j; B.guest=g; B.log.push({scene:sc.title,apt:j.apt}); B.i++; B.phase='judged'; save(); render();
}
async function guestOnly(){
  const sc=B.scene, who=B.cupAt, w=sc.w[B.wi]; let g=null;
  const cands=sc.p.map(id=>`${id}|${P[id].zh}`).join('\n');
  if (ONLINE){ try{ const r=await ask(`GUEST ROUND. The cup stopped in front of ${who}. Scene: "${w}". Deck lines that fit:\n${cands}\n${who} answers with one of these lines and explains in character, in one or two sentences, why it fits, with one concrete detail about the line. Return JSON: {"guest":{"name":"${who}","phrase_id":id,"remark":string}}`,500); g=r.guest; }catch(e){ ONLINE=false; } }
  if (!g||!P[g.phrase_id]) g={name:who,phrase_id:rnd(sc.p),remark:rnd(GUESTS[who].canned)};
  heard(g.phrase_id, who); B.guest=g; B.judge=null; B.log.push({scene:sc.title,apt:null}); B.i++; B.phase='judged'; save(); render();
}

/* ---------- the stream ---------- */
const SEATPOS={'王维':0.16,'杜甫':0.36,'苏轼':0.56,'李白':0.76,'you':0.94};
function streamSvg(){
  const order=GNAMES.filter(g=>g!==B.seat).concat([B.seat,'you']); // seat neighbour sits next to you
  const pos={}; order.forEach((n,i)=>pos[n]=[0.14,0.34,0.54,0.74,0.92][i]);
  B.pos=pos;
  return `<svg class="stream" viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg" aria-label="the winding stream">
  <path id="strm" d="M10,40 C60,10 90,90 140,70 S210,20 250,60 S320,120 350,95" fill="none" stroke="var(--water)" stroke-width="14" stroke-linecap="round"/>
  <path d="M10,40 C60,10 90,90 140,70 S210,20 250,60 S320,120 350,95" fill="none" stroke="var(--water2)" stroke-width="1.5" stroke-dasharray="3 6" opacity=".7"/>
  ${order.map(n=>{ const pt=ptAt(pos[n]); const you=n==='you'; return `<text class="s ${you?'you':''}" x="${pt.x}" y="${pt.y+ (pt.side>0?26:-16)}" text-anchor="middle">${you?'你':n}</text>`; }).join('')}
  <g id="cupg" transform="translate(${ptAt(B.cupPos||0.02).x},${ptAt(B.cupPos||0.02).y})"><path d="M-7,-3 L7,-3 L5,5 L-5,5 Z" fill="#fff" stroke="var(--ink)" stroke-width="1.3"/><ellipse cx="0" cy="-3" rx="7" ry="2.2" fill="var(--seal)" opacity=".85"/></g>
  </svg>`;
}
let PATHEL=null;
function ptAt(f){ if(!PATHEL){ const ns='http://www.w3.org/2000/svg'; const sv=document.createElementNS(ns,'svg'); PATHEL=document.createElementNS(ns,'path'); PATHEL.setAttribute('d','M10,40 C60,10 90,90 140,70 S210,20 250,60 S320,120 350,95'); sv.appendChild(PATHEL); sv.style.position='absolute'; sv.style.width='0'; sv.style.height='0'; document.body.appendChild(sv); } const L=PATHEL.getTotalLength(); const p=PATHEL.getPointAtLength(f*L); const p2=PATHEL.getPointAtLength(Math.min(L,(f+0.02)*L)); const side = (p2.x-p.x)*(0-p.y) - (p2.y-p.y)*(0-p.x) > 0 ? 1 : -1; return {x:p.x,y:p.y,side}; }
function floatCup(target, done){
  const g=document.getElementById('cupg'); const f=B.pos[target]; const L=PATHEL.getTotalLength(); const f0=B.cupPos||0.02; B.cupPos=f;
  if (REDUCED||!g){ if(g){ const p=PATHEL.getPointAtLength(f*L); g.setAttribute('transform',`translate(${p.x},${p.y})`); } setTimeout(done,300); return; }
  const dur=1800+f*1400, t0=performance.now();
  const ease=t=>1-Math.pow(1-t,3);
  function step(now){ const t=Math.min(1,(now-t0)/dur); const ff=f0+(f-f0)*ease(t); const p=PATHEL.getPointAtLength(ff*L); const bob=Math.sin(now/120)*1.5; g.setAttribute('transform',`translate(${p.x},${p.y+bob}) rotate(${Math.sin(now/200)*6})`); if(t<1) requestAnimationFrame(step); else setTimeout(done,350); }
  requestAnimationFrame(step);
}

/* ---------- banquet render ---------- */
let seatPick=null;
function renderBanquet(){
  if (!B||B.phase==='lobby'){
    const last=ST.banquets.slice(-1)[0];
    return header()+`<p class="prompt" style="font-size:18px">Choose a seat.</p>
    <p class="small">The cup floats down the stream and stops in front of someone. If it is you, the host names a scene and you answer with a classical line. A good line earns 雅 (yǎ, refinement). A poor one, or silence, earns a cup of 罚酒 (fá jiǔ, penalty wine). Three cups and you are carried out. Whoever sits beside you answers every scene too; their lines go into your 锦囊.</p>
    <div class="seats">${GNAMES.map(n=>{ const g=GUESTS[n]; return `<button class="seat ${seatPick===n?'on':''}" data-seat="${n}"><span class="d">${g.secs}s · ${g.diff}</span><b>${n}</b><i>${g.py} · ${g.era}</i><p>${g.desc}</p></button>`; }).join('')}</div>
    <p class="cue">遇 · what happened to you today (optional)</p>
    <textarea id="yu" placeholder="e.g. my friend from CMU flies to London tomorrow, or: it rained all afternoon and I did nothing">${esc(B&&B.yuDraft||'')}</textarea>
    <p class="small" style="margin-top:6px">The host turns this into the first scene of the night, so the first cup carries your own day.</p>
    <div class="row"><button class="primary" id="start" ${seatPick?'':'disabled'}>Sit down</button>${last?`<span class="small">Last banquet: ${last.carried?'carried out':last.ya+' 雅'} beside ${last.seat}</span>`:''}</div>`;
  }
  const g=GUESTS[B.seat];
  const top=`<div class="top"><span>Beside ${B.seat} · round ${Math.min(B.i+1,ROUNDS)} of ${ROUNDS} · 雅 ${B.ya}</span><span class="cups">${[0,1,2].map(i=>`<i class="cup ${i<B.cups?'full':''}"></i>`).join('')}</span></div>`;
  if (B.phase==='opening') return header()+top+streamSvg()+`<p class="wait">The guests are settling</p>`;
  if (B.phase==='end'){
    const s=saidCount();
    return header()+top+`<p class="prompt" style="margin-top:14px">${B.carried?'Carried out.':'The stream runs dry.'}</p>
    <div class="host"><b>${HOST}:</b> ${B.carried?'Three cups. Our friend has been helped to the door with great courtesy. The table will remember.':`${B.ya} 雅 over ${B.i} rounds, ${B.cups} cup${B.cups===1?'':'s'} of penalty wine. ${B.ya>=12?'A good night.':B.ya>=6?'Respectable.':'You stayed upright, which is something.'}`}</div>
    <div class="stat"><div><b>${B.ya}</b><span>雅 tonight</span></div><div><b>${B.log.filter(l=>l.apt!=null&&l.apt>=2).length}</b><span>lines you produced</span></div><div><b>${s}/${Object.keys(P).length}</b><span>锦囊 said</span></div></div>
    <p class="small">${B.log.map(l=>`${esc(l.scene)}: ${l.apt==null?'guest':['cup','cup','fit','apt'][l.apt]}`).join(' · ')}</p>
    <div class="row"><button class="primary" id="again">Another banquet</button><button data-tab="pouch">Open the 锦囊</button></div>`;
  }
  const sc=B.scene, w=sc?sc.w[B.wi]:'';
  let body='';
  if (B.phase==='table'){
    body=`<div class="host"><b>${HOST}:</b> ${esc(B.opening.host_line)}</div>${B.opening.guest_aside?`<div class="host guest"><b>${B.seat}:</b> ${esc(B.opening.guest_aside)}</div>`:''}<div class="row"><button class="primary" id="float">Float the cup</button></div>`;
  } else if (B.phase==='floating'){
    body=`<p class="wait">The cup is drifting</p>`;
  } else if (B.phase==='yourturn'){
    const hint=g.hint==='author'?`<p class="hint">Hint from ${B.seat}: ${sc.p.map(id=>P[id].author).filter((v,i,a)=>a.indexOf(v)===i).join(' / ')}</p>`:'';
    body=`<p class="cue">${sc.fam} · the host says</p><p class="prompt">${esc(w)}</p><div class="timer"><i id="tbar"></i></div>${hint}
    <input id="ans" placeholder="a classical line, characters or pinyin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row"><button class="primary" id="say">Say it</button><button class="ghost" id="pass">Drink instead</button></div>`;
  } else if (B.phase==='guestturn'){
    body=`<p class="cue">${sc.fam} · the host says, to ${B.cupAt}</p><p class="prompt">${esc(w)}</p><p class="wait">${B.cupAt} is thinking</p>`;
  } else if (B.phase==='judging'){
    body=`<p class="cue">${sc.fam} · the host says</p><p class="prompt">${esc(w)}</p><p class="small">You said: ${esc(B.input)||'nothing'}</p><p class="wait">The host is weighing it</p>`;
  } else if (B.phase==='judged'){
    const j=B.judge, gu=B.guest;
    let judge='';
    if (j){
      const cls=j.apt>=2?'good':'bad';
      judge=`<p class="small">You said: ${esc(B.input)||'nothing'}</p><div class="react ${cls}">${esc(j.reaction||'')}<small>${j.apt===3?'+2 雅':j.apt===2?'+1 雅':'罚酒 · one cup'}</small></div>
      <div class="host"><b>${HOST}:</b> ${esc(j.comment)}</div>
      ${j.match_id&&P[j.match_id]?card(P[j.match_id],{brief:true,cls:j.first?'pulse':''}):j.extra_id?extraCard(ST.extra[j.extra_id]):''}
      ${j.first?'<p class="small" style="color:var(--seal)">印 · first time you produced this line at the table. It is in the 锦囊.</p>':''}`;
    }
    const gp=P[gu.phrase_id]; const ge=ST.pouch[gu.phrase_id]||{};
    const guest=`<p class="cue">${gu.name} answers the same scene</p><div class="host guest"><b>${gu.name}:</b> ${esc(gu.remark)}</div>${card(gp,{brief:false,cls:ge.said?'':'dim'})}${ge.said?'':'<p class="small">Heard, not yet said. It sits in the 锦囊 as a gap until you produce it at the table.</p>'}`;
    const nxt = B.cups>=3?'Be carried out':B.i>=ROUNDS?'Finish the night':'Float the cup';
    body=`<p class="cue">${sc.fam} · the host said</p><p class="prompt" style="font-size:18px">${esc(w)}</p>${judge}${guest}<div class="row"><button class="primary" id="next">${nxt}</button></div>`;
  }
  return header()+top+streamSvg()+body;
}

/* ---------- pouch ---------- */
let openP=null, pouchView='景';
function renderPouch(){
  if (pouchView==='景') return renderPouchScenes();
  const byA={}; Object.values(P).forEach(p=>(byA[p.author]=byA[p.author]||[]).push(p));
  const authors=Object.keys(byA).sort((a,b)=>{ const sa=byA[a].filter(p=>(ST.pouch[p.id]||{}).said).length, sb=byA[b].filter(p=>(ST.pouch[p.id]||{}).said).length; return (sb-sa)||(byA[b].length-byA[a].length); });
  const extras=Object.entries(ST.extra);
  return header('锦囊')+viewToggle()+`<p class="small">李贺 (Lǐ Hè) rode out each morning with a brocade pouch and dropped every line he thought of into it. This is yours. Grey lines you have heard at the table; dashes are lines the guests have not said yet; the seal 印 means you produced it yourself.</p>
  <div class="stat"><div><b>${saidCount()}</b><span>said 印</span></div><div><b>${heardCount()-saidCount()}</b><span>heard</span></div><div><b>${Object.keys(P).length-heardCount()}</b><span>gaps</span></div></div>
  ${authors.map(a=>{ const ps=byA[a]; const s=ps.filter(p=>(ST.pouch[p.id]||{}).said).length; return `<div class="grp"><div class="h"><span>${esc(a)}</span><span>${s}/${ps.length}</span></div>${ps.map(p=>{ const e=ST.pouch[p.id]||{}; if(!e.heard) return `<div class="pline gap"><span>${'—'.repeat(Math.min(12,zhOnly(p.zh).length))}</span><small>${esc(p.work)}</small></div>`; return `<div class="pline ${e.said?'':'heard'}" data-open="${p.id}"><span>${esc(p.zh)}${e.said?'<span class="sl">印</span>':''}</span><small>${e.said?'said':'heard from '+esc(e.by)}</small></div>${openP===p.id?card(p):''}`; }).join('')}</div>`; }).join('')}
  ${extras.length?`<h2>Lines you brought yourself</h2>${extras.map(([id,x])=>extraCard(x)).join('')}`:''}`;
}

function viewToggle(){ return `<div class="seg"><button data-pv="景" class="${pouchView==='景'?'on':''}">景 by scene</button><button data-pv="人" class="${pouchView==='人'?'on':''}">人 by poet</button></div>`; }
let pouchFam='情';
function renderPouchScenes(){
  const fams=[['情','feelings'],['事','scenarios'],['物','things']];
  const list=SC.filter(s=>s.fam===pouchFam);
  const tot=Object.keys(P).length;
  return header('锦囊')+viewToggle()+`<div class="stat"><div><b>${saidCount()}</b><span>said 印</span></div><div><b>${heardCount()-saidCount()}</b><span>heard</span></div><div><b>${tot-heardCount()}</b><span>gaps</span></div></div>
  <div class="seg">${fams.map(f=>{ const n=SC.filter(s=>s.fam===f[0]).length; return `<button data-pf="${f[0]}" class="${pouchFam===f[0]?'on':''}">${f[0]} ${f[1]} <small>${n}</small></button>`; }).join('')}</div>
  <p class="small">Every scene the host can name. Lines you have heard at the table show in full; the rest are gaps until a guest says them.</p>
  ${list.map(s=>{ const said=s.p.filter(p=>(ST.pouch[p]||{}).said).length; return `<div class="grp"><div class="h" data-scene="${s.id}" style="cursor:pointer"><span>${esc(s.title)}</span><span>${said}/${s.p.length}</span></div>${openP===s.id?`<p class="small" style="margin:0 0 6px">${esc(s.w[0])}</p>`+s.p.map(pid=>{ const p=P[pid], e=ST.pouch[pid]||{}; if(!e.heard) return `<div class="pline gap"><span>${'—'.repeat(Math.min(12,zhOnly(p.zh).length))}</span><small>${esc(p.author)} 《${esc(p.work)}》</small></div>`; return card(p); }).join(''):''}</div>`; }).join('')}`;
}
/* ---------- yard (the ladder from v1, kept as practice) ---------- */
const RUNGS=['学','认','补','诵','急'], RUNG_EN=['study','recognise','complete','recite','live'];
const lv=pid=>ST.lv[pid]||0;
let SESSION=null;
function pickQueue(){ const t=today(); const cands=Object.keys(P).map(pid=>({pid,l:lv(pid),up:ST.lastUp[pid]===t,own:!!ST.owned[pid]})); const pool=shuffle(cands.filter(c=>!c.own)).sort((a,b)=>(a.up-b.up)||(a.l-b.l)); const review=shuffle(cands.filter(c=>c.own)).slice(0,2); return shuffle(pool.slice(0,8).concat(review).map(c=>{ const r=c.own?4:Math.min(4,c.l+1); const sc=rnd(scenesOf(c.pid)); const seen=ST.seen[c.pid]||[]; let wis=sc.w.map((_,i)=>i); if(r===4){ const un=wis.filter(i=>!seen.includes(sc.id+':'+i)); if(un.length) wis=un; } return {pid:c.pid,scene:sc.id,wi:rnd(wis),rung:r}; })); }
function distractors(pid){ const mine=new Set(scenesOf(pid).flatMap(s=>s.p)); return shuffle(Object.keys(P).filter(x=>!mine.has(x))).slice(0,3); }
function renderYard(){
  if(!SESSION){ return header('练')+`<p class="prompt" style="font-size:18px">The practice yard.</p><p class="small">Drill between banquets. Scene first, phrase second, four rungs: 认 pick it, 补 finish it, 诵 produce it, 急 produce it from a wording you have never seen, against the clock. One rung per phrase per day. This does not add to the 锦囊; only the table does.</p><div class="row"><button class="primary" id="go">Ten items</button></div>`; }
  const q=SESSION.queue, it=q[SESSION.i];
  if(!it) return header('练')+`<p class="prompt">Done.</p><div class="row"><button class="primary" id="go">Another ten</button><button data-tab="banquet">To the banquet</button></div>`;
  const p=P[it.pid], s=SCI[it.scene], w=s.w[it.wi];
  const prog=`<div class="prog">${q.map((_,i)=>`<i class="${i<SESSION.i?'d':''}"></i>`).join('')}</div>`;
  const rung=`<div class="rung">${RUNGS.slice(1).map((r,i)=>`<span class="${i+1===it.rung?'on':''}">${r} ${RUNG_EN[i+1]}</span>`).join('')}</div>`;
  const cue=`<p class="cue">${s.fam} · scene</p><p class="prompt">${esc(w)}</p>`;
  let body='';
  if(SESSION.fb){ const f=SESSION.fb; body=`<div class="fb ${f.ok?'ok':'no'}">${esc(f.msg)}</div>${card(p,{brief:true})}<div class="row"><button class="primary" id="ynext">Next</button></div>`; }
  else if(it.rung===1){ body=`<div class="opts">${shuffle([it.pid].concat(distractors(it.pid))).map(o=>`<button data-opt="${o}">${esc(P[o].zh)}</button>`).join('')}</div>`; }
  else { const hint=it.rung===2?`<p class="hint">${esc(zhOnly(p.zh).slice(0,2))}… &nbsp; ${esc(p.author)}</p>`:it.rung===3?`<p class="hint">${esc(p.author)} 《${esc(p.work)}》</p>`:`<div class="timer"><i id="ybar"></i></div>`; body=`${hint}${SESSION.hint?`<p class="hint">${esc(p.py)}</p>`:''}<input id="yans" placeholder="characters or pinyin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="row"><button class="primary" id="ycheck">Check</button><button id="yhint" class="ghost">${SESSION.hint||it.rung===4?'Reveal answer':'Show pinyin'}</button></div>`; }
  return header('练')+prog+rung+cue+body;
}
function ygrade(it,res){ const p=P[it.pid], s=SCI[it.scene], t=today(); let msg,ok=false;
  if(res){ ok=true; if(SESSION.hint) msg='Right, but with the pinyin shown it does not count.'; else if(ST.lastUp[it.pid]===t&&!ST.owned[it.pid]) msg='Right. Already climbed today.'; else if(ST.owned[it.pid]){ msg='Still yours.'; } else { const seen=ST.seen[it.pid]=ST.seen[it.pid]||[]; const key=s.id+':'+it.wi; if(it.rung===4&&seen.includes(key)) msg='Right, but you had seen this wording. 急 needs a fresh one.'; else { ST.lv[it.pid]=it.rung; ST.lastUp[it.pid]=t; if(it.rung===4){ ST.owned[it.pid]=t; msg='Owned in the yard. Now say it at the table.'; } else msg=`Climbed to ${RUNGS[it.rung]}.`; } seen.push(key); } }
  else { msg=it.rung===1?'Not that one.':'Not it. Comes back tomorrow.'; if(lv(it.pid)>0&&!ST.owned[it.pid]&&ST.lastUp[it.pid]!==t){ ST.lv[it.pid]=Math.max(0,lv(it.pid)-1); msg+=' Dropped a rung.'; } }
  touchStreak(); save(); SESSION.fb={ok,msg}; }
function yTimer(){ const bar=document.getElementById('ybar'); if(!bar) return; const t0=Date.now(); clearInterval(SESSION.timer); SESSION.timer=setInterval(()=>{ const r=1-(Date.now()-t0)/15000; if(r<=0){ clearInterval(SESSION.timer); if(!SESSION.fb){ ygrade(SESSION.queue[SESSION.i],null); SESSION.fb.msg='Time.'; render(); } } else bar.style.width=(r*100)+'%'; },200); }

/* ---------- rank ---------- */
function renderRank(){
  const r=rank(), R=RANKS[r];
  const bl=ST.banquets.slice().reverse();
  return header('榜')+`<div class="rankseal">${R[0]}<small>${R[1]}</small></div><p class="small">${R[2]}. The five grades of the imperial examination, the ladder that ran Chinese officialdom for 1,300 years. Rank is earned by lines produced at the table 印 and lines said in life 用.</p>
  <div class="stat"><div><b>${saidCount()}</b><span>印 at the table</span></div><div><b>${usedCount()}</b><span>用 in life</span></div><div><b>${ST.streak.n}</b><span>day streak</span></div></div>
  <div class="stat"><div><b>${ST.ya}</b><span>雅 all time</span></div><div><b>${ST.banquets.length}</b><span>banquets</span></div><div><b>${ST.face}</b><span>carried out</span></div></div>
  <div class="ladder">${RANKS.map((k,i)=>`<div class="${i===r?'now':i<r?'past':''}"><span>${k[0]} ${k[1]}</span><span>${k[3]} 印 · ${k[4]} 用</span></div>`).join('')}</div>
  <p class="cue">banquets</p>${bl.length?`<div class="list">${bl.map(b=>`<div><span style="color:var(--ink);font-size:14px">${b.date} beside ${b.seat}</span><span>${b.carried?'carried out':b.ya+' 雅, '+b.cups+' cups'}</span></div>`).join('')}</div>`:'<p class="empty">No banquets yet.</p>'}
  <p class="cue">said in life</p>${usedCount()?`<div class="list">${Object.keys(ST.used).map(p=>`<div><span style="color:var(--ink);font-size:14px;white-space:normal">${esc(P[p]?P[p].zh:p)}</span><span>${ST.used[p].length}×</span></div>`).join('')}</div>`:'<p class="empty">Nothing yet. This list is the point of the whole game.</p>'}
  <div class="row" style="margin-top:20px"><button class="ghost" id="reset">Reset all progress</button></div>`;
}

/* ---------- glue ---------- */
const app=document.getElementById('app');
function render(){
  tabsHtml();
  app.innerHTML = ST.tab==='banquet'?renderBanquet():ST.tab==='pouch'?renderPouch():ST.tab==='yard'?renderYard():renderRank();
  const a=document.getElementById('ans'); if(a){ a.focus(); a.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('say').click(); }); }
  const y=document.getElementById('yans'); if(y){ y.focus(); y.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('ycheck').click(); }); }
  if (SESSION&&SESSION.queue[SESSION.i]&&SESSION.queue[SESSION.i].rung===4&&!SESSION.fb) yTimer();
}
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-tab],[data-seat],[data-use],[data-open],[data-pv],[data-pf],[data-scene],.w,.gloss .x,#start,#float,#say,#pass,#next,#again,#go,#ycheck,#yhint,#ynext,[data-opt],#reset');
  if(!b) return;
  if(b.dataset.tab){ ST.tab=b.dataset.tab; if(B) clearInterval(B.timer); if(SESSION) clearInterval(SESSION.timer); save(); render(); window.scrollTo(0,0); return; }
  if(b.dataset.seat){ seatPick=b.dataset.seat; const y=document.getElementById('yu'); B=B||{phase:'lobby'}; if(y) B.yuDraft=y.value; render(); return; }
  if(b.dataset.use){ logUse(b.dataset.use); return; }
  if(b.dataset.open){ openP=openP===b.dataset.open?null:b.dataset.open; render(); return; }
  if(b.dataset.pv){ pouchView=b.dataset.pv; openP=null; render(); return; }
  if(b.dataset.pf){ pouchFam=b.dataset.pf; openP=null; render(); return; }
  if(b.dataset.scene){ openP=openP===b.dataset.scene?null:b.dataset.scene; render(); return; }
  if(b.classList.contains('w')){ const s=P[b.dataset.p].segs[+b.dataset.i]; showGloss(s); return; }
  if(b.classList.contains('x')){ hideGloss(); return; }
  if(b.id==='start'){ const y=document.getElementById('yu'); startBanquet(seatPick, y?y.value:''); return; }
  if(b.id==='float'||b.id==='next'){ nextRound(); return; }
  if(b.id==='say'){ const v=document.getElementById('ans').value.trim(); if(!v) return; submit(v,false); return; }
  if(b.id==='pass'){ submit('',false); return; }
  if(b.id==='again'){ B={phase:'lobby'}; render(); window.scrollTo(0,0); return; }
  if(b.id==='go'){ SESSION={queue:pickQueue(),i:0,fb:null,hint:false,timer:null}; render(); return; }
  if(b.dataset.opt){ const it=SESSION.queue[SESSION.i]; document.querySelectorAll('[data-opt]').forEach(o=>{ if(o.dataset.opt===it.pid) o.classList.add('right'); else if(o===b) o.classList.add('wrong'); }); const ok=b.dataset.opt===it.pid; setTimeout(()=>{ ygrade(it,ok?'exact':null); render(); },ok?350:900); return; }
  if(b.id==='ycheck'){ const it=SESSION.queue[SESSION.i]; const v=document.getElementById('yans').value.trim(); if(!v) return; clearInterval(SESSION.timer); ygrade(it,matches(v,P[it.pid])); render(); return; }
  if(b.id==='yhint'){ const it=SESSION.queue[SESSION.i]; if(!SESSION.hint&&it.rung<4){ SESSION.hint=true; render(); } else { clearInterval(SESSION.timer); ygrade(it,null); SESSION.fb.msg='Revealed. Comes back tomorrow.'; render(); } return; }
  if(b.id==='ynext'){ SESSION.i++; SESSION.fb=null; SESSION.hint=false; render(); window.scrollTo(0,0); return; }
  if(b.id==='reset'){ if(confirm('Erase all progress?')){ ST={pouch:{},extra:{},used:{},banquets:[],face:0,ya:0,streak:{last:'',n:0},tab:'rank',lv:{},lastUp:{},seen:{},owned:{},lastSummary:''}; B=null; save(); render(); } return; }
});
function showGloss(s){ hideGloss(); const g=document.createElement('div'); g.className='gloss'; g.innerHTML=`<button class="x" aria-label="close">×</button><div class="gz">${esc(s[0])}</div><div class="gp">${esc(s[2])}</div><div class="gm">${esc(s[1])}</div>`; document.body.appendChild(g); }
function hideGloss(){ document.querySelectorAll('.gloss').forEach(g=>g.remove()); }
load().then(()=>{ if(ST.tab==='banquet') B={phase:'lobby'}; render(); });
</script>
</body>
</html>
