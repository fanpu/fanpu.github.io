<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>流觞 · liú shāng</title>
<style>
:root{
  --paper:#EDF0EA; --paper2:#E1E6DE; --ink:#1C2422; --ink2:#55615B; --ink3:#8A948E;
  --rule:#C6CFC4; --seal:#B5302A; --seal2:#F1DCD8; --ok:#3F7A5A; --okbg:#DCEBE0; --water:#B9CBD1; --water2:#7FA3AE;
  --serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC","PingFang SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-text-size-adjust:100%}
body{font-size:16px;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:14px 16px 96px}
h1{font-size:15px;font-weight:400;margin:0 0 10px;color:var(--ink2)}
h1 b{color:var(--ink);font-weight:600;font-size:22px;margin-right:6px}
h2{font-size:17px;font-weight:600;margin:18px 0 6px}
button{font-family:inherit;font-size:15px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:6px;padding:9px 14px;cursor:pointer}
button:active{background:var(--paper2)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ghost{background:transparent}
button:disabled{opacity:.5}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
input,textarea{font-family:inherit;font-size:19px;width:100%;padding:10px 12px;border:1px solid var(--rule);border-bottom:2px solid var(--ink);border-radius:6px 6px 0 0;background:#fff;color:var(--ink)}
textarea{font-size:16px;min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:none;border-bottom-color:var(--seal)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);display:flex;justify-content:center;padding:6px 0 max(10px,env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:0 0 25%;max-width:130px;border:0;background:transparent;border-radius:0;padding:4px 0;color:var(--ink3);line-height:1.1}
.tabs button .z{display:block;font-size:22px}
.tabs button .e{display:block;font-size:11px}
.tabs button.on{color:var(--ink)}
.tabs button.on .z{text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--seal);text-decoration-thickness:2px}
.small{font-size:13px;color:var(--ink2)}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.seg button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 0;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.seg button small{color:var(--ink3)}
.seg button.on small{color:#ccc}
.cue{font-size:12px;color:var(--ink3);margin:16px 0 4px}
.prompt{font-size:22px;line-height:1.4;margin:0 0 6px}
.card{margin:12px 0 4px;padding:14px 14px 12px;background:#fff;border:1px solid var(--rule);border-radius:8px;position:relative}
.card.dim{background:transparent;color:var(--ink2)}
.card.sealed .zh{padding-right:44px}
.zh{font-size:24px;line-height:1.5;letter-spacing:.02em;margin:0}
.zh .w{cursor:pointer;border-bottom:1px dotted var(--rule);padding-bottom:1px}
.zh .w:active{background:var(--seal2)}
.zh .p{color:var(--ink3);margin:0 2px}
.py{font-size:13px;color:var(--ink2);margin:6px 0 0;line-height:1.6}
.en{font-size:15px;margin:10px 0 0;line-height:1.55}
.src{font-size:13px;color:var(--ink2);margin:8px 0 0}
.note{font-size:14px;color:var(--ink2);margin:10px 0 0;line-height:1.55}
.ctx{font-size:13px;color:var(--ink2);margin:10px 0 0;padding-left:10px;border-left:2px solid var(--rule);line-height:1.55}
.ctx .cz{color:var(--ink);font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12px;color:var(--ink2);border:1px solid var(--rule);border-radius:4px;padding:2px 7px}
.seal{position:absolute;top:10px;right:10px;width:34px;height:34px;border:2px solid var(--seal);color:var(--seal);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;transform:rotate(-8deg)}
.gloss{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--ink);padding:16px 18px max(18px,env(safe-area-inset-bottom));z-index:9;max-width:520px;margin:0 auto;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.gloss .gz{font-size:30px}.gloss .gp{color:var(--ink2);font-size:14px}.gloss .gm{margin-top:6px;font-size:16px}
.gloss .x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:20px;color:var(--ink3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
/* banquet */
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.seat{border:1px solid var(--rule);border-radius:8px;padding:12px;background:#fff;text-align:left;cursor:pointer;position:relative}
.seat.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seat b{font-size:22px;display:block;font-weight:600}
.seat i{font-style:normal;font-size:12px;color:var(--ink3);display:block}
.seat p{margin:6px 0 0;font-size:13px;color:var(--ink2);line-height:1.45}
.seat .d{position:absolute;top:10px;right:10px;font-size:11px;color:var(--ink3)}
.stream{width:100%;height:auto;display:block;margin:4px 0 8px}
.stream .s{font-size:15px;fill:var(--ink)}
.stream .s.you{fill:var(--seal);font-weight:600}
.stream .lab{font-size:10px;fill:var(--ink3)}
.cups{display:flex;gap:6px;align-items:center}
.cup{width:18px;height:18px;border:2px solid var(--ink3);border-radius:0 0 8px 8px;background:transparent}
.cup.full{background:var(--seal);border-color:var(--seal)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin:0 0 4px}
.host{font-size:15px;line-height:1.55;margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--ink);background:#fff}
.host.guest{border-left-color:var(--water2)}
.host b{font-weight:600}
.react{font-size:20px;margin:12px 0 0;letter-spacing:.06em}
.react small{display:block;font-size:12px;color:var(--ink3);letter-spacing:0}
.react.good{color:var(--ok)}.react.bad{color:var(--seal)}
.timer{height:3px;background:var(--rule);border-radius:2px;margin:8px 0 12px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--seal);width:100%;transition:width .2s linear}
.hint{font-size:14px;color:var(--ink2);margin:0 0 12px}
.wait{color:var(--ink3);font-size:14px;margin:14px 0}
.wait::after{content:'…';animation:dots 1.2s steps(3) infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.pulse{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(.97);background:var(--okbg)}100%{transform:scale(1)}}
/* pouch */
.grp{margin:14px 0 0;border-top:1px solid var(--rule)}
.grp .h{display:flex;justify-content:space-between;padding:10px 0 4px;font-size:16px}
.grp .h span{color:var(--ink3);font-size:13px}
.pline{padding:8px 0;border-top:1px dotted var(--rule);font-size:18px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pline.gap{color:var(--ink3);letter-spacing:.05em;font-size:15px;overflow:hidden}
.pline.gap span{white-space:nowrap;overflow:hidden;text-overflow:clip;flex:1}
.pline.heard{color:var(--ink2)}
.pline small{font-size:11px;color:var(--ink3);white-space:nowrap;letter-spacing:0}
.pline .sl{color:var(--seal);font-size:13px;margin-left:6px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0 16px}
.stat div{border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:12px;color:var(--ink2)}
.rankseal{width:110px;height:110px;border:3px solid var(--seal);color:var(--seal);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;line-height:1;transform:rotate(-4deg);margin:14px 0 18px}
.rankseal small{font-size:12px;margin-top:6px}
.ladder{border-top:1px solid var(--rule)}
.ladder div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.ladder div.now{color:var(--seal)}.ladder div.past{color:var(--ink3)}
.list{border-top:1px solid var(--rule)}
.list div{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.list div span{color:var(--ink3);font-size:12px;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opts button{text-align:left;font-size:19px;padding:12px 14px;line-height:1.4}
.opts button.right{background:var(--okbg);border-color:var(--ok)}.opts button.wrong{background:var(--seal2);border-color:var(--seal)}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--paper2);font-size:15px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--seal2)}
.rung{font-size:12px;color:var(--ink2);display:flex;gap:10px;margin:6px 0 12px}
.rung span{opacity:.45}.rung span.on{opacity:1;color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--seal)}
.prog{display:flex;gap:3px;margin:4px 0 14px}.prog i{flex:1;height:3px;background:var(--rule)}.prog i.d{background:var(--ink)}
.empty{padding:20px 0;color:var(--ink2);font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

ut an inch of gold cannot buy an inch of time.", "author": "增广贤文", "work": "增广贤文", "era": "明清", "note": "The 增广贤文 is a Ming-Qing collection of folk maxims that every schoolchild once memorised. This one is the plainest possible statement about time. Useful precisely because everyone knows it.", "ctx": null, "py": "yī cùn guāng yīn yī cùn jīn ， cùn jīn nán mǎi cùn guāng yīn"}, "caiju": {"id": "caiju", "zh": "采菊东篱下，悠然见南山", "segs": [["采菊", "pick chrysanthemums", "cǎi jú"], ["东篱下", "beneath the eastern hedge", "dōng lí xià"], ["悠然", "unhurried, at ease", "yōu rán"], ["见", "see (some read it 现, 'appears')", "jiàn"], ["南山", "the southern mountain", "nán shān"]], "en": "Picking chrysanthemums by the eastern hedge, unhurried, I see the southern mountain.", "author": "陶渊明", "work": "饮酒·其五", "era": "东晋", "note": "Tao Yuanming quit his post as a county magistrate rather than bow to an inspector, and farmed for the rest of his life. This is the founding line of Chinese contentment. The key word is 悠然: not looking for the mountain, just seeing it.", "ctx": ["此中有真意，欲辨已忘言", "cǐ zhōng yǒu zhēn yì ， yù biàn yǐ wàng yán", "In this there is a true meaning; I would explain it but have already forgotten the words."], "py": "cǎi jú dōng lí xià ， yōu rán jiàn nán shān"}, "yidanshi": {"id": "yidanshi", "zh": "一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐", "segs": [["一箪食", "one bamboo bowl of rice", "yī dān shí"], ["一瓢饮", "one gourd of water", "yī piáo yǐn"], ["在陋巷", "in a shabby lane", "zài lòu xiàng"], ["人", "others", "rén"], ["不堪其忧", "could not bear the hardship", "bù kān qí yōu"], ["回", "Yan Hui (Confucius's favourite student)", "huí"], ["也", "(topic marker)", "yě"], ["不改其乐", "did not change his joy", "bù gǎi qí lè"]], "en": "A bowl of rice, a gourd of water, a shabby lane. Others could not bear the hardship, but Hui never lost his joy.", "author": "孔子", "work": "论语·雍也", "era": "春秋", "note": "Confucius describing 颜回, the student he loved most, who died young. The joy is not despite poverty; it does not depend on the circumstances at all. Say the last five characters, 回也不改其乐, when you notice you are happy with very little.", "ctx": null, "py": "yī dān shí ， yī piáo yǐn ， zài lòu xiàng ， rén bù kān qí yōu ， huí yě bù gǎi qí lè"}, "yixiang": {"id": "yixiang", "zh": "独在异乡为异客，每逢佳节倍思亲", "segs": [["独", "alone", "dú"], ["在异乡", "in a strange land", "zài yì xiāng"], ["为异客", "as a stranger, a guest", "wéi yì kè"], ["每逢", "every time it comes to", "měi féng"], ["佳节", "a festival", "jiā jié"], ["倍", "doubly", "bèi"], ["思亲", "miss family", "sī qīn"]], "en": "Alone in a strange land, a stranger; every festival I miss my family twice as much.", "author": "王维", "work": "九月九日忆山东兄弟", "era": "唐", "note": "Wang Wei at seventeen, in the capital on the Double Ninth festival (重阳, the ninth day of the ninth lunar month). Written for exactly the scene of being far from home on a holiday. Every overseas Chinese knows it.", "ctx": ["遥知兄弟登高处，遍插茱萸少一人", "yáo zhī xiōng dì dēng gāo chù ， biàn chā zhū yú shǎo yī rén", "Far away I know my brothers climb the heights, all wearing dogwood sprigs, one person short."], "py": "dú zài yì xiāng wéi yì kè ， měi féng jiā jié bèi sī qīn"}, "yaoyue": {"id": "yaoyue", "zh": "举杯邀明月，对影成三人", "segs": [["举杯", "raise the cup", "jǔ bēi"], ["邀", "invite", "yāo"], ["明月", "the bright moon", "míng yuè"], ["对影", "facing my shadow", "duì yǐng"], ["成三人", "makes three of us", "chéng sān rén"]], "en": "I raise my cup and invite the moon; with my shadow that makes three of us.", "author": "李白", "work": "月下独酌·其一", "era": "唐", "note": "Li Bai drinking alone and refusing to be sad about it. The best line for solitude that is chosen rather than suffered. Say it when you are alone and fine with it.", "ctx": null, "py": "jǔ bēi yāo míng yuè ， duì yǐng chéng sān rén"}, "wufengyu": {"id": "wufengyu", "zh": "回首向来萧瑟处，归去，也无风雨也无晴", "segs": [["回首", "look back", "huí shǒu"], ["向来", "just now, the way I came", "xiàng lái"], ["萧瑟处", "the bleak, rain-swept place", "xiāo sè chù"], ["归去", "go back", "guī qù"], ["也无风雨", "no wind and rain", "yě wú fēng yǔ"], ["也无晴", "and no clear sky either", "yě wú qíng"]], "en": "I look back at the rain-swept way I came. Going home: no wind, no rain, and no sunshine either.", "author": "苏轼", "work": "定风波·莫听穿林打叶声", "era": "北宋", "note": "Su Shi was caught in a rainstorm without an umbrella while in political exile. His companions panicked; he walked on singing. Written that evening. The last seven characters, 也无风雨也无晴, are the Chinese phrase for equanimity: the storm and the calm are both weather, and you are not the weather.", "ctx": ["竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生", "zhú zhàng máng xié qīng shèng mǎ ， shuí pà ？ yī suō yān yǔ rèn píng shēng", "Bamboo staff, straw sandals, lighter than a horse. Who is afraid? A straw cape in the misty rain, I take life as it comes."], "py": "huí shǒu xiàng lái xiāo sè chù ， guī qù ， yě wú fēng yǔ yě wú qíng"}, "wuxi": {"id": "wuxi", "zh": "不以物喜，不以己悲", "segs": [["不以", "not because of", "bù yǐ"], ["物", "external things", "wù"], ["喜", "rejoice", "xǐ"], ["不以", "not because of", "bù yǐ"], ["己", "one's own circumstances", "jǐ"], ["悲", "grieve", "bēi"]], "en": "Not made glad by things, not made sad by one's own lot.", "author": "范仲淹", "work": "岳阳楼记", "era": "北宋", "note": "The definition of an 'ancient benevolent person' in the Record of Yueyang Tower. Written for a friend who had been demoted, by a man who had been demoted three times himself. Say it as a reminder, not a boast.", "ctx": null, "py": "bù yǐ wù xǐ ， bù yǐ jǐ bēi"}, "zhiji": {"id": "zhiji", "zh": "海内存知己，天涯若比邻", "segs": [["海内", "within the four seas, the whole world", "hǎi nèi"], ["存", "there exists", "cún"], ["知己", "someone who truly knows me", "zhī jǐ"], ["天涯", "the sky's edge", "tiān yá"], ["若", "is like", "ruò"], ["比邻", "next door", "bǐ lín"]], "en": "As long as there is one who knows me anywhere in the world, the sky's edge is next door.", "author": "王勃", "work": "送杜少府之任蜀州", "era": "唐", "note": "The parting line of the Tang. Wang Bo, who died at twenty-six, wrote it for a friend leaving for a post in Sichuan. The next couplet tells them not to weep at the fork in the road like children. Say it to someone moving abroad.", "ctx": ["无为在歧路，儿女共沾巾", "wú wéi zài qí lù ， ér nǚ gòng zhān jīn", "Do not stand at the fork in the road wetting your handkerchiefs like boy and girl."], "py": "hǎi nèi cún zhī jǐ ， tiān yá ruò bǐ lín"}, "mochou": {"id": "mochou", "zh": "莫愁前路无知己，天下谁人不识君", "segs": [["莫愁", "do not worry", "mò chóu"], ["前路", "the road ahead", "qián lù"], ["无知己", "has no one who knows you", "wú zhī jǐ"], ["天下", "under heaven, everywhere", "tiān xià"], ["谁人", "who", "shuí rén"], ["不识君", "does not know you", "bù shí jūn"]], "en": "Do not fear that the road ahead has no one who knows you; who under heaven does not know your name?", "author": "高适", "work": "别董大·其一", "era": "唐", "note": "Gao Shi was broke and unknown when he wrote this for a departing musician friend who was also broke. Two poor men encouraging each other. Warmer and more boosting than 海内存知己. Say it to someone leaving to try something ambitious.", "ctx": null, "py": "mò chóu qián lù wú zhī jǐ ， tiān xià shuí rén bù shí jūn"}, "qiaoyan": {"id": "qiaoyan", "zh": "巧言令色，鲜矣仁", "segs": [["巧言", "clever words", "qiǎo yán"], ["令色", "a pleasing face, an ingratiating expression", "lìng sè"], ["鲜矣", "rare indeed is", "xiǎn yǐ"], ["仁", "benevolence, real goodness", "rén"]], "en": "Clever words and a pleasing face: rarely is there goodness in them.", "author": "孔子", "work": "论语·学而", "era": "春秋", "note": "Confucius's warning about flatterers, four characters that every Chinese person recognises. When someone is being very smooth with you, this is the thought. Do not say it to their face.", "ctx": null, "py": "qiǎo yán lìng sè ， xiǎn yǐ rén"}, "liangyao": {"id": "liangyao", "zh": "良药苦口利于病，忠言逆耳利于行", "segs": [["良药", "good medicine", "liáng yào"], ["苦口", "bitter in the mouth", "kǔ kǒu"], ["利于病", "benefits the illness", "lì yú bìng"], ["忠言", "loyal words, honest advice", "zhōng yán"], ["逆耳", "grate on the ear", "nì ěr"], ["利于行", "benefit one's conduct", "lì yú xíng"]], "en": "Good medicine is bitter but cures the illness; honest words grate on the ear but improve your conduct.", "author": "增广贤文", "work": "增广贤文（本自《史记》）", "era": "明清", "note": "The idea is older, from the Records of the Grand Historian, where an adviser uses it to persuade Liu Bang not to loot a captured palace. Say the second half, 忠言逆耳, when you are about to tell someone something they will not enjoy hearing, or when you have just been told.", "ctx": null, "py": "liáng yào kǔ kǒu lì yú bìng ， zhōng yán nì ěr lì yú xíng"}, "xiangfeng": {"id": "xiangfeng", "zh": "人生何处不相逢", "segs": [["人生", "in life", "rén shēng"], ["何处", "where", "hé chù"], ["不", "not", "bù"], ["相逢", "meet each other", "xiāng féng"]], "en": "In this life, where do people not meet again?", "author": "增广贤文", "work": "增广贤文（亦见宋诗）", "era": "明清", "note": "The line for bumping into someone you never expected to see again. It also carries a warning in the 增广贤文 context: treat people well, because you will meet them again.", "ctx": null, "py": "rén shēng hé chù bù xiāng féng"}, "youpeng": {"id": "youpeng", "zh": "有朋自远方来，不亦乐乎", "segs": [["有朋", "to have a friend", "yǒu péng"], ["自远方来", "come from afar", "zì yuǎn fāng lái"], ["不亦", "is it not", "bù yì"], ["乐乎", "a joy", "lè hū"]], "en": "To have a friend come from afar, is that not a joy?", "author": "孔子", "work": "论语·学而", "era": "春秋", "note": "The second sentence of the Analects, so the second thing Confucius says in the book that defines him. Say it when a friend visits from far away. Everyone will recognise it and it always lands.", "ctx": null, "py": "yǒu péng zì yuǎn fāng lái ， bù yì lè hū"}, "jianxian": {"id": "jianxian", "zh": "见贤思齐焉，见不贤而内自省也", "segs": [["见贤", "see a worthy person", "jiàn xián"], ["思齐", "think of equalling them", "sī qí"], ["焉", "(particle: in that case)", "yān"], ["见不贤", "see an unworthy person", "jiàn bù xián"], ["而", "and", "ér"], ["内自省", "look inward and examine yourself", "nèi zì xǐng"], ["也", "(sentence-final particle)", "yě"]], "en": "Seeing a worthy person, think of matching them; seeing an unworthy one, examine yourself.", "author": "孔子", "work": "论语·里仁", "era": "春秋", "note": "The first four characters, 见贤思齐, are the everyday form. The second half is the part people forget: a bad example is also a mirror. Say it when someone much better than you at something walks in.", "ctx": null, "py": "jiàn xián sī qí yān ， jiàn bù xián ér nèi zì xǐng yě"}, "sanren": {"id": "sanren", "zh": "三人行，必有我师焉", "segs": [["三人行", "when three people walk together", "sān rén xíng"], ["必", "surely", "bì"], ["有我师", "there is my teacher", "yǒu wǒ shī"], ["焉", "among them", "yān"]], "en": "When three people walk together, one of them is surely my teacher.", "author": "孔子", "work": "论语·述而", "era": "春秋", "note": "The continuation says: pick out what is good in them and follow it, what is bad and correct it in yourself. It is not modesty; it is a method. Say it about anyone you learned something from unexpectedly.", "ctx": ["择其善者而从之，其不善者而改之", "zé qí shàn zhě ér cóng zhī ， qí bù shàn zhě ér gǎi zhī", "Choose what is good in them and follow it; what is not good, change in yourself."], "py": "sān rén xíng ， bì yǒu wǒ shī yān"}, "liuan": {"id": "liuan", "zh": "山重水复疑无路，柳暗花明又一村", "segs": [["山重水复", "mountain after mountain, stream after stream", "shān chóng shuǐ fù"], ["疑", "I suspected", "yí"], ["无路", "there was no road", "wú lù"], ["柳暗", "willows dark", "liǔ àn"], ["花明", "flowers bright", "huā míng"], ["又一村", "another village", "yòu yī cūn"]], "en": "Mountains fold on mountains, streams double back, I thought there was no road; then dark willows, bright flowers, and another village.", "author": "陆游", "work": "游山西村", "era": "南宋", "note": "The Chinese phrase for a breakthrough that comes right after you had given up. 柳暗花明 alone is now a set phrase. Say it when the bug finally reveals itself, or when a dead end turns.", "ctx": null, "py": "shān chóng shuǐ fù yí wú lù ， liǔ àn huā míng yòu yī cūn"}, "zhongli": {"id": "zhongli", "zh": "众里寻他千百度，蓦然回首，那人却在，灯火阑珊处", "segs": [["众里", "in the crowd", "zhòng lǐ"], ["寻他", "searched for her", "xún tā"], ["千百度", "a thousand, a hundred times", "qiān bǎi dù"], ["蓦然", "suddenly", "mò rán"], ["回首", "turn my head", "huí shǒu"], ["那人", "that person", "nà rén"], ["却在", "was instead", "què zài"], ["灯火阑珊处", "where the lanterns were dim and few", "dēng huǒ lán shān chù"]], "en": "In the crowd I searched for her a thousand times; suddenly I turned, and there she was, where the lanterns were dim.", "author": "辛弃疾", "work": "青玉案·元夕", "era": "南宋", "note": "Set on the Lantern Festival. The scholar 王国维 made this the third of his three stages of any great achievement: you search everywhere, and the thing you wanted was quietly behind you. Say it when the answer turns out to have been in plain sight.", "ctx": null, "py": "zhòng lǐ xún tā qiān bǎi dù ， mò rán huí shǒu ， nà rén què zài ， dēng huǒ lán shān chù"}, "aicai": {"id": "aicai", "zh": "君子爱财，取之有道", "segs": [["君子", "a noble person", "jūn zǐ"], ["爱财", "loves wealth", "ài cái"], ["取之", "obtains it", "qǔ zhī"], ["有道", "by proper means, according to the Way", "yǒu dào"]], "en": "A noble person loves wealth, but takes it by the proper road.", "author": "增广贤文", "work": "增广贤文", "era": "明清", "note": "Note it does not say a good person is above money. It says the way you get it is what matters. The most practical line in Chinese business ethics. Say it when tempted by a shortcut.", "ctx": null, "py": "jūn zǐ ài cái ， qǔ zhī yǒu dào"}, "fuyun": {"id": "fuyun", "zh": "不义而富且贵，于我如浮云", "segs": [["不义", "unrighteous, gained wrongly", "bú yì"], ["而", "and yet", "ér"], ["富且贵", "rich and honoured", "fù qiě guì"], ["于我", "to me", "yú wǒ"], ["如浮云", "are like drifting clouds", "rú fú yún"]], "en": "Wealth and rank gained by wrong means are to me like passing clouds.", "author": "孔子", "work": "论语·述而", "era": "春秋", "note": "The line before it describes Confucius eating plain rice, drinking water, and using his bent arm as a pillow, and finding joy in that. 浮云 became a whole internet slang word for 'meaningless' because of this line.", "ctx": null, "py": "bú yì ér fù qiě guì ， yú wǒ rú fú yún"}, "xuesi": {"id": "xuesi", "zh": "学而不思则罔，思而不学则殆", "segs": [["学", "study, take things in", "xué"], ["而不思", "without thinking", "ér bù sī"], ["则罔", "then you are lost, deceived", "zé wǎng"], ["思", "think", "sī"], ["而不学", "without studying", "ér bù xué"], ["则殆", "then you are in danger, exhausted", "zé dài"]], "en": "Study without thinking and you are lost; think without studying and you are in danger.", "author": "孔子", "work": "论语·为政", "era": "春秋", "note": "The two failure modes of learning, in twelve characters. The first is consuming without digesting (罔). The second is speculating without input (殆). Say whichever half you are guilty of that day.", "ctx": null, "py": "xué ér bù sī zé wǎng ， sī ér bù xué zé dài"}, "hongyi": {"id": "hongyi", "zh": "士不可以不弘毅，任重而道远", "segs": [["士", "a scholar-official, a person of purpose", "shì"], ["不可以不", "cannot not be", "bù kě yǐ bù"], ["弘毅", "broad-minded and resolute", "hóng yì"], ["任重", "the burden is heavy", "rèn zhòng"], ["而", "and", "ér"], ["道远", "the road is long", "dào yuǎn"]], "en": "A person of purpose must be broad and resolute, for the burden is heavy and the road is long.", "author": "曾子", "work": "论语·泰伯", "era": "春秋", "note": "Spoken by 曾子, Zengzi, the disciple from whom your own clan descends. He goes on: he takes 仁 as his burden and only death ends the road. Say 任重道远 when you take on something that will outlast the year.", "ctx": ["仁以为己任，不亦重乎？死而后已，不亦远乎", "rén yǐ wéi jǐ rèn ， bù yì zhòng hū ？ sǐ ér hòu yǐ ， bù yì yuǎn hū", "He takes benevolence as his own burden: is that not heavy? Only at death does he stop: is that not far?"], "py": "shì bù kě yǐ bù hóng yì ， rèn zhòng ér dào yuǎn"}, "xiantianxia": {"id": "xiantianxia", "zh": "先天下之忧而忧，后天下之乐而乐", "segs": [["先", "before", "xiān"], ["天下", "all under heaven, everyone", "tiān xià"], ["之忧", "'s worries", "zhī yōu"], ["而忧", "worry", "ér yōu"], ["后", "after", "hòu"], ["天下", "all under heaven, everyone", "tiān xià"], ["之乐", "'s joys", "zhī lè"], ["而乐", "rejoice", "ér lè"]], "en": "Be the first to worry about the world's worries, and the last to enjoy its joys.", "author": "范仲淹", "work": "岳阳楼记", "era": "北宋", "note": "The most quoted sentence about public duty in Chinese. Fan Zhongyan wrote it in political exile for a friend also in exile. It is a standard, not a mood. Say it when you decide to take responsibility for something bigger than yourself.", "ctx": null, "py": "xiān tiān xià zhī yōu ér yōu ， hòu tiān xià zhī lè ér lè"}, "quanjun": {"id": "quanjun", "zh": "劝君更尽一杯酒，西出阳关无故人", "segs": [["劝君", "I urge you", "quàn jūn"], ["更尽", "drink one more to the bottom", "gèng jìn"], ["一杯酒", "a cup of wine", "yī bēi jiǔ"], ["西出", "west beyond", "xī chū"], ["阳关", "Yang Pass (the last gate before the desert)", "yáng guān"], ["无故人", "there are no old friends", "wú gù rén"]], "en": "One more cup, I beg you; west of Yang Pass there will be no old friends.", "author": "王维", "work": "送元二使安西", "era": "唐", "note": "This became a song, 阳关三叠, sung at farewells for a thousand years. The line for the last drink before someone leaves for somewhere far and hard.", "ctx": null, "py": "quàn jūn gèng jìn yī bēi jiǔ ， xī chū yáng guān wú gù rén"}, "yuanlv": {"id": "yuanlv", "zh": "人无远虑，必有近忧", "segs": [["人", "a person", "rén"], ["无远虑", "without far-reaching thought", "wú yuǎn lǜ"], ["必有", "will surely have", "bì yǒu"], ["近忧", "troubles close at hand", "jìn yōu"]], "en": "A person who does not think far ahead will surely have trouble close at hand.", "author": "孔子", "work": "论语·卫灵公", "era": "春秋", "note": "Eight characters, no wasted word. The Chinese version of 'plan or be planned for'. Say it when things are going well and nobody is thinking about next year.", "ctx": null, "py": "rén wú yuǎn lǜ ， bì yǒu jìn yōu"}, "yinqing": {"id": "yinqing", "zh": "人有悲欢离合，月有阴晴圆缺，此事古难全", "segs": [["人有", "people have", "rén yǒu"], ["悲欢离合", "sorrow, joy, parting, reunion", "bēi huān lí hé"], ["月有", "the moon has", "yuè yǒu"], ["阴晴圆缺", "dark, bright, full, waning", "yīn qíng yuán quē"], ["此事", "this matter", "cǐ shì"], ["古难全", "has been hard to make whole since ancient times", "gǔ nán quán"]], "en": "People have sorrow and joy, parting and reunion; the moon has dark and bright, full and waning. This has never been made whole.", "author": "苏轼", "work": "水调歌头·明月几时有", "era": "北宋", "note": "The line just before 但愿人长久. Where that line hopes, this one accepts. Say it when something is incomplete and you have decided to stop fighting that.", "ctx": null, "py": "rén yǒu bēi huān lí hé ， yuè yǒu yīn qíng yuán quē ， cǐ shì gǔ nán quán"}, "haoyu": {"id": "haoyu", "zh": "好雨知时节，当春乃发生", "segs": [["好雨", "a good rain", "hǎo yǔ"], ["知时节", "knows its season", "zhī shí jié"], ["当春", "just as spring comes", "dāng chūn"], ["乃", "then", "nǎi"], ["发生", "comes forth, happens", "fā shēng"]], "en": "A good rain knows its season; it comes just as spring arrives.", "author": "杜甫", "work": "春夜喜雨", "era": "唐", "note": "Du Fu, settled for once, in Chengdu. Also said of a person or a piece of help that arrives at exactly the right time. The next couplet: it comes with the wind at night, quietly, and wets everything without a sound.", "ctx": ["随风潜入夜，润物细无声", "suí fēng qián rù yè ， rùn wù xì wú shēng", "It slips in with the wind at night, moistening all things, fine and soundless."], "py": "hǎo yǔ zhī shí jié ， dāng chūn nǎi fā shēng"}, "zhanyi": {"id": "zhanyi", "zh": "沾衣欲湿杏花雨，吹面不寒杨柳风", "segs": [["沾衣", "dampens the clothes", "zhān yī"], ["欲湿", "about to soak, but not quite", "yù shī"], ["杏花雨", "apricot-blossom rain (light spring rain)", "xìng huā yǔ"], ["吹面", "blows on the face", "chuī miàn"], ["不寒", "not cold", "bù hán"], ["杨柳风", "willow wind (a spring breeze)", "yáng liǔ fēng"]], "en": "Apricot-blossom rain dampens my clothes without soaking them; willow wind on my face, not cold.", "author": "志南", "work": "绝句", "era": "南宋", "note": "By a Song dynasty monk about whom almost nothing else is known. The gentlest weather line in Chinese. Say it on the first warm drizzly day of the year.", "ctx": null, "py": "zhān yī yù shī xìng huā yǔ ， chuī miàn bù hán yáng liǔ fēng"}, "fengqiu": {"id": "fengqiu", "zh": "自古逢秋悲寂寥，我言秋日胜春朝", "segs": [["自古", "since ancient times", "zì gǔ"], ["逢秋", "meeting autumn", "féng qiū"], ["悲寂寥", "people grieve at its loneliness", "bēi jì liáo"], ["我言", "I say", "wǒ yán"], ["秋日", "an autumn day", "qiū rì"], ["胜", "beats", "shèng"], ["春朝", "a spring morning", "chūn zhāo"]], "en": "Since ancient times people meet autumn with sorrow; I say an autumn day beats a spring morning.", "author": "刘禹锡", "work": "秋词·其一", "era": "唐", "note": "Liu Yuxi wrote this in exile, deliberately contradicting a thousand years of sad autumn poems. The next couplet has a single crane climbing the clear sky. Say it on a bright cool autumn day when everyone else is moping.", "ctx": null, "py": "zì gǔ féng qiū bēi jì liáo ， wǒ yán qiū rì shèng chūn zhāo"}, "luomu": {"id": "luomu", "zh": "无边落木萧萧下，不尽长江滚滚来", "segs": [["无边", "boundless", "wú biān"], ["落木", "falling leaves (literally: falling wood)", "luò mù"], ["萧萧", "rustling (sound of leaves)", "xiāo xiāo"], ["下", "come down", "xià"], ["不尽", "endless", "bù jìn"], ["长江", "the Yangtze", "cháng jiāng"], ["滚滚", "rolling, churning", "gǔn gǔn"], ["来", "comes", "lái"]], "en": "Boundless falling leaves come rustling down; the endless Yangtze comes rolling on.", "author": "杜甫", "work": "登高", "era": "唐", "note": "From the poem often called the greatest regulated verse in Chinese. Du Fu at fifty-five, sick, alone, on a hill at the autumn festival. Say it when leaves fall and the scale of things gets to you.", "ctx": null, "py": "wú biān luò mù xiāo xiāo xià ， bù jìn cháng jiāng gǔn gǔn lái"}, "chunshui": {"id": "chunshui", "zh": "问君能有几多愁，恰似一江春水向东流", "segs": [["问君", "ask you (himself)", "wèn jūn"], ["能有", "can have", "néng yǒu"], ["几多愁", "how much sorrow", "jǐ duō chóu"], ["恰似", "just like", "qià sì"], ["一江春水", "a river of spring water", "yī jiāng chūn shuǐ"], ["向东流", "flowing east", "xiàng dōng liú"]], "en": "How much sorrow can one man hold? As much as a spring river flowing east.", "author": "李煜", "work": "虞美人·春花秋月何时了", "era": "南唐", "note": "This poem reportedly got Li Yu killed: the Song emperor took it as nostalgia for his lost kingdom and had him poisoned. When a river is in front of you and something weighs on you, this is the line.", "ctx": null, "py": "wèn jūn néng yǒu jǐ duō chóu ， qià sì yī jiāng chūn shuǐ xiàng dōng liú"}, "gungun": {"id": "gungun", "zh": "滚滚长江东逝水，浪花淘尽英雄", "segs": [["滚滚", "rolling", "gǔn gǔn"], ["长江", "the Yangtze", "cháng jiāng"], ["东逝水", "waters flowing away east", "dōng shì shuǐ"], ["浪花", "the spray of the waves", "làng huā"], ["淘尽", "washes away completely", "táo jìn"], ["英雄", "heroes", "yīng xióng"]], "en": "The rolling Yangtze flows away east; its waves have washed all the heroes away.", "author": "杨慎", "work": "临江仙·滚滚长江东逝水", "era": "明", "note": "The opening of Romance of the Three Kingdoms, though written three centuries later by a scholar in exile in Yunnan. Every hero you have read about ends up in this line. Say it by any large river.", "ctx": ["是非成败转头空，青山依旧在，几度夕阳红", "shì fēi chéng bài zhuǎn tóu kōng ， qīng shān yī jiù zài ， jǐ dù xī yáng hóng", "Right and wrong, success and failure, gone in a turn of the head; the green hills are still there, and the sunset has reddened them how many times."], "py": "gǔn gǔn cháng jiāng dōng shì shuǐ ， làng huā táo jìn yīng xióng"}, "lihua": {"id": "lihua", "zh": "忽如一夜春风来，千树万树梨花开", "segs": [["忽如", "suddenly as if", "hū rú"], ["一夜", "in one night", "yī yè"], ["春风来", "the spring wind came", "chūn fēng lái"], ["千树万树", "a thousand trees, ten thousand trees", "qiān shù wàn shù"], ["梨花开", "pear blossoms open", "lí huā kāi"]], "en": "As if in one night a spring wind came, and pear blossoms opened on ten thousand trees.", "author": "岑参", "work": "白雪歌送武判官归京", "era": "唐", "note": "Snow on trees described as pear blossom, by a frontier poet in what is now Xinjiang. The standard line for waking up to snow. Also used, more loosely, for anything that blooms everywhere overnight.", "ctx": null, "py": "hū rú yī yè chūn fēng lái ， qiān shù wàn shù lí huā kāi"}, "hanjiang": {"id": "hanjiang", "zh": "孤舟蓑笠翁，独钓寒江雪", "segs": [["孤舟", "a lone boat", "gū zhōu"], ["蓑笠", "straw cape and bamboo hat", "suō lì"], ["翁", "old man", "wēng"], ["独钓", "fishes alone", "dú diào"], ["寒江雪", "the cold river's snow", "hán jiāng xuě"]], "en": "A lone boat, an old man in straw cape and hat, fishing alone in the snow on the cold river.", "author": "柳宗元", "work": "江雪", "era": "唐", "note": "Written in exile. The first two lines empty the world of birds and people; then this. Twenty characters, the most famous solitude in Chinese. Say it when you are alone in cold weather and it feels clean rather than sad.", "ctx": ["千山鸟飞绝，万径人踪灭", "qiān shān niǎo fēi jué ， wàn jìng rén zōng miè", "A thousand mountains, no bird flies; ten thousand paths, no trace of a person."], "py": "gū zhōu suō lì wēng ， dú diào hán jiāng xuě"}, "lushan": {"id": "lushan", "zh": "不识庐山真面目，只缘身在此山中", "segs": [["不识", "cannot see, do not recognise", "bù shí"], ["庐山", "Mount Lu", "lú shān"], ["真面目", "true face", "zhēn miàn mù"], ["只缘", "only because", "zhǐ yuán"], ["身在", "I am", "shēn zài"], ["此山中", "inside this mountain", "cǐ shān zhōng"]], "en": "I cannot see the true face of Mount Lu, only because I am standing inside it.", "author": "苏轼", "work": "题西林壁", "era": "北宋", "note": "The Chinese phrase for being too close to a problem to see it. Say it when you realise you need to step back, or when someone outside your team sees something you could not.", "ctx": null, "py": "bù shí lú shān zhēn miàn mù ， zhǐ yuán shēn zài cǐ shān zhōng"}, "xiyang": {"id": "xiyang", "zh": "夕阳无限好，只是近黄昏", "segs": [["夕阳", "the setting sun", "xī yáng"], ["无限好", "infinitely beautiful", "wú xiàn hǎo"], ["只是", "only, it is just that", "zhǐ shì"], ["近黄昏", "it is close to dusk", "jìn huáng hūn"]], "en": "The setting sun is infinitely beautiful; it is only that dusk is near.", "author": "李商隐", "work": "登乐游原", "era": "唐", "note": "Li Shangyin drove to the heights outside Chang'an because he was feeling low, and wrote this. Beauty and ending in one breath. Say it at a good sunset, or about anything glorious that is nearly over.", "ctx": null, "py": "xī yáng wú xiàn hǎo ， zhǐ shì jìn huáng hūn"}, "luoxia": {"id": "luoxia", "zh": "落霞与孤鹜齐飞，秋水共长天一色", "segs": [["落霞", "the sunset clouds", "luò xiá"], ["与孤鹜", "and a lone wild duck", "yǔ gū wù"], ["齐飞", "fly together", "qí fēi"], ["秋水", "autumn water", "qiū shuǐ"], ["共长天", "with the long sky", "gòng cháng tiān"], ["一色", "one colour", "yī sè"]], "en": "The sunset clouds fly level with a lone wild duck; the autumn water and the long sky are one colour.", "author": "王勃", "work": "滕王阁序", "era": "唐", "note": "Wang Bo supposedly wrote the whole preface at a banquet, at speed, as a young man. The host's own son was meant to deliver a prepared piece; when this line was read out, the host gave up and called it genius. Say it at a sunset over water.", "ctx": null, "py": "luò xiá yǔ gū wù qí fēi ， qiū shuǐ gòng cháng tiān yī sè"}, "xichuang": {"id": "xichuang", "zh": "何当共剪西窗烛，却话巴山夜雨时", "segs": [["何当", "when will we", "hé dāng"], ["共剪", "together trim", "gòng jiǎn"], ["西窗烛", "the candle by the west window", "xī chuāng zhú"], ["却话", "and talk back about", "què huà"], ["巴山", "the Ba mountains (Sichuan)", "bā shān"], ["夜雨时", "this night of rain", "yè yǔ shí"]], "en": "When will we trim the candle by the west window together, and talk about this night of rain in the Ba mountains?", "author": "李商隐", "work": "夜雨寄北", "era": "唐", "note": "Written on a rainy night far from home, imagining a future night when he will describe this one to the person he misses. Time folds twice in four lines. Say it to yourself when you are storing a moment up to tell someone later.", "ctx": ["君问归期未有期，巴山夜雨涨秋池", "jūn wèn guī qī wèi yǒu qī ， bā shān yè yǔ zhǎng qiū chí", "You ask when I return; there is no date. Night rain in the Ba mountains fills the autumn pond."], "py": "hé dāng gòng jiǎn xī chuāng zhú ， què huà bā shān yè yǔ shí"}, "suihan": {"id": "suihan", "zh": "岁寒，然后知松柏之后凋也", "segs": [["岁寒", "when the year turns cold", "suì hán"], ["然后", "only then", "rán hòu"], ["知", "do we know", "zhī"], ["松柏", "pine and cypress", "sōng bǎi"], ["之", "(links subject and verb)", "zhī"], ["后凋", "are the last to wither", "hòu diāo"], ["也", "(sentence-final particle)", "yě"]], "en": "Only when the year turns cold do we know that the pine and cypress are the last to wither.", "author": "孔子", "work": "论语·子罕", "era": "春秋", "note": "Hard times reveal who is solid. The pine and cypress became the symbols of constancy because of this one line. Say it about a friend or a colleague who held up when things got bad.", "ctx": null, "py": "suì hán ， rán hòu zhī sōng bǎi zhī hòu diāo yě"}, "yehuo": {"id": "yehuo", "zh": "野火烧不尽，春风吹又生", "segs": [["野火", "wildfire", "yě huǒ"], ["烧不尽", "cannot burn it all", "shāo bù jìn"], ["春风", "spring wind", "chūn fēng"], ["吹又生", "blows and it grows again", "chuī yòu shēng"]], "en": "Wildfire cannot burn it out; the spring wind blows and it grows again.", "author": "白居易", "work": "赋得古原草送别", "era": "唐", "note": "Bai Juyi wrote this at sixteen. An older poet had joked that with a name like 居易 (live easily) living in the capital would not be easy; after reading this he said, with a talent like this, living anywhere is easy. Say it about anything, or anyone, that keeps coming back.", "ctx": null, "py": "yě huǒ shāo bù jìn ， chūn fēng chuī yòu shēng"}, "luohong": {"id": "luohong", "zh": "落红不是无情物，化作春泥更护花", "segs": [["落红", "fallen petals (literally: fallen red)", "luò hóng"], ["不是", "are not", "bú shì"], ["无情物", "things without feeling", "wú qíng wù"], ["化作", "turn into", "huà zuò"], ["春泥", "spring mud", "chūn ní"], ["更护花", "and go on protecting the flowers", "gèng hù huā"]], "en": "Fallen petals are not heartless things; they become spring mud and protect the next flowers.", "author": "龚自珍", "work": "己亥杂诗·其五", "era": "清", "note": "Written the day he resigned from office and left the capital. Leaving a role but still nourishing what comes after. Say it when you hand something over, or when you decide to help without credit.", "ctx": null, "py": "luò hóng bú shì wú qíng wù ， huà zuò chūn ní gèng hù huā"}, "qingming": {"id": "qingming", "zh": "清明时节雨纷纷，路上行人欲断魂", "segs": [["清明时节", "around the Qingming festival", "qīng míng shí jié"], ["雨纷纷", "rain falls in a fine tangle", "yǔ fēn fēn"], ["路上行人", "travellers on the road", "lù shàng xíng rén"], ["欲断魂", "seem about to lose their souls (heartbroken)", "yù duàn hún"]], "en": "Around Qingming the rain falls thick and fine; travellers on the road look ready to lose their souls.", "author": "杜牧", "work": "清明", "era": "唐", "note": "Qingming is the tomb-sweeping festival in early April, when families visit their ancestors' graves. This is its poem. It ends with a cowherd pointing the way to a wine shop in Apricot Blossom Village.", "ctx": null, "py": "qīng míng shí jié yǔ fēn fēn ， lù shàng xíng rén yù duàn hún"}, "baozhu": {"id": "baozhu", "zh": "爆竹声中一岁除，春风送暖入屠苏", "segs": [["爆竹声中", "amid the sound of firecrackers", "bào zhú shēng zhōng"], ["一岁除", "one year is removed, ends", "yī suì chú"], ["春风", "spring wind", "chūn fēng"], ["送暖", "brings warmth", "sòng nuǎn"], ["入屠苏", "into the tusu wine (a New Year herbal wine)", "rù tú sū"]], "en": "Amid the crack of firecrackers a year is done; the spring wind brings warmth into the New Year wine.", "author": "王安石", "work": "元日", "era": "北宋", "note": "The Lunar New Year poem. Wang Anshi wrote it as he launched his sweeping reforms, and the last line, new peach-wood charms replacing old ones, is also about that. Say it on New Year's Eve.", "ctx": null, "py": "bào zhú shēng zhōng yī suì chú ， chūn fēng sòng nuǎn rù tú sū"}, "liushao": {"id": "liushao", "zh": "月上柳梢头，人约黄昏后", "segs": [["月上", "the moon rises to", "yuè shàng"], ["柳梢头", "the tips of the willows", "liǔ shāo tóu"], ["人约", "people arrange to meet", "rén yuē"], ["黄昏后", "after dusk", "huáng hūn hòu"]], "en": "The moon climbs to the willow tips; we agreed to meet after dusk.", "author": "欧阳修", "work": "生查子·元夕", "era": "北宋", "note": "Also attributed to the female poet 朱淑真. A Lantern Festival love poem: the first half is last year, this line; the second half is this year, same moon, same lanterns, the person gone. Say it when you have plans after dark.", "ctx": null, "py": "yuè shàng liǔ shāo tóu ， rén yuē huáng hūn hòu"}, "qiusuo": {"id": "qiusuo", "zh": "路漫漫其修远兮，吾将上下而求索", "segs": [["路", "the road", "lù"], ["漫漫", "long and endless", "màn màn"], ["其", "(particle)", "qí"], ["修远", "long and far", "xiū yuǎn"], ["兮", "(ancient exclamation, like 'ah')", "xī"], ["吾将", "I will", "wú jiāng"], ["上下", "high and low", "shàng xià"], ["而求索", "search and seek", "ér qiú suǒ"]], "en": "The road is long, so far and long; I will search high and low.", "author": "屈原", "work": "离骚", "era": "战国", "note": "From the Li Sao, the founding poem of the southern tradition, by a minister who drowned himself in protest. The Dragon Boat festival commemorates him. The most quoted line in Chinese about a long quest. Say it when you commit to a search you know will take years.", "ctx": null, "py": "lù màn màn qí xiū yuǎn xī ， wú jiāng shàng xià ér qiú suǒ"}, "zhizhi": {"id": "zhizhi", "zh": "知之为知之，不知为不知，是知也", "segs": [["知之", "knowing something", "zhī zhī"], ["为知之", "count it as known", "wéi zhī zhī"], ["不知", "not knowing", "bù zhī"], ["为不知", "count it as not known", "wéi bù zhī"], ["是", "this is", "shì"], ["知也", "knowledge, wisdom", "zhī yě"]], "en": "To know what you know and know what you do not know: this is knowledge.", "author": "孔子", "work": "论语·为政", "era": "春秋", "note": "Said to 子路, the boldest and most bluffing of the disciples. The last 知 is sometimes read as 智, wisdom. Say it when you catch yourself, or someone else, pretending to know.", "ctx": null, "py": "zhī zhī wéi zhī zhī ， bù zhī wéi bù zhī ， shì zhī yě"}, "shizhe": {"id": "shizhe", "zh": "逝者如斯夫，不舍昼夜", "segs": [["逝者", "that which passes", "shì zhě"], ["如斯", "is like this", "rú sī"], ["夫", "(exclamation)", "fū"], ["不舍", "does not stop", "bù shě"], ["昼夜", "day or night", "zhòu yè"]], "en": "What passes is like this: it does not stop, day or night.", "author": "孔子", "work": "论语·子罕", "era": "春秋", "note": "Confucius on a riverbank. Two thousand years of commentary disagree about whether this is a lament or an encouragement. Say it by moving water when time is on your mind.", "ctx": null, "py": "shì zhě rú sī fū ， bù shě zhòu yè"}, "modengxian": {"id": "modengxian", "zh": "莫等闲，白了少年头，空悲切", "segs": [["莫等闲", "do not idle", "mò děng xián"], ["白了", "until white is", "bái le"], ["少年头", "the young head (hair)", "shào nián tóu"], ["空", "in vain", "kōng"], ["悲切", "grieve bitterly", "bēi qiè"]], "en": "Do not idle until your young hair turns white and grieve in vain.", "author": "岳飞", "work": "满江红·怒发冲冠", "era": "南宋", "note": "Yue Fei, the general who was executed by his own court for wanting to keep fighting the Jurchen. Fierce and urgent. Say it when you catch yourself wasting a day.", "ctx": null, "py": "mò děng xián ， bái le shào nián tóu ， kōng bēi qiè"}, "gongxing": {"id": "gongxing", "zh": "纸上得来终觉浅，绝知此事要躬行", "segs": [["纸上", "from paper, from books", "zhǐ shàng"], ["得来", "what is gained", "dé lái"], ["终觉浅", "always feels shallow", "zhōng jué qiǎn"], ["绝知", "to truly know", "jué zhī"], ["此事", "this matter", "cǐ shì"], ["要躬行", "you must do it yourself", "yào gōng xíng"]], "en": "What comes from books always feels shallow; to truly know a thing you must do it with your own hands.", "author": "陆游", "work": "冬夜读书示子聿", "era": "南宋", "note": "Written to his son on a winter night. Lu You wrote nearly ten thousand poems and still said this. Say it when you have read enough and need to build.", "ctx": null, "py": "zhǐ shàng dé lái zhōng jué qiǎn ， jué zhī cǐ shì yào gōng xíng"}, "nanyi": {"id": "nanyi", "zh": "天下事有难易乎？为之，则难者亦易矣", "segs": [["天下事", "matters under heaven, any undertaking", "tiān xià shì"], ["有难易乎", "are there hard and easy ones?", "yǒu nán yì hū"], ["为之", "do it", "wéi zhī"], ["则", "then", "zé"], ["难者", "the hard one", "nán zhě"], ["亦易矣", "becomes easy too", "yì yì yǐ"]], "en": "Is anything in the world hard or easy? Do it, and the hard becomes easy.", "author": "彭端淑", "work": "为学一首示子侄", "era": "清", "note": "From an essay about two monks who wanted to go to the South Sea: the rich one spent years planning a boat, the poor one set off with a bowl and came back a year later. Say it when you are over-planning.", "ctx": ["不为，则易者亦难矣", "bù wèi ， zé yì zhě yì nán yǐ", "Do not do it, and the easy becomes hard."], "py": "tiān xià shì yǒu nán yì hū ？ wéi zhī ， zé nán zhě yì yì yǐ"}, "huofu": {"id": "huofu", "zh": "祸兮福之所倚，福兮祸之所伏", "segs": [["祸", "misfortune", "huò"], ["兮", "(exclamation)", "xī"], ["福之所倚", "is what fortune leans on", "fú zhī suǒ yǐ"], ["福", "fortune", "fú"], ["兮", "(exclamation)", "xī"], ["祸之所伏", "is where misfortune lies hidden", "huò zhī suǒ fú"]], "en": "Misfortune is what fortune leans on; fortune is where misfortune hides.", "author": "老子", "work": "道德经·第五十八章", "era": "春秋", "note": "The source of the folk story 塞翁失马 (the old man who lost his horse). Say it when a plan fails and you suspect it might turn out to be a gift, or when things are going too well.", "ctx": null, "py": "huò xī fú zhī suǒ yǐ ， fú xī huò zhī suǒ fú"}, "zizhi": {"id": "zizhi", "zh": "知人者智，自知者明", "segs": [["知人者", "one who knows others", "zhī rén zhě"], ["智", "is clever", "zhì"], ["自知者", "one who knows himself", "zì zhī zhě"], ["明", "is enlightened, clear-sighted", "míng"]], "en": "To know others is cleverness; to know yourself is clarity.", "author": "老子", "work": "道德经·第三十三章", "era": "春秋", "note": "The chapter continues: to overcome others is strength, to overcome yourself is true power. Say it when you catch a blind spot in your own thinking.", "ctx": ["胜人者有力，自胜者强", "shèng rén zhě yǒu lì ， zì shèng zhě qiáng", "One who overcomes others has force; one who overcomes himself is strong."], "py": "zhī rén zhě zhì ， zì zhī zhě míng"}, "shaou": {"id": "shaou", "zh": "飘飘何所似，天地一沙鸥", "segs": [["飘飘", "drifting", "piāo piāo"], ["何所似", "what am I like?", "hé suǒ shì"], ["天地", "between heaven and earth", "tiān dì"], ["一沙鸥", "a single sand gull", "yī shā ōu"]], "en": "Drifting, what am I like? A single gull between heaven and earth.", "author": "杜甫", "work": "旅夜书怀", "era": "唐", "note": "Du Fu on a boat at night, jobless, sick, and far from anywhere. Say it when you feel unmoored, and want to say so without complaining.", "ctx": null, "py": "piāo piāo hé suǒ shì ， tiān dì yī shā ōu"}, "gengshang": {"id": "gengshang", "zh": "欲穷千里目，更上一层楼", "segs": [["欲", "if you want to", "yù"], ["穷", "exhaust, see to the end of", "qióng"], ["千里目", "a thousand-li view", "qiān lǐ mù"], ["更上", "climb up one more", "gèng shàng"], ["一层楼", "storey of the tower", "yī céng lóu"]], "en": "If you want to see a thousand li, climb one more storey.", "author": "王之涣", "work": "登鹳雀楼", "era": "唐", "note": "Twenty characters every Chinese child can recite. Literal at a viewpoint, and the standard metaphor for needing a higher vantage to see further. Say it on a climb, or when you decide to go one level up on a problem.", "ctx": null, "py": "yù qióng qiān lǐ mù ， gèng shàng yī céng lóu"}, "chunfeng": {"id": "chunfeng", "zh": "春风得意马蹄疾，一日看尽长安花", "segs": [["春风得意", "pleased as a spring wind (in high spirits)", "chūn fēng dé yì"], ["马蹄疾", "horse's hooves fly", "mǎ tí jí"], ["一日", "in one day", "yī rì"], ["看尽", "see all of", "kàn jìn"], ["长安花", "the flowers of Chang'an", "cháng ān huā"]], "en": "In high spirits my horse's hooves fly; in one day I see all the flowers of Chang'an.", "author": "孟郊", "work": "登科后", "era": "唐", "note": "Meng Jiao passed the imperial exam at forty-six after failing repeatedly. 春风得意 became the phrase for a person riding high. Say it on the day something you worked years for finally comes through.", "ctx": null, "py": "chūn fēng dé yì mǎ tí jí ， yī rì kàn jìn cháng ān huā"}, "guanshan": {"id": "guanshan", "zh": "无为在歧路，儿女共沾巾", "segs": [["无为", "do not", "wú wéi"], ["在歧路", "at the fork in the road", "zài qí lù"], ["儿女", "like boy and girl", "ér nǚ"], ["共沾巾", "together wet your handkerchiefs", "gòng zhān jīn"]], "en": "Do not stand at the fork in the road wetting your handkerchiefs like children.", "author": "王勃", "work": "送杜少府之任蜀州", "era": "唐", "note": "The line right after 海内存知己. Bracing, almost brusque. Say it when a goodbye is getting too teary.", "ctx": null, "py": "wú wéi zài qí lù ， ér nǚ gòng zhān jīn"}, "jinzun": {"id": "jinzun", "zh": "人生得意须尽欢，莫使金樽空对月", "segs": [["人生", "in life", "rén shēng"], ["得意", "when things go your way", "dé yì"], ["须", "must", "xū"], ["尽欢", "enjoy to the full", "jìn huān"], ["莫使", "do not let", "mò shǐ"], ["金樽", "the golden cup", "jīn zūn"], ["空", "empty", "kōng"], ["对月", "face the moon", "duì yuè"]], "en": "When life goes your way, enjoy it to the full; never let the golden cup sit empty under the moon.", "author": "李白", "work": "将进酒", "era": "唐", "note": "Li Bai's drinking song. The line for a good night that you refuse to waste. He follows it with 天生我材必有用. Say it when raising a glass among friends.", "ctx": null, "py": "rén shēng dé yì xū jìn huān ， mò shǐ jīn zūn kōng duì yuè"}, "qingzhou": {"id": "qingzhou", "zh": "两岸猿声啼不住，轻舟已过万重山", "segs": [["两岸", "on both banks", "liǎng àn"], ["猿声", "the cries of gibbons", "yuán shēng"], ["啼不住", "cannot stop calling", "tí bú zhù"], ["轻舟", "the light boat", "qīng zhōu"], ["已过", "has already passed", "yǐ guò"], ["万重山", "ten thousand folds of mountain", "wàn zhòng shān"]], "en": "The gibbons on both banks are still crying, and my light boat has already passed ten thousand mountains.", "author": "李白", "work": "早发白帝城", "era": "唐", "note": "Li Bai had just been pardoned on his way to exile and turned his boat around. The mountains that took weeks to pass going up take a morning coming down. Say it when something that dragged for ages is suddenly behind you.", "ctx": null, "py": "liǎng àn yuán shēng tí bú zhù ， qīng zhōu yǐ guò wàn zhòng shān"}, "choudao": {"id": "choudao", "zh": "抽刀断水水更流，举杯消愁愁更愁", "segs": [["抽刀", "draw a sword", "chōu dāo"], ["断水", "cut the water", "duàn shuǐ"], ["水更流", "the water flows on harder", "shuǐ gèng liú"], ["举杯", "raise a cup", "jǔ bēi"], ["消愁", "to drown sorrow", "xiāo chóu"], ["愁更愁", "the sorrow deepens", "chóu gèng chóu"]], "en": "Draw a sword to cut the water and the water flows harder; raise a cup to drown sorrow and the sorrow deepens.", "author": "李白", "work": "宣州谢朓楼饯别校书叔云", "era": "唐", "note": "Trying to stop a feeling by force makes it stronger. Say it when you notice you are fighting your own mind, or when someone reaches for a drink to fix something a drink cannot fix.", "ctx": null, "py": "chōu dāo duàn shuǐ shuǐ gèng liú ， jǔ bēi xiāo chóu chóu gèng chóu"}, "yangtian": {"id": "yangtian", "zh": "仰天大笑出门去，我辈岂是蓬蒿人", "segs": [["仰天", "face the sky", "yǎng tiān"], ["大笑", "laugh loudly", "dà xiào"], ["出门去", "walk out the door", "chū mén qù"], ["我辈", "people like me", "wǒ bèi"], ["岂是", "how could we be", "qǐ shì"], ["蓬蒿人", "weed-and-bramble people (nobodies)", "péng hāo rén"]], "en": "I throw my head back, laugh, and walk out the door; how could someone like me be a nobody in the weeds?", "author": "李白", "work": "南陵别儿童入京", "era": "唐", "note": "Li Bai, aged forty-one, had just been summoned to the imperial court after years of waiting. This is the sound of leaving for the big opportunity. Loud, and he knew it.", "ctx": null, "py": "yǎng tiān dà xiào chū mén qù ， wǒ bèi qǐ shì péng hāo rén"}, "guangsha": {"id": "guangsha", "zh": "安得广厦千万间，大庇天下寒士俱欢颜", "segs": [["安得", "how could I get", "ān dé"], ["广厦", "a great house", "guǎng shà"], ["千万间", "with ten million rooms", "qiān wàn jiān"], ["大庇", "to shelter broadly", "dà bì"], ["天下寒士", "all the cold scholars under heaven", "tiān xià hán shì"], ["俱欢颜", "all with glad faces", "jù huān yán"]], "en": "If only I could get a great house of ten million rooms, to shelter every poor scholar under heaven and make all their faces glad.", "author": "杜甫", "work": "茅屋为秋风所破歌", "era": "唐", "note": "The wind had just torn the roof off his hut and his children were cold. He wished for a house for everyone else. Say it when you want to build something that shelters many people, not just yourself.", "ctx": null, "py": "ān dé guǎng shà qiān wàn jiān ， dà bì tiān xià hán shì jù huān yán"}, "powanjuan": {"id": "powanjuan", "zh": "读书破万卷，下笔如有神", "segs": [["读书", "read books", "dú shū"], ["破万卷", "wear through ten thousand scrolls", "pò wàn juàn"], ["下笔", "put brush to paper", "xià bǐ"], ["如有神", "as if a spirit guides it", "rú yǒu shén"]], "en": "Read until ten thousand scrolls are worn through, and when you write it is as if a spirit moves your brush.", "author": "杜甫", "work": "奉赠韦左丞丈二十二韵", "era": "唐", "note": "Du Fu describing his own preparation to a patron. Input in bulk, then output that feels effortless. Say it when the years of reading finally show in the work.", "ctx": null, "py": "dú shū pò wàn juàn ， xià bǐ rú yǒu shén"}, "jiashu": {"id": "jiashu", "zh": "烽火连三月，家书抵万金", "segs": [["烽火", "beacon fires (war)", "fēng huǒ"], ["连三月", "have lasted three months", "lián sān yuè"], ["家书", "a letter from home", "jiā shū"], ["抵", "is worth", "dǐ"], ["万金", "ten thousand gold", "wàn jīn"]], "en": "Beacon fires have burned three months running; a letter from home is worth ten thousand in gold.", "author": "杜甫", "work": "春望", "era": "唐", "note": "Du Fu trapped in occupied Chang'an during the An Lushan rebellion. Say it when a message from family arrives in the middle of a hard stretch.", "ctx": null, "py": "fēng huǒ lián sān yuè ， jiā shū dǐ wàn jīn"}, "guxiangming": {"id": "guxiangming", "zh": "露从今夜白，月是故乡明", "segs": [["露", "the dew", "lù"], ["从今夜", "from tonight", "cóng jīn yè"], ["白", "turns white (the White Dew solar term)", "bái"], ["月", "the moon", "yuè"], ["是", "is", "shì"], ["故乡", "my hometown", "gù xiāng"], ["明", "bright", "míng"]], "en": "From tonight the dew turns white; the moon is brightest over home.", "author": "杜甫", "work": "月夜忆舍弟", "era": "唐", "note": "Written for his scattered brothers during the rebellion, on the night the White Dew term begins in early September. The moon is not actually brighter at home. That is the point.", "ctx": null, "py": "lù cóng jīn yè bái ， yuè shì gù xiāng míng"}, "xueni": {"id": "xueni", "zh": "人生到处知何似，应似飞鸿踏雪泥", "segs": [["人生", "a human life", "rén shēng"], ["到处", "wherever it goes", "dào chù"], ["知何似", "what is it like?", "zhī hé shì"], ["应似", "must be like", "yīng shì"], ["飞鸿", "a wild goose in flight", "fēi hóng"], ["踏雪泥", "stepping on snowy mud", "tà xuě ní"]], "en": "What is a life, wherever it goes? It must be like a wild goose landing on snowy mud.", "author": "苏轼", "work": "和子由渑池怀旧", "era": "北宋", "note": "The next lines: the mud keeps a claw-print by chance, and the goose flies off not caring east or west. The origin of the phrase 雪泥鸿爪, the traces we leave. Say it when you revisit a place from years ago.", "ctx": ["泥上偶然留指爪，鸿飞那复计东西", "ní shàng ǒu rán liú zhǐ zhǎo ， hóng fēi nà fù jì dōng xī", "By chance it leaves a claw-print in the mud; the goose flies on, not counting east or west."], "py": "rén shēng dào chù zhī hé shì ， yīng shì fēi hóng tà xuě ní"}, "chunxiao": {"id": "chunxiao", "zh": "春宵一刻值千金，花有清香月有阴", "segs": [["春宵", "a spring night", "chūn xiāo"], ["一刻", "one quarter-hour", "yī kè"], ["值千金", "is worth a thousand gold", "zhí qiān jīn"], ["花有清香", "the flowers have a clear fragrance", "huā yǒu qīng xiāng"], ["月有阴", "the moon has its shadows", "yuè yǒu yīn"]], "en": "A quarter-hour of a spring night is worth a thousand gold; the flowers have their scent, the moon its shadows.", "author": "苏轼", "work": "春宵", "era": "北宋", "note": "Now used for any precious evening. Say it on a night you don't want to end, or as a reason not to go home yet.", "ctx": null, "py": "chūn xiāo yī kè zhí qiān jīn ， huā yǒu qīng xiāng yuè yǒu yīn"}, "dajiang": {"id": "dajiang", "zh": "大江东去，浪淘尽，千古风流人物", "segs": [["大江", "the great river", "dà jiāng"], ["东去", "flows east", "dōng qù"], ["浪淘尽", "the waves have washed away", "làng táo jìn"], ["千古", "a thousand ages of", "qiān gǔ"], ["风流人物", "brilliant figures", "fēng liú rén wù"]], "en": "The great river flows east, and its waves have washed away the brilliant figures of a thousand ages.", "author": "苏轼", "work": "念奴娇·赤壁怀古", "era": "北宋", "note": "The opening of the most famous of all Song ci, written at Red Cliff in exile. The heroes of the Three Kingdoms are gone; the river is not. Say it by any large river, or about anyone who was once the most important person in the room.", "ctx": null, "py": "dà jiāng dōng qù ， làng táo jìn ， qiān gǔ fēng liú rén wù"}, "zaishao": {"id": "zaishao", "zh": "谁道人生无再少？门前流水尚能西", "segs": [["谁道", "who says", "shuí dào"], ["人生", "in life", "rén shēng"], ["无再少", "there is no second youth", "wú zài shào"], ["门前", "before the gate", "mén qián"], ["流水", "the stream", "liú shuǐ"], ["尚能西", "can still flow west", "shàng néng xī"]], "en": "Who says life has no second youth? The stream before the gate can still run west.", "author": "苏轼", "work": "浣溪沙·游蕲水清泉寺", "era": "北宋", "note": "Every Chinese river flows east; Su Shi found one running west and took it personally. Say it when starting over later than you planned.", "ctx": null, "py": "shuí dào rén shēng wú zài shào ？ mén qián liú shuǐ shàng néng xī"}, "shuiqiong": {"id": "shuiqiong", "zh": "行到水穷处，坐看云起时", "segs": [["行到", "walk until", "xíng dào"], ["水穷处", "the place where the water ends", "shuǐ qióng chù"], ["坐看", "sit and watch", "zuò kàn"], ["云起时", "the moment the clouds rise", "yún qǐ shí"]], "en": "Walk until the stream runs out, then sit and watch the clouds rise.", "author": "王维", "work": "终南别业", "era": "唐", "note": "Wang Wei following a stream up the mountain with no destination. When it ends, he sits. The Chinese line for reaching the end of a path and not treating it as a problem.", "ctx": null, "py": "xíng dào shuǐ qióng chù ， zuò kàn yún qǐ shí"}, "mingyuesong": {"id": "mingyuesong", "zh": "明月松间照，清泉石上流", "segs": [["明月", "the bright moon", "míng yuè"], ["松间", "between the pines", "sōng jiān"], ["照", "shines", "zhào"], ["清泉", "a clear spring", "qīng quán"], ["石上", "over the stones", "shí shàng"], ["流", "flows", "liú"]], "en": "The bright moon shines between the pines; a clear spring flows over the stones.", "author": "王维", "work": "山居秋暝", "era": "唐", "note": "Ten characters, two images, no adjectives that aren't needed. The evening after rain in the mountains. Say it on a clear night by water.", "ctx": null, "py": "míng yuè sōng jiān zhào ， qīng quán shí shàng liú"}, "kongshan": {"id": "kongshan", "zh": "空山不见人，但闻人语响", "segs": [["空山", "the empty mountain", "kōng shān"], ["不见人", "no one to be seen", "bú jiàn rén"], ["但闻", "only hear", "dàn wén"], ["人语响", "the echo of voices", "rén yǔ xiǎng"]], "en": "Empty mountain, no one in sight, only the echo of voices somewhere.", "author": "王维", "work": "鹿柴", "era": "唐", "note": "Wang Wei's most translated poem. Presence proven by absence. Say it in any quiet place where you can hear people you cannot see.", "ctx": null, "py": "kōng shān bú jiàn rén ， dàn wén rén yǔ xiǎng"}, "canghai2": {"id": "canghai2", "zh": "曾经沧海难为水，除却巫山不是云", "segs": [["曾经", "having once", "céng jīng"], ["沧海", "seen the vast sea", "cāng hǎi"], ["难为水", "no other water counts as water", "nán wéi shuǐ"], ["除却", "apart from", "chú què"], ["巫山", "Mount Wu (famed for its clouds)", "wū shān"], ["不是云", "no cloud is a cloud", "bú shì yún"]], "en": "Having seen the ocean, no other water is water; apart from the clouds of Mount Wu, no cloud is a cloud.", "author": "元稹", "work": "离思·其四", "era": "唐", "note": "Written for his dead wife. After something extraordinary, nothing else compares. Said of a person, and also of a place, a teacher, a city, a job.", "ctx": null, "py": "céng jīng cāng hǎi nán wéi shuǐ ， chú què wū shān bú shì yún"}, "lingxi": {"id": "lingxi", "zh": "身无彩凤双飞翼，心有灵犀一点通", "segs": [["身无", "my body has no", "shēn wú"], ["彩凤", "bright phoenix", "cǎi fèng"], ["双飞翼", "pair of wings to fly to you", "shuāng fēi yì"], ["心有", "but my heart has", "xīn yǒu"], ["灵犀", "the magic rhinoceros horn (believed to have a thread running through it)", "líng xī"], ["一点通", "one point of connection", "yì diǎn tōng"]], "en": "I have no phoenix wings to fly to you, but our hearts are joined like the thread in a rhinoceros horn.", "author": "李商隐", "work": "无题·昨夜星辰昨夜风", "era": "唐", "note": "心有灵犀 is now the everyday phrase for two people who understand each other without a word. Say it when someone finishes your thought.", "ctx": null, "py": "shēn wú cǎi fèng shuāng fēi yì ， xīn yǒu líng xī yī diǎn tōng"}, "yidai": {"id": "yidai", "zh": "衣带渐宽终不悔，为伊消得人憔悴", "segs": [["衣带", "my belt", "yī dài"], ["渐宽", "grows loose", "jiàn kuān"], ["终不悔", "and I never regret it", "zhōng bù huǐ"], ["为伊", "for her, for that", "wèi yī"], ["消得", "it is worth", "xiāo dé"], ["人憔悴", "wasting away", "rén qiáo cuì"]], "en": "My belt grows loose and I don't regret it; for this it is worth wasting away.", "author": "柳永", "work": "蝶恋花·伫倚危楼风细细", "era": "北宋", "note": "A love poem that 王国维 made the second of his three stages of great achievement: the long, thinning grind after the first vision and before the sudden finding. Say it in the middle of something that is costing you.", "ctx": null, "py": "yī dài jiàn kuān zhōng bù huǐ ， wèi yī xiāo dé rén qiáo cuì"}, "liangqing": {"id": "liangqing", "zh": "两情若是久长时，又岂在朝朝暮暮", "segs": [["两情", "two hearts", "liǎng qíng"], ["若是", "if they are", "ruò shì"], ["久长时", "lasting", "jiǔ cháng shí"], ["又岂在", "why would it depend on", "yòu qǐ zài"], ["朝朝暮暮", "every morning and every evening together", "zhāo zhāo mù mù"]], "en": "If two hearts are truly lasting, why would it depend on being together every morning and night?", "author": "秦观", "work": "鹊桥仙·纤云弄巧", "era": "北宋", "note": "About the Cowherd and Weaver Girl, who meet once a year across the Milky Way. The standard line for a long-distance relationship. Some editions read 长久时; both are attested.", "ctx": null, "py": "liǎng qíng ruò shì jiǔ cháng shí ， yòu qǐ zài zhāo zhāo mù mù"}, "yixinren": {"id": "yixinren", "zh": "愿得一心人，白头不相离", "segs": [["愿得", "I wish to have", "yuàn dé"], ["一心人", "a person of one heart", "yī xīn rén"], ["白头", "until our hair is white", "bái tóu"], ["不相离", "never parting", "bù xiāng lí"]], "en": "I want one person with a single heart, and to grow white-haired together, never parting.", "author": "卓文君", "work": "白头吟", "era": "西汉", "note": "By a woman who eloped with the poet 司马相如 and later wrote this when he considered taking a concubine. He changed his mind. Say it about what you actually want from a relationship.", "ctx": null, "py": "yuàn dé yī xīn rén ， bái tóu bù xiāng lí"}, "shinian": {"id": "shinian", "zh": "十年生死两茫茫，不思量，自难忘", "segs": [["十年", "ten years", "shí nián"], ["生死", "the living and the dead", "shēng sǐ"], ["两茫茫", "each lost to the other in vastness", "liǎng máng máng"], ["不思量", "I don't dwell on it", "bù sī liáng"], ["自难忘", "yet cannot forget", "zì nán wàng"]], "en": "Ten years, the living and the dead each lost in a vastness; I don't dwell on it, and cannot forget.", "author": "苏轼", "work": "江城子·乙卯正月二十日夜记梦", "era": "北宋", "note": "Written after dreaming of his wife, dead ten years. The truest line in Chinese about grief that has settled but not gone. Say it on an anniversary.", "ctx": null, "py": "shí nián shēng sǐ liǎng máng máng ， bù sī liáng ， zì nán wàng"}, "danxin": {"id": "danxin", "zh": "人生自古谁无死，留取丹心照汗青", "segs": [["人生", "in life", "rén shēng"], ["自古", "since ancient times", "zì gǔ"], ["谁无死", "who does not die", "shuí wú sǐ"], ["留取", "keep", "liú qǔ"], ["丹心", "a red (loyal) heart", "dān xīn"], ["照汗青", "to shine on the histories (bamboo records)", "zhào hàn qīng"]], "en": "Since ancient times who has not died? Keep a loyal heart to shine on the record of history.", "author": "文天祥", "work": "过零丁洋", "era": "南宋", "note": "Written in captivity by the last prime minister of the Song, who refused to serve the Mongols and was executed. Say it when doing the right thing is going to cost you.", "ctx": null, "py": "rén shēng zì gǔ shéi wú sǐ ， liú qǔ dān xīn zhào hàn qīng"}, "chouziwei": {"id": "chouziwei", "zh": "而今识尽愁滋味，欲说还休", "segs": [["而今", "now", "ér jīn"], ["识尽", "I have tasted fully", "shí jǐn"], ["愁滋味", "the flavour of sorrow", "chóu zī wèi"], ["欲说", "about to speak", "yù shuō"], ["还休", "and stop", "hái xiū"]], "en": "Now that I know the full taste of sorrow, I open my mouth to speak, and stop.", "author": "辛弃疾", "work": "丑奴儿·书博山道中壁", "era": "南宋", "note": "The first half of the poem is about being young and pretending to be sad for effect. This is the second half. Say it when someone asks how you are and the honest answer is too long.", "ctx": ["少年不识愁滋味，爱上层楼，为赋新词强说愁", "shào nián bù shí chóu zī wèi ， ài shàng céng lóu ， wèi fù xīn cí qiáng shuō chóu", "When young I did not know the taste of sorrow; I loved to climb towers and forced a little sadness into my poems."], "py": "ér jīn shí jìn chóu zī wèi ， yù shuō hái xiū"}, "ertong": {"id": "ertong", "zh": "儿童相见不相识，笑问客从何处来", "segs": [["儿童", "the children", "ér tóng"], ["相见", "see me", "xiāng jiàn"], ["不相识", "do not know me", "bù xiāng shí"], ["笑问", "laughing, they ask", "xiào wèn"], ["客", "the visitor", "kè"], ["从何处来", "where are you from?", "cóng hé chù lái"]], "en": "The children see me and don't know me; laughing, they ask the stranger where he's from.", "author": "贺知章", "work": "回乡偶书·其一", "era": "唐", "note": "He came home at eighty-six after fifty years away. The previous line: my accent is unchanged, my hair is thin. Say it when you go back to a place that has forgotten you.", "ctx": ["少小离家老大回，乡音无改鬓毛衰", "shào xiǎo lí jiā lǎo dà huí ， xiāng yīn wú gǎi bìn máo shuāi", "I left home young and return old; my accent unchanged, my temples thinned."], "py": "ér tóng xiāng jiàn bù xiāng shí ， xiào wèn kè cóng hé chù lái"}, "fangcao": {"id": "fangcao", "zh": "天涯何处无芳草", "segs": [["天涯", "to the sky's edge", "tiān yá"], ["何处", "where", "hé chù"], ["无", "is there no", "wú"], ["芳草", "fragrant grass", "fāng cǎo"]], "en": "Where under heaven is there no fragrant grass?", "author": "苏轼", "work": "蝶恋花·春景", "era": "北宋", "note": "Now the standard consolation after a rejection: there are other people, other places, other chances. In the original it is about spring going, not a breakup, which makes it gentler than its modern use.", "ctx": null, "py": "tiān yá hé chù wú fāng cǎo"}, "fuyun2": {"id": "fuyun2", "zh": "不畏浮云遮望眼，自缘身在最高层", "segs": [["不畏", "I don't fear", "bù wèi"], ["浮云", "drifting clouds", "fú yún"], ["遮望眼", "blocking my view", "zhē wàng yǎn"], ["自缘", "simply because", "zì yuán"], ["身在", "I stand", "shēn zài"], ["最高层", "on the highest tier", "zuì gāo céng"]], "en": "I don't fear the drifting clouds blocking my view, because I stand on the highest tier.", "author": "王安石", "work": "登飞来峰", "era": "北宋", "note": "Written at thirty, before his great reforms. Noise cannot fool you if your vantage is high enough. Say it when the news, or the office, is full of clouds.", "ctx": null, "py": "bù wèi fú yún zhē wàng yǎn ， zì yuán shēn zài zuì gāo céng"}, "qianmo": {"id": "qianmo", "zh": "千磨万击还坚劲，任尔东西南北风", "segs": [["千磨万击", "a thousand grindings, ten thousand blows", "qiān mó wàn jī"], ["还坚劲", "still firm and strong", "hái jiān jìn"], ["任尔", "let you (the wind) be", "rèn ěr"], ["东西南北风", "east, west, south, or north wind", "dōng xī nán běi fēng"]], "en": "A thousand grindings, ten thousand blows, and still it stands firm; let the wind come from any quarter it likes.", "author": "郑燮", "work": "竹石", "era": "清", "note": "Zheng Banqiao, painter of bamboo, on bamboo rooted in rock. Say it when criticism is coming from every direction and you have decided not to move.", "ctx": null, "py": "qiān mó wàn jī hái jiān jìn ， rèn ěr dōng xī nán běi fēng"}, "manzhao": {"id": "manzhao", "zh": "满招损，谦受益", "segs": [["满", "fullness, pride", "mǎn"], ["招损", "invites loss", "zhāo sǔn"], ["谦", "humility", "qiān"], ["受益", "receives benefit", "shòu yì"]], "en": "Pride invites loss; humility receives benefit.", "author": "尚书", "work": "大禹谟", "era": "上古", "note": "From the Book of Documents, among the oldest Chinese texts. Six characters. Say it to yourself when the praise is arriving faster than the work deserves.", "ctx": null, "py": "mǎn zhāo sǔn ， qiān shòu yì"}, "buyun": {"id": "buyun", "zh": "人不知而不愠，不亦君子乎", "segs": [["人不知", "others do not know me", "rén bù zhī"], ["而不愠", "and I am not resentful", "ér bù yùn"], ["不亦", "is that not", "bù yì"], ["君子乎", "a noble person?", "jūn zǐ hū"]], "en": "To be unknown and not resentful: is that not the mark of a noble person?", "author": "孔子", "work": "论语·学而", "era": "春秋", "note": "The third sentence of the Analects, right after the one about friends from afar. Not being recognised is the test; the resentment is what fails it.", "ctx": null, "py": "rén bù zhī ér bù yùn ， bù yì jūn zǐ hū"}, "cuncao": {"id": "cuncao", "zh": "谁言寸草心，报得三春晖", "segs": [["谁言", "who says", "shuí yán"], ["寸草心", "the heart of an inch-high blade of grass", "cùn cǎo xīn"], ["报得", "can repay", "bào dé"], ["三春晖", "the light of three months of spring", "sān chūn huī"]], "en": "Who says the heart of a blade of grass can ever repay the light of three months of spring?", "author": "孟郊", "work": "游子吟", "era": "唐", "note": "The mother sewing her son's clothes before he leaves. The most quoted line in Chinese about what we owe our parents. Say it before you call home.", "ctx": null, "py": "shuí yán cùn cǎo xīn ， bào dé sān chūn huī"}, "shukeren": {"id": "shukeren", "zh": "是可忍，孰不可忍", "segs": [["是", "this", "shì"], ["可忍", "can be tolerated", "kě rěn"], ["孰", "what then", "shú"], ["不可忍", "cannot be tolerated", "bù kě rěn"]], "en": "If this can be tolerated, what cannot?", "author": "孔子", "work": "论语·八佾", "era": "春秋", "note": "Confucius on a minister who used the emperor's dance troupe at his own house. The Chinese way to say a line has been crossed. Say it rarely; it is strong.", "ctx": null, "py": "shì kě rěn ， shú bù kě rěn"}, "danrushui": {"id": "danrushui", "zh": "君子之交淡如水", "segs": [["君子之交", "the friendship of noble people", "jūn zǐ zhī jiāo"], ["淡", "is plain, light", "dàn"], ["如水", "like water", "rú shuǐ"]], "en": "The friendship of noble people is plain as water.", "author": "庄子", "work": "山木", "era": "战国", "note": "The rest: the friendship of small people is sweet as wine; the plain one lasts, the sweet one breaks. Say it about a friend you haven't spoken to in a year and could call tomorrow.", "ctx": null, "py": "jūn zǐ zhī jiāo dàn rú shuǐ"}, "duxing": {"id": "duxing", "zh": "举世皆浊我独清，众人皆醉我独醒", "segs": [["举世", "the whole world", "jǔ shì"], ["皆浊", "is muddy", "jiē zhuó"], ["我独清", "I alone am clear", "wǒ dú qīng"], ["众人", "everyone", "zhòng rén"], ["皆醉", "is drunk", "jiē zuì"], ["我独醒", "I alone am awake", "wǒ dú xǐng"]], "en": "The whole world is muddy and I alone am clear; everyone is drunk and I alone am awake.", "author": "屈原", "work": "渔父", "era": "战国", "note": "Qu Yuan says this to a fisherman just before drowning himself. The fisherman's reply is to go with the current. Say it when you are sure everyone else is wrong, and then check whether the fisherman had a point.", "ctx": null, "py": "jǔ shì jiē zhuó wǒ dú qīng ， zhòng rén jiē zuì wǒ dú xǐng"}, "guobugai": {"id": "guobugai", "zh": "过而不改，是谓过矣", "segs": [["过", "an error", "guò"], ["而不改", "and not correcting it", "ér bù gǎi"], ["是谓", "that is called", "shì wèi"], ["过矣", "the real error", "guò yǐ"]], "en": "To make a mistake and not correct it: that is the real mistake.", "author": "孔子", "work": "论语·卫灵公", "era": "春秋", "note": "Confucius did not mind errors. He minded defending them. Say it when you catch yourself explaining instead of fixing.", "ctx": null, "py": "guò ér bù gǎi ， shì wèi guò yǐ"}, "shenzheng": {"id": "shenzheng", "zh": "其身正，不令而行", "segs": [["其身正", "if one is upright oneself", "qí shēn zhèng"], ["不令", "without giving orders", "bù lìng"], ["而行", "things get done", "ér xíng"]], "en": "When the leader is upright, things get done without orders.", "author": "孔子", "work": "论语·子路", "era": "春秋", "note": "The second half: if he is not upright, orders are given and not followed. The whole Confucian theory of leadership in ten characters. Say it when you are about to ask people to do something you don't do.", "ctx": ["其身不正，虽令不从", "qí shēn bù zhèng ， suī lìng bù cóng", "If he is not upright himself, even his orders are not obeyed."], "py": "qí shēn zhèng ， bù lìng ér xíng"}, "jisuo": {"id": "jisuo", "zh": "己所不欲，勿施于人", "segs": [["己", "yourself", "jǐ"], ["所不欲", "what you do not want", "suǒ bù yù"], ["勿施于人", "do not impose on others", "wù shī yú rén"]], "en": "What you do not want for yourself, do not impose on others.", "author": "孔子", "work": "论语·卫灵公", "era": "春秋", "note": "Confucius's one-word rule for a whole life, given when asked for one: 恕 (shù, reciprocity). Say it when you're about to hand someone the treatment you'd resent.", "ctx": null, "py": "jǐ suǒ bù yù ， wù shī yú rén"}, "shilai": {"id": "shilai", "zh": "时来天地皆同力，运去英雄不自由", "segs": [["时来", "when the moment comes", "shí lái"], ["天地", "heaven and earth", "tiān dì"], ["皆同力", "all push with you", "jiē tóng lì"], ["运去", "when fortune leaves", "yùn qù"], ["英雄", "even a hero", "yīng xióng"], ["不自由", "is not free", "bù zì yóu"]], "en": "When the moment comes, heaven and earth push with you; when fortune leaves, even a hero is not free.", "author": "罗隐", "work": "筹笔驿", "era": "唐", "note": "About 诸葛亮, the greatest strategist of the Three Kingdoms, who still lost. Say it when timing beat effort, yours or someone else's.", "ctx": null, "py": "shí lái tiān dì jiē tóng lì ， yùn qù yīng xióng bù zì yóu"}, "shuyujing": {"id": "shuyujing", "zh": "树欲静而风不止，子欲养而亲不待", "segs": [["树欲静", "the tree wants to be still", "shù yù jìng"], ["而风不止", "but the wind does not stop", "ér fēng bù zhǐ"], ["子欲养", "the child wants to care for them", "zǐ yù yǎng"], ["而亲不待", "but the parents do not wait", "ér qīn bù dài"]], "en": "The tree wants stillness but the wind won't stop; the child wants to care for his parents, but they do not wait.", "author": "增广贤文", "work": "增广贤文（本自《韩诗外传》）", "era": "明清", "note": "The line about calling your parents while you can. Older than the 增广贤文; the story is of a man weeping at the roadside over exactly this. Say it, then make the call.", "ctx": null, "py": "shù yù jìng ér fēng bù zhǐ ， zǐ yù yǎng ér qīn bù dài"}, "wengu": {"id": "wengu", "zh": "温故而知新，可以为师矣", "segs": [["温故", "review the old", "wēn gù"], ["而知新", "and learn the new", "ér zhī xīn"], ["可以", "one can", "kě yǐ"], ["为师矣", "be a teacher", "wéi shī yǐ"]], "en": "Review what is old and learn what is new from it; such a person can be a teacher.", "author": "孔子", "work": "论语·为政", "era": "春秋", "note": "Rereading your own notes from a year ago and seeing something you missed is exactly this. Say it when the old material yields something new.", "ctx": null, "py": "wēn gù ér zhī xīn ， kě yǐ wéi shī yǐ"}, "nayan": {"id": "nayan", "zh": "君子欲讷于言而敏于行", "segs": [["君子", "a noble person", "jūn zǐ"], ["欲", "wishes to be", "yù"], ["讷于言", "slow in speech", "nè yú yán"], ["而敏于行", "and quick in action", "ér mǐn yú xíng"]], "en": "A noble person wants to be slow to speak and quick to act.", "author": "孔子", "work": "论语·里仁", "era": "春秋", "note": "Say it after a meeting where the talking outran the doing.", "ctx": null, "py": "jūn zǐ yù nè yú yán ér mǐn yú xíng"}, "juantu": {"id": "juantu", "zh": "江东子弟多才俊，卷土重来未可知", "segs": [["江东子弟", "the young men of Jiangdong", "jiāng dōng zǐ dì"], ["多才俊", "many are talented", "duō cái jùn"], ["卷土重来", "roll up the dust and come back", "juǎn tǔ chóng lái"], ["未可知", "who can say?", "wèi kě zhī"]], "en": "The young men of Jiangdong are full of talent; whether he might have rolled back the dust and returned, who can say?", "author": "杜牧", "work": "题乌江亭", "era": "唐", "note": "About 项羽, who killed himself at the Wu river rather than go home defeated. Du Mu argues he should have gone home and regrouped. 卷土重来 is now the phrase for a comeback. Say it when you lose and decide it isn't final.", "ctx": null, "py": "jiāng dōng zǐ dì duō cái jùn ， juǎn tǔ chóng lái wèi kě zhī"}, "taoli": {"id": "taoli", "zh": "桃李不言，下自成蹊", "segs": [["桃李", "peach and plum trees", "táo lǐ"], ["不言", "say nothing", "bù yán"], ["下", "beneath them", "xià"], ["自成蹊", "a path forms by itself", "zì chéng xī"]], "en": "The peach and plum trees say nothing, yet a path forms beneath them.", "author": "司马迁", "work": "史记·李将军列传", "era": "西汉", "note": "About the general 李广, who never promoted himself and whom soldiers followed anyway. Say it about someone whose reputation was built by others, or when tempted to advertise.", "ctx": null, "py": "táo lǐ bù yán ， xià zì chéng xī"}, "dangduan": {"id": "dangduan", "zh": "当断不断，反受其乱", "segs": [["当断", "when one should decide", "dāng duàn"], ["不断", "and does not", "bù duàn"], ["反", "instead", "fǎn"], ["受其乱", "suffers the resulting chaos", "shòu qí luàn"]], "en": "Fail to decide when you should, and you suffer the chaos instead.", "author": "司马迁", "work": "史记·齐悼惠王世家", "era": "西汉", "note": "Say it when you have been circling a decision for a week.", "ctx": null, "py": "dāng duàn bù duàn ， fǎn shòu qí luàn"}, "shixi": {"id": "shixi", "zh": "学而时习之，不亦说乎", "segs": [["学", "to learn", "xué"], ["而", "and", "ér"], ["时习之", "practise it at the right times", "shí xí zhī"], ["不亦", "is it not", "bù yì"], ["说乎", "a pleasure? (说 is read yuè, an old form of 悦)", "shuō hū"]], "en": "To learn something and put it into practice at the right time, is that not a pleasure?", "author": "
