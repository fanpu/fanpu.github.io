n the shortcut is on the table.", "lian": [["p", "fuyun", "Confucius on wealth wrongly got"], ["p", "nengyi", "wealth that cannot corrupt"], ["s", "shortcut", "the profitable, slightly dirty deal"]]}}, "fuyun": {"id": "fuyun", "zh": "不义而富且贵，于我如浮云", "segs": [["不义", "unrighteous, gained wrongly", "bú yì"], ["而", "and yet", "ér"], ["富且贵", "rich and honoured", "fù qiě guì"], ["于我", "to me", "yú wǒ"], ["如浮云", "are like drifting clouds", "rú fú yún"]], "en": "Wealth and rank gained by wrong means are to me like passing clouds.", "author": "孔子", "work": "论语·述而", "era": "春秋", "note": "The line before it describes Confucius eating plain rice, drinking water, and using his bent arm as a pillow, and finding joy in that. 浮云 became a whole internet slang word for 'meaningless' because of this line.", "ctx": null, "py": "bú yì ér fù qiě guì ， yú wǒ rú fú yún", "deep": {"zi": [["义", "yì", "Rightness, what is fitting. 不义 is gain that does not fit."], ["富且贵", "fù qiě guì", "Wealth and rank, the two things the Analects repeatedly says people want and should not want wrongly."], ["浮云", "fú yún", "Drifting clouds: present, visible, and of no substance. The image had already been used for things that pass; Confucius made it the standard figure for unearned wealth."]], "dui": ["饭疏食，饮水，曲肱而枕之，乐亦在其中矣", "fàn shū shí ， yǐn shuǐ ， qǔ gōng ér zhěn zhī ， lè yì zài qí zhōng yǐ", "Eating coarse rice, drinking water, with a bent arm for a pillow: joy is in that too.", "The line before it, which is the positive picture the 浮云 (fú yún) are measured against."], "dian": "The idea reappears in 里仁 (lǐ rén): 富与贵 (fù yǔ guì)，是人之所欲也 (shì rén zhī suǒ yù yě)；不以其道得之 (bù yǐ qí dào dé zhī)，不处也 (bù chù yě) ('wealth and rank are what people want; if not obtained by the proper way, do not dwell in them'), which is the ancestor of the folk maxim 君子爱财 (jūn zǐ ài cái)，取之有道 (qǔ zhī yǒu dào).", "shi": "From 述而 (shù ér). Confucius spent much of his life poor and out of office, and the passage is one of the few places he describes his own contentment directly.", "chuan": "浮云 (fú yún) had a second life on the Chinese internet around 2010 as slang for 'meaningless, whatever' (神马都是浮云 (shén mǎ dōu shì fú yún)), which drained it; among people who know the source it still lands. The Song poets used 浮云 (fú yún) for the impermanence of everything, not only wealth; 李白 (lǐ bái)'s 浮云游子意 (fú yún yóu zi yì) is a wanderer's mind.", "lian": [["p", "aicai", "the folk maxim that descends from this"], ["p", "yidanshi", "the disciple who lived the previous line"], ["p", "nengyi", "Mencius on wealth that cannot corrupt"]]}}, "xuesi": {"id": "xuesi", "zh": "学而不思则罔，思而不学则殆", "segs": [["学", "study, take things in", "xué"], ["而不思", "without thinking", "ér bù sī"], ["则罔", "then you are lost, deceived", "zé wǎng"], ["思", "think", "sī"], ["而不学", "without studying", "ér bù xué"], ["则殆", "then you are in danger, exhausted", "zé dài"]], "en": "Study without thinking and you are lost; think without studying and you are in danger.", "author": "孔子", "work": "论语·为政", "era": "春秋", "note": "The two failure modes of learning, in twelve characters. The first is consuming without digesting (罔). The second is speculating without input (殆). Say whichever half you are guilty of that day.", "ctx": null, "py": "xué ér bù sī zé wǎng ， sī ér bù xué zé dài", "deep": {"zi": [["罔", "wǎng", "Netted, entangled, deceived. Pictures a fish in a net: you have taken in a great deal and are caught in it."], ["殆", "dài", "Peril, or exhaustion. Commentators split; both readings work. Thinking without input is dangerous because it is unmoored, and tiring because it goes nowhere."], ["则", "zé", "'Then', marking a consequence. The parallel 则…则 structure is what makes the line quotable."]], "dui": null, "dian": "No earlier source. It became the source for a two-thousand-year argument about method, which the Song philosophers settled in favour of 思 and the Qing philologists reopened in favour of 学.", "shi": "From 为政 (wéi zhèng), the chapter on governing, which is mostly about how a governing person should learn. It sits next to 温故而知新 (wēn gù ér zhī xīn) and 知之为知之 (zhī zhī wéi zhī zhī), so the three lines together are a small treatise on knowing.", "chuan": "The most useful line in the Analects for anyone who reads too much or builds too much. The two failure modes map cleanly onto modern habits: consuming papers without working through them (罔), and speculating from first principles without checking the literature (殆). Chinese teachers quote it at students constantly; it is more interesting said to yourself, choosing the half that applies.", "lian": [["p", "gongxing", "the same point about books and hands, from a poet"], ["p", "wengu", "what learning is for"], ["p", "zhizhi", "the honesty that both halves require"]]}}, "hongyi": {"id": "hongyi", "zh": "士不可以不弘毅，任重而道远", "segs": [["士", "a scholar-official, a person of purpose", "shì"], ["不可以不", "cannot not be", "bù kě yǐ bù"], ["弘毅", "broad-minded and resolute", "hóng yì"], ["任重", "the burden is heavy", "rèn zhòng"], ["而", "and", "ér"], ["道远", "the road is long", "dào yuǎn"]], "en": "A person of purpose must be broad and resolute, for the burden is heavy and the road is long.", "author": "曾子", "work": "论语·泰伯", "era": "春秋", "note": "Spoken by 曾子, Zengzi, the disciple from whom your own clan descends. He goes on: he takes 仁 as his burden and only death ends the road. Say 任重道远 when you take on something that will outlast the year.", "ctx": ["仁以为己任，不亦重乎？死而后已，不亦远乎", "rén yǐ wéi jǐ rèn ， bù yì zhòng hū ？ sǐ ér hòu yǐ ， bù yì yuǎn hū", "He takes benevolence as his own burden: is that not heavy? Only at death does he stop: is that not far?"], "py": "shì bù kě yǐ bù hóng yì ， rèn zhòng ér dào yuǎn", "deep": {"zi": [["士", "shì", "In the Zhou order, the lowest rank of the aristocracy, a man who served. Confucius's school turned 士 into the scholar with a public duty, the root of the later 士大夫."], ["弘毅", "hóng yì", "弘 is broad (as in 弘扬, to promote widely); 毅 is resolute (as in 毅力, willpower). Breadth and firmness are the two things a long road requires."], ["任", "rèn", "Read rèn, a burden carried, and by extension a responsibility. 任重道远 is the four-character form."]], "dui": ["仁以为己任，不亦重乎？死而后已，不亦远乎？", "rén yǐ wéi jǐ rèn ， bù yì zhòng hū ？ sǐ ér hòu yǐ ， bù yì yuǎn hū ？", "He takes benevolence as his own burden: is that not heavy? Only death ends it: is that not far?", "The continuation, which defines the burden and the road, and gave the language 死而后已 (sǐ ér hòu yǐ), 'until death'."], "dian": "None earlier; the speaker is 曾子 (zēng zǐ), Zengzi, Confucius's disciple, the man traditionally credited with the 大学 (dà xué) and with transmitting the teaching to Confucius's grandson 子思 (zi sī). Your own clan traces its line to him.", "shi": "From 泰伯 (tài bó). 曾子 (zēng zǐ) was one of the youngest disciples and outlived the master by decades; the sayings recorded under his name have a heaviness the master's lack. This one is the credo of the whole 士 class as it later understood itself.", "chuan": "任重道远 (rèn zhòng dào yuǎn) is now used for any long, serious undertaking, from national policy to a PhD. 诸葛亮 (zhū gě liàng)'s 鞠躬尽瘁 (jū gōng jìn cuì)，死而后已 (sǐ ér hòu yǐ) ('bend the body, exhaust the strength, until death') is the same vow in a general's mouth. Because the line comes from 曾子 (zēng zǐ), quoting it is, in your case, quoting a direct ancestor, which is a thing you are allowed to enjoy quietly.", "lian": [["p", "xiantianxia", "the same duty stated by a Song statesman"], ["p", "guangsha", "the same duty stated by a poet with no roof"], ["p", "danxin", "the road walked to its end"]]}}, "xiantianxia": {"id": "xiantianxia", "zh": "先天下之忧而忧，后天下之乐而乐", "segs": [["先", "before", "xiān"], ["天下", "all under heaven, everyone", "tiān xià"], ["之忧", "'s worries", "zhī yōu"], ["而忧", "worry", "ér yōu"], ["后", "after", "hòu"], ["天下", "all under heaven, everyone", "tiān xià"], ["之乐", "'s joys", "zhī lè"], ["而乐", "rejoice", "ér lè"]], "en": "Be the first to worry about the world's worries, and the last to enjoy its joys.", "author": "范仲淹", "work": "岳阳楼记", "era": "北宋", "note": "The most quoted sentence about public duty in Chinese. Fan Zhongyan wrote it in political exile for a friend also in exile. It is a standard, not a mood. Say it when you decide to take responsibility for something bigger than yourself.", "ctx": null, "py": "xiān tiān xià zhī yōu ér yōu ， hòu tiān xià zhī lè ér lè", "deep": {"zi": [["先", "xiān", "Before; as a verb, 'to put first'."], ["天下", "tiān xià", "All under heaven; the whole realm, everyone."], ["之忧", "zhī yōu", "'s worries; 之 the possessive."], ["后", "hòu", "After; 'to put last'. The symmetry 先…后 is the line."]], "dui": ["不以物喜，不以己悲", "bù yǐ wù xǐ ， bù yǐ jǐ bēi", "Not made glad by things, not made sad by one's own lot.", "The line earlier in the same essay that describes the temperament this duty requires."], "dian": "The idea descends from Mencius's ruler who shares the people's joys and sorrows (乐以天下 (lè yǐ tiān xià)，忧以天下 (yōu yǐ tiān xià)), and from 曾子 (zēng zǐ)'s 任重而道远 (rèn zhòng ér dào yuǎn). 范仲淹 (fàn zhòng yān) made it a sentence you can say.", "shi": "Same essay as 不以物喜 (bù yǐ wù xǐ), 岳阳楼记 (yuè yáng lóu jì), 1046, written in exile for a friend in exile. The line comes at the very end, followed by 噫！微斯人 (wēi sī rén)，吾谁与归 (wú shuí yǔ guī), 'Ah, without such people, whom would I go with?'", "chuan": "The line every Chinese official is supposed to live by and every Chinese student has to memorise. It is engraved at the actual 岳阳楼 (yuè yáng lóu), which was rebuilt many times because of the essay. Use it when you decide to take responsibility for something bigger than yourself, and say it once.", "lian": [["p", "hongyi", "曾子's burden and road"], ["p", "guangsha", "杜甫's roof for everyone"], ["s", "big-responsibility", "something that outlasts the year"]]}}, "quanjun": {"id": "quanjun", "zh": "劝君更尽一杯酒，西出阳关无故人", "segs": [["劝君", "I urge you", "quàn jūn"], ["更尽", "drink one more to the bottom", "gèng jìn"], ["一杯酒", "a cup of wine", "yī bēi jiǔ"], ["西出", "west beyond", "xī chū"], ["阳关", "Yang Pass (the last gate before the desert)", "yáng guān"], ["无故人", "there are no old friends", "wú gù rén"]], "en": "One more cup, I beg you; west of Yang Pass there will be no old friends.", "author": "王维", "work": "送元二使安西", "era": "唐", "note": "This became a song, 阳关三叠, sung at farewells for a thousand years. The line for the last drink before someone leaves for somewhere far and hard.", "ctx": null, "py": "quàn jūn gèng jìn yī bēi jiǔ ， xī chū yáng guān wú gù rén", "deep": {"zi": [["劝", "quàn", "To urge, to press upon; the verb of hospitality. 劝酒 is still what a host does."], ["更尽", "gèng jìn", "更 (gèng, once more) plus 尽 (to the bottom). Finish one more."], ["阳关", "yáng guān", "Yang Pass, near 敦煌, the last Tang gate on the southern road into Central Asia. Beyond it, no Chinese."], ["故人", "gù rén", "Old friend; the same 故 as in 故乡."]], "dui": ["渭城朝雨浥轻尘，客舍青青柳色新", "wèi chéng cháo yǔ yì qīng chén ， kè shě qīng qīng liǔ sè xīn", "Morning rain at 渭城 lays the light dust; the inn's willows are fresh green.", "The first couplet: willows were given at partings (柳 puns on 留, stay), so the green is already a farewell."], "dian": "The willow custom of Han farewells at 灞桥 (bà qiáo) outside Chang'an; the rain and the pass are the poem's own.", "shi": "Around 740. 元二 (yuán èr) (Yuan, second son) was being sent as an envoy to 安西 (ān xī), the Tang protectorate in the Tarim basin, a journey of months into a country with no old friends. 渭城 (wèi chéng) is 咸阳 (xián yáng), where the road west began.", "chuan": "The poem was set to music as 阳关三叠 (yáng guān sān dié) ('Yang Pass in three refrains') and sung at farewells for the rest of the imperial period; 阳关 (yáng guān) alone came to mean a parting song. The 琴 version is still played. The line is for the last drink before someone leaves for somewhere far and hard, and it should be said with the glass in hand.", "lian": [["p", "mochou", "the warm farewell"], ["p", "zhiji", "the bracing farewell"], ["s", "last-drink", "one more before the flight"]]}}, "yuanlv": {"id": "yuanlv", "zh": "人无远虑，必有近忧", "segs": [["人", "a person", "rén"], ["无远虑", "without far-reaching thought", "wú yuǎn lǜ"], ["必有", "will surely have", "bì yǒu"], ["近忧", "troubles close at hand", "jìn yōu"]], "en": "A person who does not think far ahead will surely have trouble close at hand.", "author": "孔子", "work": "论语·卫灵公", "era": "春秋", "note": "Eight characters, no wasted word. The Chinese version of 'plan or be planned for'. Say it when things are going well and nobody is thinking about next year.", "ctx": null, "py": "rén wú yuǎn lǜ ， bì yǒu jìn yōu", "deep": {"zi": [["远虑", "yuǎn lǜ", "虑 is deliberate thought, planning. 远 stretches it in time."], ["近忧", "jìn yōu", "忧 is worry, sorrow. 近 is close in time. The line is built entirely on the 远/近 contrast."]], "dui": null, "dian": "None earlier. 左传 (zuǒ zhuàn) has the related 居安思危 (jū ān sī wēi), 'in security think of danger', which is more often quoted in a governing context.", "shi": "From 卫灵公 (wèi líng gōng), a chapter of short, hard sayings. No occasion is recorded; it reads as a settled maxim.", "chuan": "Eight characters, no particle, no ornament. It is quoted in strategy documents, in parenting, and by anyone who wants to sound like an adult in a planning meeting. Its danger is that it is always true, so it can be used to justify any amount of worry. Use it when nobody is thinking ahead, not when everybody already is.", "lian": [["p", "huofu", "why good fortune is exactly when to think"], ["p", "dangduan", "the opposite failure: thinking so far ahead you never decide"], ["s", "good-times-plan", "the moment it was made for"]]}}, "yinqing": {"id": "yinqing", "zh": "人有悲欢离合，月有阴晴圆缺，此事古难全", "segs": [["人有", "people have", "rén yǒu"], ["悲欢离合", "sorrow, joy, parting, reunion", "bēi huān lí hé"], ["月有", "the moon has", "yuè yǒu"], ["阴晴圆缺", "dark, bright, full, waning", "yīn qíng yuán quē"], ["此事", "this matter", "cǐ shì"], ["古难全", "has been hard to make whole since ancient times", "gǔ nán quán"]], "en": "People have sorrow and joy, parting and reunion; the moon has dark and bright, full and waning. This has never been made whole.", "author": "苏轼", "work": "水调歌头·明月几时有", "era": "北宋", "note": "The line just before 但愿人长久. Where that line hopes, this one accepts. Say it when something is incomplete and you have decided to stop fighting that.", "ctx": null, "py": "rén yǒu bēi huān lí hé ， yuè yǒu yīn qíng yuán quē ， cǐ shì gǔ nán quán", "deep": {"zi": [["悲欢离合", "bēi huān lí hé", "Four states in four characters: sorrow, joy, parting, reunion. The compound became the word for the whole of human vicissitude."], ["阴晴圆缺", "yīn qíng yuán quē", "The moon's four states: hidden, clear, full, waning. Exactly parallel to the human four."], ["古难全", "gǔ nán quán", "全 as 'whole, complete'. Since ancient times hard to make whole."]], "dui": ["但愿人长久，千里共婵娟", "dàn yuàn rén cháng jiǔ ， qiān lǐ gòng chán juān", "I only wish us long life, sharing the moon a thousand li apart.", "The final couplet, the wish that follows the acceptance."], "dian": "The moon's incompleteness as a figure for life goes back through 张若虚 (zhāng ruò xū)'s 春江花月夜 (chūn jiāng huā yuè yè) to the 古诗十九首 (gǔ shī shí jiǔ shǒu); 苏轼 (sū shì)'s contribution is the exact four-against-four parallel.", "shi": "Same night as 但愿人长久 (dàn yuàn rén cháng jiǔ), 1076, 密州 (mì zhōu). See that card. The two couplets are one movement: this admits the loss, the next makes the wish anyway.", "chuan": "Quoted at weddings, funerals, and reunions, because it covers all of them. 悲欢离合 (bēi huān lí hé) alone is a common word. This is the line for acceptance rather than hope, and it is the more grown-up of the two.", "lian": [["p", "changjiu", "the wish that follows"], ["p", "wufengyu", "the same acceptance applied to weather"], ["s", "accept-incomplete", "making peace with what's missing"]]}}, "haoyu": {"id": "haoyu", "zh": "好雨知时节，当春乃发生", "segs": [["好雨", "a good rain", "hǎo yǔ"], ["知时节", "knows its season", "zhī shí jié"], ["当春", "just as spring comes", "dāng chūn"], ["乃", "then", "nǎi"], ["发生", "comes forth, happens", "fā shēng"]], "en": "A good rain knows its season; it comes just as spring arrives.", "author": "杜甫", "work": "春夜喜雨", "era": "唐", "note": "Du Fu, settled for once, in Chengdu. Also said of a person or a piece of help that arrives at exactly the right time. The next couplet: it comes with the wind at night, quietly, and wets everything without a sound.", "ctx": ["随风潜入夜，润物细无声", "suí fēng qián rù yè ， rùn wù xì wú shēng", "It slips in with the wind at night, moistening all things, fine and soundless."], "py": "hǎo yǔ zhī shí jié ， dāng chūn nǎi fā shēng", "deep": {"zi": [["好雨", "hǎo yǔ", "A good rain. 好 as adjective; the rain is praised as a person would be."], ["知时节", "zhī shí jié", "知 given to the rain: it knows. The personification is the poem's method."], ["乃", "nǎi", "Then, thereupon. A classical connective that marks the timing as exact."], ["发生", "fā shēng", "In modern Chinese 'to happen'; here the older sense, 'to send forth life'."]], "dui": ["随风潜入夜，润物细无声", "suí fēng qián rù yè ， rùn wù xì wú shēng", "It slips in with the wind by night, moistening things, fine, without a sound.", "The next couplet, which is the more famous half and is quoted about teachers, parents, and influence."], "dian": "No single source; the poem is the source. 润物细无声 (rùn wù xì wú shēng) became the standard image for quiet nurture and is inscribed in every teachers' college in China.", "shi": "761, at Du Fu's thatched cottage in 成都 (chéng dū), the one settled stretch of his life, when he had a patron, a garden, and a river outside. The 成都 (chéng dū) poems are the only happy ones.", "chuan": "Used for a person or help that arrives when needed, and for anything that works without display. The first couplet is the timing; the second is the manner. The two together are a small theory of good help.", "lian": [["p", "zhanyi", "the other gentle spring rain"], ["p", "mingyuesong", "王维's spring water after rain"], ["s", "timely-help", "exactly when needed"]]}}, "zhanyi": {"id": "zhanyi", "zh": "沾衣欲湿杏花雨，吹面不寒杨柳风", "segs": [["沾衣", "dampens the clothes", "zhān yī"], ["欲湿", "about to soak, but not quite", "yù shī"], ["杏花雨", "apricot-blossom rain (light spring rain)", "xìng huā yǔ"], ["吹面", "blows on the face", "chuī miàn"], ["不寒", "not cold", "bù hán"], ["杨柳风", "willow wind (a spring breeze)", "yáng liǔ fēng"]], "en": "Apricot-blossom rain dampens my clothes without soaking them; willow wind on my face, not cold.", "author": "志南", "work": "绝句", "era": "南宋", "note": "By a Song dynasty monk about whom almost nothing else is known. The gentlest weather line in Chinese. Say it on the first warm drizzly day of the year.", "ctx": null, "py": "zhān yī yù shī xìng huā yǔ ， chuī miàn bù hán yáng liǔ fēng", "deep": {"zi": [["沾衣欲湿", "zhān yī yù shī", "Dampens the clothes, about to soak; 欲 as 'on the point of', which is the whole precision of the line: not quite."], ["杏花雨", "xìng huā yǔ", "Apricot-blossom rain, the light rain of the second month when apricots bloom."], ["杨柳风", "yáng liǔ fēng", "Willow wind, the breeze of the third month when willows leaf. Both are names of seasonal weather, not just images."]], "dui": ["古木阴中系短篷，杖藜扶我过桥东", "gǔ mù yīn zhōng xì duǎn péng ， zhàng lí fú wǒ guò qiáo dōng", "Under old trees I tie the small boat's awning; a goosefoot staff helps me east across the bridge.", "The first couplet: an old monk with a stick, out for a walk."], "dian": "None specific. The naming of rains and winds by the flowers of the month is a folk-calendar habit the line preserves.", "shi": "Southern Song. 志南 (zhì nán) is a monk of whom nothing survives but this quatrain and a mention by 朱熹 (zhū xī), who said it had 'no sour-vegetable smell', the smell of monkish verse. The poem is one of the most anthologised in 千家诗 (qiān jiā shī).", "chuan": "The gentlest weather line in the language, quoted on the first warm drizzly day. It has no moral at all, which makes it restful in a deck full of Confucius. Say it while walking in it.", "lian": [["p", "haoyu", "杜甫's rain that came on time"], ["p", "mingyuesong", "王维's spring after rain"], ["s", "spring-rain", "drizzle without an umbrella"]]}}, "fengqiu": {"id": "fengqiu", "zh": "自古逢秋悲寂寥，我言秋日胜春朝", "segs": [["自古", "since ancient times", "zì gǔ"], ["逢秋", "meeting autumn", "féng qiū"], ["悲寂寥", "people grieve at its loneliness", "bēi jì liáo"], ["我言", "I say", "wǒ yán"], ["秋日", "an autumn day", "qiū rì"], ["胜", "beats", "shèng"], ["春朝", "a spring morning", "chūn zhāo"]], "en": "Since ancient times people meet autumn with sorrow; I say an autumn day beats a spring morning.", "author": "刘禹锡", "work": "秋词·其一", "era": "唐", "note": "Liu Yuxi wrote this in exile, deliberately contradicting a thousand years of sad autumn poems. The next couplet has a single crane climbing the clear sky. Say it on a bright cool autumn day when everyone else is moping.", "ctx": null, "py": "zì gǔ féng qiū bēi jì liáo ， wǒ yán qiū rì shèng chūn zhāo", "deep": {"zi": [["逢秋", "féng qiū", "Meeting autumn; 逢 as encountering a season."], ["寂寥", "jì liáo", "Lonely, desolate; the standard autumn feeling since 宋玉."], ["我言", "wǒ yán", "I say; the first person set against 自古."], ["春朝", "chūn zhāo", "A spring morning; 朝 read zhāo."]], "dui": ["晴空一鹤排云上，便引诗情到碧霄", "qíng kōng yī hè pái yún shàng ， biàn yǐn shī qíng dào bì xiāo", "In the clear sky a single crane pushes through the clouds, and draws my poet's mood up to the blue.", "The second couplet, the image that makes the claim good."], "dian": "Contradicts the entire tradition from 宋玉 (sòng yù)'s 九辩 (jiǔ biàn) (悲哉秋之为气也 (bēi zāi qiū zhī wèi qì yě), 'how sad, the air of autumn') through 杜甫 (dù fǔ)'s 登高 (dēng gāo). 刘禹锡 (liú yǔ xī) names the tradition (自古 (zì gǔ)) in order to refuse it.", "shi": "Around 805, in exile at 朗州 (lǎng zhōu) (Hunan) after the same failed reform that exiled 柳宗元 (liǔ zōng yuán). Two poems under the title; this is the first. 刘禹锡 (liú yǔ xī) spent twenty-three years in provincial posts and wrote his most defiant poems there.", "chuan": "Quoted by every optimist in autumn and by every writer arguing against a consensus. It is the model of the 翻案 (fān àn) poem, the poem that overturns a verdict. Say it on a bright cold day when everyone else is moping.", "lian": [["p", "luomu", "杜甫's autumn, the tradition being refused"], ["p", "fuyun2", "王安石's clarity above the clouds"], ["s", "autumn", "the clear sky"]]}}, "luomu": {"id": "luomu", "zh": "无边落木萧萧下，不尽长江滚滚来", "segs": [["无边", "boundless", "wú biān"], ["落木", "falling leaves (literally: falling wood)", "luò mù"], ["萧萧", "rustling (sound of leaves)", "xiāo xiāo"], ["下", "come down", "xià"], ["不尽", "endless", "bù jìn"], ["长江", "the Yangtze", "cháng jiāng"], ["滚滚", "rolling, churning", "gǔn gǔn"], ["来", "comes", "lái"]], "en": "Boundless falling leaves come rustling down; the endless Yangtze comes rolling on.", "author": "杜甫", "work": "登高", "era": "唐", "note": "From the poem often called the greatest regulated verse in Chinese. Du Fu at fifty-five, sick, alone, on a hill at the autumn festival. Say it when leaves fall and the scale of things gets to you.", "ctx": null, "py": "wú biān luò mù xiāo xiāo xià ， bù jìn cháng jiāng gǔn gǔn lái", "deep": {"zi": [["落木", "luò mù", "Falling wood: leaves, but the word chosen is 木, which gives the line its bareness. 落叶 would be softer."], ["萧萧", "xiāo xiāo", "An onomatopoeia for wind in trees, or a horse's cry; the sound of the leaves."], ["滚滚", "gǔn gǔn", "Rolling, churning, the sound and motion of the river. The two reduplicated words face each other across the couplet."], ["不尽", "bù jìn", "Endless, and also 'never used up', which is the point against 无边."]], "dui": ["万里悲秋常作客，百年多病独登台", "wàn lǐ bēi qiū cháng zuò kè ， bǎi nián duō bìng dú dēng tái", "Ten thousand li from home, grieving autumn, always a guest; a hundred years of illness, alone I climb the terrace.", "The next couplet, which the critics count as containing eight separate griefs in fourteen characters."], "dian": "The autumn-grief tradition begins with 宋玉 (sòng yù)'s 九辩 (jiǔ biàn) (悲哉秋之为气也 (bēi zāi qiū zhī wèi qì yě)). 屈原 (qū yuán) has 袅袅兮秋风 (niǎo niǎo xī qiū fēng)，洞庭波兮木叶下 (dòng tíng bō xī mù yè xià), falling leaves on 洞庭 (dòng tíng), and 落木 (luò mù) as a word comes from there. Du Fu inherits the whole line of sad autumns and makes the definitive one.", "shi": "767, 夔州 (kuí zhōu) (Kuizhou, on the Yangtze above the Gorges), the Double Ninth festival, when people climb a height. Du Fu was fifty-five, diabetic, half-deaf, and three years from death; the family had fled the rebellion for a decade. 登高 (dēng gāo) is the poem 明 and 清 critics called the finest regulated verse ever written.", "chuan": "The couplet is the model of 对仗 (duì zhàng), parallel construction: every character has a counterpart. Chinese students learn it as the example of the form. As a line for life it is used when leaves fall and scale gets to you, and it is one of the few autumn lines that is grand rather than merely sad.", "lian": [["p", "fengqiu", "刘禹锡 refusing the whole tradition"], ["p", "gungun", "the same river with heroes in it"], ["p", "shizhe", "the river Confucius stood by"]]}}, "chunshui": {"id": "chunshui", "zh": "问君能有几多愁，恰似一江春水向东流", "segs": [["问君", "ask you (himself)", "wèn jūn"], ["能有", "can have", "néng yǒu"], ["几多愁", "how much sorrow", "jǐ duō chóu"], ["恰似", "just like", "qià sì"], ["一江春水", "a river of spring water", "yī jiāng chūn shuǐ"], ["向东流", "flowing east", "xiàng dōng liú"]], "en": "How much sorrow can one man hold? As much as a spring river flowing east.", "author": "李煜", "work": "虞美人·春花秋月何时了", "era": "南唐", "note": "This poem reportedly got Li Yu killed: the Song emperor took it as nostalgia for his lost kingdom and had him poisoned. When a river is in front of you and something weighs on you, this is the line.", "ctx": null, "py": "wèn jūn néng yǒu jǐ duō chóu ， qià sì yī jiāng chūn shuǐ xiàng dōng liú", "deep": {"zi": [["问君", "wèn jūn", "Ask you; 君 is himself, addressed formally, a distancing device."], ["几多", "jǐ duō", "How much; a Tang-Song colloquial form still used in Cantonese (幾多)."], ["恰似", "qià sì", "Just like; 恰 as 'exactly'."], ["向东流", "xiàng dōng liú", "Flows east; the direction every Chinese river takes, so the sorrow is as inevitable as geography."]], "dui": ["春花秋月何时了？往事知多少", "chūn huā qiū yuè hé shí le ？ wǎng shì zhī duō shǎo", "Spring flowers, autumn moon, when will they end? How much of the past do I know?", "The opening: the seasons keep coming and he wishes they would stop."], "dian": "The river as the measure of grief runs from Confucius's 逝者如斯 (shì zhě rú sī) through 李白 (lǐ bái)'s 抽刀断水 (chōu dāo duàn shuǐ). 李煜 (lǐ yù)'s spring river is the one everyone quotes after him.", "shi": "978, 开封 (kāi fēng). The story in 默记 (mò jì) is that 李煜 (lǐ yù) had this 词 sung on the seventh of the seventh month, his birthday; the Song emperor 太宗 (tài zōng) heard of it, took 故国不堪回首月明中 (gù guó bù kān huí shǒu yuè míng zhōng) ('I cannot bear to turn my head toward the old country in the moonlight') as treason, and sent poisoned wine. Whether the poem killed him or not, it was written by a man who had lost everything and knew it.", "chuan": "The most famous line about sorrow in Chinese, quoted by the heartbroken and by anyone standing beside a river in spring. It is grief at full volume, which makes it hard to use in speech without irony; the ironic use is fine, and common.", "lian": [["p", "shizhe", "Confucius at the river"], ["p", "gungun", "the river that washes away kings"], ["s", "sorrow-river", "something heavy, and water"]]}}, "gungun": {"id": "gungun", "zh": "滚滚长江东逝水，浪花淘尽英雄", "segs": [["滚滚", "rolling", "gǔn gǔn"], ["长江", "the Yangtze", "cháng jiāng"], ["东逝水", "waters flowing away east", "dōng shì shuǐ"], ["浪花", "the spray of the waves", "làng huā"], ["淘尽", "washes away completely", "táo jìn"], ["英雄", "heroes", "yīng xióng"]], "en": "The rolling Yangtze flows away east; its waves have washed all the heroes away.", "author": "杨慎", "work": "临江仙·滚滚长江东逝水", "era": "明", "note": "The opening of Romance of the Three Kingdoms, though written three centuries later by a scholar in exile in Yunnan. Every hero you have read about ends up in this line. Say it by any large river.", "ctx": ["是非成败转头空，青山依旧在，几度夕阳红", "shì fēi chéng bài zhuǎn tóu kōng ， qīng shān yī jiù zài ， jǐ dù xī yáng hóng", "Right and wrong, success and failure, gone in a turn of the head; the green hills are still there, and the sunset has reddened them how many times."], "py": "gǔn gǔn cháng jiāng dōng shì shuǐ ， làng huā táo jìn yīng xióng", "deep": {"zi": [["滚滚", "gǔn gǔn", "Rolling, surging; the same word 杜甫 uses for the same river in 登高."], ["东逝水", "dōng shì shuǐ", "Water passing away east; 逝 as in 逝者如斯, 'passing, departing'."], ["淘尽", "táo jìn", "Washed away entirely; the same 淘 as in 苏轼's 浪淘尽."], ["英雄", "yīng xióng", "Heroes; the word covers 曹操, 刘备, 孙权, everyone in the novel that follows."]], "dui": ["是非成败转头空，青山依旧在，几度夕阳红", "shì fēi chéng bài zhuǎn tóu kōng ， qīng shān yī jiù zài ， jǐ dù xī yáng hóng", "Right and wrong, success and failure, empty in a turn of the head; the green hills are still there, and the sunset has reddened them how many times.", "The rest of the first stanza."], "dian": "Directly rewrites 苏轼 (sū shì)'s 大江东去 (dà jiāng dōng qù)，浪淘尽 (làng táo jìn)，千古风流人物 (qiān gǔ fēng liú rén wù) and behind it 杜甫 (dù fǔ)'s 不尽长江滚滚来 (bù jìn cháng jiāng gǔn gǔn lái). The second stanza's fisherman and woodcutter (白发渔樵 (bái fà yú qiáo)) are the 楚辞 (chǔ cí)'s 渔父 (yú fù) and the Daoist figure of the man outside history.", "shi": "Sixteenth century, in 云南 (yún nán), where 杨慎 (yáng shèn), a brilliant 状元 (zhuàng yuán) who had opposed the 嘉靖 (jiā jìng) emperor in the 大礼议 (dà lǐ yì) ritual dispute, was exiled for thirty-five years until his death. The 词 opens his 廿一史弹词 (niàn yī shǐ tán cí), a verse history of China. It was attached to the front of 三国演义 (sān guó yǎn yì) by the editor 毛宗岗 (máo zōng gǎng) in the 1660s, three centuries after the novel, and has been its opening ever since; the 1994 television series made it the theme song.", "chuan": "Recited by any large river, and at the end of any career. For most Chinese people it is the opening of the Three Kingdoms, which you already know. Say it by the water, and if someone knows the tune, they will sing the rest.", "lian": [["p", "dajiang", "苏轼's line it rewrites"], ["p", "jishengyu", "the novel it opens"], ["s", "river", "a large river"]]}}, "lihua": {"id": "lihua", "zh": "忽如一夜春风来，千树万树梨花开", "segs": [["忽如", "suddenly as if", "hū rú"], ["一夜", "in one night", "yī yè"], ["春风来", "the spring wind came", "chūn fēng lái"], ["千树万树", "a thousand trees, ten thousand trees", "qiān shù wàn shù"], ["梨花开", "pear blossoms open", "lí huā kāi"]], "en": "As if in one night a spring wind came, and pear blossoms opened on ten thousand trees.", "author": "岑参", "work": "白雪歌送武判官归京", "era": "唐", "note": "Snow on trees described as pear blossom, by a frontier poet in what is now Xinjiang. The standard line for waking up to snow. Also used, more loosely, for anything that blooms everywhere overnight.", "ctx": null, "py": "hū rú yī yè chūn fēng lái ， qiān shù wàn shù lí huā kāi", "deep": {"zi": [["忽如", "hū rú", "Suddenly as if; 忽 (sudden) plus 如 (like)."], ["梨花", "lí huā", "Pear blossom, white, dense, spring; the snow is described as its opposite season."], ["千树万树", "qiān shù wàn shù", "A thousand trees, ten thousand trees; the numbers are the abundance."]], "dui": ["北风卷地白草折，胡天八月即飞雪", "běi fēng juǎn dì bái cǎo zhé ， hú tiān bā yuè jí fēi xuě", "North wind rolls the ground, the white grass snaps; in the Tartar sky it snows in the eighth month.", "The opening, which tells you where and how cold before the pear blossoms arrive."], "dian": "The reversal is the device: snow as flowers, the frontier as a garden. Earlier poets had compared blossom to snow; 岑参 (cén cān) ran it backward.", "shi": "Around 754, at 轮台 (lún tái) (near Ürümqi), where 岑参 (cén cān) served on the staff of the general 封常清 (fēng cháng qīng). 武判官 (wǔ pàn guān) was a colleague going back to the capital. 岑参 (cén cān) is the great poet of the far western frontier, the 边塞 (biān sài) school.", "chuan": "The couplet is used for any sudden, general blooming: a policy, a fashion, a market. And for waking up to snow, which is its plain use. 一夜春风 (yī yè chūn fēng) alone now means 'overnight'.", "lian": [["p", "hanjiang", "the other snow, empty"], ["p", "haoyu", "spring arriving on time"], ["s", "snow", "everything white"]]}}, "hanjiang": {"id": "hanjiang", "zh": "孤舟蓑笠翁，独钓寒江雪", "segs": [["孤舟", "a lone boat", "gū zhōu"], ["蓑笠", "straw cape and bamboo hat", "suō lì"], ["翁", "old man", "wēng"], ["独钓", "fishes alone", "dú diào"], ["寒江雪", "the cold river's snow", "hán jiāng xuě"]], "en": "A lone boat, an old man in straw cape and hat, fishing alone in the snow on the cold river.", "author": "柳宗元", "work": "江雪", "era": "唐", "note": "Written in exile. The first two lines empty the world of birds and people; then this. Twenty characters, the most famous solitude in Chinese. Say it when you are alone in cold weather and it feels clean rather than sad.", "ctx": ["千山鸟飞绝，万径人踪灭", "qiān shān niǎo fēi jué ， wàn jìng rén zōng miè", "A thousand mountains, no bird flies; ten thousand paths, no trace of a person."], "py": "gū zhōu suō lì wēng ， dú diào hán jiāng xuě", "deep": {"zi": [["蓑笠", "suō lì", "蓑 (suō) the straw rain-cape, 笠 (lì) the bamboo hat: the fisherman's kit."], ["翁", "wēng", "An old man, respectfully."], ["独钓", "dú diào", "Fishes alone; 独 the poem's key word, appearing after 绝 and 灭 have emptied everything."], ["寒江雪", "hán jiāng xuě", "Cold river snow: three nouns, no grammar, the poem's last breath."]], "dui": ["千山鸟飞绝，万径人踪灭", "qiān shān niǎo fēi jué ， wàn jìng rén zōng miè", "A thousand mountains, no bird in flight; ten thousand paths, no trace of a person.", "The first couplet, which removes the world so the fisherman can be alone in it."], "dian": "Readers have long noticed that the four lines begin 千, 万, 孤, 独: 千万孤独 (qiān wàn gū dú), 'utterly alone', an acrostic that may or may not be intended. The fisherman is the 渔父 (yú fù) of 楚辞 (chǔ cí) and 庄子 (zhuāng zi), the figure outside society.", "shi": "Around 806 to 815, 永州 (yǒng zhōu) (Hunan), where 柳宗元 (liǔ zōng yuán) was exiled for ten years after the failed 永贞 (yǒng zhēn) reform of 805. He wrote his best prose and poems there and died in a further exile at forty-six.", "chuan": "The most painted poem in Chinese; every ink landscape with a small boat in snow is this. It is the line for clean solitude, and for a resolve that does not need company. 独钓寒江雪 (dú diào hán jiāng xuě) alone is a complete thing to say.", "lian": [["p", "kongshan", "王维's emptied mountain"], ["p", "shaou", "杜甫's small bird under the big sky"], ["s", "snow", "the white landscape"]]}}, "lushan": {"id": "lushan", "zh": "不识庐山真面目，只缘身在此山中", "segs": [["不识", "cannot see, do not recognise", "bù shí"], ["庐山", "Mount Lu", "lú shān"], ["真面目", "true face", "zhēn miàn mù"], ["只缘", "only because", "zhǐ yuán"], ["身在", "I am", "shēn zài"], ["此山中", "inside this mountain", "cǐ shān zhōng"]], "en": "I cannot see the true face of Mount Lu, only because I am standing inside it.", "author": "苏轼", "work": "题西林壁", "era": "北宋", "note": "The Chinese phrase for being too close to a problem to see it. Say it when you realise you need to step back, or when someone outside your team sees something you could not.", "ctx": null, "py": "bù shí lú shān zhēn miàn mù ， zhǐ yuán shēn zài cǐ shān zhōng", "deep": {"zi": [["识", "shí", "To recognise, to know by seeing; not 知."], ["庐山", "lú shān", "Mount Lu, in Jiangxi, the mountain of hermits and Buddhist temples, painted and visited for a thousand years before 苏轼."], ["真面目", "zhēn miàn mù", "True face; the phrase entered the language from this line and now means 'true colours'."], ["只缘", "zhǐ yuán", "Only because; 缘 as 'cause', the same 缘 as in 缘分 (fate that connects)."]], "dui": ["横看成岭侧成峰，远近高低各不同", "héng kàn chéng lǐng cè chéng fēng ， yuǎn jìn gāo dī gè bù tóng", "Seen across, a ridge; from the side, a peak; far, near, high, low, each different.", "The first couplet, the empirical observation the second couplet generalises."], "dian": "None specific; the poem is a 理趣 (lǐ qù) poem, a poem of reasoning, the Song mode 苏轼 (sū shì) perfected. It became the standard example of it.", "shi": "1084. 苏轼 (sū shì) was leaving 黄州 (huáng zhōu) after four years of exile, travelling east, and spent ten days on 庐山 (lú shān), writing on the wall of 西林寺 (xī lín sì) (the West Forest temple), hence the title 题西林壁 (tí xī lín bì). He said he wrote it as the summary of everything he had seen there.", "chuan": "The line for being too close to see, quoted in management, in science, and in politics. 庐山真面目 (lú shān zhēn miàn mù) alone means 'the real state of affairs'. The 1959 Party conference at 庐山 (lú shān) gave the phrase a political shadow in modern China. Say it when someone outside the team sees what you could not.", "lian": [["p", "gengshang", "the remedy: one storey higher"], ["p", "zizhi", "knowing yourself is the hard case"], ["s", "too-close", "inside the mountain"]]}}, "xiyang": {"id": "xiyang", "zh": "夕阳无限好，只是近黄昏", "segs": [["夕阳", "the setting sun", "xī yáng"], ["无限好", "infinitely beautiful", "wú xiàn hǎo"], ["只是", "only, it is just that", "zhǐ shì"], ["近黄昏", "it is close to dusk", "jìn huáng hūn"]], "en": "The setting sun is infinitely beautiful; it is only that dusk is near.", "author": "李商隐", "work": "登乐游原", "era": "唐", "note": "Li Shangyin drove to the heights outside Chang'an because he was feeling low, and wrote this. Beauty and ending in one breath. Say it at a good sunset, or about anything glorious that is nearly over.", "ctx": null, "py": "xī yáng wú xiàn hǎo ， zhǐ shì jìn huáng hūn", "deep": {"zi": [["夕阳", "xī yáng", "The evening sun, as opposed to 落日 (setting sun) or 斜阳 (slanting sun). 夕 is the evening itself."], ["无限好", "wú xiàn hǎo", "Boundlessly good; 无限 as 'without limit'."], ["只是", "zhǐ shì", "Read here as 'only, it is just that', the concessive, which is the traditional reading; some modern scholars argue it means 'precisely because', making the line an affirmation. The ambiguity is now part of the poem."], ["黄昏", "huáng hūn", "Dusk; literally yellow-dark."]], "dui": ["向晚意不适，驱车登古原", "xiàng wǎn yì bù shì ， qū chē dēng gǔ yuán", "Toward evening my mood was wrong; I drove up to the ancient plain.", "The first couplet: he went up because he felt low."], "dian": "乐游原 (lè yóu yuán) was the high ground southeast of Chang'an where the city went to look at itself; every Tang poet wrote there. 李商隐 (lǐ shāng yǐn)'s line replaced them all.", "shi": "Mid-ninth century, Chang'an, under the late Tang, when the dynasty was visibly failing and 李商隐 (lǐ shāng yǐn)'s career was stalled between two political factions. Readers have always heard the dynasty in the sunset.", "chuan": "Quoted about old age, about empires, about anything glorious and nearly over. Twentieth-century writers flipped it (the retort 何须惆怅近黄昏 (hé xū chóu chàng jìn huáng hūn), 'why grieve that dusk is near', is widely repeated) and the flip has become almost as well known. Say it at a sunset; the retort is available if someone gets maudlin.", "lian": [["p", "luoxia", "the sunset with no ending in it"], ["p", "gungun", "the sunset that has reddened the hills many times"], ["p", "yinqing", "苏轼 accepting the waning moon"]]}}, "luoxia": {"id": "luoxia", "zh": "落霞与孤鹜齐飞，秋水共长天一色", "segs": [["落霞", "the sunset clouds", "luò xiá"], ["与孤鹜", "and a lone wild duck", "yǔ gū wù"], ["齐飞", "fly together", "qí fēi"], ["秋水", "autumn water", "qiū shuǐ"], ["共长天", "with the long sky", "gòng cháng tiān"], ["一色", "one colour", "yī sè"]], "en": "The sunset clouds fly level with a lone wild duck; the autumn water and the long sky are one colour.", "author": "王勃", "work": "滕王阁序", "era": "唐", "note": "Wang Bo supposedly wrote the whole preface at a banquet, at speed, as a young man. The host's own son was meant to deliver a prepared piece; when this line was read out, the host gave up and called it genius. Say it at a sunset over water.", "ctx": null, "py": "luò xiá yǔ gū wù qí fēi ， qiū shuǐ gòng cháng tiān yī sè", "deep": {"zi": [["落霞", "luò xiá", "Sunset clouds, 霞 being the coloured evening cloud, not the sun itself."], ["鹜", "wù", "Read wù, a wild duck. Chosen over 雁 (goose) for the sound and the solitude."], ["齐飞", "qí fēi", "Fly level, fly together. The cloud and the bird are given the same verb."], ["一色", "yī sè", "One colour. Water and sky merge; the line is one image of horizontality."]], "dui": ["渔舟唱晚，响穷彭蠡之滨", "yú zhōu chàng wǎn ， xiǎng qióng péng lí zhī bīn", "Fishing boats sing at dusk, the sound reaching the shores of 彭蠡.", "The next line of the preface, continuing the same evening."], "dian": "The acknowledged model is 庾信 (yǔ xìn)'s 马射赋 (mǎ shè fù): 落花与芝盖同飞 (luò huā yǔ zhī gài tóng fēi)，杨柳共春旗一色 (yáng liǔ gòng chūn qí yī sè), 'fallen blossoms fly with the canopy; willows share one colour with the spring banners'. 王勃 (wáng bó) kept the structure exactly, swapped every noun, and produced the better line. Chinese critics cite the pair as the textbook case of 点化 (diǎn huà), transforming a source.", "shi": "675, 南昌 (nán chāng). The governor 阎伯屿 (yán bó yǔ) was celebrating the restored 滕王阁 (téng wáng gé) and had his son-in-law prepare a preface to be 'improvised'. 王勃 (wáng bó), passing through, accepted the brush that everyone else politely refused. The governor sulked in the next room until this line was reported to him and he said 此真天才 (cǐ zhēn tiān cái), this is real genius. The story is in 唐摭言 (táng zhí yán) and may be improved, but the preface is real.", "chuan": "The line every Chinese person knows from 滕王阁序 (téng wáng gé xù), which is the standard 骈文 (pián wén) (parallel prose) text in the curriculum. It is said at sunsets over water and is one of the few lines that is simply beautiful with no moral attached. That is rare in this deck.", "lian": [["p", "xiyang", "the other sunset, with the ending in it"], ["p", "zhiji", "the same poet, five years younger"], ["s", "sunset", "the sky and the water one colour"]]}}, "xichuang": {"id": "xichuang", "zh": "何当共剪西窗烛，却话巴山夜雨时", "segs": [["何当", "when will we", "hé dāng"], ["共剪", "together trim", "gòng jiǎn"], ["西窗烛", "the candle by the west window", "xī chuāng zhú"], ["却话", "and talk back about", "què huà"], ["巴山", "the Ba mountains (Sichuan)", "bā shān"], ["夜雨时", "this night of rain", "yè yǔ shí"]], "en": "When will we trim the candle by the west window together, and talk about this night of rain in the Ba mountains?", "author": "李商隐", "work": "夜雨寄北", "era": "唐", "note": "Written on a rainy night far from home, imagining a future night when he will describe this one to the person he misses. Time folds twice in four lines. Say it to yourself when you are storing a moment up to tell someone later.", "ctx": ["君问归期未有期，巴山夜雨涨秋池", "jūn wèn guī qī wèi yǒu qī ， bā shān yè yǔ zhǎng qiū chí", "You ask when I return; there is no date. Night rain in the Ba mountains fills the autumn pond."], "py": "hé dāng gòng jiǎn xī chuāng zhú ， què huà bā shān yè yǔ shí", "deep": {"zi": [["何当", "hé dāng", "When shall; a wishing question, like 安得."], ["共剪", "gòng jiǎn", "Trim together; 剪烛 (trimming the candle wick) was what you did while talking late."], ["却话", "què huà", "却 as 'then, in turn'; 话 as verb, 'to talk about'."], ["巴山", "bā shān", "The mountains of 巴, eastern Sichuan, where he was."]], "dui": ["君问归期未有期，巴山夜雨涨秋池", "jūn wèn guī qī wèi yǒu qī ， bā shān yè yǔ zhǎng qiū chí", "You ask when I return; there is no date. Night rain in the 巴 mountains fills the autumn pond.", "The first couplet, which contains the phrase 巴山夜雨 (bā shān yè yǔ) that the second couplet then quotes back, the poem's famous repetition."], "dian": "None specific. The device is the allusion: a poem that quotes itself, the second 巴山夜雨 (bā shān yè yǔ) being the future memory of the first.", "shi": "Around 848 to 851, in Sichuan, on a governor's staff. The title 夜雨寄北 (yè yǔ jì běi) is 'night rain, sent north', north being Chang'an, where his wife 王氏 (wáng shì) was. Whether she was alive when he wrote it is debated; she died in 851.", "chuan": "The Chinese line for storing up a moment to tell someone later. The time-fold is what people love: now, then, and the then in which now is remembered. Say it to yourself on a rainy night alone, and then do tell them.", "lian": [["p", "haishang", "the same moment shared across distance"], ["p", "changjiu", "the moon that does the sharing"], ["s", "rainy-night", "rain, a window, someone to tell"]]}}, "suihan": {"id": "suihan", "zh": "岁寒，然后知松柏之后凋也", "segs": [["岁寒", "when the year turns cold", "suì hán"], ["然后", "only then", "rán hòu"], ["知", "do we know", "zhī"], ["松柏", "pine and cypress", "sōng bǎi"], ["之", "(links subject and verb)", "zhī"], ["后凋", "are the last to wither", "hòu diāo"], ["也", "(sentence-final particle)", "yě"]], "en": "Only when the year turns cold do we know that the pine and cypress are the last to wither.", "author": "孔子", "work": "论语·子罕", "era": "春秋", "note": "Hard times reveal who is solid. The pine and cypress became the symbols of constancy because of this one line. Say it about a friend or a colleague who held up when things got bad.", "ctx": null, "py": "suì hán ， rán hòu zhī sōng bǎi zhī hòu diāo yě", "deep": {"zi": [["岁寒", "suì hán", "The cold of the year: deep winter. Not a season, a test."], ["松柏", "sōng bǎi", "Pine and cypress together, the two evergreens. Later the plum joined them as 岁寒三友, the three friends of winter."], ["后凋", "hòu diāo", "凋 is to wither. 后凋 is 'the last to wither', which is a careful phrase: even the evergreens are not said to be immune, only last."]], "dui": null, "dian": "None earlier; this is the origin of the whole evergreen symbolism in Chinese art. Every painting of a pine in snow is quoting it.", "shi": "From 子罕 (zi hǎn). Traditionally connected to the period when Confucius and his disciples were besieged and starving between 陈 and 蔡, and several disciples wavered. The line is read as what he learned from who stayed.", "chuan": "岁寒三友 (suì hán sān yǒu) (pine, bamboo, plum) became a standard painting subject and a standard way to praise loyal friends. 诗经 (shī jīng) had already used pine and cypress for endurance, but this line fixed the meaning. In modern use the line is nearly always about people, rarely about trees.", "lian": [["s", "held-up", "the friend who stayed"], ["p", "qianmo", "the bamboo version, a thousand years later"], ["p", "danrushui", "the friendship that lasts because it is light"]]}}, "yehuo": {"id": "yehuo", "zh": "野火烧不尽，春风吹又生", "segs": [["野火", "wildfire", "yě huǒ"], ["烧不尽", "cannot burn it all", "shāo bù jìn"], ["春风", "spring wind", "chūn fēng"], ["吹又生", "blows and it grows again", "chuī yòu shēng"]], "en": "Wildfire cannot burn it out; the spring wind blows and it grows again.", "author": "白居易", "work": "赋得古原草送别", "era": "唐", "note": "Bai Juyi wrote this at sixteen. An older poet had joked that with a name like 居易 (live easily) living in the capital would not be easy; after reading this he said, with a talent like this, living anywhere is easy. Say it about anything, or anyone, that keeps coming back.", "ctx": null, "py": "yě huǒ shāo bù jìn ， chūn fēng chuī yòu shēng", "deep": {"zi": [["野火", "yě huǒ", "Wildfire, the burning of fields."], ["烧不尽", "shāo bù jìn", "Cannot burn it out; 尽 as the complement 'to the end'."], ["吹又生", "chuī yòu shēng", "Blows, and again it lives. 生 as 'come to life'."]], "dui": ["离离原上草，一岁一枯荣", "lí lí yuán shàng cǎo ， yī suì yī kū róng", "Thick, thick, the grass on the plain; each year it withers and thrives.", "The opening couplet, the annual cycle that the fire cannot interrupt."], "dian": "The title's 赋得 (fù dé) marks it as an exam-style set-topic poem; 古原草 (gǔ yuán cǎo) (grass on the ancient plain) was the topic. The tradition behind it is the 楚辞 (chǔ cí) 招隐士 (zhāo yǐn shì) line 王孙游兮不归 (wáng sūn yóu xī bù guī)，春草生兮萋萋 (chūn cǎo shēng xī qī qī), which the poem's second half quotes: 又送王孙去 (yòu sòng wáng sūn qù)，萋萋满别情 (qī qī mǎn bié qíng).", "shi": "Around 787. 白居易 (bái jū yì) was sixteen and had brought his poems to the capital to show the senior poet 顾况 (gù kuàng), who joked about his name (居易 (jū yì), 'live easily': with rice this expensive, living in Chang'an is not easy). Then he read this and said with lines like these, living anywhere would be easy. The story is in 幽闲鼓吹 (yōu xián gǔ chuī) and every biography since.", "chuan": "The couplet is quoted for every kind of resilience: peoples, movements, ideas, weeds. It is the least loud resilience line in the deck, which makes it usable in a work context. 野火烧不尽 (yě huǒ shāo bù jìn) alone is understood.", "lian": [["p", "qianmo", "bamboo in rock, the loud version"], ["p", "juantu", "the general who should have regrown"], ["s", "comeback", "written off and back"]]}}, "luohong": {"id": "luohong", "zh": "落红不是无情物，化作春泥更护花", "segs": [["落红", "fallen petals (literally: fallen red)", "luò hóng"], ["不是", "are not", "bú shì"], ["无情物", "things without feeling", "wú qíng wù"], ["化作", "turn into", "huà zuò"], ["春泥", "spring mud", "chūn ní"], ["更护花", "and go on protecting the flowers", "gèng hù huā"]], "en": "Fallen petals are not heartless things; they become spring mud and protect the next flowers.", "author": "龚自珍", "work": "己亥杂诗·其五", "era": "清", "note": "Written the day he resigned from office and left the capital. Leaving a role but still nourishing what comes after. Say it when you hand something over, or when you decide to help without credit.", "ctx": null, "py": "luò hóng bú shì wú qíng wù ， huà zuò chūn ní gèng hù huā", "deep": {"zi": [["落红", "luò hóng", "Fallen red: petals, by metonymy. 红 for flower is the poetic habit."], ["无情物", "wú qíng wù", "A thing without feeling; 情 as 'feeling, sentience'."], ["化作", "huà zuò", "Turn into; 化 as 'transform'."], ["护花", "hù huā", "Protect the flowers; 护 as 'guard'."]], "dui": ["浩荡离愁白日斜，吟鞭东指即天涯", "hào dàng lí chóu bái rì xié ， yín biān dōng zhǐ jí tiān yá", "Vast the sorrow of leaving as the sun slants; my whip points east, and there is the world's edge.", "The first couplet: he is riding out of the capital."], "dian": "Reverses the whole tradition of fallen blossoms as loss (林黛玉 (lín dài yù) burying petals in 红楼梦 (hóng lóu mèng) is its extreme). 龚自珍 (gōng zì zhēn) makes the fallen petal an agent.", "shi": "1839, the 己亥 (jǐ hài) year. 龚自珍 (gōng zì zhēn), a minor official and major thinker, resigned in disgust from the capital and rode south, writing 315 short poems on the road, the 己亥杂诗 (jǐ hài zá shī). This is number five, the day he left. Number 125, 我劝天公重抖擞 (wǒ quàn tiān gōng zhòng dǒu sǒu)，不拘一格降人才 (bù jū yī gé jiàng rén cái), is the other one everyone knows. He died two years later; the Opium War began the year after he left.", "chuan": "Quoted about retirement, about teachers, about handing over. It is the standard Chinese line for contributing after leaving the stage, used in eulogies for scientists and in resignation speeches. Say it when you step down and keep helping.", "lian": [["p", "yehuo", "what grows back from what was burned"], ["p", "guangsha", "building for others at one's own cost"], ["s", "handing-over", "passing the torch"]]}}, "qingming": {"id": "qingming", "zh": "清明时节雨纷纷，路上行人欲断魂", "segs": [["清明时节", "around the Qingming festival", "qīng míng shí jié"], ["雨纷纷", "rain falls in a fine tangle", "yǔ fēn fēn"], ["路上行人", "travellers on the road", "lù shàng xíng rén"], ["欲断魂", "seem about to lose their souls (heartbroken)", "yù duàn hún"]], "en": "Around Qingming the rain falls thick and fine; travellers on the road look ready to lose their souls.", "author": "杜牧", "work": "清明", "era": "唐", "note": "Qingming is the tomb-sweeping festival in early April, when families visit their ancestors' graves. This is its poem. It ends with a cowherd pointing the way to a wine shop in Apricot Blossom Village.", "ctx": null, "py": "qīng míng shí jié yǔ fēn fēn ， lù shàng xíng rén yù duàn hún", "deep": {"zi": [["清明", "qīng míng", "The solar term around 5 April, 'clear and bright', and the festival of tending graves attached to it."], ["纷纷", "fēn fēn", "Thick and tangled, of rain or falling things; the reduplication makes it continuous."], ["欲断魂", "yù duàn hún", "About to lose the soul; 断魂 for grief so heavy it seems to sever the spirit."]], "dui": ["借问酒家何处有？牧童遥指杏花村", "jiè wèn jiǔ jiā hé chù yǒu ？ mù tóng yáo zhǐ xìng huā cūn", "May I ask where there is a wine shop? The cowherd points far off to Apricot Blossom Village.", "The second couplet, which turns the grief into a small comedy and gave a liquor brand its name."], "dian": "None specific; the festival itself is the allusion. 清明 (qīng míng) absorbed the older 寒食 (hán shí) (cold food) festival, which commemorated 介子推 (jiè zi tuī), the loyal retainer who burned rather than accept reward.", "shi": "杜牧 (dù mù), mid-ninth century, probably in office in the south. The poem's attribution has been questioned by some scholars because it does not appear in his early collections, but it has been his for a thousand years.", "chuan": "The 清明 (qīng míng) poem. Every Chinese person can recite it and it is quoted at every tomb-sweeping. The wine shop at the end is the human touch: grief, rain, and then a drink. 杏花村 (xìng huā cūn) is a famous 汾酒 (fén jiǔ) brand because of the last line.", "lian": [["p", "shinian", "grief that has settled"], ["p", "zhanyi", "the gentler spring rain"], ["p", "qingming", "(scene) early April, ancestors"]]}}, "baozhu": {"id": "baozhu", "zh": "爆竹声中一岁除，春风送暖入屠苏", "segs": [["爆竹声中", "amid the sound of firecrackers", "bào zhú shēng zhōng"], ["一岁除", "one year is removed, ends", "yī suì chú"], ["春风", "spring wind", "chūn fēng"], ["送暖", "brings warmth", "sòng nuǎn"], ["入屠苏", "into the tusu wine (a New Year herbal wine)", "rù tú sū"]], "en": "Amid the crack of firecrackers a year is done; the spring wind brings warmth into the New Year wine.", "author": "王安石", "work": "元日", "era": "北宋", "note": "The Lunar New Year poem. Wang Anshi wrote it as he launched his sweeping reforms, and the last line, new peach-wood charms replacing old ones, is also about that. Say it on New Year's Eve.", "ctx": null, "py": "bào zhú shēng zhōng yī suì chú ， chūn fēng sòng nuǎn rù tú sū", "deep": {"zi": [["爆竹", "bào zhú", "Exploding bamboo: before gunpowder, bamboo joints were thrown on fires to crack. The word survived the technology."], ["一岁除", "yī suì chú", "One year removed; 除 as 'remove, replace', which is also why New Year's Eve is 除夕."], ["屠苏", "tú sū", "Read tú sū, a herbal wine drunk on New Year's morning, youngest first, oldest last."]], "dui": ["千门万户曈曈日，总把新桃换旧符", "qiān mén wàn hù tóng tóng rì ， zǒng bǎ xīn táo huàn jiù fú", "On a thousand gates, ten thousand doors, the brightening sun; everyone swaps new peach charms for old.", "The second couplet: 桃符 (táo fú), peach-wood tablets with guardian names hung on doors, the ancestor of the red 春联 (chūn lián) (spring couplets)."], "dian": "The customs are the allusion, all of them recorded in the 荆楚岁时记 (jīng chǔ suì shí jì) (sixth century): firecrackers, 屠苏 (tú sū) wine, peach charms. 王安石 (wáng ān shí) wrote the definitive New Year poem by listing them.", "shi": "1069. 王安石 (wáng ān shí) had just been made vice-chancellor and was launching the 新法 (xīn fǎ), the sweeping economic reforms that would divide the Song. The last line, new charms for old, is read as a manifesto: out with the old.", "chuan": "The New Year poem, printed on cards and recited on television every 春节 (chūn jié). 总把新桃换旧符 (zǒng bǎ xīn táo huàn jiù fú) is quoted about any replacement of the old by the new. Say it on New Year's Eve; the whole table will finish it.", "lian": [["p", "liushao", "the festival two weeks later"], ["p", "cunjin", "the year's worth of time"], ["s", "new-year", "firecrackers"]]}}, "liushao": {"id": "liushao", "zh": "月上柳梢头，人约黄昏后", "segs": [["月上", "the moon rises to", "yuè shàng"], ["柳梢头", "the tips of the willows", "liǔ shāo tóu"], ["人约", "people arrange to meet", "rén yuē"], ["黄昏后", "after dusk", "huáng hūn hòu"]], "en": "The moon climbs to the willow tips; we agreed to meet after dusk.", "author": "欧阳修", "work": "生查子·元夕", "era": "北宋", "note": "Also attributed to the female poet 朱淑真. A Lantern Festival love poem: the first half is last year, this line; the second half is this year, same moon, same lanterns, the person gone. Say it when you have plans after dark.", "ctx": null, "py": "yuè shàng liǔ shāo tóu ， rén yuē huáng hūn hòu", "deep": {"zi": [["月上", "yuè shàng", "The moon rises to; 上 as verb of ascent."], ["柳梢头", "liǔ shāo tóu", "The tips of the willows; 梢 (shāo) the branch-tip."], ["人约", "rén yuē", "People arranged to meet; 约 as 'agree, make a date', the modern 约会 descends from it."], ["黄昏后", "huáng hūn hòu", "After dusk."]], "dui": ["今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖", "jīn nián yuán yè shí ， yuè yǔ dēng yī jiù 。 bú jiàn qù nián rén ， lèi shī chūn shān xiù", "This year at Lantern Festival the moon and lamps are as before; I do not see last year's person; tears wet my spring sleeves.", "The second stanza, which turns the first into memory."], "dian": "The 元夕 (yuán xī) (Lantern Festival, fifteenth of the first month) was the one night of the year when the curfew lifted and young women went out; it is the setting of nearly every Song romance. 崔护 (cuī hù)'s 人面桃花 (rén miàn táo huā) (the girl seen once at a door, gone the next year) is the Tang ancestor of the structure.", "shi": "Northern Song, attributed to 欧阳修 (ōu yáng xiū) in most collections and to the woman poet 朱淑真 (zhū shū zhēn) in some; scholars still argue. The two-stanza mirror (last year / this year) is the whole design.", "chuan": "The first stanza is quoted alone as a line about evening plans and young love; the second is what everyone remembers when reminded. Say the first half when you have plans after dark; keep the second for yourself.", "lian": [["p", "zhongli", "the same festival, the person found"], ["p", "changjiu", "the moon that stays while people go"], ["s", "lantern", "plans after dusk"]]}}, "qiusuo": {"id": "qiusuo", "zh": "路漫漫其修远兮，吾将上下而求索", "segs": [["路", "the road", "lù"], ["漫漫", "long and endless", "màn màn"], ["其", "(particle)", "qí"], ["修远", "long and far", "xiū yuǎn"], ["兮", "(ancient exclamation, like 'ah')", "xī"], ["吾将", "I will", "wú jiāng"], ["上下", "high and low", "shàng xià"], ["而求索", "search and seek", "ér qiú suǒ"]], "en": "The road is long, so far and long; I will search high and low.", "author": "屈原", "work": "离骚", "era": "战国", "note": "From the Li Sao, the founding poem of the southern tradition, by a minister who drowned himself in protest. The Dragon Boat festival commemorates him. The most quoted line in Chinese about a long quest. Say it when you commit to a search you know will take years.", "ctx": null, "py": "lù màn màn qí xiū yuǎn xī ， wú jiāng shàng xià ér qiú suǒ", "deep": {"zi": [["漫漫", "màn màn", "Long, endless, reduplicated for stretch. The same 漫 is in 漫长."], ["修远", "xiū yuǎn", "修 here means 'long' (as in 修长), not 'repair'. 修远 doubles the distance."], ["兮", "xī", "Read xī, the exclamatory particle that marks the whole 楚辞 tradition. It falls in the middle of each line, giving the 离骚 its lurching, chanted rhythm."], ["求索", "qiú suǒ", "求 (seek) and 索 (search, as in 搜索). The compound survives in modern Chinese almost only because of this line."]], "dui": null, "dian": "None earlier. The 离骚 (lí sāo) (Encountering Sorrow) is the beginning of the southern lyric tradition, as the 诗经 (shī jīng) is of the northern one; the two together are 风骚 (fēng sāo), which became the word for literary elegance.", "shi": "The 离骚 (lí sāo) is 屈原 (qū yuán)'s long autobiographical poem, some 370 lines, in which he recounts his loyalty, his slander, and a visionary journey through the heavens in search of a worthy lord. This couplet comes as he sets out on that journey.", "chuan": "The most quoted line about a long quest in the language, on the walls of universities and research institutes, and in the mouth of every graduation speaker. It is also the line 毛泽东 (máo zé dōng) and later leaders used for the national project. Because it is so public, say it privately, about a search that is yours.", "lian": [["p", "duxing", "屈原's other line, lonely lucidity"], ["p", "changfeng", "李白's version, a sail instead of a road"], ["p", "hongyi", "the burden heavy, the road far"]]}}, "zhizhi": {"id": "zhizhi", "zh": "知之为知之，不知为不知，是知也", "segs": [["知之", "knowing something", "zhī zhī"], ["为知之", "count it as known", "wéi zhī zhī"], ["不知", "not knowing", "bù zhī"], ["为不知", "count it as not known", "wéi bù zhī"], ["是", "this is", "shì"], ["知也", "knowledge, wisdom", "zhī yě"]], "en": "To know what you know and know what you do not know: this is knowledge.", "author": "孔子", "work": "论语·为政", "era": "春秋", "note": "Said to 子路, the boldest and most bluffing of the disciples. The last 知 is sometimes read as 智, wisdom. Say it when you catch yourself, or someone else, pretending to know.", "ctx": null, "py": "zhī zhī wéi zhī zhī ， bù zhī wéi bù zhī ， shì zhī yě", "deep": {"zi": [["知之为知之", "zhī zhī wéi zhī zhī", "The first 知 is 'to know'; 为 (wéi) is 'to count as, to take as'. Literally 'knowing it, take it as knowing it'."], ["是知也", "shì zhī yě", "The last 知 is read zhì and stands for 智, wisdom. The pun is the point: honesty about knowing is what knowing is."]], "dui": null, "dian": "None earlier. Socrates said something similar about the same time in Athens, which makes this one of the few Confucian lines Western readers recognise immediately.", "shi": "From 为政 (wéi zhèng). Addressed by name to 子路 (zi lù) (由), the boldest disciple, a former swordsman who joined the school late and had a habit of answering before he understood. 由，诲女知之乎 (huì nǚ zhī zhī hū), 'You, shall I teach you what knowing is?' The line is a rebuke with a lesson folded in.", "chuan": "The standard Chinese line for intellectual honesty, taught to children and quoted in scientific contexts. Its strength is that it is addressed to a specific bluffer, so it can be said to yourself without pomposity: you are being 子路 (zi lù) today.", "lian": [["p", "xuesi", "the two ways of not knowing"], ["p", "guobugai", "the error that follows pretending"], ["s", "know-dont-know", "the meeting where nobody will say it"]]}}, "shizhe": {"id": "shizhe", "zh": "逝者如斯夫，不舍昼夜", "segs": [["逝者", "that which passes", "shì zhě"], ["如斯", "is like this", "rú sī"], ["夫", "(exclamation)", "fū"], ["不舍", "does not stop", "bù shě"], ["昼夜", "day or night", "zhòu yè"]], "en": "What passes is like this: it does not stop, day or night.", "author": "孔子", "work": "论语·子罕", "era": "春秋", "note": "Confucius on a riverbank. Two thousand years of commentary disagree about whether this is a lament or an encouragement. Say it by moving water when time is on your mind.", "ctx": null, "py": "shì zhě rú sī fū ， bù shě zhòu yè", "deep": {"zi": [["逝者", "shì zhě", "逝 is to pass away, to depart. 者 nominalises: 'that which passes'. Deliberately unspecified: water, time, life."], ["如斯", "rú sī", "'Like this', with 斯 the demonstrative. Confucius is pointing at the river."], ["夫", "fū", "Read fú, a sentence-final exclamation. It makes the line a sigh rather than a statement."], ["不舍", "bù shě", "舍 read shě, to stop or let go. 不舍昼夜: it does not stop, day or night."]], "dui": null, "dian": "None earlier. The scene itself, 子在川上曰 (zi zài chuān shàng yuē) ('the master, standing by the river, said'), became a topos: any Chinese poet standing by water is standing where Confucius stood.", "shi": "From 子罕 (zi hǎn). No river is named. The commentarial tradition argued for two thousand years about the mood: the Han read it as a lament for lost time, the Song philosophers (especially 朱熹 (zhū xī)) read it as admiration for the ceaseless activity of the Way, with the water as a model to imitate.", "chuan": "The line is the root of every later river-and-time poem, from 李煜 (lǐ yù)'s 一江春水 (yī jiāng chūn shuǐ) to 杨慎 (yáng shèn)'s 滚滚长江 (gǔn gǔn cháng jiāng). It is quoted at funerals and at graduations, which tells you it has kept both readings. Said aloud, the four characters 逝者如斯 (shì zhě rú sī) are enough.", "lian": [["p", "gungun", "the river as the thing that washes heroes away"], ["p", "chunshui", "the river as the measure of sorrow"], ["p", "tianxingjian", "the Song reading: ceaseless motion as a model"]]}}, "modengxian": {"id": "modengxian", "zh": "莫等闲，白了少年头，空悲切", "segs": [["莫等闲", "do not idle", "mò děng xián"], ["白了", "until white is", "bái le"], ["少年头", "the young head (hair)", "shào nián tóu"], ["空", "in vain", "kōng"], ["悲切", "grieve bitterly", "bēi qiè"]], "en": "Do not idle until your young hair turns white and grieve in vain.", "author": "岳飞", "work": "满江红·怒发冲冠", "era": "南宋", "note": "Yue Fei, the general who was executed by his own court for wanting to keep fighting the Jurchen. Fierce and urgent. Say it when you catch yourself wasting a day.", "ctx": null, "py": "mò děng xián ， bái le shào nián tóu ， kōng bēi qiè", "deep": {"zi": [["等闲", "děng xián", "Idly, lightly; 等闲 as 'ordinary, careless'. 莫等闲: do not take it lightly."], ["白了少年头", "bái le shào nián tóu", "Whitened the young head; 白 as verb, 'to turn white', with 了 marking completion."], ["空", "kōng", "In vain, emptily."], ["悲切", "bēi qiè", "Grieve bitterly; 切 as 'keen, sharp'."]], "dui": ["三十功名尘与土，八千里路云和月", "sān shí gōng míng chén yǔ tǔ ， bā qiān lǐ lù yún hé yuè", "Thirty years of achievement, dust and earth; eight thousand li of road, cloud and moon.", "The couplet before: everything he has done is nothing yet."], "dian": "The 少壮不努力 (shào zhuàng bù nǔ lì) of the 长歌行 (cháng gē xíng) is the ancestor; this is the same warning from a general. Note: whether 岳飞 (yuè fēi) wrote the 满江红 (mǎn jiāng hóng) is disputed. It is not recorded before the Ming, and some scholars (余嘉锡 (yú jiā xī), 夏承焘 (xià chéng dào)) argued it was composed in the fifteenth century in his name. Most Chinese readers do not care, and the poem is his in every anthology.", "shi": "Attributed to 岳飞 (yuè fēi) (1103 to 1142), the general who drove the 金 back toward the north and was recalled by twelve gold-tablet orders, then executed on a fabricated charge by the chancellor 秦桧 (qín guì). His tomb at 杭州 (háng zhōu) has kneeling statues of 秦桧 (qín guì) and his wife that visitors have spat on for eight centuries.", "chuan": "The most patriotic poem in Chinese, sung as an anthem in the 1930s and after; 怒发冲冠 (nù fà chōng guān) (hair standing up under the hat with rage) is its opening. This couplet is the one used about personal urgency rather than the nation. Say it when you catch yourself wasting a day, and hear the general behind it.", "lian": [["p", "shaozhuang", "the Han version, from a folk song"], ["p", "cunjin", "the folk maxim about gold and time"], ["s", "wasted-day", "the day that slipped"]]}}, "gongxing": {"id": "gongxing", "zh": "纸上得来终觉浅，绝知此事要躬行", "segs": [["纸上", "from paper, from books", "zhǐ shàng"], ["得来", "what is gained", "dé lái"], ["终觉浅", "always feels shallow", "zhōng jué qiǎn"], ["绝知", "to truly know", "jué zhī"], ["此事", "this matter", "cǐ shì"], ["要躬行", "you must do it yourself", "yào gōng xíng"]], "en": "What comes from books always feels shallow; to truly know a thing you must do it with your own hands.", "author": "陆游", "work": "冬夜读书示子聿", "era": "南宋", "note": "Written to his son on a winter night. Lu You wrote nearly ten thousand poems and still said this. Say it when you have read enough and need to build.", "ctx": null, "py": "zhǐ shàng dé lái zhōng jué qiǎn ， jué zhī cǐ shì yào gōng xíng", "deep": {"zi": [["纸上", "zhǐ shàng", "On paper; from books."], ["终觉浅", "zhōng jué qiǎn", "终 as 'in the end, always'; 觉 as 'feel'; 浅 as 'shallow'."], ["绝知", "jué zhī", "To know thoroughly; 绝 as 'utterly'."], ["躬行", "gōng xíng", "To do it in person; 躬 as 'oneself, bodily'. 躬行 is still the word for practising what one preaches."]], "dui": ["古人学问无遗力，少壮工夫老始成", "gǔ rén xué wèn wú yí lì ， shào zhuàng gōng fu lǎo shǐ chéng", "The ancients spared no effort in learning; the work of youth was completed only in age.", "The first couplet, addressed to a young son: it takes a lifetime."], "dian": "The distrust of paper learning has a classical source in 赵括 (zhào kuò), the general who had memorised every book on war and lost 400,000 men at 长平 (zhǎng píng) (史记 (shǐ jì)), the origin of 纸上谈兵 (zhǐ shàng tán bīng), 'discussing war on paper'. 陆游 (lù yóu)'s readers heard him.", "shi": "1199, a winter night, written for his youngest son 子聿 (zi yù), then twenty-one. 陆游 (lù yóu) was seventy-four. He had spent his life reading and writing and told his son that was not enough.", "chuan": "The standard Chinese line for the gap between knowing and doing, on the walls of engineering schools and in every speech about practice. Say it when you have read enough and need to build, and say it to yourself first.", "lian": [["p", "xuesi", "learning and thinking, both required"], ["p", "powanjuan", "杜甫's ten thousand scrolls, the other half"], ["p", "nanyi", "the monk who just went"]]}}, "nanyi": {"id": "nanyi", "zh": "天下事有难易乎？为之，则难者亦易矣", "segs": [["天下事", "matters under heaven, any undertaking", "tiān xià shì"], ["有难易乎", "are there hard and easy ones?", "yǒu nán yì hū"], ["为之", "do it", "wéi zhī"], ["则", "then", "zé"], ["难者", "the hard one", "nán zhě"], ["亦易矣", "becomes easy too", "yì yì yǐ"]], "en": "Is anything in the world hard or easy? Do it, and the hard becomes easy.", "author": "彭端淑", "work": "为学一首示子侄", "era": "清", "note": "From an essay about two monks who wanted to go to the South Sea: the rich one spent years planning a boat, the poor one set off with a bowl and came back a year later. Say it when you are over-planning.", "ctx": ["不为，则易者亦难矣", "bù wèi ， zé yì zhě yì nán yǐ", "Do not do it, and the easy becomes hard."], "py": "tiān xià shì yǒu nán yì hū ？ wéi zhī ， zé nán zhě yì yì yǐ", "deep": {"zi": [["天下事", "tiān xià shì", "Matters under heaven; any undertaking."], ["难易", "nán yì", "Hard and easy; a two-character contrast the essay turns on."], ["为之", "wéi zhī", "Do it; 为 read wéi, 之 the object."], ["亦易矣", "yì yì yǐ", "Also easy; 亦 as 'also', 矣 marking the result."]], "dui": ["不为，则易者亦难矣", "bù wèi ， zé yì zhě yì nán yǐ", "Do not do it, and the easy becomes hard.", "The matching sentence, the other half of the opening."], "dian": "The parable that follows: two monks of the Sichuan borderlands (蜀鄙二僧 (shǔ bǐ èr sēng)) wanted to go to 南海 (nán hǎi) (Putuo island, the Guanyin pilgrimage). The rich one spent years planning to hire a boat; the poor one said he needed only a water bottle and a rice bowl, went, and came back a year later. The rich one was ashamed.", "shi": "Eighteenth century. 彭端淑 (péng duān shū) wrote 为学一首示子侄 (wèi xué yī shǒu shì zi zhí) ('on learning, for my sons and nephews') as a family instruction; it was picked up by the schoolbooks and is now one of the most-read classical essays in the curriculum.", "chuan": "Quoted against over-planning and for just starting, in every Chinese speech to students. It works because the story is concrete: a bowl and a bottle. Say it when you have been building the boat for a year.", "lian": [["p", "gongxing", "陆游: do it with your own hands"], ["p", "dangduan", "the cost of not deciding"], ["s", "over-planning", "the perfect plan, nothing done"]]}}, "huofu": {"id": "huofu", "zh": "祸兮福之所倚，福兮祸之所伏", "segs": [["祸", "misfortune", "huò"], ["兮", "(exclamation)", "xī"], ["福之所倚", "is what fortune leans on", "fú zhī suǒ yǐ"], ["福", "fortune", "fú"], ["兮", "(exclamation)", "xī"], ["祸之所伏", "is where misfortune lies hidden", "huò zhī suǒ fú"]], "en": "Misfortune is what fortune leans on; fortune is where misfortune hides.", "author": "老子", "work": "道德经·第五十八章", "era": "春秋", "note": "The source of the folk story 塞翁失马 (the old man who lost his horse). Say it when a plan fails and you suspect it might turn out to be a gift, or when things are going too well.", "ctx": null, "py": "huò xī fú zhī suǒ yǐ ， fú xī huò zhī suǒ fú", "deep": {"zi": [["兮", "xī", "Read xī, an exclamatory particle from the southern (楚) tradition. Its presence here is a sign that the 道德经 was composed to be chanted."], ["倚", "yǐ", "To lean on. 福之所倚: what fortune leans against."], ["伏", "fú", "To lie hidden, to crouch. 祸之所伏: where misfortune crouches. The two verbs make fortune and misfortune into bodies leaning on and hiding in each other."]], "dui": null, "dian": "None earlier in written form. It is the source for the 淮南子 (huái nán zi) story of 塞翁失马 (sài wēng shī mǎ), the old man at the frontier whose lost horse returned with another, whose son then broke his leg riding it, who was then spared from the war. That story is how most people know the idea.", "shi": "道德经 (dào dé jīng) chapter 58. The text is attributed to 老子 (lǎo zi), about whom almost nothing certain is known; the book itself is a compilation probably assembled in the fourth or third century BCE. The chapter is about governing lightly, and this line is its pivot.", "chuan": "The most quoted line of Daoist thought after 道可道 (dào kě dào). It underlies the Chinese habit of tempering good news and consoling bad. Its modern misuse is as fatalism; the original is closer to an observation about systems, that every state carries the seed of its reversal, which you already know from control theory.", "lian": [["p", "yuanlv", "the Confucian version: think ahead in good times"], ["s", "plan-fails", "the rejection that might be lucky"], ["p", "shilai", "when fortune leaves"]]}}, "zizhi": {"id": "zizhi", "zh": "知人者智，自知者明", "segs": [["知人者", "one who knows others", "zhī rén zhě"], ["智", "is clever", "zhì"], ["自知者", "one who knows himself", "zì zhī zhě"], ["明", "is enlightened, clear-sighted", "míng"]], "en": "To know others is cleverness; to know yourself is clarity.", "author": "老子", "work": "道德经·第三十三章", "era": "春秋", "note": "The chapter continues: to overcome others is strength, to overcome yourself is true power. Say it when you catch a blind spot in your own thinking.", "ctx": ["胜人者有力，自胜者强", "shèng rén zhě yǒu lì ， zì shèng zhě qiáng", "One who overcomes others has force; one who overcomes himself is strong."], "py": "zhī rén zhě zhì ， zì zhī zhě míng", "deep": {"zi": [["智", "zhì", "Cleverness, practical intelligence. Knowing others earns you this."], ["明", "míng", "Brightness, clarity; the light in which things are seen. Knowing yourself earns this, and 明 is the higher word in the 道德经's vocabulary."]], "dui": ["胜人者有力，自胜者强", "shèng rén zhě yǒu lì ， zì shèng zhě qiáng", "One who overcomes others has force; one who overcomes himself is strong.", "The next line, with the same structure: 力 (force) is the lower word, 强 (strength) the higher."], "dian": "None earlier. The Delphic 'know thyself' is the Western twin; the Chinese line goes further by ranking self-knowledge above knowledge of others explicitly.", "shi": "道德经 (dào dé jīng) chapter 33, a chapter of paired contrasts that continues: 知足者富 (zhī zú zhě fù) (one who knows sufficiency is rich), 强行者有志 (qiáng xíng zhě yǒu zhì) (one who persists has will).", "chuan": "自知之明 (zì zhī zhī míng), 'the clarity of self-knowledge', is the idiom that descends from it, usually in the negative: 没有自知之明 (méi yǒu zì zhī zhī míng), someone with no idea of their own limits. Say the original when you have just found one of yours.", "lian": [["p", "guobugai", "the error of not correcting"], ["p", "duxing", "the man certain everyone else is wrong"], ["s", "blind-spot", "catching one"]]}}, "shaou": {"id": "shaou", "zh": "飘飘何所似，天地一沙鸥", "segs": [["飘飘", "drifting", "piāo piāo"], ["何所似", "what am I like?", "hé suǒ shì"], ["天地", "between heaven and earth", "tiān dì"], ["一沙鸥", "a single sand gull", "yī shā ōu"]], "en": "Drifting, what am I like? A single gull between heaven and earth.", "author": "杜甫", "work": "旅夜书怀", "era": "唐", "note": "Du Fu on a boat at night, jobless, sick, and far from anywhere. Say it when you feel unmoored, and want to say so without complaining.", "ctx": null, "py": "piāo piāo hé suǒ shì ， tiān dì yī shā ōu", "deep": {"zi": [["飘飘", "piāo piāo", "Blown about, drifting; reduplicated to make the drifting continuous."], ["何所似", "hé suǒ shì", "'What is it like?', a question form Du Fu uses often. Here it is asked of himself."], ["沙鸥", "shā ōu", "A gull of the sandbanks, a river bird, not a sea bird. Small, white, alone."]], "dui": ["名岂文章著，官应老病休", "míng qǐ wén zhāng zhù ， guān yīng lǎo bìng xiū", "Is a name made by writing? Office should end with age and illness.", "The couplet before, bitter on both counts: he knew his writing was good and his career was over."], "dian": "The bird as the self is old, from 庄子 (zhuāng zi)'s 鹏 to 陶渊明 (táo yuān míng)'s 归鸟 (guī niǎo). Du Fu's choice of the smallest, most drifting bird against the largest words, 天地 (tiān dì), is the reversal.", "shi": "765, on a boat down the Yangtze after his patron 严武 (yán wǔ) died and the 成都 (chéng dū) refuge ended. Du Fu was fifty-three, jobless, with a family aboard, headed nowhere in particular. The first couplet, 细草微风岸 (xì cǎo wēi fēng àn)，危樯独夜舟 (wēi qiáng dú yè zhōu), sets the small boat under a huge sky.", "chuan": "The line for feeling unanchored, quoted by emigrants, the unemployed, and the recently divorced, usually the last five characters alone. It does not complain; that is why it can be said in company.", "lian": [["p", "hanjiang", "柳宗元's fisherman, alone by choice"], ["p", "yaoyue", "Li Bai's solitude, with jokes"], ["s", "unmoored", "between things"]]}}, "gengshang": {"id": "gengshang", "zh": "欲穷千里目，更上一层楼", "segs": [["欲", "if you want to", "yù"], ["穷", "exhaust, see to the end of", "qióng"], ["千里目", "a thousand-li view", "qiān lǐ mù"], ["更上", "climb up one more", "gèng shàng"], ["一层楼", "storey of the tower", "yī céng lóu"]], "en": "If you want to see a thousand li, climb one more storey.", "author": "王之涣", "work": "登鹳雀楼", "era": "唐", "note": "Twenty characters every Chinese child can recite. Literal at a viewpoint, and the standard metaphor for needing a higher vantage to see further. Say it on a climb, or when you decide to go one level up on a problem.", "ctx": null, "py": "yù qióng qiān lǐ mù ， gèng shàng yī céng lóu", "deep": {"zi": [["欲", "yù", "If you want to; the classical 'wish to'."], ["穷", "qióng", "To exhaust, to reach the limit of. 穷千里目: see to the very end of a thousand li."], ["更上", "gèng shàng", "更 (gèng) as 'further'; go up one more."], ["一层楼", "yī céng lóu", "One storey of the tower. 层 is the measure word for floors still."]], "dui": ["白日依山尽，黄河入海流", "bái rì yī shān jǐn ， huáng hé rù hǎi liú", "The white sun ends against the mountains; the Yellow River flows into the sea.", "The first couplet, the view from the tower, before the poem says the view is not enough."], "dian": "None specific. The tower, 鹳雀楼 (guàn què lóu) (Stork Tower) at 蒲州 (pú zhōu) on the Yellow River, was a three-storey Tang landmark; the poem is why it was rebuilt in 2002.", "shi": "Early eighth century. 王之涣 (wáng zhī huàn) has six surviving poems; this and 凉州词 (liáng zhōu cí) are two of the most famous poems in the language. Twenty characters, perfectly parallel in both couplets.", "chuan": "Every Chinese child learns it before they can write. It is quoted about ambition, about research, about wanting a better view of a problem, and it is said at every scenic tower in China. Because it is so early-learned it is warm rather than pompous; you can say it to a five-year-old and to a CEO.", "lian": [["p", "lingjueding", "杜甫's summit version"], ["p", "fuyun2", "王安石's top tier"], ["p", "lushan", "when height is what you lack"]]}}, "chunfeng": {"id": "chunfeng", "zh": "春风得意马蹄疾，一日看尽长安花", "segs": [["春风得意", "pleased as a spring wind (in high spirits)", "chūn fēng dé yì"], ["马蹄疾", "horse's hooves fly", "mǎ tí jí"], ["一日", "in one day", "yī rì"], ["看尽", "see all of", "kàn jìn"], ["长安花", "the flowers of Chang'an", "cháng ān huā"]], "en": "In high spirits my
