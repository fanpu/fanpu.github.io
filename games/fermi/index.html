<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fermi Estimates</title>
<style>
:root{
  --paper:#F3F5F8; --card:#FFFFFF; --ink:#1B2A41; --muted:#5E6B7E; --line:#CBD3DE; --line2:#E4E9F0;
  --accent:#1F6F8B; --accent-ink:#134B5E; --truth:#D99A1E; --truth-ink:#8A5F05;
  --band68:rgba(31,111,139,.30); --band95:rgba(31,111,139,.12); --danger:#B23A48; --ok:#2E7D5B;
  --serif:"Charter","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding:14px 16px 80px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
header h1 span{color:var(--muted);font-weight:400;font-size:15px;margin-left:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;padding:6px 10px;border-radius:6px;color:var(--muted);cursor:pointer}
.tab.on{background:var(--ink);color:#fff}
.card{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:16px;margin-bottom:12px}
.q{font-size:21px;line-height:1.35;margin:6px 0 12px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:#fff}
.chip.live{border-color:var(--truth);color:var(--truth-ink)}
.chip.proc{border-color:var(--accent);color:var(--accent-ink)}
.chip.est{border-color:var(--ink);color:var(--ink)}
.filters.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.filters.scroll::-webkit-scrollbar{display:none}
.filters.scroll .chip{flex:0 0 auto}
label.lbl{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;font-size:18px}
textarea{font-size:16px;min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}
input[type=range]{width:100%;accent-color:var(--accent)}
.hint{font-size:14px;color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:600}
.btn.sec{background:#fff;color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink);font-weight:400}
.btn.small{padding:6px 10px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ladder{margin:14px 0 4px;border-left:2px solid var(--line);padding-left:12px}
.rung{margin:0 0 8px}
.rung .t{font-weight:600}
.rung .x{color:var(--ink);margin-top:2px}
.rung.locked .t{color:var(--muted);font-weight:400}
.rung button{margin-left:6px}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:16px;margin:8px 0}
.stat dt{color:var(--muted)} .stat dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.ok{color:var(--ok)} .bad{color:var(--danger)} .warn{color:var(--truth-ink)}
.ruler{width:100%;height:auto;display:block;margin:6px 0 2px}
.small{font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
.src{font-size:13px;color:var(--muted);margin-top:8px;word-break:break-word}
.notice{background:#FFF7E3;border:1px solid #F0D9A0;border-radius:8px;padding:10px 12px;font-size:15px;margin:10px 0}
.err{color:var(--danger);font-size:15px}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:16px;margin:14px 0 6px}
p{margin:0 0 10px}
ul{padding-left:20px;margin:0 0 10px}
li{margin-bottom:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters .chip{cursor:pointer;background:#fff}
.filters .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.anchor-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:15px}
.timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.sprint-q{padding:10px 0;border-bottom:1px solid var(--line2)}
.sprint-q .qq{font-size:16px;margin-bottom:6px}
.k-preview{font-size:15px;margin-top:6px;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){ .reveal{animation:rise .25s ease-out} @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
<script defer src="/assets/js/game-analytics.js"></script>
</head>

ts (oil, gas, coal, nuclear, renewables) before conversion. World total in 2024: 176,737 TWh, i.e. 21,654 kWh per person per year."}, {"title": "Anchors", "text": "Population of Russia: 145 million. Energy per person by type: poor countries 1,000 to 5,000 kWh; middle income 10,000 to 30,000; rich temperate 35,000 to 50,000; cold or oil-rich or refining hubs 60,000 to 200,000."}, {"title": "Structure", "text": "Total = population × per-capita energy, then convert kWh to TWh by dividing by 10^9."}, {"title": "Compute", "text": "145 million × 62,485 kWh ≈ 9,049 TWh."}, {"title": "Bound", "text": "Share of world primary energy: 5.12%. Compare with the country's share of world population (1.77%): the ratio of the two is the 'energy intensity of a citizen' relative to the world average, here 2.89×."}], "anchors": [{"name": "Primary energy, Russia (2024)", "value": 9049.149, "unit": "TWh"}, {"name": "Energy per capita, Russia (2024)", "value": 62485.312, "unit": "kWh/person"}, {"name": "World primary energy (2024)", "value": 176737.094, "unit": "TWh"}], "note": null}, {"id": "cum_India", "tier": "bank", "domain": "climate", "decay": "slow", "text": "How many billion tonnes of CO2 has India emitted cumulatively from fossil fuels and industry since 1750, through 2024?", "answer": 66.072531, "unit": "billion tonnes CO2", "source": "Our World in Data, owid-co2-data (Global Carbon Budget 2025 / UN WPP / Energy Institute)", "asof": 2024, "chain": [{"title": "Frame", "text": "A cumulative stock: the integral of an exponentially-growing flow. World cumulative since 1750 is 1849 billion tonnes, versus 38.6 billion per year now, so the world has emitted about 48 'current years' worth."}, {"title": "Anchors", "text": "India emits 3,193 million tonnes per year today. The key ratio is cumulative ÷ current annual: for a country whose emissions plateaued long ago (UK, Germany, USA) the ratio is 80 to 260 years; for a late industrialiser still growing (China, India) it is 20 to 30."}, {"title": "Structure", "text": "Cumulative ≈ current annual × effective years, where effective years ≈ 1/growth rate for exponential growth (a 3%/yr grower has ~33 effective years behind it)."}, {"title": "Compute", "text": "3,193 Mt × 21 effective years ≈ 66.1 billion tonnes."}, {"title": "Bound", "text": "India's share of world cumulative CO2 is 3.6%, versus 8.3% of current annual emissions. If those two differ a lot, the country's history is very different from its present."}], "anchors": [{"name": "Cumulative CO2 since 1750, India", "value": 66.072531, "unit": "Gt"}, {"name": "World cumulative CO2 since 1750", "value": 1849.123875, "unit": "Gt"}], "note": null}, {"id": "co2pc_Brazil", "tier": "bank", "domain": "climate", "decay": "slow", "text": "What were Brazil's per-capita CO2 emissions in 2024, in tonnes per person?", "answer": 2.278, "unit": "tonnes CO2 per person", "source": "Our World in Data, owid-co2-data (Global Carbon Budget 2025 / UN WPP / Energy Institute)", "asof": 2024, "chain": [{"title": "Frame", "text": "A ratio: annual fossil CO2 divided by population. The world average is 4.7 t/person. Everything is relative to that number."}, {"title": "Anchors", "text": "Per-capita CO2 tracks two things: energy use per person and the carbon intensity of that energy. Brazil uses 18,486 kWh of primary energy per person per year (world average 21,654 kWh)."}, {"title": "Structure", "text": "per-capita CO2 ≈ energy per capita × carbon intensity. Coal-heavy grids run ~0.3 kg CO2/kWh of primary energy; gas ~0.2; hydro/nuclear-heavy well under 0.1."}, {"title": "Compute", "text": "Brazil's implied carbon intensity is 0.123 kg CO2 per kWh of primary energy. 18,486 kWh × that ≈ 2.3 t."}, {"title": "Bound", "text": "Ranges: sub-Saharan Africa 0.1 to 1; Europe 4 to 8; USA/Australia/Canada 14 to 15; Gulf states 20 to 40."}], "anchors": [{"name": "CO2 per capita, Brazil (2024)", "value": 2.278, "unit": "t/person"}, {"name": "World CO2 per capita (2024)", "value": 4.729, "u ons: how rich, how cold, and does the country host energy-intensive industry or refining out of proportion to its population?"}, {"title": "Compute", "text": "Japan: 38,745 kWh, which is 1.79× the world average, or 4.4 kW continuous per person."}, {"title": "Bound", "text": "Total primary energy 4,795 TWh over 124 million people. If your per-capita guess times population gives a total that is a wildly wrong share of the world's 176,737 TWh, revise."}], "anchors": [{"name": "Energy per capita, Japan (2024)", "value": 38745.039, "unit": "kWh/person"}, {"name": "World energy per capita (2024)", "value": 21653.723, "unit": "kWh/person"}], "note": null}, {"id": "phys_great_wall", "tier": "bank", "domain": "geography", "decay": "timeless", "text": "What is the total length of all sections of the Great Wall of China, in kilometres, according to the 2012 national survey?", "answer": 21196.18, "unit": "km", "source": "China State Administration of Cultural Heritage, 2012 survey", "asof": 2012, "chain": [{"title": "Frame", "text": "the 2012 survey counted every dynasty's walls, branches and trenches, not one continuous line. The Ming wall alone is about 8,850 km."}, {"title": "Anchors", "text": "Earth's circumference is 40,000 km; Beijing to Shanghai is ~1,200 km."}, {"title": "Structure", "text": "Ming wall × factor for older Qin, Han and other dynastic sections (roughly 2.4×)."}, {"title": "Compute", "text": "8,850 × 2.4 ≈ 21,000 km."}, {"title": "Bound", "text": "between 8,000 (Ming only) and 25,000 km."}], "anchors": [{"name": "Great Wall total length (2012 survey)", "value": 21196.18, "unit": "km"}, {"name": "Ming Great Wall length", "value": 8851.8, "unit": "km"}], "note": null}, {"id": "elec_Singapore", "tier": "bank", "domain": "energy", "decay": "slow", "text": "How many terawatt-hours of electricity did Singapore generate in 2024?", "answer": 59.61, "unit": "TWh", "source": "Our World in Data, owid-energy-data (Energy Institute Statistical Review / Ember)", "asof": "text": "United States's share of world cumulative CO2 is 23.5%, versus 12.7% of current annual emissions. If those two differ a lot, the country's history is very different from its present."}], "anchors": [{"name": "Cumulative CO2 since 1750, United States", "value": 434.866562, "unit": "Gt"}, {"name": "World cumulative CO2 since 1750", "value": 1849.123875, "unit": "Gt"}], "note": null}, {"id": "nuclear_Sweden", "tier": "bank", "domain": "energy", "decay": "live", "text": "How many terawatt-hours of electricity did Sweden generate from nuclear power in 2024?", "answer": 50.67, "unit": "TWh", "source": "Our World in Data, owid-energy-data (Energy Institute Statistical Review / Ember)", "asof": 2024, "chain": [{"title": "Frame", "text": "World nuclear generation in 2024: 2,777 TWh out of 30,930 TWh total (9.0% of world electricity)."}, {"title": "Anchors", "text": "Sweden's total generation: 172 TWh. Nuclear share of the mix is the lever: leaders sit at 15 to 40%, laggards under 5%. Capacity × capacity factor also works: solar ~15 to 20%, onshore wind ~25 to 35%, nuclear ~80 to 90% of nameplate hours."}, {"title": "Structure", "text": "Nuclear TWh = total generation × nuclear share, or = installed GW × 8,760 h × capacity factor / 1,000."}, {"title": "Compute", "text": "172 TWh × 29.4% ≈ 50.7 TWh."}, {"title": "Bound", "text": "Sweden's share of world nuclear output: 1.8%. Solar and wind are growing 15 to 30% a year, so answers for these decay fast; nuclear is nearly flat."}], "anchors": [{"name": "Nuclear electricity, Sweden (2024)", "value": 50.67, "unit": "TWh"}, {"name": "World nuclear electricity (2024)", "value": 2777.11, "unit": "TWh"}], "note": null}, {"id": "co2_United States", "tier": "bank", "domain": "climate", "decay": "slow", "text": "How many million tonnes of CO2 did United States emit from fossil fuels and industry in 2024?", "answer": 4904.12, "unit": "million tonnes CO2", "source": "Our World in Data, owid-co2-data (Global Carbon Budget 2025 / UN WPP / Energy Institute)", "asof": 2024, "chain": [{"title": "Frame", "text": "A flow: tonnes per year. Global fossil CO2 in 2024 was about 38,599 million tonnes (38.6 billion tonnes). Per person that is 4.7 t/yr."}, {"title": "Anchors", "text": "Population of United States: 345 million. Per-capita emissions cluster by type: subsistence economies 0.1 to 1 t, middle income 2 to 5 t, rich industrial 6 to 10 t, coal-heavy or oil-state economies 12 to 40 t."}, {"title": "Structure", "text": "Emissions = population × per-capita emissions. Pick the per-capita band from energy mix and income, then multiply."}, {"title": "Compute", "text": "345 million × 14.2 t ≈ 4,904 million tonnes. The per-capita figure is the whole game; the population you can usually recall."}, {"title": "Bound", "text": "United States's share of global CO2 is 12.71%. Check: does your answer divided by 38,599 give a plausible share for a country of 345 million people?"}], "anchors": [{"name": "CO2 emissions of United States (2024)", "value": 4904.12, "unit": "Mt"}, {"name": "CO2 per capita, United States (2024)", "value": 14.197, "unit": "t/person"}, {"name": "World CO2 emissions (2024)", "value": 38598.578, "unit": "Mt"}], "note": null}, {"id": "phys_earth_mass", "tier": "bank", "domain": "physics", "decay": "timeless", "text": "What is the mass of Earth, in kilograms?", "answer": 5.972e+24, "unit": "kg", "source": "IAU nominal value", "asof": 2015, "chain": [{"title": "Frame", "text": "mass = volume × mean density. Rock is ~3 g/cm³, iron ~8; Earth's bulk density is 5.5 g/cm³ because of its iron core."}, {"title": "Anchors", "text": "volume = (4/3)πr³ with r = 6.371 × 10^6 m, so r³ ≈ 2.59 × 10^20 m³ and volume ≈ 1.08 × 10^21 m³."}, {"title": "Structure", "text": "1.08 × 10^21 m³ × 5,500 kg/m³."}, {"title": "Compute", "text": "≈ 5.9 × 10^24 kg."}, {"title": "Bound", "text": "exponent must be 24; the mantissa 5 to 6."}], "anchors": [{"name": "Mass of Earth", "value": 5.972e+24, "unit": "kg"}, {"name": "Earth mean density", "value": 5.51, "unit": "g/cm³"}], "note": null}, {"id": "co2_India", "tier": "bank", "domain": "climate", "decay": "slow", "text": "How many million tonnes of CO2 did India emit from fossil fuels and industry in 2024?", "answer": 3193.478, "unit": "million tonnes CO2", "source": "Our World in Data, owid-co2-data (Global Carbon Budget 2025 / UN WPP / Energy Institute)", "asof": 2024, "chain": [{"title": "Frame", "text": "A flow: tonnes per year. Global fossil CO2 in 2024 was about 38,599 million tonnes (38.6 billion tonnes). Per person that is 4.7 t/yr."}, {"title": "Anchors", "text": "Population of India: 1.45 billion. Per-capita emissions cluster by type: subsistence economies 0.1 to 1 t, middle income 2 to 5 t, rich industrial 6 to 10 t, coal-heavy or oil-state economies 12 to 40 t."}, {"title": "Structure", "text": "Emissions = population × per-capita emissions. Pick the per-capita band from energy mix and income, then multiply."}, {"title": "Compute", "text": "1.45 billion × 2.2 t ≈ 3,194 million tonnes. The per-capita figure is the whole game; the population you can usually recall."}, {"title": "Bound", "text": "India's share of global CO2 is 8.27%. Check: does your answer divided by 38,599 give a plausible share for a country of 1.45 billion people?"}], "anchors": [{"name": "CO2 emissions of India (2024)", "value": 3193.478, "unit": "Mt"}, {"name": "CO2 per capita, India (2024)", "value": 2.201, "unit": "t/person"}, {"name": "World CO2 emissions (2024)", "value": 38598.578, "unit": "Mt"}], "note": null}, {"id": "phys_c", "tier": "bank", "domain": "physics", "decay": "timeless", "text": "What is the speed of light in vacuum, in metres per second?", "answer": 299792458.0, "unit": "m/s", "source": "SI definition of the metre (exact)", "asof": 2019, "chain": [{"title": "Frame", "text": "an exact constant since 1983, when the metre was defined from it."}, {"title": "Anchors", "text": "light circles the Earth about 7.5 times per second; Earth's circumference is 40,000 km."}, {"title": "Structure", "text": "7.5 × 40,000 km per second."}, {"title": "Compute", "text": "300,000 km/s = 3 × 10^8 m/s."}, {"title": "Bound", "text": "the exact value is 2.998 × 10^8; any answer outside 2.9 to 3.1 × 10^8 is wrong."}], "anchors": [{"name": "Speed of light", "value": 299792458, "unit": "m/s"}], "note": null}, {"id": "energy_South Korea", "tier": "bank", "domain": "energy", "decay": "slow", "text": "What was South Korea's primary energy consumption in 2024, in terawatt-hours?", "answer": 3616.218, "unit": "TWh", "source": "Our World in Data, owid-co2-data (Global Carbon Budget 2025 / UN WPP / Energy Institute)", "asof": 2024, "chain": [{"title": "Frame", "text": "Primary energy = all energy inputs (oil, gas, coal, nuclear, renewables) before conversion. World total in 2024: 176,737 TWh, i.e. 21,654 kWh per person per year."}, {"title": "Anchors", "text": "Population of South Korea: 51.7 million. Energy per person by type: poor countries 1,000 to 5,000 kWh; middle income 10,000 to 30,000; rich temperate 35,000 to 50,000; cold or oil-rich or refining hubs 60,000 to 200,000."}, {"title": "Structure", "text": "Total = population × per-capita energy, then convert kWh to TWh by dividing by 10^9."}, {"title": "Compute", "text": "51.7 million × 69,922 kWh ≈ 3,616 TWh."}, {"title": "Bound", "text": "Share of world primary energy: 2.05%. Compare with the country's share of world population (0.63%): the ratio of the two is the 'energy intensity of a citizen' relative to the world average, here 3.23×."}], "anchors": [{"name": "Primary energy, South Korea (2024)", "value": 3616.218, "unit": "TWh"}, {"name": "Energy per capita, South Korea (2024)", "value": 69922.406, "unit": "kWh/person"}, {"name": "World primary energy (2024)", "value": 176737.094, "unit": "TWh"}], "note": null}, {"id": "phys_age_universe", "tier": "bank", "domain": "physics", "decay": "timeless", "text": "What is the age of the universe, in billions of years?", "an  "text": "361 × 0.46."}, {"title": "Compute", "text": "≈ 166 million km²."}, {"title": "Bound", "text": "greater than total land area (149 million)."}], "anchors": [{"name": "Pacific Ocean area", "value": 165250000.0, "unit": "km²"}, {"name": "Total ocean area", "value": 361000000.0, "unit": "km²"}], "note": null}, {"id": "co2pc_Ethiopia", "tier": "bank", "domain": "climate", "decay": "slow", "text": "What were Ethiopia's per-capita CO2 emissions in 2024, in tonnes per person?", "answer": 0.135, "unit": "tonnes CO2 per person", "source": "Our World in Data, owid-co2-data (Global Carbon Budget 2025 / UN WPP / Energy Institute)", "asof": 2024, "chain": [{"title": "Frame", "text": "A ratio: annual fossil CO2 divided by population. The world average is 4.7 t/person. Everything is relative to that number."}, {"title": "Anchors", "text": "Per-capita CO2 tracks two things: energy use per person and the carbon intensity of that energy. Ethiopia uses 686 kWh of primary energy per person per year (world average 21,654 kWh)."}, {"title": "Structure", "text": "per-capita CO2 ≈ energy per capita × carbon intensity. Coal-heavy grids run ~0.3 kg CO2/kWh of primary energy; gas ~0.2; hydro/nuclear-heavy well under 0.1."}, {"title": "Compute", "text": "Ethiopia's implied carbon intensity is 0.197 kg CO2 per kWh of primary energy. 686 kWh × that ≈ 0.1 t."}, {"title": "Bound", "text": "Ranges: sub-Saharan Africa 0.1 to 1; Europe 4 to 8; USA/Australia/Canada 14 to 15; Gulf states 20 to 40."}], "anchors": [{"name": "CO2 per capita, Ethiopia (2024)", "value": 0.135, "unit": "t/person"}, {"name": "World CO2 per capita (2024)", "value": 4.729, "unit": "t/person"}], "note": null}, {"id": "enpc_Hong Kong", "tier": "bank", "domain": "energy", "decay": "slow", "text": "How much primary energy did Hong Kong consume per person in 2024, in kilowatt-hours per year?", "answer": 36808.547, "unit": "kWh per person per year", "source": "Our World in Data, owid-co2-data (Global Carbon Budget 2025 / UN WPP / Energy Institute)", "asof": 2024, "chain": [{"title": "Frame", "text": "World average is 21,654 kWh per person per year. A useful conversion: 1 kW of continuous power for a year is 8,760 kWh, so the average human runs on about 2.5 kW continuously."}, {"title": "Anchors", "text": "A household's electricity is only a small slice; industry, transport and heating dominate. Bands: 1 to 5 thousand kWh (low income), 10 to 30 thousand (middle), 35 to 50 thousand (rich temperate), 60 to 200 thousand (cold, oil-rich, or industrial/refining hubs)."}, {"title": "Structure", "text": "Ask three questions: how rich, how cold, and does the country host energy-intensive industry or refining out of proportion to its population?"}, {"title": "Compute", "text": "Hong Kong: 36,809 kWh, which is 1.70× the world average, or 4.2 kW continuous per person."}, {"title": "Bound", "text": "Total primary energy 273 TWh over 7.41 million people. If your per-capita guess times population gives a total that is a wildly wrong share of the world's 176,737 TWh, revise."}], "anchors": [{"name": "Energy per capita, Hong Kong (2024)", "value": 36808.547, "unit": "kWh/person"}, {"name": "World energy per capita (2024)", "value": 21653.723, "unit": "kWh/person"}], "note": null}, {"id": "energy_Canada", "tier": "bank", "domain": "energy", "decay": "slow", "text": "What was Canada's primary energy consumption in 2024, in terawatt-hours?", "answer": 3886.195, "unit": "TWh", "source": "Our World in Data, owid-co2-data (Global Carbon Budget 2025 / UN WPP / Energy Institute)", "asof": 2024, "chain": [{"title": "Frame", "text": "Primary energy = all energy inputs (oil, gas, coal, nuclear, renewables) before conversion. World total in 2024: 176,737 TWh, i.e. 21,654 kWh per person per year."}, {"title": "Anchors", "text": "Population of Canada: 39.7 million. Energy per person by type: poor countries 1,000 to 5,000 kWh; middle income 10,000 to 30,000; rich temperate 35,000 to 50,000; cold or oil-rich or refining hubs 60,000 to 200,000."}, {"title": "Structure", "text": "Total = population × per-capita energy, then convert kWh to TWh by dividing by 10^9."}, {"title": "Compute", "text": "39.7 million × 97,785 kWh ≈ 3,886 TWh."}, {"title": "Bound", "text": "Share of world primary energy: 2.20%. Compare with the country's share of world population (0.49%): the ratio of the two is the 'energy intensity of a citizen' relative to the world average, here 4.52×."}], "anchors": [{"name": "Primary energy, Canada (2024)", "value": 3886.195, "unit": "TWh"}, {"name": "Energy per capita, Canada (2024)", "value": 97784.539, "unit": "kWh/person"}, {"name": "World primary energy (2024)", "value": 176737.094, "unit": "TWh"}], "note": null}, {"id": "energy_United Kingdom", "tier": "bank", "domain": "energy", "decay": "slow", "text": "What was United Kingdom's primary energy consumption in 2024, in terawatt-hours?", "answer": 1936.96, "unit": "TWh", "source": "Our World in Data, owid-co2-data (Global Carbon Budget 2025 / UN WPP / Energy Institute)", "asof": 2024, "chain": [{"title": "Frame", "text": "Primary energy = all energy inputs (oil, gas, coal, nuclear, renewables) before conversion. World total in 2024: 176,737 TWh, i.e. 21,654 kWh per person per year."}, {"title": "Anchors", "text": "Population of United Kingdom: 69.1 million. Energy per person by type: poor countries 1,000 to 5,000 kWh; middle income 10,000 to 30,000; rich temperate 35,000 to 50,000; cold or oil-rich or refining hubs 60,000 to 200,000."}, {"title": "Structure", "text": "Total = population × per-capita energy, then convert kWh to TWh by dividing by 10^9."}, {"title": "Compute", "text": "69.1 million × 28,016 kWh ≈ 1,937 TWh."}, {"title": "Bound", "text": "Share of world primary energy: 1.10%. Compare with the country's share of world population (0.85%): the ratio of the two is the 'energy intensity of a citizen' relative to the world average, here 1.29×."}], "anchors": [{"name": "Primary energy, United Kingdom (2024) te)", "asof": 2024, "chain": [{"title": "Frame", "text": "A stock, not a flow: people alive at one moment. The world held about 8.16 billion people in 2024. So the question is really: what share of humanity lives in Iceland?"}, {"title": "Anchors", "text": "Iceland ranks #175 in the world by population. The countries just above and below it are Bahamas (401,282) and Vanuatu (327,786)."}, {"title": "Structure", "text": "Two independent routes: (a) share of world × 8.16 billion; (b) an older figure you remember, compounded forward. In 2000 Iceland had 281,293 people."}, {"title": "Compute", "text": "Route (b): 281,293 × (1 + 1.41%)^24 ≈ 393,404. Rich-country growth runs 0 to 1%/yr, fast-growing African countries 2.5 to 3%/yr; that band alone pins the answer within a factor of ~1.7 over 24 years."}, {"title": "Bound", "text": "Sanity: the answer must sit between the two neighbours in rank, and its share of world population is 0.00%."}], "anchors": [{"name": "Population of Iceland (2024)", "value": 393404.0, "unit": "people"}, {"name": "World population (2024)", "value": 8161972574.0, "unit": "people"}], "note": null}, {"id": "enpc_China", "tier": "bank", "domain": "energy", "decay": "slow", "text": "How much primary energy did China consume per person in 2024, in kilowatt-hours per year?", "answer": 34514.457, "unit": "kWh per person per year", "source": "Our World in Data, owid-co2-data (Global Carbon Budget 2025 / UN WPP / Energy Institute)", "asof": 2024, "chain": [{"title": "Frame", "text": "World average is 21,654 kWh per person per year. A useful conversion: 1 kW of continuous power for a year is 8,760 kWh, so the average human runs on about 2.5 kW continuously."}, {"title": "Anchors", "text": "A household's electricity is only a small slice; industry, transport and heating dominate. Bands: 1 to 5 thousand kWh (low income), 10 to 30 thousand (middle), 35 to 50 thousand (rich temperate), 60 to 200 thousand (cold, oil-rich, or industrial/refining hubs)."}, {"title" e": "Apollo Guidance Computer RAM", "value": 2048, "unit": "words"}], "note": null}, {"id": "est_iss_orbits", "tier": "estimathon", "domain": "science", "decay": "timeless", "text": "How many times does the International Space Station orbit Earth per day?", "answer": 15.5, "unit": "orbits", "source": "Derived from a 92.9-minute orbital period at ~415 km", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "a low orbit's period depends only on altitude; at ~400 km it is about 93 minutes."}, {"title": "Anchors", "text": "orbital speed 7.66 km/s; circumference of the orbit 2π × 6,790 km = 42,660 km."}, {"title": "Structure", "text": "period = circumference ÷ speed; orbits per day = 1,440 minutes ÷ period."}, {"title": "Compute", "text": "42,660 ÷ 7.66 = 5,570 s = 92.8 min; 1,440 ÷ 92.8 ≈ 15.5."}, {"title": "Bound", "text": "between 15 and 16; astronauts see 16 sunrises a day."}], "anchors": [{"name": "ISS orbital period", "value": 92.9, "unit": "min"}, {"name": "ISS orbital speed", "value": 7.66, "unit": "km/s"}], "note": null}, {"id": "est_pluto_light", "tier": "estimathon", "domain": "science", "decay": "timeless", "text": "How long does sunlight take to reach Pluto at its mean distance of 39.5 AU, in hours?", "answer": 5.47, "unit": "hours", "source": "Derived from 499 s per AU", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "light takes 499 seconds (8.3 minutes) per astronomical unit."}, {"title": "Anchors", "text": "Pluto's mean distance is 39.5 AU (it ranges from 30 to 49)."}, {"title": "Structure", "text": "39.5 × 499 s ÷ 3,600."}, {"title": "Compute", "text": "19,710 s ≈ 5.47 h."}, {"title": "Bound", "text": "Neptune (30 AU) is 4.2 h; the New Horizons signals from Pluto in 2015 took 4.5 h at 32 AU."}], "anchors": [{"name": "Light travel time per AU", "value": 499, "unit": "s"}, {"name": "Pluto mean distance", "value": 39.5, "unit": "AU"}], "note": null}, {"id": "est_marathon_wr", "tier": "estimathon", "domain": "sports", " Mahut at Wimbledon 2010, last?", "answer": 665.0, "unit": "minutes", "source": "Wimbledon records: 11 h 5 min over three days", "source_url": null, "asof": 2010, "chain": [{"title": "Frame", "text": "no tiebreak in the fifth set at the time; the final set went 70-68."}, {"title": "Anchors", "text": "a five-set match normally takes 3 to 4 hours; the fifth set alone here had 138 games at ~5 minutes each."}, {"title": "Structure", "text": "normal four sets (~3 h) + 138 games × ~5 min."}, {"title": "Compute", "text": "180 + 138 × 4.5 ≈ 800 minutes; the games were quick (both were serving bombs), so the true figure is a bit lower."}, {"title": "Bound", "text": "the previous record was 6 h 33 min (393 min)."}], "anchors": [{"name": "Isner vs Mahut match length", "value": 665, "unit": "min"}], "note": null}, {"id": "est_gold_mined", "tier": "estimathon", "domain": "money", "decay": "slow", "text": "How much gold has been mined in all of human history, in tonnes, per the World Gold Council's end-2025 figure?", "answer": 219891.0, "unit": "tonnes", "source": "World Gold Council above-ground stocks, end 2025", "source_url": null, "asof": 2025, "chain": [{"title": "Frame", "text": "gold is almost never destroyed, so the above-ground stock is the cumulative total; two-thirds of it was mined after 1950."}, {"title": "Anchors", "text": "annual mine output is ~3,600 t; that rate has been roughly stable for 20 years and grew from ~1,000 t/yr in 1950."}, {"title": "Structure", "text": "cumulative = recent rate × effective years (≈ 60 for a stock that doubled since 1990)."}, {"title": "Compute", "text": "3,600 × 60 ≈ 216,000 t."}, {"title": "Bound", "text": "melted down it fits in a cube 22.5 m on a side; at $4,000/oz it is worth ~$28 trillion."}], "anchors": [{"name": "Gold ever mined (end 2025)", "value": 219891, "unit": "t"}, {"name": "Annual gold mine production", "value": 3600, "unit": "t"}], "note": null}, {"id": "est_gold_cube", "tier": "estimathon", "domain": "money", "decay": "slow", "text": "If all the gold ever mined (219,891 tonnes) were melted into a single cube, how long would each side be, in metres?", "answer": 22.49, "unit": "m", "source": "Derived: 219,891 t ÷ 19,320 kg/m³", "source_url": null, "asof": 2025, "chain": [{"title": "Frame", "text": "mass ÷ density gives volume; cube root gives the side."}, {"title": "Anchors", "text": "gold density 19,320 kg/m³ (19.3× water, 2.5× steel)."}, {"title": "Structure", "text": "(219,891,000 ÷ 19,320)^(1/3)."}, {"title": "Compute", "text": "11,380 m³ → side 22.5 m, about a seven-storey building."}, {"title": "Bound", "text": "an Olympic pool holds 2,500 m³, so the cube is about 4.5 Olympic pools of solid gold."}], "anchors": [{"name": "Gold density", "value": 19320, "unit": "kg/m³"}, {"name": "Volume of all gold ever mined", "value": 11380, "unit": "m³"}], "note": null}, {"id": "est_dollar_stack", "tier": "estimathon", "domain": "money", "decay": "timeless", "text": "How tall would a stack of one million US $1 bills be, in metres?", "answer": 109.2, "unit": "m", "source": "Derived: US Bureau of Engraving and Printing bill thickness 0.0043 in", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "thickness × count; the unknown is the thickness of a banknote."}, {"title": "Anchors", "text": "a ream of 500 sheets of paper is ~5 cm thick, so ~0.1 mm per sheet; a banknote is similar at 0.109 mm."}, {"title": "Structure", "text": "1,000,000 × 0.109 mm."}, {"title": "Compute", "text": "109 m, taller than the Statue of Liberty and pedestal (93 m)."}, {"title": "Bound", "text": "100 bills ≈ 1 cm is the pocket rule; 1 million bills ≈ 100 m."}], "anchors": [{"name": "Thickness of a US banknote", "value": 0.109, "unit": "mm"}], "note": null}, {"id": "est_apollo_cost", "tier": "estimathon", "domain": "money", "decay": "timeless", "text": "How much did the Apollo programme cost in then-year (nominal) dollars, as reported to Congress in 1973?", "answer": 25400000000.0, "unit": "US dollars", "source": "NASA testimony to Congress, 1973 ($25.4 billion); ~$257 billion in 2020 dollars", "source_url": null, "asof": 1973, "chain": [{"title": "Frame", "text": "1961 to 1972, spanning the Saturn V, the Apollo spacecraft and 11 crewed flights; at its 1966 peak NASA took 4.4% of the federal budget."}, {"title": "Anchors", "text": "NASA's budget peaked at ~$5.9 billion in 1966; the programme ran about a decade with a triangular spending profile."}, {"title": "Structure", "text": "peak × duration × ~0.5 (triangle) × Apollo's share of NASA (~65%)."}, {"title": "Compute", "text": "5.9 × 12 × 0.5 × 0.65 ≈ $23 billion."}, {"title": "Bound", "text": "each Saturn V cost ~$185 million; 13 launched; the total in today's dollars is ~$260 billion."}], "anchors": [{"name": "Apollo programme cost (nominal)", "value": 25400000000.0, "unit": "USD"}, {"name": "Apollo programme cost (2020 dollars)", "value": 257000000000.0, "unit": "USD"}], "note": null}, {"id": "est_tan89", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "What is tan(89°)?", "answer": 57.29, "unit": "", "source": "Exact computation", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "near 90°, tan(90° − x) = cot(x) ≈ 1/x for small x in radians."}, {"title": "Anchors", "text": "1° = π/180 = 0.017453 radians."}, {"title": "Structure", "text": "1 ÷ 0.017453."}, {"title": "Compute", "text": "57.3 (the number of degrees in a radian, no coincidence)."}, {"title": "Bound", "text": "tan(85°) = 11.4, tan(89.9°) = 573."}], "anchors": [{"name": "Degrees per radian", "value": 57.2958, "unit": ""}], "note": null}, {"id": "est_3pow33", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "What is 3^33?", "answer": 5559060566555523.0, "unit": "", "source": "Exact computation", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "log10(3) = 0.4771, so 3^33 has 33 × 0.4771 = 15.74 → 16 digits."}, {"title": "Anchors", "text": "3^4 = 81 ≈ 10^1.908; 3^10 = 59,049; 3^20 = 3.487 × 10^9."}, {"title": "Structure", "text": "3^33 = 3^20 × 3^10 × 3^3."}, {"title": "Compute", "text": "3.487e9 × 59,049 × 27 ≈ 5.56 × 10^15."}, {"title": "Bound", "text": "between 10^15 and 10^16."}], "anchors": [{"name": "log10 of 3", "value": 0.4771, "unit": ""}], "note": null}, {"id": "est_epi", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "What is e^π − π?", "answer": 19.9991, "unit": "", "source": "Exact computation (a famous near-integer)", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "e^π (Gelfond's constant) is 23.14; subtracting π gives something suspiciously close to 20."}, {"title": "Anchors", "text": "e^3 = 20.09; e^0.14159 = 1.152."}, {"title": "Structure", "text": "e^π = e^3 × e^0.14159."}, {"title": "Compute", "text": "20.09 × 1.152 = 23.14; minus 3.1416 = 19.999."}, {"title": "Bound", "text": "the closeness to 20 is a coincidence, unlike e^(π√163) which is close to an integer for deep reasons."}], "anchors": [{"name": "e to the power pi", "value": 23.1407, "unit": ""}], "note": null}, {"id": "est_pow2_digits", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "How many decimal digits does 2^2026 have?", "answer": 610.0, "unit": "digits", "source": "Exact computation", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "digits = floor(n × log10 2) + 1."}, {"title": "Anchors", "text": "log10 2 = 0.30103; the rule of thumb is 3 digits per 10 doublings."}, {"title": "Structure", "text": "2026 × 0.30103."}, {"title": "Compute", "text": "609.9 → 610 digits."}, {"title": "Bound", "text": "2^2000 has 603 digits; each extra 10 doublings adds 3."}], "anchors": [{"name": "log10 of 2", "value": 0.30103, "unit": ""}], "note": null}, {"id": "est_harmonic", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "What is the 1000th harmonic number, 1 + 1/2 + 1/3 + ... + 1/1000?", "answer": 7.4855, "unit": "", "source": "Exact computation", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "the harmonic series grows like ln n; the correction is the Euler-Mascheroni constant γ."}, {"title": "Anchors", "text": "ln 1000 = 6.9078; γ = 0.5772."}, {"title": "Structure", "text": "H_n ≈ ln n + γ + 1/(2n)."}, {"title": "Compute", "text": "6.9078 + 0.5772 + 0.0005 = 7.4855."}, {"title": "Bound", "text": "H_100 = 5.19, H_1,000,000 = 14.39; it takes 1.5 × 10^43 terms to reach 100."}], "anchors": [{"name": "Euler-Mascheroni constant", "value": 0.5772, "unit": ""}, {"name": "ln 1000", "value": 6.9078, "unit": ""}], "note": null}, {"id": "est_deck_orderings", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "In how many ways can a standard 52-card deck be ordered (52!)?", "answer": 8.0658e+67, "unit": "orderings", "source": "Exact computation", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "52 factorial; Stirling gives log10(52!) ≈ 52 log10(52/e) + ½ log10(2π·52)."}, {"title": "Anchors", "text": "52/e = 19.13; log10(19.13) = 1.2817; ½ log10(326.7) = 1.257."}, {"title": "Structure", "text": "52 × 1.2817 + 1.257."}, {"title": "Compute", "text": "66.65 + 1.26 = 67.91 → 8.1 × 10^67."}, {"title": "Bound", "text": "more than the number of atoms on Earth (~10^50); a well-shuffled deck has almost certainly never existed in that order before."}], "anchors": [{"name": "52 factorial", "value": 8.0658e+67, "unit": ""}], "note": null}, {"id": "est_poker_hands", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "How many distinct 5-card poker hands can be dealt from a 52-card deck?", "answer": 2598960.0, "unit": "hands", "source": "Exact computation: C(52, 5)", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "unordered 5-subsets of 52."}, {"title": "Anchors", "text": "52 × 51 × 50 × 49 × 48 ordered draws; divide by 5! = 120."}, {"title": "Structure", "text": "C(52,5) = 52!/(5!·47!)."}, {"title": "Compute", "text": "311,875,200 ÷ 120 = 2,598,960."}, {"title": "Bound", "text": "royal flushes are 4 of these (1 in 649,740)."}], "anchors": [{"name": "5-card poker hands", "value": 2598960, "unit": "hands"}], "note": null}, {"id": "est_bridge_deals", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "How many distinct bridge deals are there (52 cards split into four labelled hands of 13)?", "answer": 5.3645e+28, "unit": "deals", "source": "Exact computation: 52!/(13!)^4", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "multinomial coefficient 52!/(13!^4)."}, {"title": "Anchors", "text": "log10(52!) = 67.91; log10(13!) = log10(6,227,020,800) = 9.794."}, {"title": "Structure", "text": "67.91 − 4 × 9.794."}, {"title": "Compute", "text": "67.91 − 39.18 = 28.73 → 5.4 × 10^28."}, {"title": "Bound", "text": "about a billion times the number of 5-card poker hands squared."}], "anchors": [{"name": "Number of bridge deals", "value": 5.3645e+28, "unit": "deals"}, {"name": "13 factorial", "value": 6227020800, "unit": ""}], "note": null}, {"id": "est_rubik", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "How many reachable positions does a 3×3×3 Rubik's Cube have?", "answer": 4.3252e+19, "unit": "positions", "source": "Exact: 8!·3^7·12!·2^11/2 = 43,252,003,274,489,856,000", "source_url": null, "asof": 0, "chain": [{"title": "Frame", "text": "corner permutations × corner orientations × edge permutations × edge orientations, divided by parity constraints."}, {"title": "Anchors", "text": "8 corners (8! = 40,320 permutations, 3^8 orientations); 12 edges (12! = 479 million, 2^12 orientations)."}, {"title": "Structure", "text": "8! × 12! × 3^8 × 2^12 ÷ 12 (one corner orientation, one edge orientation and the permutation parity are forced)."}, {"title": "Compute", "text": "40,320 × 4.79e8 × 6,561 × 4,096 ÷ 12 ≈ 4.3 × 10^19."}, {"title": "Bound", "text": "at one position per second, 1.4 trillion years; any position can be solved in 20 moves."}], "anchors": [{"name": "Rubik's Cube positions", "value": 4.3252e+19, "unit": "positions"}, {"name": "12 factorial", "value": 479001600, "unit": ""}], "note": null}, {"id": "est_sudoku", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "How many valid completed 9×9 Sudoku grids exist?", "answer": 6.6709e+21, "unit": "grids", "source": "Felgenhauer and Jarvis 2005: 6,670,903,752,021,072,936,960", "source_url": null, "asof": 2005, "chain": [{"title": "Frame", "text": "81 cells filled with 1 to 9 under row, column and box constraints; brute force is hopeless, but the first band (three rows) can be counted directly."}, {"title": "Anchors", "text": "the top band has 9! × 56 × 6^6 ≈ 948 billion completions; there are 3 bands and the constraints between them cut the product enormously."}, {"title": "Structure", "text": "(9!)^9 possible Latin-ish fillings of rows ≈ 10^50 is the wrong ceiling; the real count is closer to (top band)^2 × a coupling factor."}, {"title": "Compute", "text": "the published count is 6.67 × 10^21, or 5.47 billion essentially different grids after removing symmetries."}, {"title": "Bound", "text": "between the 5.5 × 10^9 essentially different grids and 9!^9 ≈ 10^50."}], "anchors": [{"name": "Completed Sudoku grids", "value": 6.6709e+21, "unit": "grids"}], "note": null}, {"id": "est_go_positions", "tier": "estimathon", "domain": "math", "decay": "timeless", "text": "How many legal positions are there on a 19×19 Go board (Tromp 2016)?", "answer": 2.0817e+170, "unit": "positions", "source": "Tromp 2016: 2.081681994 × 10^170", "source_url": null, "asof": 2016, "chain": [{"title": "Frame", "text": "each of 361 points is empty, black or white; only positions with no captured-but-remaining stones (every group has a liberty) are legal."}, {"title": "Anchors", "text": "3^361 = 1.74 × 10^172 total colourings; about 1.2% of them are legal."}, {"title": "Structure", "text": "3^361 × legal fraction."}, {"title": "Compute", "text": "10^172.24 × 0.012 ≈ 2 × 10^170."}, {"tit function parseNum(s){
  if (s==null) return NaN;
  let t = String(s).trim().toLowerCase().replace(/,/g,'').replace(/\s+/g,'');
  if (!t) return NaN;
  t = t.replace(/×10\^?/,'e').replace(/\*10\^?/,'e').replace(/x10\^?/,'e').replace(/\^/,'');
  const suf = {k:1e3, m:1e6, b:1e9, bn:1e9, g:1e9, t:1e12, tn:1e12, tr:1e12};
  const m = t.match(/^([0-9.]+(?:e[+-]?[0-9]+)?)(k|m|bn|b|g|tn|tr|t)?$/);
  if (!m) return NaN;
  let v = parseFloat(m[1]); if (m[2]) v *= suf[m[2]];
  return v;
}
function fmt(v, unit){
  if (v==null || !isFinite(v)) return '?';
  const a = Math.abs(v); let s;
  if (a===0) s='0';
  else if (a>=1e15 || a<1e-3) s = v.toExponential(3).replace('e+','e');
  else if (a>=1e12) s = (v/1e12).toPrecision(3).replace(/\.?0+$/,'') + ' trillion';
  else if (a>=1e9) s = (v/1e9).toPrecision(3).replace(/\.?0+$/,'') + ' billion';
  else if (a>=1e6) s = (v/1e6).toPrecision(3).replace(/\.?0+$/,'') + ' million';
  else if (a>=1000) s = Math.round(v).toLocaleString('en-US');
  else if (a>=100) s = v.toFixed(0);
  else if (a>=10) s = v.toFixed(1).replace(/\.0$/,'');

  return unit ? s + ' ' + unit : s;
}

function score(m,k,y){
  const sig=Math.log(k), z=(Math.log(y)-Math.log(m))/sig;
  const ls = 0.5*z*z + Math.log(sig) + 0.5*LN2PI;           // negative log density in ln-space; lower is better

  const kstar = Math.exp(Math.abs(Math.log(y/m)));           // hindsight-optimal k for this one question

  const s10=Math.log10(k), lo=Math.log10(m)-1.645*s10, hi=Math.log10(m)+1.645*s10, ly=Math.log10(y), a=0.1;

}

      st('Bound', `Exactly 8 survivors in every complete block of 30, so the answer is 8·floor(N/30) plus 0 to 8.`)],
      [{name:'Fraction coprime to 30', value:4/15, unit:''}]); } },
 { key:'trailing_zeros', domain:'math', make(){ const n=pick([1000,12345,100000,rnd(500,2000000)]); let z=0,p=5; while(p<=n){ z+=Math.floor(n/p); p*=5; }
    return q(`proc_tz_${n}`, `How many trailing zeros does ${n.toLocaleString('en-US')}! end with?`, z, 'zeros', 'Exact computation (Legendre)', [
      st('Frame', `A trailing zero needs a factor 10 = 2 × 5; factors of 2 are abundant, so count factors of 5.`),
      st('Anchors', `Legendre's formula: floor(n/5) + floor(n/25) + floor(n/125) + ... which sums to just under n/4.`),
      st('Structure', `n/5 + n/25 + n/125 + ... = n/4 in the limit.`),
      st('Compute', `${n.toLocaleString('en-US')} / 4 = ${(n/4).toLocaleString('en-US')}; subtract a little for the floors.`),
      st('Bound', `Strictly less than n/4; more than n/5.`)],
      [{name:'Trailing zeros of n! ≈ n/4', value:NaN, unit:'formula'}]); } },
 { key:'digit_sum_pow2', domain:'math', make(){ const n=pick([100,500,1000,2000,rnd(100,6000)]); const s=(1n<<BigInt(n)).toString(); const ans=[...s].reduce((a,c)=>a+ +c,0); const digits=s.length;
    return q(`proc_ds2_${n}`, `What is the sum of the decimal digits of 2^${n}?`, ans, '', 'Exact computation', [
      st('Frame', `Digits of a large power behave like uniform random digits, so the expected digit sum is 4.5 per digit. This is a question about expectation, not computation.`),
      st('Anchors', `2^${n} has floor(${n} × 0.30103) + 1 = ${digits} digits.`),
      st('Structure', `4.5 × number of digits, with a standard deviation of about 2.87 × sqrt(digits) = ${(2.87*Math.sqrt(digits)).toFixed(1)}.`),
      st('Compute', `4.5 × ${digits} = ${(4.5*digits).toFixed(0)}.`),
      st('Bound', `Your 68% interval should be roughly ± ${(2.87*Math.sqrt(digits)).toFixed(0)} around that, which is a very tight spread factor; this question tests whether you can be confidently narrow.`)],
      [{name:'log10 2', value:0.30103, unit:''}]); } },
];

function pool(){ return [...BANK, ...S.live.filter(x=>!x.disputed)]; }
function attempts(id){ return S.history.filter(h=>h.id===id).length; }
const DOMAINS = ['all','math','science','structures','culture','singapore','business','money','sports','geography','physics','energy','climate','population'];
function nextQuestion(){
  const dom=S.settings.domain, tier=S.settings.tier;
  const okDom = q => dom==='all' || q.domain===dom;
  const est = tier==='all'||tier==='estimathon' ? EST_BANK.filter(okDom) : [];
  const data = tier==='all'||tier==='bank' ? DATA_BANK.filter(okDom) : [];
  const live = tier==='all'||tier==='live' ? S.live.filter(x=>!x.disputed && okDom(x)) : [];
  const proc = (tier==='all'||tier==='proc') && (dom==='all'||dom==='math') ? PROC : [];
  const unseen = arr => { const u=arr.filter(q=>attempts(q.id)===0); return u.length? u : arr; };
  // weighted choice among non-empty sources
  const buckets=[]; if(est.length) buckets.push(['est',0.55]); if(proc.length) buckets.push(['proc',0.25]); if(data.length) buckets.push(['data',0.15]); if(live.length) buckets.push(['live',0.10]);
  if (!buckets.length) return null;
  const tot=buckets.reduce((a,b)=>a+b[1],0); let r=Math.random()*tot, choice=buckets[buckets.length-1][0];
  for(const [k,w] of buckets){ if(r<w){ choice=k; break; } r-=w; }
  if (choice==='proc') return pick(proc).make();
  if (choice==='est') return pick(unseen(est));
  if (choice==='data') return pick(unseen(data));
  return pick(unseen(live));
}

function ruler(m,k,y){
  const s=Math.log10(k), lm=Math.log10(m), ly=Math.log10(y);
  const lo=Math.min(lm-2.2*s, ly-0.3*Math.max(s,0.15)), hi=Math.max(lm+2.2*s, ly+0.3*Math.max(s,0.15));
  const W=600,H=90,pad=30; const X=v=>pad+(v-lo)/(hi-lo)*(W-2*pad);
  const b95=[X(lm-1.96*s),X(lm+1.96*s)], b68=[X(lm-s),X(lm+s)];
  // decade ticks
  let ticks=''; const d0=Math.ceil(lo), d1=Math.floor(hi); const step=Math.max(1,Math.ceil((d1-d0)/6));
  for(let d=d0; d<=d1; d+=step){ ticks+=`<line x1="${X(d)}" y1="58" x2="${X(d)}" y2="66" stroke="#9AA6B5"/><text x="${X(d)}" y="80" font-size="11" text-anchor="middle" fill="#5E6B7E">1e${d}</text>`; }
  return `<svg class="ruler" viewBox="0 0 ${W} ${H}" role="img" aria-label="Log-scale ruler showing your interval and the true value">
    <line x1="${pad}" y1="62" x2="${W-pad}" y2="62" stroke="#9AA6B5"/>${ticks}
    <rect x="${b95[0]}" y="26" width="${Math.max(2,b95[1]-b95[0])}" height="26" fill="rgba(31,111,139,.12)"/>
    <rect x="${b68[0]}" y="26" width="${Math.max(2,b68[1]-b68[0])}" height="26" fill="rgba(31,111,139,.30)"/>
    <line x1="${X(lm)}" y1="22" x2="${X(lm)}" y2="56" stroke="#1F6F8B" stroke-width="2"/>
    <text x="${X(lm)}" y="16" font-size="11" text-anchor="middle" fill="#134B5E">you</text>
    <polygon points="${X(ly)},30 ${X(ly)+7},40 ${X(ly)},50 ${X(ly)-7},40" fill="#D99A1E" stroke="#8A5F05"/>
    <text x="${X(ly)}" y="16" font-size="11" text-anchor="middle" fill="#8A5F05" font-weight="700">truth</text>
  </svg>`;
}
function kFromSlider(v){ return Math.exp(v/1000*Math.log(50)); }

}

/* ===================== Claude calls: diagnosis and live generation ===================== */
async function claude(prompt, useSearch, maxTokens=1000){
  const body={ model:'claude-sonnet-4-6', max_tokens:1000, messages:[{role:'user', content:prompt}] };
  if (useSearch) body.tools=[{type:'web_search_20250305', name:'web_search'}];
  const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data = await res.json();
  if (!data.content) throw new Error(data.error? data.error.message : 'No content');
  return data.content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
}
function parseJSON(t){ const s=t.indexOf('{'), e=t.lastIndexOf('}'); if(s<0||e<0) throw new Error('No JSON in response'); return JSON.parse(t.slice(s,e+1).replace(/```json|```/g,'')); }
async function diagnose(){
  const box=$('#diag'); box.innerHTML='<p class="small">Reading your reasoning…</p>';
  const qq=P.q, r=P.result;
  const prompt = `You are coaching a strong quantitative thinker on Fermi estimation. Compare their reasoning to the canonical chain and diagnose where the miss came from.
Question: ${qq.text}
True answer: ${qq.answer} ${qq.unit}
Their median: ${P.median}; their spread factor k: ${P.k} (68% band = median/k to median*k). Signed log10 error (truth/median): ${r.l10.toFixed(2)}; z = ${r.z.toFixed(2)}.
Their written reasoning: """${(P.reason||'').slice(0,1500)}"""
Canonical chain: ${JSON.stringify(qq.chain)}
Classify the main failure as exactly one of: "anchor" (a reference number was wrong or missing), "structure" (the decomposition itself was wrong or missed a factor), "spread" (numbers fine but confidence mis-sized), "arithmetic", or "none" (well reasoned; the miss is within noise).
Respond ONLY with JSON, no prose, no markdown fences: {"failure": "...", "diagnosis": "2 to 4 sentences, specific, naming the actual number or step", "missing_anchors": ["short anchor facts they should memorize, with values"], "lesson": "one sentence they can carry to the next question"}`;
  try{ const j=parseJSON(await claude(prompt,false));
    box.innerHTML=`<div class="notice"><b>Main failure: ${esc(j.failure)}</b><br>${esc(j.diagnosis)}${j.missing_anchors&&j.missing_anchors.length?`<ul>${j.missing_anchors.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}<i>${esc(j.lesson)}</i></div>`;
    const h=S.history[S.history.length-1]; if(h && h.id===qq.id){ h.failure=j.failure; save(); }
  }catch(err){ box.innerHTML=`<p class="err">Diagnosis failed: ${esc(err.message)}</p>`; }
}
async function generateLive(topic){
  const prompt = `Create ONE Fermi-estimation question with a verifiable numeric answer${topic?` about: ${topic}`:' on an interesting topic (technology, economics, geography, science, sports, culture, infrastructure, Singapore or Asia are all fine)'}. Use web search to confirm the answer from an authoritative source. The answer must be a single positive number in stated units, not a range.
Also write a five-step reasoning chain a strong estimator would use WITHOUT knowing the answer: Frame (what kind of quantity, what global total it lives inside), Anchors (2 or 3 reference numbers with values), Structure (the decomposition formula), Compute (plugging in, arriving near the answer), Bound (sanity limits). Every number in the chain must be true.
Respond ONLY with JSON, no markdown fences:
{"text":"the question, with units, unambiguous", "answer": number, "unit":"...", "source":"publisher and title", "source_url":"...", "asof":"year or date the figure refers to", "domain": one of ["technology","economy","geography","science","culture","infrastructure","sports","other"], "decay": one of ["timeless","slow","live"], "chain":[{"title":"Frame","text":"..."},{"title":"Anchors","text":"..."},{"title":"Structure","text":"..."},{"title":"Compute","text":"..."},{"title":"Bound","text":"..."}], "anchors":[{"name":"...","value":number,"unit":"..."}], "confidence": 0 to 1 how sure you are the answer is right}`;
  const j=parseJSON(await claude(prompt,true));
  if(!(j.answer>0)) throw new Error('Generated answer was not a positive number');
  // independent verification pass
  let verified=false, vnote='';
  try{
    const v=parseJSON(await claude(`Independently verify this claim using web search. Question: "${j.text}". Proposed answer: ${j.answer} ${j.unit}. Respond ONLY with JSON: {"your_answer": number, "source_url":"...", "agree": true or false (true if within 10% or the same figure from an authoritative source), "note":"one sentence"}`, true));
    verified = !!v.agree && v.your_answer>0 && Math.abs(Math.log10(v.your_answer/j.answer))<0.05;
    vnote = v.note||'';
    if (!verified && v.your_answer>0) vnote = `Verifier found ${v.your_answer} (${v.source_url||'no url'}). ${vnote}`;
  }catch(e){ vnote='Verification call failed; answer unverified.'; }
  const qobj={id:'live_'+Date.now(), tier:'live', domain:j.domain||'other', decay:j.decay||'slow', text:j.text, answer:+j.answer, unit:j.unit||'', source:j.source||'', source_url:j.source_url||'', asof:j.asof||'', chain:Array.isArray(j.chain)?j.chain:[], anchors:Array.isArray(j.anchors)?j.anchors:[], verified, note: verified? 'Two independent search passes agreed.' : ('Unverified: '+vnote), disputed:false, created:Date.now()};
  S.live.push(qobj); save(); return qobj;
}

function renderSprint(){

    return;
  }
  const left=Math.max(0, SP.end-Date.now()); const mm=String(Math.floor(left/60000)).padStart(2,'0'), ss=String(Math.floor(left%60000/1000)).padStart(2,'0');
  if (!SP.done){
    v.innerHTML=`<div class="card"><div class="row"><div class="timer" id="timer">${mm}:${ss}</div><button class="btn" data-act="finish">Submit all</button></div>
      ${SP.qs.map((qq,i)=>`<div class="sprint-q"><div class="qq"><b>${i+1}.</b> ${esc(qq.text)}${qq.unit?` <span class="small">(${esc(qq.unit)})</span>`:''}</div>
        <div class="row"><input type="text" inputmode="decimal" placeholder="min" data-sp="${i}" data-side="0" value="${esc(SP.answers[i][0])}"><input type="text" inputmode="decimal" placeholder="max" data-sp="${i}" data-side="1" value="${esc(SP.answers[i][1])}"></div></div>`).join('')}
      <div class="btnrow"><button class="btn" data-act="finish">Submit all</button><button class="btn ghost" data-act="abandon">Abandon</button></div></div>`;
    v.querySelectorAll('[data-sp]').forEach(inp=>inp.addEventListener('input', e=>{ SP.answers[+e.target.dataset.sp][+e.target.dataset.side]=e.target.value; }));
    return;
  }
  // results
  let sum=0, good=0; const rows=SP.qs.map((qq,i)=>{ const lo=parseNum(SP.answers[i][0]), hi=parseNum(SP.answers[i][1]); const ok=isFinite(lo)&&isFinite(hi)&&lo>0&&hi>=lo&&qq.answer>=lo&&qq.answer<=hi; const ratio= ok? Math.floor(hi/lo):null; if(ok){good++; sum+=ratio;} return {qq,lo,hi,ok,ratio}; });
  const total=(10+sum)*Math.pow(2,13-good);
  v.innerHTML=`<div class="card"><h2 style="margin-top:0">Sprint result</h2>
    <div class="big">${total.toLocaleString('en-US')}</div><div class="small">(10 + ${sum}) × 2^(13 − ${good}) · ${good} of 13 good</div>
    <table><tr><th>#</th><th style="text-align:left">Truth</th><th>Your interval</th><th>Good</th><th>⌊max/min⌋</th></tr>
    ${rows.map((r,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${esc(fmt(r.qq.answer,r.qq.unit))}</td><td>${isFinite(r.lo)?esc(fmt(r.lo)):'–'} … ${isFinite(r.hi)?esc(fmt(r.hi)):'–'}</td><td class="${r.ok?'ok':'bad'}">${r.ok?'yes':'no'}</td><td>${r.ratio??'–'}</td></tr>`).join('')}</table>
    <p class="small" style="margin-top:10px">What-if: had every miss been a punt with a 1000× wide good interval, the score would have been ${((10+sum+1000*(13-good))*1).toLocaleString('en-US')}. Compare that with ${total.toLocaleString('en-US')} to see whether narrowing or punting was your error.</p>
    <h3>Reasoning ladders</h3>
    ${rows.map((r,i)=>`<details><summary>${i+1}. ${esc(r.qq.text)}</summary><div class="ladder">${r.qq.chain.map(s=>`<div class="rung"><div class="t">${esc(s.title)}</div><div class="x">${esc(s.text)}</div></div>`).join('')}</div><div class="src">Source: ${esc(r.qq.source)}</div></details>`).join('')}
    <div class="btnrow"><button class="btn" data-act="reset">New sprint</button></div></div>`;
}
function sprintClick(act){
  if (act==='start'){ const qs=[]; const seen=new Set(); let guard=0; while(qs.length<13 && guard++<500){ const x=nextQuestion(); if(x && !seen.has(x.id)){ seen.add(x.id); qs.push(x);} } SP={active:true, qs, answers:qs.map(()=>['','']), end:Date.now()+30*60*1000, done:false}; SP.timerId=setInterval(()=>{ if(!SP.active||SP.done){clearInterval(SP.timerId);return;} const t=$('#timer'); if(t){ const left=Math.max(0,SP.end-Date.now()); t.textContent=`${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`; if(left<=0){ finishSprint(); } } },1000); render(); }
  else if (act==='finish') finishSprint();
  else if (act==='abandon'){ SP={active:false,qs:[],answers:[],end:0,done:false}; render(); }
  else if (act==='reset'){ SP={active:false,qs:[],answers:[],end:0,done:false}; render(); }
}
function finishSprint(){ SP.done=true; clearInterval(SP.timerId); SP.qs.forEach((qq,i)=>{ const lo=parseNum(SP.answers[i][0]), hi=parseNum(SP.answers[i][1]); if(isFinite(lo)&&isFinite(hi)&&lo>0&&hi>=lo){ const m=Math.sqrt(lo*hi); S.history.push({id:qq.id,text:qq.text,domain:qq.domain,decay:qq.decay,tier:qq.tier,ts:Date.now(),mode:'sprint',lo,hi,median:m,truth:qq.answer,unit:qq.unit,good:qq.answer>=lo&&qq.answer<=hi,l10:Math.log10(qq.answer/m)}); } }); save(); render(); }

/* ===================== DASHBOARD ===================== */
function renderDashboard(){
  const v=$('#view'); const H=S.history.filter(h=>h.mode==='deliberate');
  if (!H.length){ v.innerHTML=`<div class="card"><p>No deliberate-mode attempts yet.</p><p class="small">Calibration statistics need at least 20 to 30 questions before the reliability numbers mean much; the error bars below will tell you when.</p></div>`; return; }
  const zs=H.map(h=>h.z), T=Math.sqrt(mean(zs.map(z=>z*z)));
  const bias=mean(H.map(h=>h.l10)), absE=mean(H.map(h=>Math.abs(h.l10))), ls=mean(H.map(h=>h.ls));
  const last=H.slice(-10), prev=H.slice(-20,-10);
  const lvl=[[50,0.674],[68,1],[90,1.645],[95,1.96]];
  const rel=lvl.map(([p,c])=>{ const hit=H.filter(h=>Math.abs(h.z)<=c).length; const [a,b]=wilson(hit,H.length); return {p,hit,n:H.length,obs:hit/H.length,a,b}; });
  const doms={}; for(const h of H){ (doms[h.domain]=doms[h.domain]||[]).push(h); }
  const hinted=H.filter(h=>h.hints>0), unh=H.filter(h=>!h.hints);
  const tRec = T>1.15? `Your bands are too narrow. When your intuition says k, submit k<sup>${T.toFixed(2)}</sup> (a k of 3 should become ${Math.pow(3,T).toFixed(1)}).` : T<0.85? `Your bands are too wide. When your intuition says k, submit k<sup>${T.toFixed(2)}</sup> (a k of 3 should become ${Math.pow(3,T).toFixed(1)}).` : `Your spreads are about right in aggregate. Now work on resolution: vary k more between questions you know and ones you don't.`;
  const W=300,Hh=220,pad=34; const X=p=>pad+p/100*(W-pad-10), Y=p=>Hh-pad-p/100*(Hh-pad-10);
  const chart=`<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;max-width:360px;display:block" role="img" aria-label="Reliability diagram">
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(100)}" y2="${Y(100)}" stroke="#CBD3DE" stroke-dasharray="4 4"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(100)}" y2="${Y(0)}" stroke="#9AA6B5"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(100)}" stroke="#9AA6B5"/>
    ${[0,50,100].map(p=>`<text x="${X(p)}" y="${Hh-10}" font-size="11" text-anchor="middle" fill="#5E6B7E">${p}%</text><text x="${X(0)-6}" y="${Y(p)+4}" font-size="11" text-anchor="end" fill="#5E6B7E">${p}%</text>`).join('')}
    <text x="${X(50)}" y="${Hh-2}" font-size="11" text-anchor="middle" fill="#5E6B7E">stated confidence</text>
    ${rel.map(r=>`<line x1="${X(r.p)}" y1="${Y(r.a*100)}" x2="${X(r.p)}" y2="${Y(r.b*100)}" stroke="#1F6F8B" stroke-width="2"/><circle cx="${X(r.p)}" cy="${Y(r.obs*100)}" r="5" fill="#D99A1E" stroke="#8A5F05"/>`).join('')}
  </svg>`;
  v.innerHTML=`<div class="card">
    <h2 style="margin-top:0">Calibration after ${H.length} questions</h2>
    <dl class="stat">
      <dt>Temperature T (RMS of z)</dt><dd class="${Math.abs(T-1)<0.15?'ok':'warn'}">${T.toFixed(2)}</dd>
      <dt>Mean log score (lower is better)</dt><dd>${ls.toFixed(2)}${prev.length?` · last 10: ${mean(last.map(h=>h.ls)).toFixed(2)} vs prior 10: ${mean(prev.map(h=>h.ls)).toFixed(2)}`:''}</dd>
      <dt>Median accuracy (mean |log10 error|)</dt><dd>${absE.toFixed(2)} (typical miss ${Math.pow(10,absE).toFixed(2)}×)</dd>
      <dt>Bias (mean signed log10 error)</dt><dd>${bias>0?'+':''}${bias.toFixed(2)} (you tend to guess ${bias>0.03?'too low':bias<-0.03?'too high':'neither high nor low'})</dd>
      <dt>Interval score, 90% bands</dt><dd>${mean(H.map(h=>h.is90||0)).toFixed(2)}</dd>
    </dl>
    <div class="notice">${tRec}${H.length<20?' Treat this as provisional until you pass 20 questions.':''}</div>
    ${chart}
    <table><tr><th>Stated</th><th>Observed</th><th>95% CI</th><th>n</th></tr>${rel.map(r=>`<tr><td>${r.p}%</td><td class="${r.obs<r.p/100-0.1?'bad':r.obs>r.p/100+0.1?'warn':'ok'}">${(r.obs*100).toFixed(0)}%</td><td>${(r.a*100).toFixed(0)} to ${(r.b*100).toFixed(0)}%</td><td>${r.n}</td></tr>`).join('')}</table>
    <p class="small" style="margin-top:8px">Read: at each stated level, the truth should land inside your band that often. Below the diagonal means overconfident, above means underconfident. The bars are Wilson 95% intervals on the observed rate.</p>
  </div>
  <div class="card"><h2 style="margin-top:0">By domain</h2>
    <table><tr><th>Domain</th><th>n</th><th>|log10 err|</th><th>68% hit</th><th>bias</th></tr>${Object.entries(doms).sort((a,b)=>b[1].length-a[1].length).map(([d,arr])=>`<tr><td>${esc(d)}</td><td>${arr.length}</td><td>${mean(arr.map(h=>Math.abs(h.l10))).toFixed(2)}</td><td>${(arr.filter(h=>Math.abs(h.z)<=1).length/arr.length*100).toFixed(0)}%</td><td>${mean(arr.map(h=>h.l10)).toFixed(2)}</td></tr>`).join('')}</table>
    <p class="small" style="margin-top:8px">Hints before committing: ${hinted.length} hinted (mean |log10 err| ${hinted.length?mean(hinted.map(h=>Math.abs(h.l10))).toFixed(2):'–'}) vs ${unh.length} unhinted (${unh.length?mean(unh.map(h=>Math.abs(h.l10))).toFixed(2):'–'}). A big gap means the ladder is doing the work your anchor deck should.</p>
    ${H.some(h=>h.failure)?`<p class="small">Diagnosed failures: ${['anchor','structure','spread','arithmetic','none'].map(f=>`${f} ${H.filter(h=>h.failure===f).length}`).join(' · ')}</p>`:''}
  </div>
  <div class="card"><h2 style="margin-top:0">Recent</h2>
    <table><tr><th style="text-align:left">Question</th><th>you</th><th>truth</th><th>z</th></tr>${H.slice(-15).reverse().map(h=>`<tr><td style="text-align:left">${esc(h.text.slice(0,70))}${h.text.length>70?'…':''}</td><td>${esc(fmt(h.median))}</td><td>${esc(fmt(h.truth))}</td><td class="${Math.abs(h.z)<=1?'ok':Math.abs(h.z)<=1.96?'warn':'bad'}">${h.z.toFixed(1)}</td></tr>`).join('')}</table>
    <div class="btnrow"><button class="btn ghost" data-act="clear">Clear history</button></div>
  </div>`;
}

/* ===================== ANCHORS (Leitner deck) ===================== */
const LEITNER=[0,1,3,7,21,60];
let A={ cur:null, revealed:false, res:null };
function dueAnchors(){ const now=Date.now(); return S.anchors.filter(a=>a.due<=now); }
function renderAnchors(){
  const v=$('#view'); const due=dueAnchors();
  if (!S.anchors.length){ v.innerHTML=`<div class="card"><p>Your anchor deck is empty.</p><p class="small">After each reveal, add the reference numbers you were missing. The deck quizzes you on a spaced schedule (1, 3, 7, 21, 60 days). Estimation skill is mostly the size of this deck.</p></div>`; return; }
  if (!A.cur && due.length) A.cur=pick(due);
  let quiz='';
  if (A.cur){
    if (!A.revealed) quiz=`<div class="card"><div class="small">${due.length} due now</div><div class="q">${esc(A.cur.name)}</div><input type="text" id="aval" inputmode="decimal" placeholder="your value${A.cur.unit?` (${esc(A.cur.unit)})`:''}"><div class="btnrow"><button class="btn" data-act="check">Check</button><button class="btn ghost" data-act="dontknow">Don't know</button></div></div>`;
    else quiz=`<div class="card reveal"><div class="q">${esc(A.cur.name)}</div><div class="big">${esc(fmt(A.cur.value,A.cur.unit))}</div><div class="small mono">${esc(fmtRaw(A.cur.value))}</div><p class="${A.res.pass?'ok':'bad'}">${A.res.pass?'Within 25%: promoted.':`Off by ${Math.pow(10,Math.abs(A.res.err)).toFixed(2)}×: back to box 1.`} Next review in ${LEITNER[Math.min(A.res.box,LEITNER.length-1)]} day(s).</p><div class="btnrow"><button class="btn" data-act="nextanchor">Next</button></div></div>`;
  } else quiz=`<div class="card"><p>Nothing due. ${S.anchors.length} anchors in the deck.</p></div>`;
  v.innerHTML=quiz+`<div class="card"><h2 style="margin-top:0">Deck</h2>${S.anchors.slice().sort((a,b)=>a.due-b.due).map((a,i)=>`<div class="anchor-item"><span>${esc(a.name)}<br><span class="small">box ${a.box+1} · ${a.due<=Date.now()?'due':'due '+new Date(a.due).toLocaleDateString()}</span></span><span style="text-align:right"><b>${esc(fmt(a.value,a.unit))}</b><br><button class="btn small ghost" data-act="del" data-i="${S.anchors.indexOf(a)}">remove</button></span></div>`).join('')}</div>`;
}
function anchorsClick(act,b){
  if (act==='check'||act==='dontknow'){ const val=act==='check'?parseNum($('#aval').value):NaN; const err=isFinite(val)&&val>0?Math.log10(val/A.cur.value):9; const pass=Math.abs(err)<=Math.log10(1.25); A.cur.box=pass?Math.min(A.cur.box+1,LEITNER.length-1):0; A.cur.due=Date.now()+LEITNER[A.cur.box]*86400000; A.revealed=true; A.res={pass,err,box:A.cur.box}; save(); render(); }
  else if (act==='nextanchor'){ A={cur:null,revealed:false,res:null}; render(); }
  else if (act==='del'){ S.anchors.splice(+b.dataset.i,1); A={cur:null,revealed:false,res:null}; save(); render(); }
}

/* ===================== METHOD ===================== */
function renderMethod(){
  $('#view').innerHTML=`<div class="card">
  <h2 style="margin-top:0">How to think about a Fermi question</h2>
  <p><b>Frame.</b> Name the kind of quantity (stock or flow, per-capita or total, count or rate) and the global total it lives inside. Almost every number about the world is a share of something you already know: 8.2 billion people, 38 billion tonnes of CO2, 31,000 TWh of electricity, 510 million km² of planet.</p>
  <p><b>Anchors.</b> Write down the two or three reference numbers the question depends on before you compute anything. If you can't, that is the finding: the gap is in your deck, not your reasoning.</p>
  <p><b>Structure.</b> Decompose multiplicatively (population × per-capita, area × density, capacity × hours × utilisation). Take two independent routes when you can; if they agree within 2× you can tighten k. If they disagree, your structure is wrong somewhere, not your anchors.</p>
  <p><b>Compute.</b> Work in orders of magnitude and mantissas: 3.5 × 10^8 times 1.4 × 10^4, exponent first (12), then mantissa (4.9). Round aggressively; rounding errors are far smaller than anchor errors.</p>
  <p><b>Bound.</b> Find a hard ceiling and floor (a country can't emit more than the world; a coefficient can't exceed 2^n). Then squeeze: which side is your median closer to, and why?</p>
  <h2>Sizing your spread</h2>
  <p>Errors on these questions are multiplicative, so think in factors, not differences. Your spread factor k is the factor you'd bet 2:1 the truth lies within. A useful ladder: k = 1.3 when you know the anchor cold; k = 2 when you decomposed with good anchors; k = 3 to 5 for one shaky anchor; k = 10 or more when you are reasoning from first principles alone.</p>
  <p>The scoring here is the log score: ½z² + ln(σ) + constant, with σ = ln k and z your error in units of σ. It is proper: the only way to minimise it long-run is to report what you believe. Narrow bands are rewarded when right and punished quadratically when wrong; wide bands pay a steady ln(σ) tax. The dashboard's temperature T is the multiplier that would have made your z-scores unit-variance; T above 1 means your bands should be k<sup>T</sup> instead of k.</p>
  <h2>Estimathon strategy is different</h2>
  <p>Under Estimathon scoring, a miss doubles everything, so the game rewards guaranteeing coverage: two or three gimme questions with tiny ratios, honest intervals where you have a decomposition, and deliberate 1000× punts on the rest. A perfect calibrator who refuses to punt loses to a mediocre estimator who does. Train calibration in Deliberate mode, train the game in Sprint mode, and don't let one habit leak into the other.</p>
  <h2>Two skills, two feedback loops</h2>
  <p>Calibration (does your 68% band hit 68%?) and resolution (do you tighten on questions you actually know?) improve separately, and the research says feedback on one does not transfer to the other. The temperature number trains calibration. The anchor deck and the per-domain table train resolution: you can only be sharp where you have anchors.</p>
  <h2>Reading the ladders</h2>
  <p>Frame, Anchors and Structure are fair to open before committing; they teach the move. Compute and Bound unlock after you commit because they give the answer away. The dashboard tracks hinted vs unhinted accuracy so you can see when the ladder is doing your thinking for you.</p>
  </div>`;
}

/* ===================== SETTINGS ===================== */
function renderSettings(){
  const s=S.settings;
  $('#view').innerHTML=`<div class="card">
    <h2 style="margin-top:0">Question sources</h2>
    <div class="filters">${[['all','Mixed'],['estimathon','Estimathon-style'],['proc','Computed'],['bank','World data'],['live','Live generated']].map(([k,l])=>`<span class="chip ${s.tier===k?'on':''}" data-tierf="${k}">${l}</span>`).join('')}</div>
    <p class="small">Estimathon-style: ${EST_BANK.length} questions in the classic mould (monuments, jumbo jets, word counts, McDonald's counts, clever math), each answer checked against a primary source in September 2026. Computed: exact answers from code with fresh numbers every time. World data: ${DATA_BANK.length} questions generated from Our World in Data tables, every number in every hint computed from the source rows. Live: written by Claude with web search plus an independent verification pass; ${S.live.length} stored, ${S.live.filter(x=>x.verified).length} verified. Mixed draws 55% Estimathon, 25% computed, 15% world data, 10% live.</p>
    <label class="lbl">Default spread factor k</label>
    <input type="number" id="defk" min="1.05" max="50" step="0.1" value="${s.defaultK}">
    <h2>Live generation</h2>
    <p class="small">Uses Claude inside this page. Each generated question costs two calls (one to write and source it, one to verify independently). Unverified questions are labelled and can be disputed; disputed ones are excluded from your statistics.</p>
    <div class="btnrow"><button class="btn ${s.liveEnabled?'sec':''}" data-act="togglelive">${s.liveEnabled?'Disable Claude features':'Enable Claude features'}</button></div>
    ${s.liveEnabled?`<label class="lbl">Topic for a new question (optional)</label><input type="text" id="topic" placeholder="e.g. semiconductor fabs, Singapore MRT, ocean shipping"><div class="btnrow"><button class="btn" data-act="gen">Generate one question</button><button class="btn sec" data-act="gen5">Generate five</button></div><div id="genout"></div>`:''}
    <h2>Data</h2>
    <p class="small">${S.history.length} attempts, ${S.anchors.length} anchors, ${S.live.length} live questions in storage.</p>
    <div class="btnrow"><button class="btn ghost" data-act="export">Copy everything as JSON</button></div>
  </div>`;
  $('#defk').addEventListener('change', e=>{ const k=parseFloat(e.target.value); if(k>1){ s.defaultK=k; save(); } });
  $('#view').querySelectorAll('[data-tierf]').forEach(c=>c.addEventListener('click',()=>{ s.tier=c.dataset.tierf; save(); newPractice(); renderSettings(); }));
}
async function settingsClick(act){
  const s=S.settings;
  if (act==='togglelive'){ s.liveEnabled=!s.liveEnabled; save(); render(); }
  else if (act==='gen'||act==='gen5'){ const out=$('#genout'); const n=act==='gen5'?5:1; const topic=($('#topic')||{}).value||''; for(let i=0;i<n;i++){ out.innerHTML=`<p class="small">Generating ${i+1} of ${n}… (two search calls)</p>`; try{ const qq=await generateLive(topic); out.innerHTML+=`<div class="notice">${qq.verified?'Verified':'Unverified'}: ${esc(qq.text)} → ${esc(fmt(qq.answer,qq.unit))}<br><span class="small">${esc(qq.note)}</span></div>`; }catch(err){ out.innerHTML+=`<p class="err">Generation failed: ${esc(err.message)}</p>`; } } renderSettings(); $('#genout').innerHTML=`<p class="small">Done. ${S.live.length} live questions stored.</p>`; }
  else if (act==='export'){ try{ await navigator.clipboard.writeText(JSON.stringify({history:S.history,anchors:S.anchors,live:S.live},null,1)); setSave('copied'); }catch(e){ setSave('copy blocked'); } }
}

/* ===================== boot ===================== */
renderTabs();
$('#view').innerHTML='<div class="card"><p class="small">Loading your history…</p></div>';
loadAll().then(()=>{ render(); });
